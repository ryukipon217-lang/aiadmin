<style>
/* ================= shared/01-tokens.css ================= */
/* ============================================================================
   admin2 共通トークン+共通部品 (正典: redesign/portal-proto/portal.html)
   ここに置くのは全アプリで再利用する規則のみ: 色・書体・.glass・.btn・.nb・
   フォーカス・reduced-motion。レイアウトは各アプリ側で設計する(機械的統一の禁止)。
   ============================================================================ */
:root{
  --accent:#6e86e0; --deep:#4f63c4; --ink:#22314a; --ink2:#2b3d57; --ink3:#3d5877; --ink4:#526d89; --ink5:#71859a;
  --cream:#faf6e8; --paper:#fdfcf8; --line:#d9dfe9; --rule:#22314a;
  --warn:#a8434f; --ok:#3f7d5c; --amber:#8a6a2f;
  --wash1:rgba(110,134,224,.08); --wash2:rgba(244,232,196,.35); --wash3:rgba(233,180,196,.10);
  --serif:'Zen Old Mincho',serif; --sans:'Zen Kaku Gothic New',sans-serif; --latin:'Cormorant Garamond',serif;
  /* アプリ識別色(全アプリ共通で固定の意味を持つ) */
  --app-event:#6e86e0; --app-comms:#c96f83; --app-org:#4c8f6a; --app-hq:#b08430; --app-analytics:#5d7bab;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.8;
  background-image:
    radial-gradient(ellipse 900px 520px at 88% -6%, rgba(110,134,224,.26), transparent 60%),
    radial-gradient(ellipse 700px 500px at -8% 30%, rgba(244,228,178,.75), transparent 60%),
    radial-gradient(ellipse 540px 430px at 96% 46%, rgba(110,134,224,.2), transparent 62%),
    radial-gradient(ellipse 700px 460px at 26% 74%, rgba(110,134,224,.14), transparent 62%),
    radial-gradient(ellipse 620px 480px at 70% 108%, rgba(233,180,196,.26), transparent 62%);
  background-attachment:fixed}
/* フロストガラス(浮いている操作面・状態帯に使用。見出し・本文の紙面には使わない) */
.glass{background:linear-gradient(168deg, rgba(255,255,255,.52), rgba(255,255,255,.24));
  -webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);
  border:1px solid rgba(255,255,255,.75);box-shadow:0 14px 38px -18px rgba(34,49,74,.3), inset 0 1px 0 rgba(255,255,255,.9)}
.mi{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;vertical-align:-3px;display:inline-block}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px}
/* 日本語の改行制御: 単語の途中・単位の直前で折らない。複合語・日付時刻・数値+単位は .nb で固定 */
body{line-break:strict}
.nb{white-space:nowrap}
.btn{white-space:nowrap}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2.5px solid var(--deep);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

/* ボタン(操作規則は全アプリ共通。文字は絶対に折らない=入らないときはボタンごと縦積み) */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:700;font-size:14px;
  background:var(--deep);color:#fff;padding:12px 22px;border-radius:8px;text-decoration:none;min-height:44px;
  border:0;cursor:pointer;transition:background .15s}
.btn:hover{background:#43549f}
.btn.sub{color:var(--deep);background:linear-gradient(168deg, rgba(255,255,255,.55), rgba(255,255,255,.28));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);
  box-shadow:0 8px 22px -14px rgba(34,49,74,.3)}
.btn.sub:hover{background:rgba(255,255,255,.65)}

/* ================= checkin/20-checkin.css ================= */
/* ============================================================================
   当日受付(iPad・カメラ全画面) — 正典: redesign/portal-proto/event-checkin.html
   構図は代表指示で確定: カメラ全画面・終了/別日トーストは上・状況バーは最下部。
   全状態=同じ舞台(紺のカメラ地+薄いガイド四隅+下部バー)の上で演出し、
   下部シート(.dock)の中身だけが入れ替わる。白カードを画面中央に浮かべない。
   このアプリは独立ファイル(タブバーなし)。sharedの紙面背景は使わず暗地に上書きする。
   ============================================================================ */
html,body{height:100%}
body{background:#151d30;color:var(--ink);font-size:16px;line-height:1.7;overflow:hidden;
  background-image:none}
#app.wrap{max-width:none;padding:0;height:100%}
a:focus-visible,button:focus-visible{outline:2.5px solid #fff;outline-offset:2px;border-radius:4px}
.dock a:focus-visible,.dock button:focus-visible,.dock input:focus-visible{outline-color:var(--deep)}
.svgi{display:inline-block;vertical-align:-3px;flex:none}

/* ===== 全画面ステージ(カメラ) ===== */
.stage{position:relative;height:100dvh;overflow:hidden}
@supports not (height:100dvh){.stage{height:100vh}}
.feed{position:absolute;inset:0;
  background:
    radial-gradient(ellipse 74% 56% at 50% 40%, rgba(110,134,224,.2), transparent 72%),
    radial-gradient(ellipse 50% 40% at 22% 78%, rgba(233,180,196,.1), transparent 70%),
    linear-gradient(174deg, #2a3550, #1b2439 58%, #151d30)}
.feed video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feed.mirror video{transform:scaleX(-1)}
/* (上質化) 実カメラの白飛びでも文字が沈まないシネマ調ビネット(上下の暗帯+周辺減光) */
.feed::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(9,14,26,.62), rgba(9,14,26,.18) 18%, transparent 30%),
    linear-gradient(0deg, rgba(9,14,26,.66), rgba(9,14,26,.2) 20%, transparent 34%),
    radial-gradient(ellipse 130% 96% at 50% 44%, transparent 56%, rgba(9,14,26,.42) 100%)}
/* 舞台上部の小さなワードマーク(スキャン前の全状態に共通) */
.brand{position:absolute;left:0;right:0;top:36px;z-index:4;text-align:center;pointer-events:none;
  font-family:var(--latin);font-size:30px;font-weight:500;letter-spacing:.02em;color:rgba(255,255,255,.94);
  text-shadow:0 1px 16px rgba(9,14,26,.6)}
.brand b{color:#a7b7f2;font-weight:500}
/* 中央の読み取りガイド(枠外をそっと沈め、視線を読取域へ) */
.guidebox{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(56vw,460px);aspect-ratio:1;border:0;background:none;padding:0}
.guidebox::before{content:'';position:absolute;inset:0;border-radius:16px;pointer-events:none;
  box-shadow:0 0 0 200vmax rgba(8,13,24,.26)}
.guidebox .dash{position:absolute;inset:0;border:1.5px dashed rgba(255,255,255,.32);border-radius:16px;
  box-shadow:inset 0 0 34px rgba(110,134,224,.12)}
.guidebox .corner{position:absolute;width:44px;height:44px;border:3.5px solid #93a7ec;
  filter:drop-shadow(0 0 7px rgba(110,134,224,.55))}
.guidebox .corner.tl{top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.guidebox .corner.tr{top:-2px;right:-2px;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.guidebox .corner.bl{bottom:-2px;left:-2px;border-right:0;border-top:0;border-radius:0 0 0 14px}
.guidebox .corner.br{bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 14px 0}
/* スキャン前/カメラ不可: ガイドは薄く静かに置く(舞台は同じまま・偽の走査線は出さない) */
.guidebox.idle{opacity:.36}
.guidebox.idle::before{box-shadow:none}
.guidebox.idle .dash{border-color:rgba(255,255,255,.3);box-shadow:none}
/* 走査線: ゆっくり往復する細い光(動きは控えめ・reduced-motionでは共通ルールで停止) */
.scanline{position:absolute;left:7%;right:7%;top:12%;height:2px;border-radius:2px;pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(154,173,238,.9), transparent);
  box-shadow:0 0 16px 3px rgba(110,134,224,.4);
  animation:ck-sweep 3.2s cubic-bezier(.45,.05,.55,.95) infinite alternate}
@keyframes ck-sweep{from{top:9%}to{top:89%}}
.callout{position:absolute;left:0;right:0;top:9%;text-align:center;color:#fff;text-shadow:0 1px 12px rgba(9,14,26,.6)}
.callout h1{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.08em;line-height:1.5}
.callout p{font-size:15px;color:rgba(255,255,255,.75);margin-top:4px}
/* 状態ピル(ガラス+呼吸するドット)。文字だけの状態表示をやめて上質に */
.camstate{position:absolute;left:50%;top:63.5%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:9px;
  max-width:88%;padding:8px 17px;border-radius:999px;font-size:12px;letter-spacing:.14em;color:rgba(255,255,255,.8);white-space:nowrap;
  background:rgba(16,24,42,.46);border:1px solid rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(12px) saturate(1.15);backdrop-filter:blur(12px) saturate(1.15);
  box-shadow:0 10px 26px -14px rgba(9,14,26,.7), inset 0 1px 0 rgba(255,255,255,.14)}
.camstate.wide{white-space:normal;letter-spacing:.04em;line-height:1.6;border-radius:14px;text-align:left}
.camdot{width:7px;height:7px;border-radius:50%;flex:none;background:#8fe3b0;box-shadow:0 0 9px rgba(143,227,176,.85);
  animation:ck-pulse 1.8s ease-in-out infinite}
.camdot.warn{background:#f0c987;box-shadow:0 0 9px rgba(240,201,135,.85)}
.camdot.info{background:#93a7ec;box-shadow:0 0 9px rgba(147,167,236,.85)}
@keyframes ck-pulse{0%,100%{opacity:.45}50%{opacity:1}}
/* カメラ不可のときの正直な導線(状態ピル+名前で探すを縦に・重なり無し) */
.camwrap{position:absolute;left:50%;top:63.5%;transform:translateX(-50%);z-index:4;width:min(88%,560px);
  display:flex;flex-direction:column;align-items:center;gap:16px}
.camwrap .camstate{position:static;left:auto;top:auto;transform:none;max-width:100%}
.findcta{display:inline-flex;align-items:center;gap:10px;
  min-height:60px;padding:0 28px;font-size:17px;font-weight:700;letter-spacing:.04em;color:var(--deep);
  background:#fff;border:0;border-radius:12px;box-shadow:0 16px 38px -16px rgba(6,10,20,.85);cursor:pointer}
.findcta:hover{background:#f0f3fb}

/* ===== 決済係(2台で分担・受信側)。カメラなしの決済カウンター ===== */
.desk{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);margin:0 auto;width:min(92%,720px);text-align:center;color:#fff}
.desk .kick{font-size:11px;letter-spacing:.3em;color:rgba(255,255,255,.55)}
.desk .kick.amber{color:#f0c987}
.desk .kick.ok{color:#8fe3b0}
.desk h1{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:.06em;line-height:1.5;margin-top:12px}
.desk .sub{font-size:14px;color:rgba(255,255,255,.62);margin-top:8px;line-height:1.9}
.desk .bigname{font-size:44px;font-weight:700;letter-spacing:.02em;line-height:1.35;margin-top:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 14px rgba(9,14,26,.6)}
.desk .bigamt{font-family:var(--serif);font-size:74px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;
  color:#ffd9a8;margin-top:2px}
.desk .bigamt small{font-size:26px;font-weight:500;margin-left:2px}
.desk .tagline{font-size:15px;color:rgba(255,255,255,.75);margin-top:4px}
.desk .paywrap{margin-top:20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.desk .methods{justify-content:center}
.desk .mchip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.85)}
.desk .mchip small{color:rgba(255,255,255,.55)}
.desk .mchip[aria-pressed="true"]{background:var(--deep);border-color:#93a7ec;color:#fff}
.desk .confirm{flex:none;width:min(100%,420px)}
.desk .hold{margin-left:0;color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.3)}
.desk .hold:hover{background:rgba(255,255,255,.1)}
.desk .err{font-size:13px;color:#ffb3a6;font-weight:700;margin-top:10px}
.desk .okring{width:88px;height:88px;margin:18px auto 0;border-radius:50%;border:2.5px solid rgba(143,227,176,.85);
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(143,227,176,.25)}
/* 受信待ちの呼吸リング */
.listen{width:104px;height:104px;margin:26px auto 0;position:relative}
.listen i{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(147,167,236,.5);
  animation:ck-ring 2.6s ease-out infinite}
.listen i:nth-child(2){animation-delay:1.3s}
.listen b{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);
  border-radius:50%;background:#93a7ec;box-shadow:0 0 14px rgba(147,167,236,.9)}
@keyframes ck-ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.15);opacity:0}}
/* 保留中の呼び出しチップ(下部・横スクロール) */
.heldrail{position:absolute;left:14px;right:14px;bottom:96px;z-index:5;display:flex;gap:9px;align-items:center;overflow-x:auto;
  -webkit-overflow-scrolling:touch;padding:6px 2px}
.heldrail .cap{flex:none;font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.55);white-space:nowrap}
.heldrail button{flex:none;min-height:46px;padding:8px 15px;border-radius:11px;font-size:13.5px;font-weight:700;color:#fff;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.24);cursor:pointer;white-space:nowrap}
.heldrail button b{color:#ffd9a8;font-weight:700;margin-left:7px;font-size:12px}
.heldrail button:hover{background:rgba(255,255,255,.16)}

/* 左上: 終了(副操作・控えめ) */
.quit{position:absolute;top:16px;left:16px;z-index:6;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:8px 15px;
  font-size:13.5px;color:rgba(255,255,255,.82);background:rgba(20,28,46,.42);border:1px solid rgba(255,255,255,.28);border-radius:8px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer}
.quit:hover{background:rgba(20,28,46,.62)}
/* 右上の小さな操作(消音など)。終了と同じ言葉づかい */
.topbtns{position:absolute;top:16px;right:16px;z-index:6;display:flex;gap:8px}
.topbtns button{min-height:44px;padding:8px 13px;font-size:13px;color:rgba(255,255,255,.82);
  background:rgba(20,28,46,.42);border:1px solid rgba(255,255,255,.28);border-radius:8px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer}
.topbtns button:hover{background:rgba(20,28,46,.62)}

/* 別日QR/日付切替の控えめトースト(上部中央・音は鳴らさない) */
.toast{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:7;display:inline-flex;align-items:center;gap:8px;max-width:88%;
  padding:10px 20px;border-radius:8px;font-size:14.5px;color:var(--ink2);
  background:linear-gradient(168deg, rgba(255,255,255,.86), rgba(255,255,255,.66));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(201,154,75,.5);border-left:4px solid #c99a4b;
  box-shadow:0 10px 26px -12px rgba(10,16,30,.5)}
.toast b{color:var(--amber);font-weight:700}
.toast.plain{border-color:rgba(255,255,255,.6);border-left-color:var(--deep)}

/* ===== スキャン結果シート(カメラの上に浮く) ===== */
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:112px;width:min(92%,760px);z-index:5;
  border-radius:14px;padding:22px 26px 20px;
  /* 暗いカメラ地の上では透過を弱め、読みやすさ優先(屋外コントラスト) */
  background:linear-gradient(168deg, rgba(253,252,248,.95), rgba(253,252,248,.86))}
.who{display:flex;align-items:center;gap:20px}
.who img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 10px 26px -10px rgba(34,49,74,.4);flex:none}
.who .name{font-size:34px;font-weight:700;line-height:1.3;letter-spacing:.02em}
.who .tags{font-size:16px;color:var(--ink3);margin-top:2px}
.who .tags b{color:var(--deep);font-weight:700}
.due{margin-left:auto;text-align:right;padding-left:20px;flex:none}
.due .st{display:inline-flex;align-items:center;gap:8px;font-size:15.5px;font-weight:700;letter-spacing:.08em;color:#fff;
  background:var(--warn);border-radius:6px;padding:4px 14px}
.due .st::before{content:'';width:9px;height:9px;border-radius:50%;background:#fff}
.due .st.ok{background:var(--ok)}
.due .amt{font-family:var(--serif);font-size:38px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--warn);line-height:1.25;margin-top:3px}
.due .amt small{font-size:17px;font-weight:500;margin-left:1px}
.due .brk{font-size:12.5px;color:var(--ink4)}
.payrow{display:flex;gap:12px;align-items:stretch;margin-top:18px}
.methods{display:flex;gap:10px;flex:none}
.mchip{min-width:102px;min-height:62px;padding:8px 15px;border-radius:8px;font-size:15.5px;font-weight:700;color:var(--ink3);
  background:rgba(255,255,255,.66);border:1.5px solid var(--line);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
.mchip small{font-size:11.5px;font-weight:400;color:var(--ink5);letter-spacing:.06em;white-space:nowrap}
.mchip[aria-pressed="true"]{color:#fff;background:var(--deep);border-color:var(--deep);box-shadow:0 8px 20px -8px rgba(79,99,196,.55)}
.mchip[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.confirm{flex:1;min-height:62px;border:0;border-radius:8px;background:var(--deep);color:#fff;cursor:pointer;
  font-size:20px;font-weight:700;letter-spacing:.06em;white-space:nowrap;padding:0 22px;
  box-shadow:0 14px 32px -12px rgba(79,99,196,.65);transition:background .15s}
.confirm:hover{background:#43549f}
.confirm[disabled]{opacity:.65;cursor:default}
.sheet-foot{display:flex;align-items:center;gap:14px;margin-top:11px}
.sheet-foot .note{font-size:12.5px;color:var(--ink4)}
.sheet-foot .err{font-size:12.5px;color:var(--warn);font-weight:700}
.hold{margin-left:auto;min-height:46px;padding:8px 15px;font-size:14px;color:var(--ink3);font-weight:700;
  background:transparent;border:1px solid var(--line);border-radius:8px;white-space:nowrap;cursor:pointer}
.hold:hover{background:rgba(255,255,255,.6)}
/* 受付完了(決済済み・緑)。自動で次へ */
.sheet .done-line{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;color:var(--ok);font-weight:700}
.sheet .done-line .sub{font-size:12.5px;color:var(--ink4);font-weight:400}
/* 重複・案内のみの一行(操作なし) */
.sheet .info-line{margin-top:12px;font-size:13.5px;color:var(--ink4)}

/* ===== 最下部: 状況バー(イベント・進捗・担当・受付のかたち・名前で探す) ===== */
.statusbar{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:10px;
  padding:13px 14px;color:#fff;
  background:rgba(16,23,38,.72);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
  border-top:1px solid rgba(255,255,255,.16)}
.evline{flex:1 1 auto;min-width:0;overflow:hidden}

/* ============================================================================
   虹彩(iris)アップグレード+かぶり根絶(2026-09-02 代表指示)
   - 呼びかけ文とガイド枠の重なり: 絶対%配置を廃し、#ck-callout をフロー縦積みに
     (横持ち/低背でも構造的に重ならない。ガイドはvhでも縮む)

     カメラ地に微オーロラ・確定ボタン光沢・バー/シート上端に1px虹彩ライン
   ============================================================================ */
.stage{--iris:conic-gradient(from 220deg, #7d90e8, #8fc6ea, #a9e3cf, #f0d9a6, #ecc3d8, #b3a6ef, #7d90e8)}

  width:min(56vw,460px,46vh);margin-top:clamp(16px,4.5vh,46px)}
/* ガイド枠=虹彩リング(mask-composite方式・確実に描ける)+内側は既存の点線 */
.guidebox .corner{display:none}
.guidebox::after{content:'';position:absolute;inset:-3px;border-radius:19px;padding:3.5px;
  background:var(--iris);filter:saturate(1.25) drop-shadow(0 0 10px rgba(140,164,240,.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;animation:ckIris 18s linear infinite;pointer-events:none}
.guidebox.idle::after{opacity:.55;filter:saturate(1.1)}
@keyframes ckIris{to{filter:saturate(1.25) drop-shadow(0 0 10px rgba(140,164,240,.45)) hue-rotate(360deg)}}
#ck-callout .camstate,#ck-callout .camwrap{position:static;left:auto;top:auto;transform:none;margin-top:16px;pointer-events:auto}
/* 呼びかけの虹彩ティック(小さな署名・文字は白のまま) */
.callout h1::before{content:'';display:block;width:30px;height:3px;border-radius:2px;margin:0 auto 12px;

  background:linear-gradient(90deg,rgba(125,144,232,0),#8fc6ea 20%,#a9e3cf 40%,#f0d9a6 60%,#ecc3d8 80%,rgba(125,144,232,0))}
/* 確定ボタンの光沢(角度グラデ+押下で沈む) */

.confirm:active{transform:translateY(1px)}

<script>
// ================= shared/10-api.js =================
/* ============================================================================
   admin2 共通 GAS API 層 (vanilla JS・console.html の実プロトコル準拠)
   - 読取 = GET ?action&memberId&params(JSON: {...params, token})。タイムアウト12s。
     ネットワーク断/5xx/429/404 は指数バックオフで最大2回リトライ(読取は冪等)。
     対象4action は軽量読取API優先。2連続失敗で5分間 本体GAS直行にフォールバック。
   - 書込 = POST body=JSON {action,payload,memberId,token} / Content-Type: text/plain。
     二重送信防止のため自動リトライしない。
   - セッション = localStorage connecta.memberId / connecta.token
     (console.html と同一キー=同一オリジンでSSO。consoleログイン済ならそのまま開く)
   ============================================================================ */
window.AdminAPI = (function () {
  'use strict';
  var URL_MAIN = 'https://script.google.com/macros/s/AKfycbxLs1eXm39MHM0lSioBf9ghVFL8p8fIhIdYJpBBweBTCLOFDqWclPhoF66c0FgfrbHg/exec';
  var URL_READ = 'https://script.google.com/macros/s/AKfycbxm-_IBapGbmilVQSzPhsLhL6cMwm8_bIwxyq8Wh8j3IxXjGjBz234EwEohFe18EAY/exec';
  var READ_API_ACTIONS = {
    listEvents: 1, listParticipants: 1, listRegistrations: 1, listTodos: 1,
    // read-api @5 で追加(2026-09-01 B1): イベント新機能の読取+ポータルの遅い3本
    listEventStaffAssignments: 1, listVenues: 1, listEventExpenses: 1, listEventGroups: 1,
    listNews: 1, listMinutesMeetings: 1, listMembers: 1,
    // read-api @listWaitlist 追加済み(2026-09-01): キャンセル待ちの読取
    listWaitlist: 1,
    // read-api 対応済み(2026-09-02 B3): 配信タイムラインの読取
    listEventComms: 1,
    // イベント単体の申込読取(バックエンド実装中の新action。無ければ本体→呼び出し側でlistRegistrationsへフォールバック)
    listEventRegistrations: 1,
  };
  var ROLE_RANK = { '代表': 5, '副代表': 4, 'マネージャー': 3, 'アシマネ': 2, 'メンバー': 1 };
  var onUnauthorized = null; // アプリ側が setOnUnauthorized で登録(認証切れ→ログイン画面へ)

  function mid() { try { return localStorage.getItem('connecta.memberId') || ''; } catch (e) { return ''; } }
  function tok() { try { return localStorage.getItem('connecta.token') || ''; } catch (e) { return ''; } }
  function setSession(id, t) { try { if (id) localStorage.setItem('connecta.memberId', id); if (t) localStorage.setItem('connecta.token', t); } catch (e) {} }
  function clearSession() { try { localStorage.removeItem('connecta.memberId'); localStorage.removeItem('connecta.token'); } catch (e) {} }

  // 認証切れ判定(console.html authFail と同一)。権限不足(FORBIDDEN等)は認証切れ扱いにしない
  function authFail(j) {
    var e = (j && j.error && (j.error.message || j.error)) || '';
    if (/FORBIDDEN|権限がありません|required /i.test(String(e))) return false;
    return !!(j && (j.unauthorized === true || (!j.ok && /AUTH_REQUIRED|認証が必要|認証が切れ|再ログイン|未ログイン|セッション|ログインが必要|unauthorized|expired/i.test(String(e)))));
  }
  function handleResp(j) {
    if (j && j.user !== undefined) window.currentUser = j.user;
    if (authFail(j)) {
      if (typeof onUnauthorized === 'function') onUnauthorized();
      var er = new Error('認証が切れています。再ログインしてください。');
      er._auth = true;
      throw er;
    }
    if (!j || !j.ok) throw new Error((j && j.error && (j.error.message || j.error)) || '取得に失敗しました');
    return j.data;
  }

  // 1回のGET。silent=軽量API用(認証不一致でもログアウトさせず、失敗として本体へ委譲)
  async function fetchAt(base, action, params, timeoutMs, silent) {
    var u = base + '?action=' + encodeURIComponent(action)
      + '&memberId=' + encodeURIComponent(mid())
      + '&params=' + encodeURIComponent(JSON.stringify(Object.assign({}, params, { token: tok() })));
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var to = ctrl ? setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, timeoutMs || 12000) : null;
    var r;
    try { r = await fetch(u, { method: 'GET', signal: ctrl ? ctrl.signal : undefined }); }

  // 未決済判定+課金行(複数日は0円行→同一ユーザーの課金行=Day1へ)。console 32016-32024 と同じ。
  function payTargetOf(reg) {
    var paidNow = regPaidFlag(reg) || num(reg.amount) === 0;
    var target = reg;
    if (paidNow && num(reg.amount) === 0 && reg.userId) {
      var sib = null;
      eventRegs().forEach(function (r) {
        if (sib || !r || r.id === reg.id) return;
        if (String(r.userId) !== String(reg.userId)) return;
        if (!(num(r.amount) > 0) || regPaidFlag(r)) return;
        if (regCancelled(r) || regRefund(r)) return;
        if (payMark[r.id] === 'done') return;
        sib = r;
      });
      if (sib) { paidNow = false; target = sib; }
    }
    return { paidNow: paidNow, target: target };
  }

  function sheetFor(reg, kind, extra) {
    var pt = payTargetOf(reg);
    return Object.assign({
      kind: kind,
      regId: reg.id,
      payRegId: pt.target.id,
      appId: String(pt.target.applicationId || ''),
      name: reg.userName || reg.userId || reg.id,
      photo: photoOf(reg),
      tagsHtml: tagsOf(reg),
      amount: num(pt.target.amount),
      declared: pt.target.paymentMethod || '',
      method: '',
      err: '',
    }, extra || {});
  }

  // 戻り値 {matched}. opts: {manual, viaPush}
  function processCode(text, opts) {
    opts = opts || {};
    if (!dayReady()) {
      UI.dayOpen = true;
      showToast('受付する日程を選択してください', true, 5000);
      paintPane();
      return { matched: false };
    }
    var p = parseScan(text);
    var regs = dayRegs();
    var reg = findByScan(regs, p);
    if (!reg) {
      // (複数日) 別日程の行しか無い場合: まず同一ユーザーの選択日程の行で続行(Day1メールQR対策)。
      //   本当にその日の申込が無いときだけ、無音の案内で拒否(console 31977-32001)。
      var all = eventRegs();
      var other = findByScan(all, p);
      if (other && other.userId) {
        regs.forEach(function (r) { if (!reg && String(r.userId) === String(other.userId)) reg = r; });
      }
      if (!reg && other) {
        var sk = '#' + (p.regId || p.userId);
        if (!chimed[sk]) { chimed[sk] = 1; chime('err'); }
        var sess = sessById(other.sessionId);
        var d = sess && parseYmd(sess.date);
        // .toastはinline-flexのため、文節ごとに.nbで包む(正典のtoastと同じ構造=変な折り返し防止)
        showToast('<span class="nb">このQRは<b>' + (d ? esc(dateSlash(d)) : 'ほかの日程') + 'の申込</b>です</span>' +
          '<span class="nb">― きょうの受付はできません</span>');
        return { matched: false };
      }
      if (!reg) {
        var ek = '?' + (p.regId || p.userId || p.raw || String(text || ''));
        if (!chimed[ek]) { chimed[ek] = 1; chime('err'); }
        showToast('このイベントの申込者ではありません', true, 5000);
        return { matched: false };
      }
    }
    if (regChecked(reg) || localChecked[reg.id]) {
      // 重複スキャン: 音は最初の1回だけ(かざしっぱなし対策)。手動検索は毎回音あり。
      var first = !chimed[reg.id];
      if (first || opts.manual) { chimed[reg.id] = 1; chime('dup'); }
      var pt0 = payTargetOf(reg);
      var stillUnpaid = !pt0.paidNow && payMark[pt0.target.id] !== 'done';
      if (stillUnpaid) setSheet(sheetFor(reg, (UI.mode === 'duo' && UI.duoRole === 'push') ? 'push' : 'unpaid', { dupNote: true }));
      else setSheet(sheetFor(reg, 'dup'), 2200);
      return { matched: true };
    }
    if (UI.mode === 'duo' && UI.duoRole === 'push') return pushCode(reg, p, text);

    // ---- solo: 楽観チェックイン(console 32014-32038) ----
    var pt = payTargetOf(reg);
    localChecked[reg.id] = pt.paidNow ? 'ok' : 'hold';
    chimed[reg.id] = 1;
    chime(pt.paidNow ? 'ok' : 'hold');
    UI.count++;
    setSheet(sheetFor(reg, pt.paidNow ? 'ok' : 'unpaid'), pt.paidNow ? 2200 : 0);
    bgCheckin(reg, pt.paidNow);
    return { matched: true };
  }

  // 裏の admin.checkin(最大2リトライ→最終失敗はロールバック+控えめ通知)。console bgCheckin と同じ。
  function bgCheckin(reg, optimisticPaid) {
    var tries = 0;
    function run() {
      svcPost('admin.checkin', { regId: reg.id }).then(function (res) {
        res = res || {};
        if (res.requiresPayment === true && optimisticPaid) {
          // 楽観では済にしたが実際は未決済 → 保留へ訂正+その場で決済確認できるように
          localChecked[reg.id] = 'hold';
          if (payMark[reg.id] !== 'done') setSheet(sheetFor(reg, 'unpaid', { note: '未決済でした ― 当日決済を確認してください' }));
        }
        scheduleReload();
        paintBar();
      }, function () {
        tries++;
        if (tries <= 2) { setTimeout(run, 700 * tries); return; }
        // ロールバック: 再スキャンで再送できる状態に戻す(音も復活)
        delete localChecked[reg.id];
        delete chimed[reg.id];
        UI.count = Math.max(0, UI.count - 1);
        UI.syncFailed++;
        if (UI.sheet && UI.sheet.regId === reg.id && UI.sheet.kind !== 'confirmed') { UI.sheet = null; paintSheet(); }
        chime('err');
        showToast('<span class="nb">' + esc(reg.userName || reg.id) + ' の受付を同期できませんでした</span>' +
          '<span class="nb">― もう一度スキャンしてください</span>', true, 8000);
        paintBar();
      });
    }
    run();
  }

  /* ---- duo(2台で分担): この端末は読むだけ=qrPushScan 送信(console pushCode) ---- */
  function pushCode(reg, p, rawText) {
    var key = p.regId || p.userId || String(rawText || '').trim();
    if (pushed[key]) {
      // 送信済み(重複): 無音・再送なし。未決済の人には案内だけ出し直す。
      var pt0 = payTargetOf(reg);
      if (!pt0.paidNow) setSheet(sheetFor(reg, 'push', { dupNote: true }));
      else setSheet(sheetFor(reg, 'dup'), 2200);
      return { matched: true };
    }
    pushed[key] = Date.now();
    pushCount++;
    var pt = payTargetOf(reg);
    chimed[reg.id] = 1;
    chime(pt.paidNow ? 'ok' : 'hold');
    setSheet(sheetFor(reg, pt.paidNow ? 'pushok' : 'push'), pt.paidNow ? 2200 : 0);
    var tries = 0;
    function run() {
      svcPost('qrPushScan', { code: reg.id, eventId: S.ev.id, device: String(device || 'scanner-1').trim() || 'scanner-1' })
        .then(function () { paintBar(); }, function () {
          tries++;
          if (tries <= 2) { setTimeout(run, 700 * tries); return; }
          delete pushed[key];   // 再スキャンで再送できるように
          delete chimed[reg.id];
          if (UI.sheet && UI.sheet.regId === reg.id) { UI.sheet = null; paintSheet(); }
          chime('err');
          showToast('<span class="nb">送信に失敗しました</span><span class="nb">― もう一度スキャンしてください</span>', true, 8000);
        });
    }
    run();
    return { matched: true };
  }

  /* ---- その場の決済確定(金銭=偽完了禁止・force再読取で裏取り) ---- */
  function confirmPay(method) {
    var sh = UI.sheet;
    if (!sh || sh.kind !== 'unpaid') return Promise.resolve(false);
    var target = null;
    eventRegs().forEach(function (r) { if (!target && r.id === sh.payRegId) target = r; });
    if (!target) { sh.err = '対象の申込が見つかりません。再読み込みしてください。'; paintSheet(); return Promise.resolve(false); }
    if (payMark[target.id] === 'pending') return Promise.resolve(false);
    payMark[target.id] = 'pending';
    var m = method || '当日確認';
    UI.sheet = Object.assign({}, sh, { kind: 'confirming', method: m, err: '' });
    paintSheet();

    // 経路の選択(冒頭コメントの決定): 課金行がいま受付した行(保留/済) → confirmPayment。
    // 別Dayの未チェックイン課金行(Day2到着) → application.markPaid(チェックイン行は同送しない)。
    var viaConfirm = regAtVenue(target) || !!localChecked[target.id];
    var post;
    if (viaConfirm) {
      // スキャン直後は裏の admin.checkin が未着で前提条件エラーになり得る → 間を置いて最大3試行(console confirmPay)。
      //   adminConfirmPayment_ は保留/済のみ成功の前提があるため、成功後の再試行は二重計上されない。
      post = (function () {
        var lastErr = null;
        function attempt(i) {
          return svcPost('admin.confirmPayment', { regId: target.id, paymentMethod: m })
            .catch(function (e) {
              lastErr = e;
              if (i >= 2) throw lastErr;
              return new Promise(function (r) { setTimeout(r, 1200 * (i + 1)); }).then(function () { return attempt(i + 1); });
            });
        }
        return attempt(0);
      })();
    } else if (target.applicationId) {
      var ids = [];
      var amt = 0;
      eventRegs().forEach(function (r) {
        if (String(r.applicationId || '') !== String(target.applicationId)) return;
        if (regPaidFlag(r) || !(num(r.amount) > 0)) return;
        if (regAtVenue(r) || localChecked[r.id]) return; // チェックイン行を markPaid で上書きしない
        ids.push(r.id); amt += num(r.amount);
      });
      if (!ids.length) { ids = [target.id]; amt = num(target.amount); }
      post = svcPost('admin.application.markPaid', {
        applicationId: String(target.applicationId), regIds: ids, method: m, amount: amt,
        memo: '[当日受付] scan=' + String(sh.regId || ''),
      });
    } else {
      delete payMark[target.id];
      UI.sheet = Object.assign({}, sh, { kind: 'unpaid', err: 'この申込はこの場で決済済化できません。consoleの申込・決済から記録してください。' });
      paintSheet();
      return Promise.resolve(false);
    }

    return post.then(function () {
      // サーバ確定済み。表示は実データの取り直し(force)で裏取りしてから確定にする。
      return reloadRegs().then(function () {
        var fresh = null;
        eventRegs().forEach(function (r) { if (!fresh && r.id === target.id) fresh = r; });
        return !!(fresh && (regPaidFlag(fresh) || regChecked(fresh)));
      }, function () { return null; }); // null=記録は済んだが再読取に失敗
    }).then(function (verified) {
      payMark[target.id] = 'done';
      localChecked[sh.regId] = 'ok';
      chime('ok');
      var note = verified === null ? '決済は記録されました ― 表示の更新に失敗したため数字は再読込で反映されます' : '';
      if (UI.sheet && UI.sheet.regId === sh.regId) setSheet(Object.assign({}, UI.sheet, { kind: 'confirmed', method: m, note: note, err: '' }), 1800);
      paintBar();
      return true;
    }, function (e) {
      if (e && e._auth) return false;
      delete payMark[target.id];
      if (UI.sheet && UI.sheet.regId === sh.regId) {
        UI.sheet = Object.assign({}, UI.sheet, { kind: 'unpaid', err: ((e && e.message) || '決済の確認に失敗しました。') + ' 記録は変わっていません。もう一度お試しください。' });
        paintSheet();
      }
      return false;
    });
  }

  /* ============================================================================
     カメラ(BarcodeDetector優先 → jsQR フォールバック) — console 32151-32267 の移植
     ============================================================================ */
  var stream = null, detector = null, engine = '', rafId = 0, scanOn = false;
  var jsqrPromise = null;
  var scanCanvas = null;
  var wakeLock = null;
  function loadJsQR() {
    if (window.jsQR) return Promise.resolve(window.jsQR);
    if (jsqrPromise) return jsqrPromise;
    jsqrPromise = new Promise(function (resolve, reject) {
      try {
        var s = document.createElement('script');
        s.src = 'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js';
        s.async = true;
        s.onload = function () { resolve(window.jsQR); };
        s.onerror = function () { jsqrPromise = null; reject(new Error('QRデコーダの読み込みに失敗しました')); };
        document.head.appendChild(s);
      } catch (e) { jsqrPromise = null; reject(e); }
    });
    return jsqrPromise;
  }
  function hasCam() {
    var secure = (typeof window === 'undefined') || window.isSecureContext !== false;
    return !!(NAV && NAV.mediaDevices && NAV.mediaDevices.getUserMedia) && secure;
  }
  function videoEl() { return document.getElementById('ck-video'); }
  function tick() {
    if (!scanOn) return;
    var video = videoEl();
    var done = Promise.resolve('');
    if (video && video.readyState >= 2 && !busyScan) {
      done = (function () {
        try {
          if (engine === 'bd' && detector) {
            return detector.detect(video).then(function (codes) { return (codes && codes.length && codes[0].rawValue) || ''; }, function () { return ''; });
          }
          if (engine === 'jsqr' && window.jsQR) {
            var w = video.videoWidth, h = video.videoHeight;
            if (w && h) {
              if (!scanCanvas) scanCanvas = document.createElement('canvas');
              scanCanvas.width = w; scanCanvas.height = h;
              var ctx = scanCanvas.getContext('2d', { willReadFrequently: true });
              ctx.drawImage(video, 0, 0, w, h);
              var dat = ctx.getImageData(0, 0, w, h);
              var r = window.jsQR(dat.data, w, h, { inversionAttempts: 'dontInvert' });
              return Promise.resolve((r && r.data) || '');
            }
          }
        } catch (e) { /* 一過性の検出エラーはループ継続 */ }
        return Promise.resolve('');
      })();
    }
    done.then(function (val) {
      if (val && scanOn) {
        var now = Date.now();
        if (!(val === lastHit.code && now - lastHit.t < 3000)) { // 同一コード3秒デバウンス
          lastHit = { code: val, t: now };
          busyScan = true;
          try { processCode(val); } catch (e) {}
          busyScan = false;
          lastHit.t = Date.now();
        }
      }
      if (scanOn && typeof requestAnimationFrame === 'function') rafId = requestAnimationFrame(tick);
    });
  }
  function acquireWake() {
    try {
      if (NAV && NAV.wakeLock && NAV.wakeLock.request) {
        NAV.wakeLock.request('screen').then(function (wl) { wakeLock = wl; }, function () {});
      }
    } catch (e) {}
  }
  function startCam(face) {
    if (!hasCam()) {
      UI.camErr = (typeof window !== 'undefined' && window.isSecureContext === false)
        ? 'httpsでのアクセスが必要なため、カメラを使用できません。「名前で探す」で受付できます。'
        : 'この端末ではカメラを使用できません。「名前で探す」で受付できます。';
      UI.phase = 'scan';
      paintAll();
      return Promise.resolve(false);
    }
    return NAV.mediaDevices.getUserMedia({ video: { facingMode: { ideal: face } }, audio: false }).then(function (st) {
      stopCam();
      stream = st;
      UI.camErr = '';
      UI.phase = 'scan';
      // QRエンジン: BarcodeDetector(qr_code対応時)優先 → jsQR 遅延ロード
      detector = null; engine = '';
      var pick = Promise.resolve();
      try {
        if ('BarcodeDetector' in window && window.BarcodeDetector.getSupportedFormats) {
          pick = window.BarcodeDetector.getSupportedFormats().then(function (fmts) {
            if (fmts && fmts.indexOf('qr_code') >= 0) {
              detector = new window.BarcodeDetector({ formats: ['qr_code'] });
              engine = 'bd';
            }
          }, function () {});
        }
      } catch (e) {}
      return pick.then(function () {
        if (!engine) {
          return loadJsQR().then(function () { engine = 'jsqr'; }, function () {
            UI.camErr = 'QRの自動読み取りエンジンを読み込めませんでした(通信環境をご確認ください)。映像は出ますが「名前で探す」をご利用ください。';
          });
        }
      }).then(function () {
        paintAll();
        var v = videoEl();
        if (v) {
          try { v.srcObject = stream; } catch (e) {}
          try { v.setAttribute('playsinline', 'true'); v.muted = true; } catch (e) {}
          var p = v.play(); if (p && p.catch) p.catch(function () {});
        }
        scanOn = true;
        acquireWake();
        if (typeof requestAnimationFrame === 'function') rafId = requestAnimationFrame(tick);
        return true;
      });
    }, function (e) {
      var nm = (e && e.name) || '';
      UI.camErr =
        nm === 'NotAllowedError' || nm === 'SecurityError' ? 'カメラの使用が許可されませんでした ― ブラウザ/OSの設定で許可すると再開できます。それまでは「名前で探す」で受付できます。' :
        nm === 'NotFoundError' || nm === 'OverconstrainedError' || nm === 'DevicesNotFoundError' ? '利用できるカメラが見つかりません。「名前で探す」で受付できます。' :
        nm === 'NotReadableError' ? 'カメラが他のアプリで使用中の可能性があります。他アプリを閉じてもう一度お試しください。「名前で探す」でも受付できます。' :
        'カメラを使用できません(' + (nm || '不明') + ')。「名前で探す」で受付できます。';
      UI.phase = 'scan'; // 暗地のまま受付は続けられる(名前検索)
      paintAll();
      return false;
    });
  }
  function stopCam() {
    scanOn = false;
    if (rafId && typeof cancelAnimationFrame === 'function') { cancelAnimationFrame(rafId); rafId = 0; }
    if (stream) { try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} stream = null; }
    try { if (wakeLock && wakeLock.release) wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }
  function faceForMode() { return UI.mode === 'duo' ? 'user' : 'environment'; } // console: 連携=内カメラ/通常=外カメラ

  /* ---------- 決済係(受信側): qrLivePoll を1秒間隔でポーリング(console 32291-32330) ----------
     多重実行は recvBusy で防ぎ、cursor(since)で新着だけ受け取る。届いたスキャンは
     processCode({auto:true}) で自動チェックイン=console の「自動チェックインON」と同じ。
     受信済み seq は再処理しない。通信エラーは次周期で静かに回復(consoleと同じ)。 */
  function startRecv() {
    stopCam();
    if (recvTimer) return;
    pollRecv();
    if (typeof setInterval === 'function') recvTimer = setInterval(pollRecv, 1000);
    acquireWake(); // カウンター端末もスリープさせない
  }
  function stopRecv() {
    if (recvTimer) { try { clearInterval(recvTimer); } catch (e) {} recvTimer = 0; }
    recvBusy = false;
    if (!scanOn) { try { if (wakeLock && wakeLock.release) wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  function pollRecv() {
    if (recvBusy || !S.ev || !recvActive() || UI.phase !== 'scan') return;
    recvBusy = true;
    svcFetch('qrLivePoll', { eventId: S.ev.id, since: recvCursor || 0 }).then(function (r) {
      r = r || {};
      if (r.cursor != null) recvCursor = Number(r.cursor) || recvCursor;
      var fresh = arr(r.scans).filter(function (s) { return s && s.code && !recvSeen[String(s.seq)]; });
      fresh.forEach(function (s) {
        recvSeen[String(s.seq)] = 1;
        recvCount++;
        try { processCode(String(s.code), { auto: true }); } catch (e) {}
      });
      recvBusy = false;
      if (fresh.length) paintCallout();
    }, function () { recvBusy = false; /* 一時的な通信エラーは次周期で回復 */ });
  }

  /* ---------- 日付跨ぎ(1分毎+タブ復帰。自動選択のみ本日へ追随) ---------- */
  function recomputeToday(forced) {
    var next = forced || ymd(new Date());
    if (next === todayYmd) return;
    todayYmd = next;
    if (!S.ev || !isMulti()) { paintBar(); return; }
    var today = todaySession();
    if (!today) { paintBar(); return; }
    var cur = sessById(UI.sel);
    if (cur && String(cur.date).slice(0, 10) === todayYmd) { paintBar(); return; }
    if (UI.selBy === 'auto') {
      UI.sel = String(today.id);
      UI.sheet = null;
      showToast('<span class="nb">日付が変わったため</span><span class="nb">本日の日程(Day' + dayNoOf(today.id) + ')へ切替えました</span>', true, 8000);
      paintAll();
    } else {
      showToast('<span class="nb">日付が変わりました</span><span class="nb">― 選択中はDay' + (dayNoOf(UI.sel) || '?') + 'のままです</span>', true, 8000);
      paintBar();
    }
  }

  /* ============================================================================
     描画: 骨格は1回だけ(カメラvideoを生かす)・動く部分はゾーン差し替え
     ============================================================================ */
  function renderShell() {
    root.innerHTML =
      '<div class="stage">' +
      '<div class="feed" id="ck-feed"><video id="ck-video" playsinline muted></video></div>' +
      '<div id="ck-brand"></div>' +
      '<div id="ck-callout"></div>' +
      '<div id="ck-quit-z"></div>' +
      '<div class="topbtns" id="ck-top"></div>' +
      '<div id="ck-toast"></div>' +
      '<div id="ck-sheet"></div>' +
      '<div id="ck-bar"></div>' +
      '<div id="ck-pane"></div>' +
      '</div>';
    paintAll();
  }
  function quit() {
    stopCam();
    stopRecv();
    location.href = './event.html' + QS + '#/ev/' + encodeURIComponent((S.ev && S.ev.id) || route().id || '') + '/day';
  }
  function paintAll() { paintBrand(); paintQuit(); paintCallout(); paintTop(); paintToast(); paintSheet(); paintBar(); paintPane(); }

  /* 舞台上部の小さなワードマーク(スキャン前の全状態)。スキャン中は呼びかけに譲る */
  function paintBrand() {
    var el = document.getElementById('ck-brand');
    if (!el) return;
    el.innerHTML = UI.phase === 'scan' ? '' : '<div class="brand" aria-hidden="true">connec<b>+</b>a</div>';
  }
  /* 左上の終了は文脈があるときだけ(ログイン前などに崩れた枠を残さない) */
  function paintQuit() {
    var el = document.getElementById('ck-quit-z');
    if (!el) return;
    var bare = UI.phase === 'login' || UI.phase === 'boot' || UI.phase === 'pick';
    el.innerHTML = bare ? '' :

  function mirrorFeed() {

  /* ---- 決済カウンター(決済係)。console confirmFull の状態機械を desk 描画で ---- */
  function heldRows() {
    var seen = {};
    var out = [];
    dayRegs().forEach(function (r) {
      if (!regActive(r) || seen[r.id]) return;
      var heldNow = regHeld(r) || localChecked[r.id] === 'hold';
      if (!heldNow) return;
      var pt = payTargetOf(r);
      if (pt.paidNow || payMark[pt.target.id] === 'done') return;
      seen[r.id] = 1;
      out.push({ reg: r, amount: num(pt.target.amount) });
    });
    return out;
  }
  function collectedSum() { // その場決済の回収合計(console cfCollected)
    var sum = 0, n = 0;
    Object.keys(payMark).forEach(function (id) {
      if (payMark[id] !== 'done') return;
      eventRegs().forEach(function (r) { if (r.id === id) { sum += num(r.amount); n++; } });
    });
    return { sum: sum, n: n };
  }
  function deskHtml() {
    var sh = UI.sheet;
    var h = '';
    if (!sh) {
      var col = collectedSum();
      h = '<div class="desk"><div class="kick nb">2台で分担 ・ 決済係</div>' +
        '<h1><span class="nb">読み取りを</span><span class="nb">待っています</span></h1>' +
        '<div class="listen" aria-hidden="true"><i></i><i></i><b></b></div>' +
        '<p class="sub"><span class="nb">読み取り端末でQRが読まれると、ここに表示されます。</span><br>' +
        '<span class="nb">未決済の方は、この画面でそのまま決済を確定できます。</span></p>' +
        '<p class="sub"><span class="nb">受信 ' + recvCount + '件</span>' +
        (col.n > 0 ? ' <span class="nb">・ その場決済の回収 ' + money(col.sum) + '円(' + col.n + '件)</span>' : '') + '</p>' +
        (DEMO ? '<div style="margin-top:14px"><button type="button" class="findbtn nb" id="ck-demo-live">デモ ― 読み取りの到着を再現</button></div>' : '') +
        '</div>';
    } else if (sh.kind === 'unpaid' || sh.kind === 'confirming') {
      var busy = sh.kind === 'confirming';
      var sel = sh.method || (sh.declared === 'PayPay' ? 'PayPay' : '現金');
      h = '<div class="desk"><div class="kick amber nb">未決済 ― 決済の確認</div>' +
        '<div class="bigname nb">' + esc(sh.name) + 'さん</div>' +
        (sh.tagsHtml ? '<div class="tagline">' + sh.tagsHtml + '</div>' : '') +
        '<div class="bigamt nb">' + money(sh.amount) + '<small>円</small></div>' +
        (sh.declared ? '<div class="tagline nb">申告: ' + esc(sh.declared) + '</div>' : '') +
        '<div class="paywrap">' + methodChips(sel) +
        '<button type="button" class="confirm" id="ck-confirm"' + (busy ? ' disabled' : '') + '>' + (busy ? '確定しています…' : 'その場で決済を確定') + '</button>' +
        '<button type="button" class="hold" id="ck-hold"' + (busy ? ' disabled' : '') + '><span class="nb">保留のまま次の方へ</span></button></div>' +
        (sh.note ? '<p class="sub">' + esc(sh.note) + '</p>' : '') +
        (sh.err ? '<div class="err">' + esc(sh.err) + '</div>' : '') +
        '</div>';
    } else if (sh.kind === 'confirmed') {
      h = '<div class="desk"><div class="kick ok nb">決済を確認しました</div>' +
        '<div class="okring" aria-hidden="true"><svg width="46" height="46" viewBox="0 0 52 52" fill="none"><path d="M14 27l8 8 16-17" stroke="#8fe3b0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
        '<div class="bigname nb">' + esc(sh.name) + 'さん ― 入場確定</div>' +
        '<p class="sub nb">決済(' + esc(sh.method || '当日確認') + ')を確認しました</p>' +
        (sh.note ? '<p class="sub">' + esc(sh.note) + '</p>' : '') + '</div>';
    } else if (sh.kind === 'dup') {
      h = '<div class="desk"><div class="kick ok nb">受付済み</div>' +
        '<div class="bigname nb">' + esc(sh.name) + 'さん</div>' +
        '<p class="sub nb">すでに受付済みです(重複スキャン)</p></div>';
    } else { // ok
      h = '<div class="desk"><div class="kick ok nb">受付しました</div>' +
        '<div class="okring" aria-hidden="true"><svg width="46" height="46" viewBox="0 0 52 52" fill="none"><path d="M14 27l8 8 16-17" stroke="#8fe3b0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
        '<div class="bigname nb">' + esc(sh.name) + 'さん ― ようこそ</div>' +
        '<p class="sub nb">決済済み ・ そのままお通しください</p></div>';
    }
    // 保留中の呼び出しレール(タップで決済カウンターに表示 — console confirmFull下部と同じ)
    var held = heldRows();
    if (held.length) {
      h += '<div class="heldrail" aria-label="保留中"><span class="cap nb">保留中 ' + held.length + '名 ― タップで表示</span>' +
        held.map(function (x) {
          return '<button type="button" data-heldreg="' + esc(x.reg.id) + '"><span class="nb">' + esc(x.reg.userName || x.reg.id) + '</span>' +
            (x.amount > 0 ? '<b class="nb">' + money(x.amount) + '円</b>' : '') + '</button>';

    return h;
  }
  function bindDesk() {
    Array.prototype.forEach.call(root.querySelectorAll('[data-method]'), function (b) {
      b.addEventListener('click', function () {
        if (UI.sheet && UI.sheet.kind === 'unpaid') { UI.sheet.method = b.getAttribute('data-method'); paintCallout(); } // paintCallout が bindDesk を再実行する(二重バインド禁止)
      });
    });
    var cb = document.getElementById('ck-confirm');
    if (cb) cb.addEventListener('click', function () {
      var s2 = UI.sheet;
      confirmPay((s2 && s2.method) || (s2 && s2.declared === 'PayPay' ? 'PayPay' : '現金'));
    });
    var hb = document.getElementById('ck-hold');
    if (hb) hb.addEventListener('click', function () { UI.sheet = null; paintSheet(); });
    Array.prototype.forEach.call(root.querySelectorAll('[data-heldreg]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-heldreg');
        var reg = null;
        dayRegs().forEach(function (r) { if (!reg && r.id === id) reg = r; });
        if (reg) setSheet(sheetFor(reg, 'unpaid'));
      });
    });
    var dl = document.getElementById('ck-demo-live');
    if (dl) dl.addEventListener('click', demoLivePush);
  }

  function paintTop() {

    var b = document.getElementById('ck-mute');

  function paintToast() {

  function methodChips(sel) {

    }).join('') + '</div>';

  function paintSheet() {
    var el = document.getElementById('ck-sheet');
    if (!el) return;
    if (recvActive()) { el.innerHTML = ''; paintCallout(); return; } // 決済係は中央の決済カウンターに描く
    var sh = UI.sheet;
    if (!sh) { el.innerHTML = ''; return; }
    var who = '<div class="who">' +
      (sh.photo ? '<img src="' + esc(sh.photo) + '" alt="">' : '') +

      (sh.tagsHtml ? '<div class="tags">' + sh.tagsHtml + '</div>' : '') + '</div>';

    if (sh.kind === 'ok' || sh.kind === 'pushok') {
      who += '<div class="due"><span class="st ok nb">決済済み</span></div></div>';
      body = '<div class="done-line"><span class="nb">' + (sh.kind === 'pushok' ? '読み取りました' : '受付完了') + '</span>' +

      who += '<div class="due"><span class="st nb">未決済</span>' +
        '<div class="amt nb">' + money(sh.amount) + '<small>円</small></div></div></div>';

      body = '<div class="info-line"><span class="nb">決済がまだ確認できていません</span> <span class="nb">― 受付スタッフが確認します。そのままお待ちください</span>' +
        (sh.dupNote ? ' <span class="nb">(読み取り済み)</span>' : '') + '</div>';
    } else { // unpaid / confirming
      var busy = sh.kind === 'confirming';
      var brk = [];
      var cn = num((eventRegs().filter(function (r) { return r.id === sh.regId; })[0] || {}).companionsCount);
      if (cn > 0) brk.push('大人1名+こども' + cn + '名');
      who += '<div class="due"><span class="st nb">未決済</span>' +
        '<div class="amt nb">' + money(sh.amount) + '<small>円</small></div>' +
        (brk.length ? '<div class="brk nb">' + esc(brk.join(' ・ ')) + '</div>' : '') + '</div></div>';
      var sel = sh.method || (sh.declared === 'PayPay' ? 'PayPay' : '現金');
      body = '<div class="payrow">' + methodChips(sel) +
        '<button type="button" class="confirm" id="ck-confirm"' + (busy ? ' disabled' : '') + '>' +
        (busy ? '確定しています…' : 'その場で決済を確定') + '</button></div>' +
        '<div class="sheet-foot"><span class="note"><span class="nb">確定するとチェックイン済+決済済みになります</span> <span class="nb">― 受け取りを確認してから押してください</span></span>' +
        '<button type="button" class="hold" id="ck-hold"' + (busy ? ' disabled' : '') + '><span class="nb">保留のまま次の方へ</span></button></div>' +
        (sh.note ? '<div class="info-line">' + esc(sh.note) + '</div>' : '') +
        (sh.err ? '<div class="sheet-foot"><span class="err">' + esc(sh.err) + '</span></div>' : '');
    }
    el.innerHTML = '<section class="sheet glass" aria-label="スキャン結果">' + who + body + '</section>';
    Array.prototype.forEach.call(root.querySelectorAll('[data-method]'), function (b) {
      b.addEventListener('click', function () {
        if (UI.sheet && (UI.sheet.kind === 'unpaid')) { UI.sheet.method = b.getAttribute('data-method'); paintSheet(); }
      });
    });
    var cb = document.getElementById('ck-confirm');
    if (cb) cb.addEventListener('click', function () {
      var s2 = UI.sheet;
      confirmPay((s2 && s2.method) || (s2 && s2.declared === 'PayPay' ? 'PayPay' : '現金'));
    });
    var hb = document.getElementById('ck-hold');
    if (hb) hb.addEventListener('click', function () {
      // 保留のまま次へ: 行はサーバ側も保留(チェックイン保留)のまま。シートを閉じるだけ(consoleと同じ)。
      UI.sheet = null;

  }

  function switchMode(mode) {
    if (mode === 'duo') {
      // 2台で分担は役割(読み取り/決済係)を選んでから。再タップで役割の切替もできる。
      UI.roleOpen = true;
      paintPane();
      return;
    }
    if (mode !== 'solo' || UI.mode === 'solo') return;
    UI.mode = 'solo';
    stopRecv();
    UI.sheet = null; // モード切替で前モードの案内は消す(consoleは切替でカメラ停止=表示リセット)
    if (UI.phase === 'scan' && !DEMO && hasCam()) startCam('environment'); // consoleと同じ向き規約へ戻す
    paintAll();
  }
  function setDuoRole(role) {
    // 役割の確定=そのまま開始(開始前の役割選択シートからの直行もここに合流する)
    if (role !== 'push' && role !== 'recv') return;
    UI.roleOpen = false;
    UI.dayOpen = false;
    UI.mode = 'duo';
    UI.duoRole = role;
    UI.sheet = null;
    if (role === 'recv') {
      UI.phase = 'scan';
      startRecv(); // カメラを止めて受信専用へ(決済カウンター・カメラ許可不要)
      paintAll();
      return;
    }
    stopRecv();
    if (DEMO) { UI.phase = 'scan'; paintAll(); return; } // デモはダミー地のまま
    startCam('user'); // 読み取り側=内カメラ(console規約)。不可なら camErr+正直な案内で開始
    paintAll();
  }

  /* ---- 下部シート(dock): 開始前/日程選択/名前検索/ログイン/権限/エラーの全状態 ----
     舞台(カメラ地+薄ガイド+状況バー)はそのまま、この dock の中身だけを入れ替える。 */
  function dockWrap(inner, opts) {
    opts = opts || {};
    return '<div class="dockwrap' + (opts.veil ? ' veil' : '') + '">' +
      '<section class="dock' + (opts.cls ? ' ' + opts.cls : '') + '" aria-label="' + esc(opts.label || '当日受付') + '">' + inner + '</section></div>';
  }
  function paintPane() {
    var el = document.getElementById('ck-pane');
    if (!el) return;
    var live = UI.phase === 'scan';
    if (UI.phase === 'login') { el.innerHTML = dockWrap(loginHtml(), { label: 'ログイン' }); bindLogin(); return; }
    if (UI.phase === 'boot') {

      el.innerHTML = dockWrap('<div class="kick nb">当日受付</div>' +
        '<h2>権限が必要です</h2><p class="sub">受付(チェックイン・決済確認)には<span class="nb">アシスタントマネージャー以上</span>の権限が必要です。</p>' +
        '<div class="cta"><button type="button" class="rowlink" id="ck-back2">イベント面へ戻る</button></div>', { label: '権限が必要です' });

      return;
    }
    if (UI.phase === 'notfound') {
      el.innerHTML = dockWrap('<div class="kick nb">当日受付</div>' +
        '<h2>このイベントは見つかりませんでした</h2><p class="sub">URLが古いか、イベントが削除された可能性があります。</p>' +
        '<div class="cta"><button type="button" class="rowlink" id="ck-back3">イベント面へ戻る</button></div>', { label: 'イベントが見つかりません' });
      var b3 = document.getElementById('ck-back3');

  /* ---- 直リンクなしで開いたとき: きょうのイベントを選ぶ(1件なら自動で開始画面へ) ---- */
  function evIsToday(e) {
    if (!e) return false;
    var ss = evSess(e);
    if (ss.length) {
      var hit = false;
      ss.forEach(function (s) { if (String(s.date).slice(0, 10) === todayYmd) hit = true; });
      return hit;
    }
    return String(e.date || '').slice(0, 10) === todayYmd;
  }
  function pickHtml() {
    var list = arr(S.pick);
    var todays = list.filter(evIsToday);
    var future = list.filter(function (e) { return !evIsToday(e) && String(e.date || '').slice(0, 10) > todayYmd; })
      .sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); }).slice(0, 4);
    var row = function (e, isToday) {
      var d = parseYmd(String(e.date || '').slice(0, 10));
      return '<button type="button" data-pick="' + esc(e.id) + '">' +
        '<span class="dn nb">' + esc(e.title || e.name || e.id) + '</span>' +
        '<span class="dd nb">' + (d ? esc(dateSlash(d)) + '(' + WD[d.getDay()] + ')' : '') + (timeRange(e) ? ' ' + esc(timeRange(e)) : '') + '</span>' +
        (isToday ? '<span class="today nb">きょう</span>' : '') + '</button>';
    };
    var h = '<div class="kick nb">当日受付</div><h2>受付するイベントを選んでください</h2>';
    if (todays.length) {
      h += '<div class="dayrows">' + todays.map(function (e) { return row(e, true); }).join('') + '</div>';
    } else {
      h += '<p class="sub nb">きょう開催のイベントはありません。</p>';
    }
    if (future.length) {
      h += '<div class="subhead nb">これからのイベント</div>' +
        '<div class="dayrows">' + future.map(function (e) { return row(e, false); }).join('') + '</div>';
    }
    if (!todays.length && !future.length) h += '<p class="sub">イベント面の「受付を開く(iPad)」からも入れます。</p>';
    return h;
  }
  function bindPick() {
    Array.prototype.forEach.call(root.querySelectorAll('[data-pick]'), function (b) {
      b.addEventListener('click', function () {
        location.hash = '#/ev/' + encodeURIComponent(b.getAttribute('data-pick') || '');
      });
    });
  }
  function loadPicker() {
    UI.phase = 'boot';
    paintAll();
    API.fetchData('listEvents', {}).then(function (events) {
      var list = arr(events).filter(function (e) { return e && e.id && !/下書き/.test(String(e.status || '')); });
      var todays = list.filter(evIsToday);
      if (todays.length === 1) { location.hash = '#/ev/' + encodeURIComponent(todays[0].id); return; } // 1件なら自動選択で開始画面へ
      S.pick = list;
      UI.phase = 'pick';
      paintAll();
    }, function (e) {
      if (e && e._auth) return;
      S.err = (e && e.message) || '通信に失敗しました。';
      UI.phase = 'boot';
      paintAll();
    });
  }

  function bindStart() {

        paintPane();
      });

    var sb = document.getElementById('ck-start');
    if (sb) sb.addEventListener('click', function () {
      if (isMulti() && !UI.sel) return;
      UI.dayOpen = false;
      UI.sheet = null; // 日程を切り替えたら前日程向けの案内は消す(console 31865)

      startCam(faceForMode());
      paintPane();

    // 受付のかたち: この端末で確定(既定) / 2台で分担=役割の説明シートへ

        paintPane();
      });
    });
    var cb = document.getElementById('ck-daycancel');
    if (cb) cb.addEventListener('click', function () { UI.dayOpen = false; paintPane(); });
  }

  /* ---- ログイン(event/30-app.js renderLogin と同じ文言規約・同じAPI規約) ---- */
  function loginHtml() {
    var st = UI;
    var f;
    if (st.loginMode === 'setpw') {
      f = '<label>新しいパスワード<input type="password" id="ck-npw" autocomplete="new-password">' +
        '<span class="hint nb">10文字以上で設定してください</span></label>' +
        '<label>パスワード(確認)<input type="password" id="ck-npw2" autocomplete="new-password"></label>';
    } else {
      f = '<label>メンバーコード または メール<input id="ck-lid" value="' + esc(st.loginId || '') + '" autocomplete="username" placeholder="CN0001 / you@example.com"></label>' +
        '<label>パスワード<input type="password" id="ck-lpw" autocomplete="current-password">' +
        '<span class="hint"><span class="nb">初回(未設定)の場合は</span><span class="nb">空のままログインしてください</span></span></label>';
    }
    return '<div class="kick nb">運営メンバー専用</div>' +
      '<h2>' + (st.loginMode === 'setpw' ? 'パスワードの設定' : '当日受付') + '</h2>' +
      '<p class="sub">' + (st.loginMode === 'setpw'
        ? '初回ログインです。ご自身のパスワードを設定してください。'
        : 'console と同じ<span class="nb">メンバーコード(またはメール)</span>と<span class="nb">パスワードで入れます</span>。') + '</p>' +
      '<form id="ck-lform">' + f +
      (st.loginErr ? '<div class="err">' + esc(st.loginErr) + '</div>' : '') +
      '<div class="cta"><button class="go" id="ck-lgo" type="submit"><span class="nb">' +
      (st.loginBusy ? (st.loginMode === 'setpw' ? '設定中…' : '認証中…') : (st.loginMode === 'setpw' ? '設定してログイン' : 'ログイン')) + '</span></button></div>' +
      '</form>';
  }
  function bindLogin() {
    var form = document.getElementById('ck-lform');
    if (!form) return;
    var submit = function (ev) {
      if (ev && ev.preventDefault) ev.preventDefault();
      if (UI.loginBusy) return;
      var g = function (id) { var n = document.getElementById(id); return n ? String(n.value || '') : ''; };
      if (UI.loginMode === 'setpw') {
        var npw = g('ck-npw'), npw2 = g('ck-npw2');
        if (npw !== npw2) { UI.loginErr = '確認用パスワードが一致しません。'; paintPane(); return; }
        if (npw.length < 10) { UI.loginErr = 'パスワードは10文字以上にしてください。'; paintPane(); return; }
        UI.loginBusy = true; UI.loginErr = ''; paintPane();
        API.setPassword(UI.loginId, npw).then(function (r) {
          UI.loginBusy = false;
          if (API.finishLogin(r, UI.loginId)) { boot(); return; }
          UI.loginMode = 'login'; UI.loginErr = '設定は完了しました。設定したパスワードでログインしてください。'; paintPane();
        }, function (e) { UI.loginBusy = false; UI.loginErr = (e && e.message) || 'パスワードの設定に失敗しました。'; paintPane(); });
        return;
      }
      var id = g('ck-lid').trim(), pw = g('ck-lpw');
      if (!id) { UI.loginErr = 'メンバーコードまたはメールを入力してください。'; paintPane(); return; }
      UI.loginId = id;
      UI.loginBusy = true; UI.loginErr = ''; paintPane();
      API.login(id, pw).then(function (r) {
        UI.loginBusy = false;
        if (r && r.needsPasswordSet) { UI.loginMode = 'setpw'; UI.loginErr = ''; paintPane(); return; }
        if (API.finishLogin(r, id)) { boot(); return; }
        UI.loginErr = (r && r.error) || 'ID またはパスワードが違います。ご確認ください。';
        paintPane();
      }, function (e) { UI.loginBusy = false; UI.loginErr = (e && e.message) || 'ログインに失敗しました。'; paintPane(); });
    };
    form.addEventListener('submit', submit);
    var go = document.getElementById('ck-lgo');
    if (go) go.addEventListener('click', submit);
  }

  /* ============================================================================
     読込
     ============================================================================ */
  function route() {
    var m = /^#\/ev\/([^\/]+)/.exec(location.hash || '');
    return { id: m ? decodeURIComponent(m[1]) : '' };
  }
  function meModel() {
    var u = window.currentUser;
    var m = (u && u.member) || {};
    return {
      name: m.nickname || m.name || '',
      rank: API.myRank(),
      photo: m.photoUrl || m.avatarUrl || '',
    };
  }
  function applyGate() {
    S.me = meModel();
    if (S.me && S.me.rank > 0 && S.me.rank < 2) { UI.phase = 'perm'; stopCam(); paintAll(); return false; }
    return true;
  }
  function reloadRegs() {
    if (DEMO) { paintBar(); return Promise.resolve(); }
    var evId = S.ev ? S.ev.id : route().id;
    var viaFull = function () {
      return API.fetchData('listRegistrations', {}).then(function (rows) {
        S.regs = arr(rows).filter(function (r) { return r && r.eventId === evId; });
      });
    };
    if (erUnsupported) return viaFull();
    return API.fetchData('listEventRegistrations', { eventId: evId }).then(function (d) {
      S.regs = arr(d && d.rows ? d.rows : d);
    }, function (e) {
      if (/unknown action|invalid action|not supported|未対応|不明なアクション/i.test(String((e && e.message) || ''))) erUnsupported = true;
      return viaFull();
    });
  }
  function loadReal() {
    if (S.loading) return;
    S.loading = true;
    var evId = route().id;
    if (!evId) { S.loading = false; loadPicker(); return; } // 直リンクなし → きょうのイベントを選ぶ(1件なら自動)
    // 軽量読取はuser非同梱=役職不明のままだと権限ゲートが判定できない → getDataGen で解決(event/30-app.js と同じ)
    if (API.hasSession() && !(window.currentUser && window.currentUser.member)) {
      API.fetchData('getDataGen', {}).then(function () {
        if (applyGate()) paintAll();
      }, function () {});
    }
    var pEv = API.fetchData('listEvents', {});
    var pRegs = reloadRegs();
    var pParts = API.fetchData('listParticipants', {}).then(function (r) { S.parts = arr(r); }, function () { S.parts = []; });
    pEv.then(function (events) {
      var hit = null;
      arr(events).forEach(function (e) { if (e && String(e.id) === String(evId)) hit = e; });
      if (!hit) { S.loading = false; UI.phase = 'notfound'; paintAll(); return; }
      S.ev = hit;
      if (!applyGate()) { S.loading = false; return; }
      // 複数日: きょうのDayを既定選択(console 31682-31684)
      if (isMulti()) {
        var today = todaySession();
        if (today && !UI.sel) { UI.sel = String(today.id); UI.selBy = 'auto'; }
      }
      UI.phase = 'ready';
      paintAll();
      pRegs.then(function () { paintAll(); }, function (e2) {
        if (e2 && e2._auth) return;
        S.regs = S.regs || [];
        showToast('申込名簿を取得できませんでした ― <span class="nb">通信を確認して再読み込みしてください</span>', true, 10000);
        paintAll();
      });
      pParts.then(function () { paintBar(); });
      Promise.all([pRegs.catch(function () {}), pParts]).then(function () { S.loading = false; });
    }, function (e) {
      S.loading = false;
      if (e && e._auth) return;
      S.err = (e && e.message) || '通信に失敗しました。';
      UI.phase = 'boot';
      paintAll();
    });
  }

  /* ============================================================================
     デモ(?demo=1): 実コードパス(processCode/bgCheckin/confirmPay)をそのまま通す。
     通信だけ端末内サーバに差し替え(svcFetch/svcPost)。カメラ枠はダミー地。
     ============================================================================ */
  var DEMO_DB = null;
  function demoSeed() {
    if (DEMO_DB) return DEMO_DB;
    var t = new Date();
    function dy(n) { var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + n); return ymd(d); }
    var regs = [];
    // EV-PIC(単日きょう・1,500円): 42申込 ・ 34名が受付済み ・ サラさん=未決済+こども1名同伴(正典モックの状態)
    var NAMES = ['ハルト', 'ファティマ', 'リン・チェン', 'トム', 'ソフィア', 'ダニエル', 'ユスフ', 'マリア', 'ジン', 'アオイ',
      'ケンタ', 'アミナ', 'パブロ', 'ユイ', 'ラフル', 'エレナ', 'ミンジュン', 'リナ', 'オマール', 'ハンナ',
      'タクミ', 'ジェシカ', 'グエン', 'モエ', 'カルロス', 'ナディア', 'ショウ', 'イザベラ', 'アキラ', 'ターリク',
      'メイ', 'ルーカス', 'サキ', 'イワン', 'チカ', 'ノア', 'ヒロ', 'アリヤ', 'レン', 'ビクトル'];
    for (var i = 1; i <= 40; i++) {
      regs.push({
        id: 'PR' + i, eventId: 'EV-PIC', userId: 'PU' + i,
        userName: NAMES[i - 1],
        status: i <= 34 ? 'チェックイン済' : '決済済み', paid: true, amount: 1500,
      });
    }
    regs.push({ id: 'R-90001', eventId: 'EV-PIC', userId: 'PU-SARA', userName: 'サラ', status: '申込済み', paid: false, amount: 1500, companionsCount: 1, companions: [{ type: 'child', age: 6 }] });
    regs.push({ id: 'R-90002', eventId: 'EV-PIC', userId: 'PU-MIGUEL', userName: 'ミゲル', status: '申込済み', paid: false, amount: 1500, paymentMethod: 'PayPay' });
    // EV-CAMP(2泊3日・きょう=Day2): Day2到着の未決済(課金行=Day1)= markPaid 正経路の見本
    var camp = [
      { id: 'CR1', applicationId: 'CA1', userId: 'CU1', userName: 'ユスフ', sessionId: 'CS1', status: '決済済み', paid: true, amount: 12000 },
      { id: 'CR2', applicationId: 'CA1', userId: 'CU1', userName: 'ユスフ', sessionId: 'CS2', status: '決済済み', paid: true, amount: 0 },
      { id: 'CR3', applicationId: 'CA1', userId: 'CU1', userName: 'ユスフ', sessionId: 'CS3', status: '決済済み', paid: true, amount: 0 },
      { id: 'CR4', applicationId: 'CA2', userId: 'CU2', userName: 'ミオ', sessionId: 'CS1', status: '申込済み', paid: false, amount: 12000 },
      { id: 'CR5', applicationId: 'CA2', userId: 'CU2', userName: 'ミオ', sessionId: 'CS2', status: '申込済み', paid: false, amount: 0 },
      { id: 'CR6', applicationId: 'CA3', userId: 'CU3', userName: 'ハンナ', sessionId: 'CS2', status: '決済済み', paid: true, amount: 8000 },
      { id: 'CR7', applicationId: 'CA3', userId: 'CU3', userName: 'ハンナ', sessionId: 'CS3', status: '決済済み', paid: true, amount: 0 },
      { id: 'CR8', applicationId: 'CA4', userId: 'CU4', userName: 'レオ', sessionId: 'CS3', status: '申込済み', paid: false, amount: 8000 },
    ];
    camp.forEach(function (r) { r.eventId = 'EV-CAMP'; regs.push(r); });
    DEMO_DB = {
      events: [
        { id: 'EV-PIC', title: '国際交流ピクニック', status: '公開中', date: dy(0), time: '12:00', endTime: '15:00', venue: '代々木公園 中央広場', capacity: 50, fee: 1500 },
        { id: 'EV-CAMP', title: '秋の国際交流合宿(2泊3日)', format: 'multi', status: '公開中', date: dy(-1), endDate: dy(1), time: '10:00', venue: '河口湖 青少年交流の家', fee: 12000,
          sessions: [
            { id: 'CS1', name: '1日目', date: dy(-1), startTime: '10:00', endTime: '21:00' },
            { id: 'CS2', name: '2日目', date: dy(0), startTime: '07:00', endTime: '21:00' },
            { id: 'CS3', name: '3日目', date: dy(1), startTime: '07:00', endTime: '15:00' },
          ] },
      ],
      regs: regs,
      parts: [
        { id: 'PU-SARA', events: 0, photoUrl: 'https://i.pravatar.cc/192?img=31' },
        { id: 'PU-MIGUEL', events: 0, photoUrl: 'https://i.pravatar.cc/192?img=13' },
        { id: 'PU1', events: 3, photoUrl: 'https://i.pravatar.cc/192?img=15' },
        { id: 'CU2', events: 0, photoUrl: 'https://i.pravatar.cc/192?img=44' },
      ],
      live: [], // 2台分担の中継キュー(qrPushScan→qrLivePoll。実BEのCacheServiceキューと同じ形)
    };
    return DEMO_DB;
  }
  // 端末内サーバ: Code.gs の adminCheckin_/adminConfirmPayment_/applicationMarkPaid_ と同じ規約で応答
  function demoServer(action, params, payload) {
    var db = demoSeed();
    return new Promise(function (resolve, reject) {
      setTimeout(function () {
        function find(id) { var hit = null; db.regs.forEach(function (r) { if (r.id === id) hit = r; }); return hit; }
        if (action === 'admin.checkin') {
          var r = find(payload.regId);
          if (!r) return reject(new Error('regが見つかりません'));
          var isPaid = regPaidFlag(r) || num(r.amount) === 0;
          r.status = isPaid ? 'チェックイン済' : 'チェックイン保留';
          return resolve({ success: true, isPaid: isPaid, requiresPayment: !isPaid, newStatus: r.status });
        }
        if (action === 'admin.confirmPayment') {
          var r2 = find(payload.regId);
          if (!r2) return reject(new Error('regが見つかりません'));
          if (!/チェックイン/.test(r2.status)) return reject(new Error('「チェックイン保留」 状態の reg のみ決済確認できます (現在: ' + r2.status + ')'));
          r2.status = 'チェックイン済'; r2.paid = true; r2.actualPaymentMethod = payload.paymentMethod || '当日確認';
          return resolve({ success: true, newStatus: 'チェックイン済' });
        }
        if (action === 'admin.application.markPaid') {
          var ids = arr(payload.regIds).map(String);
          var paidIds = [];
          db.regs.forEach(function (r3) {
            if (String(r3.applicationId || '') !== String(payload.applicationId)) return;
            if (/返金|キャンセル/.test(String(r3.status))) return;
            if (regPaidFlag(r3)) return;
            if (ids.length && ids.indexOf(String(r3.id)) < 0) return;
            r3.status = '決済済み'; r3.paid = true;
            paidIds.push(r3.id);
          });
          if (!paidIds.length) return reject(new Error('決済済化できる reg がありません'));
          return resolve({ applicationId: payload.applicationId, paidRegIds: paidIds });
        }
        if (action === 'qrPushScan') { // 実BE(Code.gs qrPushScan)と同じ: seq採番してキューへ
          var seq = (db.live.length ? num(db.live[db.live.length - 1].seq) : 0) + 1;
          db.live.push({ seq: seq, code: String(payload.code || ''), device: String(payload.device || ''), at: new Date().toISOString() });
          return resolve({ ok: true, seq: seq });
        }
        if (action === 'qrLivePoll') { // 実BE(Code.gs qrLivePoll)と同じ: since より新しい scans + cursor
          var since = num(params && params.since);
          var out = db.live.filter(function (s) { return num(s.seq) > since; });
          var last = db.live.length ? num(db.live[db.live.length - 1].seq) : since;
          return resolve({ scans: out, cursor: Math.max(since, last) });
        }
        if (action === 'listEvents') return resolve(db.events);
        if (action === 'listRegistrations') return resolve(db.regs);
        if (action === 'listParticipants') return resolve(db.parts);
        reject(new Error('unknown action ' + action));
      }, 120);
    });
  }
  var demoScript = { i: 0, j: 0 };
  function demoSeq() {
    // 正典モックの一連の流れ: 決済済み→サラ(未決済・こども同伴)→重複→別日QR(合宿はDay2到着も)
    return S.ev && S.ev.id === 'EV-CAMP'
      ? ['CR6', 'CR5', 'CR1', 'CR8', 'CR6']  // ハンナ(済)/ミオDay2到着(課金=Day1)/ユスフのDay1QR(当日行で続行)/レオ(Day3=別日)/重複
      : ['PR36', 'R-90001', 'PR36', 'R-90002']; // ノア(済)/サラ(未決済)/重複/ミゲル(未決済PayPay申告)
  }
  function demoTap() {
    var seq = demoSeq();
    var code = seq[demoScript.i % seq.length];
    demoScript.i++;
    processCode(code, {});
  }
  function demoLivePush() {
    // 決済係のデモ: 読み取り端末からの到着を再現(中継キューに積む→実物の受信ループが拾う)
    var seq = demoSeq();
    var code = seq[demoScript.j % seq.length];
    demoScript.j++;
    demoServer('qrPushScan', null, { code: code, eventId: S.ev ? S.ev.id : '', device: 'scanner-demo' });
  }
  function loadDemo() {
    var db = demoSeed();
    var evId = route().id || 'EV-PIC';
    var hit = null;
    db.events.forEach(function (e) { if (e.id === evId) hit = e; });
    if (!hit) { UI.phase = 'notfound'; paintAll(); return; }
    S.ev = hit;
    S.regs = db.regs.filter(function (r) { return r.eventId === evId; });
    S.parts = db.parts;
    S.me = { name: 'みずき', rank: 3, photo: 'https://i.pravatar.cc/80?img=47' };
    if (isMulti()) {
      var today = todaySession();
      if (today) { UI.sel = String(today.id); UI.selBy = 'auto'; }
    }
    UI.phase = 'ready';
    paintAll();
  }

  /* ---------- QAブリッジ(オフライン検証/スクショ用。スキャナ/受信と同じ入口しか触れない) ---------- */
  window.__ckScan = function (text, opts) { return processCode(text, opts || {}); };
  window.__ckState = function () {
    return {
      phase: UI.phase, mode: UI.mode, duoRole: UI.duoRole, roleOpen: UI.roleOpen, sel: UI.sel, selBy: UI.selBy,
      sheet: UI.sheet ? { kind: UI.sheet.kind, regId: UI.sheet.regId, payRegId: UI.sheet.payRegId, name: UI.sheet.name, amount: UI.sheet.amount, method: UI.sheet.method, err: UI.sheet.err } : null,
      tally: S.ev ? tallyNow() : null,
      count: UI.count, pushCount: pushCount, syncFailed: UI.syncFailed,
      recvCount: recvCount, recvCursor: recvCursor, recvOn: !!recvTimer,
      toast: UI.toastMsg ? UI.toastMsg.html : '',
      dayOpen: UI.dayOpen, findOpen: UI.findOpen, camErr: UI.camErr, today: todayYmd,
    };
  };
  window.__ckSetToday = function (y) { recomputeToday(String(y)); };
  window.__ckStart = function () { UI.phase = 'scan'; UI.dayOpen = false; paintAll(); };
  window.__ckCamErr = function (msg) { UI.camErr = String(msg == null ? '' : msg); paintAll(); }; // 見た目検証(カメラ拒否の舞台)専用
  window.__ckRole = function (role) { UI.phase = 'scan'; UI.dayOpen = false; setDuoRole(role); };
  window.__ckLive = function (code) { if (DEMO) demoServer('qrPushScan', null, { code: String(code || ''), eventId: S.ev ? S.ev.id : '', device: 'scanner-demo' }); };

  /* ---------- 起動 ---------- */
  API.setOnUnauthorized(function () {
    if (unauthShown) return;
    unauthShown = true;
    API.clearSession();
    stopCam();
    UI.phase = 'login';
    UI.loginErr = 'セッションが切れました。再度ログインしてください。';
    paintAll();
  });
  function boot() {
    unauthShown = false;
    renderShell();
    if (DEMO) { loadDemo(); return; }
    if (!API.hasSession()) { UI.phase = 'login'; paintAll(); return; }
    loadReal();
  }
  window.addEventListener('hashchange', function () {
    // イベントを跨いだら受付状態をリセット(consoleはイベント切替で cursor/chimed/pushed 等をリセット)
    stopCam();
    stopRecv();
    S.ev = null; S.regs = null; S.pick = null;
    localChecked = {}; chimed = {}; payMark = {}; pushed = {};
    recvCursor = 0; recvSeen = {}; recvCount = 0;
    UI.sel = ''; UI.selBy = 'auto'; UI.sheet = null; UI.count = 0; UI.dayOpen = false; UI.findOpen = false;
    UI.roleOpen = false; UI.mode = 'solo'; UI.duoRole = 'push';
    UI.phase = 'boot';
    boot();
  });
  if (typeof setInterval === 'function') {
    dayTimer = setInterval(function () { recomputeToday(); }, 60000); // 1分毎の日付跨ぎ追随(console 31694-31699)
  }
  try {
    document.addEventListener('visibilitychange', function () {
      recomputeToday();
      if (document.visibilityState === 'visible' && (scanOn || recvTimer)) acquireWake(); // Wake Lockは背面化で自動解放される
    });
  } catch (e) {}
  boot();
})();
