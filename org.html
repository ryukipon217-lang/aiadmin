  var rsvpBusy = false;
  function bindHome(vm) {
    // 既読: 「開く」を押したら点を消す(localStorage)
    O.nodes(O.root.querySelectorAll('[data-read]')).forEach(function (el) {
      el.addEventListener('click', function () {
        O.markRead(el.getAttribute('data-read'));
        setTimeout(function () { if (O.route().view === 'home') O.render(); }, 0);
      });
    });
    // 出席で返す / 欠席に変える(setMyMeetingRsvp・自動リトライなし)
    O.nodes(O.root.querySelectorAll('[data-rsvp]')).forEach(function (el) {
      el.addEventListener('click', function () {
        var note = document.getElementById('og-rsvp-note');
        if (O.DEMO) { if (note) note.textContent = 'デモ表示のため送信は行われません。'; return; }
        if (rsvpBusy || !vm.band || !vm.band.intakeId) return;
        rsvpBusy = true;
        if (note) note.textContent = '送信中…';
        API.postData('setMyMeetingRsvp', { intakeId: vm.band.intakeId, rsvpStatus: el.getAttribute('data-rsvp') })
          .then(function () {
            return API.fetchData('listMinutesMeetings', {}).then(function (d) { O.M.meetings = d; }, function () {});
          })
          .then(function () {
            rsvpBusy = false;
            O.cacheSave();
            if (O.route().view === 'home') O.render();
          })
          .catch(function (e) {
            rsvpBusy = false;
            if (note) note.textContent = '送信できませんでした: ' + String((e && e.message) || '通信エラー');
          });
      });
    });
    // オンボーディング起票(アシマネ+)
    var st = document.getElementById('og-ob-start');
    if (st) st.addEventListener('click', function () {
      var note = document.getElementById('og-ob-note');
      if (O.DEMO) { if (note) note.textContent = 'デモ表示のため起票は行われません。'; return; }
      var mid = st.getAttribute('data-ob-start');
      if (!mid || st.disabled) return;
      st.disabled = true;
      if (note) note.textContent = '起票しています…';
      API.postData('startOnboarding', { memberId: mid, mentorId: (O.M.me && O.M.me.id) || '' })
        .then(function () {
          delete O.OB[mid];
          loadOnboarding(mid);
        })
        .catch(function (e) {
          st.disabled = false;
          if (note) note.textContent = '起票できませんでした: ' + String((e && e.message) || '通信エラー');
        });
    });
  }
})();

// ================= org/50-dept.js =================
/* ============================================================================
   部署ハブ(#/dept/<id>) — 正典: org-dept.html
   会議の日バンド(録音導線=consoleの議事録ページへ) / 3日以内議事録 / 数字バンド /
   部署目標(listDeptGoals・意味色+目標比%・編集=アシマネ+) / グループのレール
   (listDeptGroups) / メンバーレール / 出席のようす / 直近の議事録 / 右欄(次の定例+タスク)
   編集ビュー: #/dept/<id>/goals(saveDeptGoal/updateGoalCurrent) /
               #/dept/<id>/groups(saveDeptGroup)
   ============================================================================ */
(function () {
  'use strict';
  var O = window.__ORG;
  var API = window.AdminAPI;
  var esc = O.esc, arr = O.arr, num = O.num, faceHtml = O.faceHtml;

  /* ---------- 部署単位の遅延読取(目標+グループ。全メンバー読取可) ---------- */
  function loadDeptExtras(deptId) {
    if (O.DEMO) return;
    var gl = O.GL[deptId] || (O.GL[deptId] = { items: null, err: false, fetched: false, loading: false });
    var gr = O.GRP[deptId] || (O.GRP[deptId] = { groups: null, err: false, fetched: false, loading: false });
    var jobs = [];
    if (!gl.loading && !gl.fetched) {
      gl.loading = true;
      jobs.push(API.fetchData('listDeptGoals', { deptId: deptId }).then(
        function (d) { gl.items = O.unwrapList(d, 'items'); gl.err = false; },
        function () { gl.err = true; if (gl.items === null) gl.items = []; }
      ).then(function () { gl.loading = false; gl.fetched = true; }));
    }
    if (!gr.loading && !gr.fetched) {
      gr.loading = true;
      jobs.push(API.fetchData('listDeptGroups', { deptId: deptId }).then(
        function (d) { gr.groups = O.unwrapList(d, 'groups'); gr.err = false; },
        function () { gr.err = true; if (gr.groups === null) gr.groups = []; }
      ).then(function () { gr.loading = false; gr.fetched = true; }));
    }
    if (!jobs.length) return;
    Promise.all(jobs).then(function () {
      O.cacheSave();
      var r = O.route();
      if (String(r.id) === String(deptId) && (r.view === 'dept' || r.view === 'goals' || r.view === 'groups')) O.render();
    });
  }
  O.loadDeptExtras = loadDeptExtras;

  function mgrOf(dept) {
    var ms = O.deptMembers(dept);
    var hit = null;
    ms.forEach(function (m) { if (!hit && /マネージャー|代表/.test(String(m.role || '')) && !/アシ/.test(String(m.role || ''))) hit = m; });
    return hit;
  }
  function deptTodos(dept) {
    if (!O.M.todosOk) return null;
    var rows = arr(O.M.todos).filter(function (t) {
      if (!t) return false;
      var d = t.dept || t.deptName || '';
      return d && O.deptMatches(dept, d);
    });
    return rows;
  }
  function taskDone(t) { return t.done === true || /完了|done/i.test(String(t.status || '')); }
  function taskTitle(t) { return t.title || t.name || t.taskName || t.task || '(無題のタスク)'; }
  function taskDeadline(t) { return String(t.deadline || t.dueDate || t.due || '').slice(0, 10); }

  /* ---------- 部署ハブのビューモデル ---------- */
  function buildDeptModel(dept) {
    var M = O.M;
    var me = M.me || {};
    var vm = { me: me, showHq: me.rank >= 3, dept: dept };
    var members = O.deptMembers(dept);
    var mgr = mgrOf(dept);
    vm.metaHtml = 'メンバー<span class="nb">' + (members.length || num(dept.memberCount) || '—') + '名</span>' +
      (mgr ? ' ・ マネージャー ' + esc(mgr.name) : '');
    vm.standfirst = String(dept.desc || '');
    vm.cover = dept.photoUrl ? { src: dept.photoUrl, cap: dept.photoCaption || '' } : null; // 実フィールドが無ければ表紙ごと省略

    var meetings = O.deptMeetings(dept);
    var minutes = O.deptMinutes(dept);
    var canScope = !(M.minutes && M.minutes.scope === 'own' && !O.isMyDept(dept) && me.rank < 3);
    vm.minutesVisible = canScope;

    // 会議の日バンド(当日会議があるときだけ)
    vm.mday = null;
    var todayMtg = meetings.filter(function (m) { return O.mtDate(m) === O.TODAY && !m.docUrl; })[0];
    if (todayMtg) {
      var scIt = null;
      arr(M.schedule && M.schedule.items).forEach(function (it) { if (it && it.id === 'mtg-' + todayMtg.intakeId) scIt = it; });
      var t = scIt ? O.hm(scIt.start) : '';
      var ro = arr(todayMtg.roster);
      var coming = ro.filter(O.rsvpComing);
      var unknown = ro.filter(O.rsvpUnknown);
      // 未回答が1〜2名なら名前まで(正典の「未回答1名(ダイチさん)」= やわらかい声かけの手がかり)
      var unkNames = unknown.slice(0, 2).map(function (r) {
        var mm = O.memberById(r.memberId);
        return (mm && mm.name) || r.name || '';
      }).filter(Boolean);
      var unkHtml = unknown.length
        ? ' ・ <span class="nb">未回答' + unknown.length + '名' +
          (unknown.length <= 2 && unkNames.length === unknown.length ? '(' + esc(unkNames.join('さん・') + 'さん') + ')' : '') + '</span>'
        : '';
      vm.mday = {
        titleHtml: 'きょう' + (t ? ' <span class="nb">' + esc(t) + '</span>' : '') + ' ' + esc(O.mtName(todayMtg)),
        agenda: arr(todayMtg.agenda).length ? todayMtg.agenda : null, // 実BEにアジェンダは無い(デモのみ)
        rsvpHtml: coming.length || unknown.length
          ? '<b class="nb">' + coming.length + '名</b>出席予定' + unkHtml
          : '',
        faces: ro.filter(O.rsvpComing).slice(0, 4).map(function (r) { return O.memberById(r.memberId) || { name: r.name }; }),
      };
    }

    // 3日以内の議事録
    vm.fresh = minutes.filter(function (it) {
      var d = O.mnDate(it);
      return d && d >= O.ymd(O.addDays(O.NOW, -2)) && d <= O.TODAY;
    }).map(function (it) { return freshRow(it, dept); });

    // 数字バンド(実フィールドから判定できるセルだけ)
    var cells = [];
    if (members.length || num(dept.memberCount)) cells.push({ v: String(members.length || num(dept.memberCount)), u: '名', l: 'メンバー' });
    if (M.meetingsOk) cells.push({ v: String(meetings.filter(function (m) { return O.inThisWeek(O.mtDate(m)); }).length), u: '回', l: '<span class="nb">今週の会議</span>' });
    if (M.minutesOk && canScope) cells.push({ v: String(minutes.filter(function (it) { return O.inThisWeek(O.mnDate(it)); }).length), u: '件', l: '<span class="nb">今週の議事録</span>' });
    var todos = deptTodos(dept);
    if (todos && todos.length) {
      var doneN = todos.filter(taskDone).length;
      cells.push({ v: doneN + '<small>/' + todos.length + '</small>', u: '', raw: true, l: '<span class="nb">タスク消化</span>' });
    }
    var att = O.attendanceSeries(dept, 5);
    if (att.length >= 2) {
      var avg = Math.round(att.reduce(function (s, x) { return s + x.rate; }, 0) / att.length);
      cells.push({ v: String(avg), u: '%', l: '<span class="nb">出席率(直近' + att.length + '回)</span>' });
    }
    vm.numband = cells;

    // 部署目標
    var gl = O.GL[dept.id];
    vm.canEditGoals = me.rank >= 3 || (me.rank >= 2 && O.isMyDept(dept));
    vm.goals = gl && Array.isArray(gl.items)
      ? { items: gl.items.map(goalRow), err: gl.err, fetched: gl.fetched }
      : null;

    // グループのレール
    var gr = O.GRP[dept.id];
    vm.groups = gr && Array.isArray(gr.groups)
      ? { items: gr.groups.map(function (g) { return groupRow(g, gl && gl.items); }), err: gr.err, fetched: gr.fetched }
      : null;

    // メンバーレール
    vm.crew = members.map(function (m) {
      var isMe = String(m.id) === String(me.id);
      var isNew = String(m.joinedAt || '').slice(0, 10) >= O.ymd(O.addDays(O.NOW, -30));
      var tg = null;
      arr(M.tags).forEach(function (t) { if (t && String(t.id) === String(m.id)) tg = t; });
      var nt = m.crewNote || (tg && arr(tg.skills).slice(0, 2).join('・')) || '';
      return { m: m, you: isMe, isNew: isNew, role: isNew ? '研修中' : (m.role && m.role !== 'メンバー' ? m.role : (tg && tg.skills[0]) || m.title || 'メンバー'), nt: nt };
    }).sort(function (a, b) { return (b.you ? 1 : 0) - (a.you ? 1 : 0); });

    // 出席のようす
    vm.att = null;
    if (att.length >= 2) {
      var avg2 = Math.round(att.reduce(function (s, x) { return s + x.rate; }, 0) / att.length);
      var maxRate = Math.max.apply(null, att.map(function (x) { return x.rate; }));
      vm.att = {
        bars: att.map(function (x, i) {
          return { rate: x.rate, dt: O.md(x.date), hi: i === att.length - 1, hpx: Math.max(8, Math.round(x.rate / 100 * 42)) };
        }),
        noteHtml: '直近' + att.length + '回の平均は<b class="nb">' + avg2 + '%</b>。最高は<span class="nb">' + maxRate + '%</span>です。',
      };
    }

    // 直近の議事録(3日より前・最新5件)
    vm.recent = minutes.filter(function (it) { return O.mnDate(it) < O.ymd(O.addDays(O.NOW, -2)); })
      .slice(0, 5).map(function (it) { return recentRow(it); });

    // 右欄: 次の定例
    var next = meetings.filter(function (m) { return O.mtDate(m) > O.TODAY; })
      .sort(function (a, b) { return O.mtDate(a).localeCompare(O.mtDate(b)); })[0];
    vm.next = next ? {
      title: O.mtName(next),
      metaHtml: '<span class="nb">' + esc(O.mdW(O.mtDate(next))) + '</span>',
      noteHtml: (function () {
        var ro = arr(next.roster);
        var coming = ro.filter(O.rsvpComing).length;
        var unknown = ro.filter(O.rsvpUnknown).length;
        if (!ro.length) return '出席者はまだ登録されていません。';
        return '出席予定<span class="nb">' + coming + '名</span>' + (unknown ? ' ・ 未回答<span class="nb">' + unknown + '名</span>' : '') + '。';
      })(),
    } : null;

    // 右欄: のこりのタスク
    vm.tasks = null;
    if (todos && todos.length) {
      var open = todos.filter(function (t) { return !taskDone(t); })
        .sort(function (a, b) { return (taskDeadline(a) || '9999').localeCompare(taskDeadline(b) || '9999'); });
      vm.tasks = {
        openCount: open.length,
        doneCount: todos.length - open.length,
        total: todos.length,
        rows: open.slice(0, 5).map(function (t) {
          var dl = taskDeadline(t);
          var hot = dl && dl <= O.ymd(O.addDays(O.NOW, 1));
          var who = O.memberById(t.assigneeId || t.assignee) || O.memberByName(t.assigneeName || t.assignee);
          return {
            title: taskTitle(t),
            sub: [who ? who.name + 'さん' : (t.assigneeName || ''), t.eventTitle || t.note || ''].filter(Boolean).join(' ― '),
            who: who,
            when: dl ? (dl === O.TODAY ? 'きょう' : dl === O.ymd(O.addDays(O.NOW, 1)) ? 'あす' : O.md(dl)) : '—',
            hot: hot,
          };
        }),
      };
    }
    return vm;
  }
  O.buildDeptModel = buildDeptModel;

  function freshRow(it, dept) {
    var d = O.mnDate(it);
    var ageDays = Math.round((O.tsOf(O.TODAY) - O.tsOf(d)) / 86400000);
    var left = 3 - ageDays - 1; // 表示は当日+2日=3日間
    var ex = O.extractMinutes(O.mnBody(it), O.myNames());
    var mt = matchMeeting(it);
    var subs = [];
    if (O.mnType(it)) subs.push(esc(O.typeLabel(O.mnType(it))));
    if (ex) {
      if (ex.decisions.length) subs.push('決定<b>' + ex.decisions.length + '件</b>');
      if (ex.actions.length) subs.push('宿題<b>' + ex.actions.length + '件</b>');
    }
    if (mt) {
      var ro = arr(mt.roster);
      var attN = ro.filter(O.rsvpAttended).length;
      if (ro.length && attN) subs.push('出席<b>' + attN + '/' + ro.length + '</b>');
    }
    if (!ex) subs.push('本文はドキュメントで');
    return {
      id: O.mnId(it),
      date: d === O.TODAY ? O.md(d) + ' きょう' : O.mdW(d),
      title: O.mnTitle(it),
      unread: !O.isRead('mn:' + O.mnId(it)),
      subHtml: subs.join(' ・ '),
      youHtml: ex && ex.forYou.length
        ? '<b>あなた宛て</b> ― ' + esc(String(ex.forYou[0].text || ex.forYou[0].head).slice(0, 60)) + (ex.forYou[0].due ? ' ・ <span class="nb">' + esc(ex.forYou[0].due) + '</span>' : '')
        : '',
      stay: d === O.TODAY ? '' : (left >= 1 ? 'あと' + left + '日ここに表示されます' : ''),
      href: O.mnUrl(it),
    };
  }
  function matchMeeting(it) {
    var hit = null;
    var url = O.mnUrl(it);
    var ms = arr(O.M.meetings && O.M.meetings.meetings);
    ms.forEach(function (m) {
      if (hit || !m) return;
      if (url && m.docUrl && m.docUrl === url) { hit = m; return; }
      if (O.ckey(O.mtName(m)) === O.ckey(O.mnTitle(it)) && O.mtDate(m) === O.mnDate(it)) hit = m;
    });
    return hit;
  }
  O.matchMeeting = matchMeeting;
  function recentRow(it) {
    var ex = O.extractMinutes(O.mnBody(it), O.myNames());
    var mt = matchMeeting(it);
    var subs = [];
    if (O.mnType(it)) subs.push(esc(O.typeLabel(O.mnType(it))));
    if (mt) {
      var ro = arr(mt.roster);
      var attN = ro.filter(O.rsvpAttended).length;
      if (ro.length && attN) subs.push('出席<b>' + attN + '/' + ro.length + '</b>');
    }
    if (ex && ex.decisions.length) subs.push('決定<b>' + ex.decisions.length + '件</b>' + (ex.decisions[0] ? ' ― ' + esc(String(ex.decisions[0].text || ex.decisions[0].head).slice(0, 40)) : ''));
    return { date: O.mdW(O.mnDate(it)), title: O.mnTitle(it), subHtml: subs.join(' ・ '), href: O.mnUrl(it) };
  }
  function goalRow(g) {
    var st = O.goalState(g.current, g.target);
    return {
      id: g.id,
      nameHtml: esc(g.goal) + (g.metric ? ' ― <span class="nb">' + esc(g.metric) + '</span>' : ''),
      state: st,
      cur: g.current, tgt: g.target, unit: g.unit || '',
      quarter: g.quarter || '',
      noteHtml: (g.note ? esc(g.note) : '') +
        (g.updatedBy ? '<span class="owner nb">更新 ' + esc((O.memberById(g.updatedBy) || { name: g.updatedBy }).name) + (g.updatedAt ? ' ・ ' + esc(O.relLabel(g.updatedAt)) : '') + '</span>' : ''),
    };
  }
  O.goalRow = goalRow;
  function groupRow(g, goals) {
    var leader = g.leaderId ? O.memberById(g.leaderId) : null;
    var goal = null;
    arr(goals).forEach(function (x) { if (!goal && x && x.groupId && String(x.groupId) === String(g.id)) goal = x; });
    var subs = [];
    subs.push('<b>' + arr(g.memberIds).length + '名</b>');
    if (leader) subs.push('リーダー ' + esc(leader.name));
    if (g.kind === 'project' && g.endDate) subs.push('<span class="nb">' + esc(O.md(g.endDate)) + 'まで</span>');
    if (goal) {
      var st = O.goalState(goal.current, goal.target);
      subs.push(esc(goal.goal) + (st.pct !== null ? ' <span class="nb">' + st.pct + '%</span>' : ''));
    }
    if (g.note) subs.push(esc(g.note));
    return { id: g.id, name: g.name, kind: g.kind, subHtml: subs.join(' ・ ') };
  }

  /* ---------- 描画: 見出し+タブ(概要/議事録/編集ビュー共通) ---------- */
  function deptHeadHtml(vm, current) {
    var dept = vm.dept;
    var h = '<a class="back" href="#/"><span class="mi">arrow_back</span>組織ホームへ</a>';
    h += '<div class="titlegrid' + (vm.cover ? '' : ' nocover') + '"><div><div class="titleblock"><div>' +
      '<div class="kicker">部署ハブ</div><h1>' + esc(dept.name) + '</h1></div>' +
      '<div class="meta">' + vm.metaHtml + '</div></div>' +
      (vm.standfirst ? '<p class="standfirst">' + esc(vm.standfirst) + '</p>' : '') + '</div>';
    if (vm.cover) {
      h += '<figure class="cover"><img src="' + esc(vm.cover.src) + '" alt="">' +
        (vm.cover.cap ? '<figcaption class="cap">' + esc(vm.cover.cap) + '</figcaption>' : '') + '</figure>';
    }
    h += '</div>';
    var base = '#/dept/' + encodeURIComponent(dept.id);
    var tabs = [
      ['dept', base, '概要'],
      ['minutes', base + '/minutes', '会議・議事録'],
      ['oneonone', base + '/oneonone', '1on1'],
      ['attendance', base + '/attendance', '出欠'],
      ['eval', base + '/eval', '評価<span class="gate nb">アシマネ以上</span>'],
    ];
    h += '<nav class="tabbar glass" aria-label="部署内">' + tabs.map(function (t) {
      return '<a href="' + t[1] + '"' + (current === t[0] ? ' aria-current="page"' : '') + '>' + t[2] + '</a>';
    }).join('') + '</nav>';
    return h;
  }
  O.deptHeadHtml = deptHeadHtml;

  function renderDept(vm) {
    var dept = vm.dept;
    var h = O.mastheadHtml({ showHq: vm.showHq });
    h += deptHeadHtml(vm, 'dept');

    // 会議の日バンド
    if (vm.mday) {
      h += '<section class="mday glass" aria-label="きょうの会議"><div>' +
        '<div class="md-kicker">会 議 の 日</div>' +
        '<div class="md-title">' + vm.mday.titleHtml + '</div>';
      if (vm.mday.agenda) {
        h += '<ol class="md-agenda">' + vm.mday.agenda.map(function (a, i) {
          return '<li><span class="no">' + (i + 1) + '</span><span>' + a.t + (a.small ? '<small>' + esc(a.small) + '</small>' : '') + '</span></li>';
        }).join('') + '</ol>';
      }
      h += '</div><div class="md-side">';
      if (vm.mday.rsvpHtml) {
        h += '<div class="md-rsvp">' + (vm.mday.faces.length ? '<span class="faces">' +
          vm.mday.faces.map(function (p) { return faceHtml(p, p.name); }).join('') + '</span>' : '') +
          '<span>' + vm.mday.rsvpHtml + '</span></div>';
      }
      h += '<a class="btn" href="./console.html#minutes" target="_blank" rel="noopener"><span class="mi">mic</span>録音を投稿</a>' +
        '<p class="md-note">consoleの議事録ページが開きます ― 「録音を投稿」タブから。文字起こしされ、決定と宿題を整理した議事録になります。</p>' +
        '</div></section>';
    }

    // 3日以内の議事録
    if (vm.minutesVisible && vm.fresh.length) {
      h += '<section class="fresh" aria-label="議事録・3日以内">' +
        '<h2 class="sec">この3日の議事録<span class="qual">会議から3日間ここに出ます</span></h2>' +
        vm.fresh.map(function (f) {
          return '<div class="f-row"><span class="f-date nb">' + esc(f.date) + '</span><div>' +
            '<div class="f-title">' + (f.unread ? '<span class="dot" aria-hidden="true"></span>' : '') + esc(f.title) +
            (f.unread ? '<span class="dot-label">未読</span>' : '') + '</div>' +

  O.renderGoalsEdit = renderGoalsEdit;
  function bindGoalsEdit(vm, editing) {
    var dept = vm.dept;
    function refetch() {
      return API.fetchData('listDeptGoals', { deptId: dept.id }).then(function (d) {
        O.GL[dept.id] = { items: O.unwrapList(d, 'items'), err: false, fetched: true, loading: false };
        O.cacheSave();
      }, function () {});
    }
    O.nodes(O.root.querySelectorAll('[data-goal-cur]')).forEach(function (el) {
      el.addEventListener('click', function () {
        if (goalEd.busy) return;
        var id = el.getAttribute('data-goal-cur');
        var inp = document.getElementById('og-cur-' + id);
        var v = inp ? Number(inp.value) : NaN;
        if (!isFinite(v)) { goalEd.err = '実績は数値で入力してください。'; goalEd.doneMsg = ''; O.render(); return; }
        if (O.DEMO) { goalEd.doneMsg = 'デモ表示のため保存は行われません。'; goalEd.err = ''; O.render(); return; }
        goalEd.busy = true; goalEd.err = ''; goalEd.doneMsg = ''; O.render();
        API.postData('updateGoalCurrent', { id: id, current: v })
          .then(refetch)
          .then(function () { goalEd.busy = false; goalEd.doneMsg = '実績を更新しました。'; O.render(); })
          .catch(function (e) { goalEd.busy = false; goalEd.err = '更新できませんでした: ' + String((e && e.message) || '通信エラー'); O.render(); });
      });
    });
    O.nodes(O.root.querySelectorAll('[data-goal-edit]')).forEach(function (el) {
      el.addEventListener('click', function () {
        goalEd.editingId = el.getAttribute('data-goal-edit');
        goalEd.err = ''; goalEd.doneMsg = '';
        O.render();
      });
    });
    var cancel = document.getElementById('og-g-cancel');
    if (cancel) cancel.addEventListener('click', function () { goalEd.editingId = ''; goalEd.err = ''; goalEd.doneMsg = ''; O.render(); });
    var form = document.getElementById('og-goal-form');
    if (form) form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (goalEd.busy) return;
      var g = function (id) { var n = document.getElementById(id); return n ? String(n.value || '').trim() : ''; };
      var goal = g('og-g-goal');
      var quarter = g('og-g-quarter');
      if (!goal) { goalEd.err = '目標のことばを入力してください。'; goalEd.doneMsg = ''; O.render(); return; }
      if (!quarter) { goalEd.err = '四半期を入力してください(例: ' + curQuarter() + ')。'; goalEd.doneMsg = ''; O.render(); return; }
      if (O.DEMO) { goalEd.doneMsg = 'デモ表示のため保存は行われません。'; goalEd.err = ''; O.render(); return; }
      var payload = {
        deptId: dept.id, goal: goal, quarter: quarter,
        metric: g('og-g-metric'), unit: g('og-g-unit'), note: g('og-g-note'),
        groupId: g('og-g-group'),
      };
      var tg = g('og-g-target'), cu = g('og-g-current');
      if (tg !== '') payload.target = Number(tg);
      if (cu !== '') payload.current = Number(cu);
      if (editing) payload.id = editing.id;
      goalEd.busy = true; goalEd.err = ''; goalEd.doneMsg = ''; O.render();
      API.postData('saveDeptGoal', payload)
        .then(refetch)
        .then(function () {
          goalEd.busy = false; goalEd.editingId = '';
          goalEd.doneMsg = editing ? '目標を保存しました。' : '目標を追加しました。';
          O.render();
        })
        .catch(function (e) {
          goalEd.busy = false;
          goalEd.err = '保存できませんでした: ' + String((e && e.message) || '通信エラー') + ' ― 入力は残っています。';
          O.render();
        });
    });

      '<label>メンバー<span class="hint">押して出し入れ ・ いま' + selIds.length + '名</span></label>' +
      '<div class="msel">' + members.map(function (m) {
        var on = selIds.indexOf(String(m.id)) >= 0 || selIds.indexOf(m.id) >= 0;
        return '<button type="button" aria-pressed="' + (on ? 'true' : 'false') + '" data-grp-m="' + esc(m.id) + '">' + esc(m.name) + '</button>';
      }).join('') + '</div>' +
      '<label style="margin-top:14px">メモ<textarea id="og-gr-note">' + esc(editing ? editing.note || '' : '') + '</textarea></label>' +
      '<div class="edit-cta"><button type="submit" class="btn" id="og-gr-save">' + (grpEd.busy ? '保存中…' : (editing ? '保存する' : 'グループをつくる')) + '</button>' +
      (editing ? '<button type="button" class="btn sub" id="og-gr-cancel">新規に戻す</button>' : '') +
      (editing ? '<button type="button" class="btn-warn" id="og-gr-close">' + (grpEd.confirmClose ? 'もう一度押すと解散します' : 'このグループを解散') + '</button>' : '') +
      '</div>' +
      (editing ? '<p class="edit-note" style="margin-top:6px">解散すると一覧から消えます(記録は残ります)。</p>' : '') +
      (grpEd.err ? '<p class="edit-err">' + esc(grpEd.err) + '</p>' : '') +
      (grpEd.doneMsg ? '<p class="save-done">' + esc(grpEd.doneMsg) + '</p>' : '') +
      '</form>';
    h += O.colophonHtml('部署ハブ', esc(dept.name));
    O.root.innerHTML = '<div class="pg-edit">' + h + '</div>';
    bindGroupsEdit(vm, editing, selIds, members);
  }
  O.renderGroupsEdit = renderGroupsEdit;
  function bindGroupsEdit(vm, editing, selIds, members) {
    var dept = vm.dept;
    function refetch() {
      return API.fetchData('listDeptGroups', { deptId: dept.id }).then(function (d) {
        O.GRP[dept.id] = { groups: O.unwrapList(d, 'groups'), err: false, fetched: true, loading: false };
        O.cacheSave();
      }, function () {});
    }
    O.nodes(O.root.querySelectorAll('[data-grp-edit]')).forEach(function (el) {
      el.addEventListener('click', function () {
        grpEd.editingId = el.getAttribute('data-grp-edit');
        grpEd.memberIds = null; grpEd.err = ''; grpEd.doneMsg = ''; grpEd.confirmClose = false;
        O.render();
      });
    });
    O.nodes(O.root.querySelectorAll('[data-grp-m]')).forEach(function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-grp-m');
        var cur = grpEd.memberIds !== null ? grpEd.memberIds : selIds.slice();
        var i = cur.map(String).indexOf(String(id));
        if (i >= 0) cur.splice(i, 1); else cur.push(String(id));
        grpEd.memberIds = cur;
        grpEd.confirmClose = false;
        O.render();
      });
    });
    var cancel = document.getElementById('og-gr-cancel');
    if (cancel) cancel.addEventListener('click', function () {
      grpEd.editingId = ''; grpEd.memberIds = null; grpEd.err = ''; grpEd.doneMsg = ''; grpEd.confirmClose = false;
      O.render();
    });
    var close = document.getElementById('og-gr-close');
    if (close) close.addEventListener('click', function () {
      if (grpEd.busy || !editing) return;
      if (!grpEd.confirmClose) { grpEd.confirmClose = true; O.render(); return; } // 確認ステップ(1タップ目は予告)
      if (O.DEMO) { grpEd.doneMsg = 'デモ表示のため保存は行われません。'; grpEd.confirmClose = false; O.render(); return; }
      grpEd.busy = true; grpEd.err = ''; grpEd.doneMsg = ''; O.render();
      API.postData('saveDeptGroup', { id: editing.id, active: false })
        .then(refetch)
        .then(function () {
          grpEd.busy = false; grpEd.editingId = ''; grpEd.memberIds = null; grpEd.confirmClose = false;
          grpEd.doneMsg = 'グループを解散しました。';
          O.render();
        })
        .catch(function (e) {
          grpEd.busy = false; grpEd.confirmClose = false;
          grpEd.err = '解散できませんでした: ' + String((e && e.message) || '通信エラー');
          O.render();
        });
    });
    var form = document.getElementById('og-grp-form');
    if (form) form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (grpEd.busy) return;
      var g = function (id) { var n = document.getElementById(id); return n ? String(n.value || '').trim() : ''; };
      var name = g('og-gr-name');
      if (!name) { grpEd.err = 'グループの名前を入力してください。'; grpEd.doneMsg = ''; O.render(); return; }
      if (O.DEMO) { grpEd.doneMsg = 'デモ表示のため保存は行われません。'; grpEd.err = ''; O.render(); return; }
      var payload = {
        deptId: dept.id, name: name, kind: g('og-gr-kind') || 'standing',
        endDate: g('og-gr-end'), leaderId: g('og-gr-leader'), note: g('og-gr-note'),
        memberIds: (grpEd.memberIds !== null ? grpEd.memberIds : selIds).map(String),
      };
      if (editing) payload.id = editing.id;
      grpEd.busy = true; grpEd.err = ''; grpEd.doneMsg = ''; O.render();
      API.postData('saveDeptGroup', payload)
        .then(refetch)
        .then(function () {
          grpEd.busy = false; grpEd.editingId = ''; grpEd.memberIds = null;
          grpEd.doneMsg = editing ? 'グループを保存しました。' : 'グループをつくりました。';
          O.render();
        })
        .catch(function (e) {
          grpEd.busy = false;
          grpEd.err = '保存できませんでした: ' + String((e && e.message) || '通信エラー') + ' ― 入力は残っています。';
          O.render();
        });
    });
  }
})();

// ================= org/60-minutes.js =================
/* ============================================================================
   会議・議事録タブ(#/dept/<id>/minutes) — 正典: org-minutes.html
   部署のタイムライン一本化(listMinutes)+種別チップ+未読点(localStorage)+
   決定/宿題の構造化(本文があるものだけ防御的に抽出。無い議事録は正直に
   ドキュメントへのリンクだけ)+「あなた宛て」(名前の行の原文引用)。
   ============================================================================ */
(function () {
  'use strict';
  var O = window.__ORG;
  var esc = O.esc, arr = O.arr;

  /* タブ内の一時状態(部署が変わったらリセット) */
  var st = { deptId: '', q: '', type: '*', open: {}, showAll: false };
  O.minSt = st;
  function resetSt(deptId) {
    if (st.deptId !== String(deptId)) {
      st.deptId = String(deptId); st.q = ''; st.type = '*'; st.open = {}; st.showAll = false;
    }
  }

  function buildMinModel(dept) {
    var M = O.M;
    var me = M.me || {};
    var vm = { me: me, showHq: me.rank >= 3, dept: dept };
    var base = O.buildDeptModel(dept); // 見出し・タブ・可視判定を共用
    vm.metaHtml = base.metaHtml;
    vm.standfirst = base.standfirst;
    vm.cover = base.cover;
    vm.canEditGoals = base.canEditGoals;
    vm.minutesVisible = base.minutesVisible;

    var all = O.deptMinutes(dept);
    vm.total = all.length;

    // 処理中(録音投稿済み・議事録待ち)の会議
    vm.queue = arr(O.deptMeetings(dept)).filter(function (m) {
      return String(m.status || '') === 'pending';
    }).sort(function (a, b) { return O.mtDate(b).localeCompare(O.mtDate(a)); })[0] || null;

    // 種別チップ(実データに現れた種別だけ・件数つき)
    var counts = { '*': all.length };
    all.forEach(function (it) {
      var t = O.mnType(it);
      counts[t] = (counts[t] || 0) + 1;
    });
    vm.chips = [{ key: '*', label: 'すべて', n: all.length }];
    Object.keys(counts).forEach(function (k) {
      if (k === '*') return;
      vm.chips.push({ key: k, label: O.typeLabel(k), n: counts[k] });
    });

    // しぼり込み(種別+検索語=会議名/本文)
    var q = O.ckey(st.q);
    var rows = all.filter(function (it) {
      if (st.type !== '*' && O.mnType(it) !== st.type) return false;
      if (q) {
        var hay = O.ckey(O.mnTitle(it) + ' ' + O.mnBody(it));
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    vm.filtered = rows.length;

    // 月ごとにまとめる(新しい順)。既定はきょうから3か月ぶん+「さかのぼる」
    var months = [];
    var byMonth = {};
    rows.forEach(function (it) {
      var ym = O.mnDate(it).slice(0, 7);
      if (!byMonth[ym]) { byMonth[ym] = []; months.push(ym); }
      byMonth[ym].push(it);
    });
    var limit = st.showAll || q || st.type !== '*' ? months.length : 3;
    vm.olderCount = 0;
    if (months.length > limit) {
      months.slice(limit).forEach(function (ym) { vm.olderCount += byMonth[ym].length; });
      months = months.slice(0, limit);
    }
    var names = O.myNames();
    vm.months = months.map(function (ym) {
      var pend = vm.queue && O.mtDate(vm.queue).slice(0, 7) === ym ? 1 : 0;
      return {
        label: (+ym.slice(5, 7)) + '月' + (ym.slice(0, 4) !== String(O.NOW.getFullYear()) ? '(' + ym.slice(0, 4) + ')' : ''),
        count: byMonth[ym].length,
        pending: pend,
        rows: byMonth[ym].map(function (it) { return minRow(it, names); }),
      };
    });

    // 右rail: あなた宛て(本文つき議事録から抽出。実BEは本文を返さない=正直な空文言)
    var you = [];
    var mentions = [];
    var hasBody = false;
    all.forEach(function (it) {
      var body = O.mnBody(it);
      if (!body) return;
      hasBody = true;
      var ex = O.extractMinutes(body, names);
      if (!ex) return;
      ex.forYou.forEach(function (a, i) {
        you.push({
          id: 'you:' + O.mnId(it) + ':' + i,
          text: a.text || a.head,
          due: a.due,
          src: O.md(O.mnDate(it)) + ' ' + O.typeLabel(O.mnType(it)),
          done: O.isYouDone('you:' + O.mnId(it) + ':' + i),
        });
      });
      if (!mentions.length && ex.mentions.length) {
        // 宿題と同文の行は「名前が出た箇所」から除く(重複表示を避ける)
        var used = {};
        ex.forYou.forEach(function (a) { used[O.ckey(a.text || a.head)] = 1; });
        ex.mentions.some(function (line) {
          if (used[O.ckey(line)]) return false;
          mentions.push({ line: line, src: O.md(O.mnDate(it)) + ' ' + O.mnTitle(it) });
          return true;
        });
      }
    });
    vm.you = { items: you.slice(0, 8), mentions: mentions.slice(0, 2), hasBody: hasBody };
    return vm;
  }
  O.buildMinModel = buildMinModel;

  function minRow(it, names) {
    var d = O.mnDate(it);
    var body = O.mnBody(it);
    var ex = body ? O.extractMinutes(body, names) : null;
    var mt = O.matchMeeting(it);
    var subs = [];
    if (ex) {
      if (ex.decisions.length) subs.push('決定<b>' + ex.decisions.length + '件</b>' + (ex.decisions[0] ? ' ― ' + esc(String(ex.decisions[0].text || ex.decisions[0].head).slice(0, 44)) : ''));
      if (ex.actions.length) subs.push('宿題<b>' + ex.actions.length + '件</b>');
    } else {
      subs.push('本文はドキュメントで開けます');
    }
    if (it.updated_at) subs.push('<span class="nb">' + esc(O.relLabel(it.updated_at)) + ' 更新</span>');
    var attHtml = '';
    if (mt) {
      var ro = arr(mt.roster);
      var attN = ro.filter(O.rsvpAttended).length;
      if (ro.length && attN) attHtml = '<span class="nb">出席' + attN + '/' + ro.length + '</span>';
    }
    var fresh = d >= O.ymd(O.addDays(O.NOW, -2)) && d <= O.TODAY;
    var left = 3 - Math.round((O.tsOf(O.TODAY) - O.tsOf(d)) / 86400000) - 1;
    var forYou = ex && ex.forYou.length ? ex.forYou[0] : null;
    return {
      id: O.mnId(it),
      date: d === O.TODAY ? O.md(d) + ' きょう' : O.mdW(d),
      title: O.mnTitle(it),
      type: O.mnType(it),
      unread: !O.isRead('mn:' + O.mnId(it)),
      subHtml: subs.join(' ／ '),
      youHtml: forYou ? '<b>あなた宛て</b> ― ' + esc(String(forYou.text || forYou.head).slice(0, 60)) + (forYou.due ? ' ・ <span class="nb">' + esc(forYou.due) + '</span>' : '') : '',
      top3: fresh ? '概要の最上部にも表示中' + (d === O.TODAY ? '(あと3日)' : left >= 1 ? '(あと' + left + '日)' : '') : '',
      attHtml: attHtml,
      href: O.mnUrl(it),
      canOpenInline: !!ex || !!body,
      ex: ex,
      body: body,
    };
  }

  function detailHtml(r) {
    var h = '<div class="m-detail" data-mdetail="' + esc(r.id) + '">';
    var ex = r.ex;
    if (ex && ex.forYou.length) {
      h += '<h3>あなた宛て</h3>' + ex.forYou.map(function (a) {
        return '<p class="d-you"><b>' + esc((O.M.me && O.M.me.name) || 'あなた') + 'さん(あなた)</b> ― ' + esc(a.text || a.head) +
          (a.due ? ' ・ <span class="due nb">' + esc(a.due) + '</span>' : '') + '</p>';
      }).join('');
    }
    if (ex && ex.decisions.length) {
      h += '<h3>決定したこと</h3><ul class="dlist">' + ex.decisions.map(function (dcs, i) {
        return '<li><span class="no">' + (i + 1) + '</span><span>' + esc(dcs.text || dcs.head) + '</span></li>';
      }).join('') + '</ul>';
    }
    if (ex && ex.actions.length) {
      h += '<h3>宿題</h3>' + ex.actions.map(function (a) {
        var who = a.owner ? O.memberByName(a.owner.replace(/さん$/, '')) : null;
        return '<div class="hw">' + (who ? O.faceHtml(who, who.name) : '') +
          '<span><b>' + esc(a.text || a.head) + '</b>' + (a.owner ? ' ― ' + esc(a.owner) : '') + '</span>' +
          (a.due ? '<time class="nb">' + esc(a.due) + '</time>' : '') + '</div>';
      }).join('');
    }
    if (!ex) {
      h += '<p class="d-none">この議事録には決定・宿題の見出しが見つかりませんでした。全文からご確認ください。</p>';
    }
    if (r.body) {
      h += '<h3>全文</h3><p class="fulltext" id="og-full-' + esc(r.id) + '">' + esc(r.body) + '</p>' +
        '<div class="d-more"><button data-fullopen="' + esc(r.id) + '">全文を読む<span class="nb">(約' + String(r.body.length).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '字)</span></button>' +
        (r.href ? '<a href="' + esc(r.href) + '" target="_blank" rel="noopener">ドキュメントで開く</a>' : '') + '</div>';
    } else if (r.href) {
      h += '<div class="d-more"><a href="' + esc(r.href) + '" target="_blank" rel="noopener">ドキュメントで開く</a></div>';
    }
    h += '</div>';
    return h;
  }

  function renderMin(vm) {
    var dept = vm.dept;
    resetSt(dept.id);
    var h = O.mastheadHtml({ showHq: vm.showHq });
    h += O.deptHeadHtml(vm, 'minutes');

    if (!vm.minutesVisible) {
      h += '<p class="stub-line">この部署の議事録は、所属メンバーとマネージャー以上が閲覧できます。</p>';
      O.root.innerHTML = '<div class="pg-min">' + h + O.colophonHtml('部署ハブ') + '</div>';
      return;
    }

    // 主要操作: 録音を投稿(consoleへ)+処理中
    h += '<section class="recband glass" aria-label="録音の投稿">' +
      '<a class="btn" href="./console.html#minutes" target="_blank" rel="noopener"><span class="mi">mic</span>録音を投稿</a>' +
      '<p class="rb-note">consoleの議事録ページが開きます(「録音を投稿」タブ)。録音を上げると文字起こしされ、議事録になってこの一覧に入ります。</p>';
    if (vm.queue) {
      h += '<div class="rb-queue"><span class="mi">graphic_eq</span><div><b class="nb">' + esc(O.md(O.mtDate(vm.queue))) + ' ' + esc(O.mtName(vm.queue)) + '</b> ― ' +
        '<span class="st">議事録を作成中</span><small>できあがると下の一覧に入ります</small></div></div>';
    }
    h += '</section>';

    h += '<div class="cols"><main>';
    h += '<h2 class="sec">部署の議事録<span class="qual">新しい順 ・ 全' + vm.total + '件</span></h2>';
    if (!O.M.minutesOk) {
      h += '<div class="goal-empty">議事録を取得できませんでした。再読み込みしてください。</div>';
    } else if (!vm.total) {
      h += '<div class="goal-empty">議事録はまだありません。会議の録音を投稿すると、ここに時系列で並びます。</div>';
    } else {
      // 検索+種別チップ
      h += '<div class="filters"><label class="search"><span class="mi">search</span>' +
        '<input type="search" id="og-min-q" value="' + esc(st.q) + '" placeholder="会議名・本文をさがす"></label>' +
        '<div class="chips" role="group" aria-label="種別でしぼり込み">' + vm.chips.map(function (c) {
          return '<button aria-pressed="' + (st.type === c.key ? 'true' : 'false') + '" data-mtype="' + esc(c.key) + '">' +
            esc(c.label) + '<small>' + c.n + '</small></button>';
        }).join('') + '</div></div>';
      if (!vm.filtered) {
        h += '<div class="goal-empty">この条件に合う議事録はありません。ことばを変えるか、しぼり込みを外してください。</div>';
      }
      vm.months.forEach(function (mo) {
        h += '<div class="month">' + esc(mo.label) + '<small>' + mo.count + '件' + (mo.pending ? ' ・ 1件作成中' : '') + '</small></div>';
        mo.rows.forEach(function (r) {
          var opened = !!st.open[r.id];
          h += '<div class="mm' + (opened ? ' opened' : '') + '">' +
            '<span class="mm-date nb">' + esc(r.date) + '</span>' +
            '<div><div class="mm-title">' + (r.unread ? '<span class="dot" aria-hidden="true"></span>' : '') + esc(r.title) +
            '<span class="kind ' + O.typeCls(r.type) + ' nb">' + esc(O.typeLabel(r.type)) + '</span>' +
            (r.unread ? '<span class="dot-label">未読</span>' : '') + '</div>' +
            '<div class="mm-sum">' + r.subHtml + '</div>' +
            (r.youHtml && !opened ? '<div class="mm-you">' + r.youHtml + '</div>' : '') +
            (r.top3 ? '<div class="mm-top3 nb">' + esc(r.top3) + '</div>' : '') + '</div>' +
            '<div class="mm-right">' + (r.attHtml ? '<span class="mm-att">' + r.attHtml + '</span>' : '') +
            (r.canOpenInline
              ? '<button class="mm-open" data-mopen="' + esc(r.id) + '">' + (opened ? '閉じる' : '開く') + '</button>'
              : (r.href ? '<a class="mm-open" data-read="mn:' + esc(r.id) + '" href="' + esc(r.href) + '" target="_blank" rel="noopener">開く</a>' : '<span class="mm-open" style="color:var(--ink5)">処理中</span>')) +
            '</div></div>';
          if (opened) h += detailHtml(r);
        });
      });
      if (vm.olderCount) {
        h += '<button class="older" id="og-min-older">これより前の議事録 ' + vm.olderCount + '件をさかのぼる</button>';
      }
    }
    h += '</main>';

    // 右rail: あなた宛て
    h += '<aside class="side glass">';
    var openYou = vm.you.items.filter(function (y) { return !y.done; }).length;
    h += '<h2>あなた宛て' + (vm.you.items.length ? '<span class="cnt nb">のこり' + openYou + '件</span>' : '') + '</h2>';
    if (vm.you.items.length) {
      h += '<ul class="you-list">' + vm.you.items.map(function (y) {
        if (y.done) {
          return '<li class="done"><span class="mi">check_circle</span><span><b>' + esc(y.text) + '</b>' +
            '<small><span class="nb">' + esc(y.src) + '</span> ・ このチェックは端末内メモです <button style="border:0;background:none;color:var(--deep);font-weight:700;cursor:pointer;padding:0;font-size:11.5px" data-you="' + esc(y.id) + '">戻す</button></small></span></li>';
        }
        return '<li><input type="checkbox" id="' + esc(y.id) + '" data-you="' + esc(y.id) + '" aria-label="' + esc(y.text) + 'を完了にする">' +
          '<label for="' + esc(y.id) + '"><b>' + esc(y.text) + '</b>' + (y.due ? ' ― <span class="due nb">' + esc(y.due) + '</span>' : '') +
          '<small><span class="nb">' + esc(y.src) + '</span></small></label></li>';
      }).join('') + '</ul>';
      h += '<p class="side-note">議事録の宿題からあなた宛てを集めています。チェックは端末内のメモです(議事録側は変わりません)。</p>';
    } else {
      h += '<div class="side-empty">' + (vm.you.hasBody
        ? 'いまあなた宛ての宿題は見つかっていません。'
        : '宿題の自動抽出は、本文つきの議事録で動きます。いまの議事録は「開く」からドキュメントで確認してください。') + '</div>';
    }
    if (vm.you.mentions.length) {
      h += '<h2 style="margin-top:22px">名前が出た箇所</h2>' + vm.you.mentions.map(function (m) {
        return '<div class="mention"><div class="who"><span><b class="nb">' + esc(m.src) + '</b></span></div><q>' + esc(m.line) + '</q></div>';
      }).join('');
    }
    h += '</aside></div>';

    h += O.colophonHtml('部署ハブ', esc(dept.name) + ' 会議・議事録 ・ ' + esc(O.NOW.getFullYear() + '.' + (O.NOW.getMonth() + 1) + '.' + O.NOW.getDate()));
    O.root.innerHTML = '<div class="pg-min">' + h + '</div>';
    bindMin(vm);
  }
  O.renderMin = renderMin;

  function bindMin(vm) {
    var q = document.getElementById('og-min-q');
    if (q) {
      q.addEventListener('input', function () {
        st.q = q.value;
        // 入力中のフォーカスを保たせるため、値だけ状態へ吸収して再描画(検索欄は先頭で再フォーカス)
        O.render();
        var q2 = document.getElementById('og-min-q');
        if (q2) { q2.focus(); try { q2.setSelectionRange(q2.value.length, q2.value.length); } catch (e) {} }
      });
    }
    O.nodes(O.root.querySelectorAll('[data-mtype]')).forEach(function (el) {
      el.addEventListener('click', function () {
        st.type = el.getAttribute('data-mtype');
        O.render();
      });
    });
    O.nodes(O.root.querySelectorAll('[data-mopen]')).forEach(function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-mopen');
        st.open[id] = !st.open[id];
        if (st.open[id]) O.markRead('mn:' + id);
        O.render();
      });
    });
    O.nodes(O.root.querySelectorAll('[data-read]')).forEach(function (el) {
      el.addEventListener('click', function () {
        O.markRead(el.getAttribute('data-read'));
        setTimeout(function () { if (O.route().view === 'minutes') O.render(); }, 0);
      });
    });
    O.nodes(O.root.querySelectorAll('[data-fullopen]')).forEach(function (el) {
      el.addEventListener('click', function () {
        var n = document.getElementById('og-full-' + el.getAttribute('data-fullopen'));
        if (n) n.classList.add('open');
        el.style.display = 'none';
      });
    });
    O.nodes(O.root.querySelectorAll('[data-you]')).forEach(function (el) {
      el.addEventListener('click', function () {
        O.toggleYouDone(el.getAttribute('data-you'));
        O.render();
      });
    });
    var older = document.getElementById('og-min-older');
    if (older) older.addEventListener('click', function () { st.showAll = true; O.render(); });
  }
})();

// ================= org/70-members.js =================
/* ============================================================================
   メンバー名鑑(#/members)+自分のプロフィール編集(#/me) — 正典: org-members.html
   listMemberTags(全員・PII無し)を主に、listMembers(役職・入会日)で補完。
   検索+タグしぼり込み。タグ・ひとことの編集は本人のみ(setMyProfileTags)。
   ============================================================================ */
(function () {
  'use strict';
  var O = window.__ORG;
  var API = window.AdminAPI;
  var esc = O.esc, arr = O.arr, faceHtml = O.faceHtml;

  var st = { q: '', tag: '' };
  O.memSt = st;

  function personTags(t) {
    return { skills: arr(t && t.skills), interests: arr(t && t.interests), languages: arr(t && t.languages) };
  }
  function allTagsOf(t) {
    var p = personTags(t);
    return p.skills.concat(p.interests, p.languages);
  }

  function buildMembersModel() {
    var M = O.M;
    var me = M.me || {};
    var vm = { me: me, showHq: me.rank >= 3 };
    var tags = arr(M.tags);
    var members = arr(M.members);
    var byId = {};
    members.forEach(function (m) { if (m && m.id) byId[String(m.id)] = m; });

    // 名鑑の行 = listMemberTags(全部署横断・PII無し)を主とし、役職/入会日を listMembers で補完
    var people = tags.map(function (t) {
      var m = byId[String(t.id)] || {};
      var title = m.role && m.role !== 'メンバー' ? m.role : (t.title || m.title || 'メンバー');
      if (title === 'アシマネ') title = 'アシスタントマネージャー'; // 名鑑は略さない(正典の表記)
      return {
        id: t.id, name: t.name, dept: t.dept || m.dept || '',
        title: title,
        initial: t.initial || m.initial, accent: t.accent || m.accent,
        photoUrl: t.photoUrl || m.photoUrl || '',
        joinedAt: m.joinedAt || '',
        oneline: t.oneline || '',
        tg: personTags(t),
        isMe: String(t.id) === String(me.id),
      };
    });
    vm.tagsErr = !M.tagsOk;
    vm.totalPeople = people.length;

    // よく探されるタグ(2名以上・上位7)
    var freq = {};
    people.forEach(function (p) {
      allTagsOf({ skills: p.tg.skills, interests: p.tg.interests, languages: p.tg.languages }).forEach(function (t) {
        freq[t] = (freq[t] || 0) + 1;
      });
    });
    vm.popTags = Object.keys(freq).filter(function (t) { return freq[t] >= 2; })
      .sort(function (a, b) { return freq[b] - freq[a]; }).slice(0, 7)
      .map(function (t) { return { t: t, n: freq[t] }; });

    // しぼり込み
    var q = O.ckey(st.q);
    function hit(p) {
      if (st.tag) {
        var all = p.tg.skills.concat(p.tg.interests, p.tg.languages);
        if (all.map(O.ckey).indexOf(O.ckey(st.tag)) < 0) return false;
      }
      if (q) {
        var hay = O.ckey(p.name + ' ' + p.oneline + ' ' + p.tg.skills.join(' ') + ' ' + p.tg.interests.join(' ') + ' ' + p.tg.languages.join(' '));
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    }
    var shown = people.filter(hit);
    vm.shownCount = shown.length;
    vm.filtering = !!(q || st.tag);

    // 部署ごとの段組(listDepartments の表示順 → その他)
    var deps = arr(M.departments).filter(O.deptActive)
      .slice().sort(function (a, b) { return (O.num(a.order) || 999) - (O.num(b.order) || 999); });
    var sections = [];
    var used = {};
    deps.forEach(function (d) {
      var ps = shown.filter(function (p) { return O.deptMatches(d, p.dept); });
      ps.forEach(function (p) { used[String(p.id)] = 1; });
      if (!ps.length) return;
      var mgr = null;
      ps.forEach(function (p) { if (!mgr && /マネージャー|代表/.test(String(p.title)) && !/アシ/.test(String(p.title))) mgr = p; });
      sections.push({ name: d.name, count: ps.length, mgr: mgr ? mgr.name : '', people: sortPeople(ps) });
    });
    var rest = shown.filter(function (p) { return !used[String(p.id)]; });
    if (rest.length) sections.push({ name: '部署未定・その他', count: rest.length, mgr: '', people: sortPeople(rest) });
    vm.sections = sections;
    vm.deptCount = deps.length;
    vm.joinedThisMonth = people.filter(function (p) { return String(p.joinedAt || '').slice(0, 7) === O.TODAY.slice(0, 7); }).length;
    vm.q = st.q; vm.tag = st.tag;
    return vm;
  }
  O.buildMembersModel = buildMembersModel;
  function sortPeople(ps) {
    var RANKW = { '代表': 0, '副代表': 1, 'マネージャー': 2, 'アシスタントマネージャー': 3, 'アシマネ': 3 };
    return ps.slice().sort(function (a, b) {
      var ra = RANKW[a.title] !== undefined ? RANKW[a.title] : 9;
      var rb = RANKW[b.title] !== undefined ? RANKW[b.title] : 9;
      if (ra !== rb) return ra - rb;
      return String(a.name).localeCompare(String(b.name), 'ja');
    });
  }

  function tagSpanHtml(t, lang, tag) {
    var hitCls = tag && O.ckey(t) === O.ckey(tag) ? ' hit' : '';
    return '<span class="t' + (lang ? ' lang' : '') + hitCls + ' nb">' + esc(t) + '</span>';
  }
  function renderMembers(vm) {
    var h = O.mastheadHtml({ showHq: vm.showHq });
    h += '<a class="back" href="#/"><span class="mi">arrow_back</span>組織ホームへ</a>';
    h += '<div class="titleblock"><div><div class="kicker">名鑑</div><h1>メンバー名鑑</h1></div>' +
      '<div class="meta"><span class="nb">' + vm.totalPeople + '名</span> ・ <span class="nb">' + vm.deptCount + '部署</span>' +
      (vm.joinedThisMonth ? ' ・ 今月の入会<span class="nb">' + vm.joinedThisMonth + '名</span>' : '') + '</div></div>';
    h += '<p class="standfirst">スキル・興味・ことばのタグは本人が書いています。「動画を編集できる人」「韓国語を話せる人」― 頼みごとの相手はここから探せます。</p>';

    h += '<div class="finder glass"><label class="q"><span class="mi">search</span>' +
      '<input type="search" id="og-mem-q" value="' + esc(vm.q) + '" placeholder="名前・スキル・ことばで探す(例: 動画編集)"></label>' +
      '<a class="btn" href="#/me"><span class="mi">edit</span>自分のプロフィールを編集</a></div>';
    if (vm.popTags.length) {
      h += '<div class="tagrow"><span class="lbl">よく探されるタグ:</span>' + vm.popTags.map(function (x) {
        return '<button class="nb" aria-pressed="' + (O.ckey(vm.tag) === O.ckey(x.t) ? 'true' : 'false') + '" data-memtag="' + esc(x.t) + '">' + esc(x.t) + '<i>' + x.n + '名</i></button>';
      }).join('') + '</div>';
      h += '<p class="finder-note">タグを押すと、その人だけに絞り込めます。' + (vm.tag ? ' ― いま「' + esc(vm.tag) + '」で絞り込み中(もう一度押すと外れます)。' : '') + '</p>';
    }

    if (vm.tagsErr && !vm.totalPeople) {
      h += '<div class="book-empty">名鑑を取得できませんでした。再読み込みしてください。</div>';
    } else if (!vm.totalPeople) {
      h += '<div class="book-empty">メンバーがまだ登録されていません。</div>';
    } else if (!vm.shownCount) {
      h += '<div class="book-empty">この条件に合う人は見つかりませんでした。ことばを変えるか、タグを外してください。</div>';
    } else {
      vm.sections.forEach(function (sec) {
        h += '<section class="deptsec"><h2 class="sec">' + esc(sec.name) + '<span class="cnt nb">' + sec.count + '名</span>' +
          (sec.mgr ? '<span class="mg">マネージャー ' + esc(sec.mgr) + '</span>' : '') + '</h2><div class="book">';
        sec.people.forEach(function (p) {
          var tagsHtml = [];
          p.tg.skills.forEach(function (t) { tagsHtml.push(tagSpanHtml(t, false, vm.tag)); });
          p.tg.interests.forEach(function (t) { tagsHtml.push(tagSpanHtml(t, false, vm.tag)); });
          p.tg.languages.forEach(function (t) { tagsHtml.push(tagSpanHtml(t, true, vm.tag)); });
          var isNew = p.joinedAt && String(p.joinedAt).slice(0, 10) >= O.ymd(O.addDays(O.NOW, -30));
          h += '<div class="person' + (p.isMe ? ' me' : '') + '">' + faceHtml(p, p.name) + '<div>' +
            '<div class="head"><span class="nm">' + esc(p.name) + '</span><span class="pos nb">' + esc(p.title) + '</span>' +
            (p.isMe ? '<span class="youmark">あなた</span>' : '') +
            (isNew && !p.isMe ? '<span class="newmark nb">' + esc(O.md(String(p.joinedAt).slice(0, 10))) + '入会</span>' : '') + '</div>' +
            (tagsHtml.length ? '<div class="tags">' + tagsHtml.join('・') + '</div>' : '') +
            (p.oneline ? '<div class="word">' + esc(p.oneline) + '</div>' : '') +
            '</div>' + (p.isMe ? '<a class="edit" href="#/me">編集</a>' : '') + '</div>';
        });
        h += '</div></section>';
      });
      h += '<p class="bookfoot">タグとひとことは<b>本人が編集</b>します ― 空欄の人には1on1で声をかけてみてください。部署や役職の変更は console のメンバー管理から。</p>';
    }

    h += O.colophonHtml('名鑑', vm.totalPeople + '名 ・ ' + esc(O.NOW.getFullYear() + '.' + (O.NOW.getMonth() + 1) + '.' + O.NOW.getDate()) + ' 現在');
    O.root.innerHTML = '<div class="pg-members">' + h + '</div>';
    bindMembers();
  }
  O.renderMembers = renderMembers;
  function bindMembers() {
    var q = document.getElementById('og-mem-q');
    if (q) q.addEventListener('input', function () {
      st.q = q.value;
      O.render();
      var q2 = document.getElementById('og-mem-q');
      if (q2) { q2.focus(); try { q2.setSelectionRange(q2.value.length, q2.value.length); } catch (e) {} }
    });
    O.nodes(O.root.querySelectorAll('[data-memtag]')).forEach(function (el) {
      el.addEventListener('click', function () {
        var t = el.getAttribute('data-memtag');
        st.tag = O.ckey(st.tag) === O.ckey(t) ? '' : t;
        O.render();
      });
    });
  }

  /* ============================================================================
     自分のプロフィール編集(#/me) — setMyProfileTags(本人のみ・BEも本人固定)
     ============================================================================ */
  var pf = { busy: false, err: '', doneMsg: '', vals: null }; // vals=保存失敗/検証エラー時の入力保持
  O.pfEd = pf;
  function myTagRow() {
    var me = O.M.me || {};
    var hit = null;
    arr(O.M.tags).forEach(function (t) { if (t && String(t.id) === String(me.id)) hit = t; });
    return hit;
  }
  function renderProfileEdit() {
    var me = O.M.me || {};
    var row = myTagRow() || { skills: [], interests: [], languages: [], oneline: '' };
    var t = pf.vals || {
      skills: arr(row.skills).join(', '), interests: arr(row.interests).join(', '),
      languages: arr(row.languages).join(', '), oneline: row.oneline || '',
    };
    var h = O.mastheadHtml({ showHq: me.rank >= 3 });
    h += '<a class="back" href="#/members"><span class="mi">arrow_back</span>名鑑に戻る</a>';
    h += '<div class="titleblock"><div><div class="kicker">名鑑 ・ 本人編集</div><h1>自分のプロフィール</h1></div>' +
      '<div class="meta">' + esc(me.name || '') + (me.dept ? ' ・ ' + esc(me.dept) : '') + '</div></div>';
    h += '<p class="standfirst">ここで書いたタグとひとことは、名鑑で全メンバーに表示されます。名前・部署・役職の変更は console のメンバー管理から。</p>';
    h += '<form class="gform" id="og-pf-form" style="margin-top:18px">' +
      '<label>できること(スキル)<input id="og-pf-skills" value="' + esc(t.skills) + '" placeholder="例: 動画編集, 写真, 司会">' +
      '<span class="hint">読点かカンマで区切って最大10個 ・ 1つ20字まで</span></label>' +
      '<label>興味のあること<input id="og-pf-interests" value="' + esc(t.interests) + '" placeholder="例: 料理, 音楽"></label>' +
      '<label>話せることば<input id="og-pf-languages" value="' + esc(t.languages) + '" placeholder="例: 英語, 韓国語"></label>' +
      '<label>ひとこと<textarea id="og-pf-oneline" maxlength="60">' + esc(t.oneline || '') + '</textarea>' +
      '<span class="hint">60字まで ・ 頼みごとの相手を探す人へ向けて</span></label>' +
      '<div class="edit-cta"><button type="submit" class="btn" id="og-pf-save">' + (pf.busy ? '保存中…' : '保存する') + '</button>' +
      '<a class="btn sub" href="#/members">名鑑に戻る</a></div>' +
      (pf.err ? '<p class="edit-err">' + esc(pf.err) + '</p>' : '') +
      (pf.doneMsg ? '<p class="save-done">' + esc(pf.doneMsg) + '</p>' : '') +
      '</form>';
    h += O.colophonHtml('名鑑');
    O.root.innerHTML = '<div class="pg-edit">' + h + '</div>';
    var form = document.getElementById('og-pf-form');
    if (form) form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (pf.busy) return;
      var g = function (id) { var n = document.getElementById(id); return n ? String(n.value || '') : ''; };
      pf.vals = { skills: g('og-pf-skills'), interests: g('og-pf-interests'), languages: g('og-pf-languages'), oneline: g('og-pf-oneline') };
      var split = function (s) {
        return s.split(/[,、，]/).map(function (x) { return x.trim(); }).filter(Boolean);
      };
      var payload = {
        skills: split(g('og-pf-skills')),
        interests: split(g('og-pf-interests')),
        languages: split(g('og-pf-languages')),
        oneline: g('og-pf-oneline').trim(),
      };
      if (payload.oneline.length > 60) { pf.err = 'ひとことは60字までです。'; pf.doneMsg = ''; O.render(); return; }
      var over = payload.skills.concat(payload.interests, payload.languages).filter(function (x) { return x.length > 20; });
      if (over.length) { pf.err = 'タグは1つ20字までです: ' + over[0]; pf.doneMsg = ''; O.render(); return; }
      if (O.DEMO) { pf.doneMsg = 'デモ表示のため保存は行われません。'; pf.err = ''; O.render(); return; }
      pf.busy = true; pf.err = ''; pf.doneMsg = ''; O.render();
      API.postData('setMyProfileTags', payload)
        .then(function (r) {
          // 応答の正規化済みタグで手元の名鑑行を更新(再fetch不要)
          var row = myTagRow();
          if (row && r) {
            row.skills = arr(r.skills); row.interests = arr(r.interests);
            row.languages = arr(r.languages); row.oneline = r.oneline || '';
          } else if (r) {
            O.M.tags = arr(O.M.tags).concat([{ id: r.memberId, name: (O.M.me && O.M.me.name) || '', dept: (O.M.me && O.M.me.dept) || '', title: 'メンバー', initial: (O.M.me && O.M.me.initial) || '', accent: (O.M.me && O.M.me.accent) || 'indigo', skills: arr(r.skills), interests: arr(r.interests), languages: arr(r.languages), oneline: r.oneline || '' }]);
          }
          pf.busy = false; pf.vals = null; pf.doneMsg = '保存しました。名鑑に反映されています。';
          O.cacheSave();
          O.render();
        })
        .catch(function (e) {
          pf.busy = false;
          pf.err = '保存できませんでした: ' + String((e && e.message) || '通信エラー') + ' ― 入力は残っています。';
          O.render();
        });
    });
  }
  O.renderProfileEdit = renderProfileEdit;
})();

      { id: 'DG-BUDDY', deptId: 'D-PR', name: '秋のバディ企画チーム', kind: 'project', memberIds: ['CN-YUI', 'CN-HARUTO'], leaderId: 'CN-YUI', endDate: '2026-10-31', note: '募集〜説明会まで', active: true },
    ] };
    O.OB['CN-AISHA'] = { fetched: true, loading: false, err: false, forbidden: false, data: { memberId: 'CN-AISHA', total: 5, done: 3, steps: [
      { id: 'OB1', memberId: 'CN-AISHA', step: 1, label: 'アカウントとプロフィール登録', doneAt: D(-3) + 'T10:00:00', doneBy: 'CN-AISHA', mentorId: 'CN-MIZUKI', note: '' },
      { id: 'OB2', memberId: 'CN-AISHA', step: 2, label: '部署のみんなと顔合わせ', doneAt: D(-1) + 'T19:00:00', doneBy: 'CN-AISHA', mentorId: 'CN-MIZUKI', note: '' },
      { id: 'OB3', memberId: 'CN-AISHA', step: 3, label: '初めてのイベント運営', doneAt: T + 'T15:10:00', doneBy: 'CN-MIZUKI', mentorId: 'CN-MIZUKI', note: '' },
      { id: 'OB4', memberId: 'CN-AISHA', step: 4, label: '振り返り1on1', doneAt: '', doneBy: '', mentorId: 'CN-MIZUKI', note: 'みずきさんと・今週中' },
      { id: 'OB5', memberId: 'CN-AISHA', step: 5, label: '最初の役割を決める', doneAt: '', doneBy: '', mentorId: 'CN-MIZUKI', note: '' },
    ] } };
    // 正典パリティ用のデモ専用フィード行(実データ源が無い種類: 会議アジェンダ追加・ナレッジ・締切)
    O.demoExtraFeed = function (feed) {
      var T2 = O.NOW.getTime();
      var extra = [
        { id: 'dx:ob', ts: T2 - 150 * 60000, tag: '仲間', face: O.memberById('CN-AISHA'),
          bodyHtml: '<b>アイシャさん</b>のオンボーディング「初めてのイベント運営」が<span class="act">きょう完了しました</span>。次は振り返り1on1です。', go: { label: '進捗', href: '#/members' } },
        { id: 'dx:agenda', ts: T2 - 218 * 60000, tag: '会議', face: O.memberById('CN-YUI'),
          bodyHtml: '<b>ユイさん</b>が 今夜の定例アジェンダに「10月バディ募集の打ち手」を<span class="act">追加しました</span>。', go: null },
        { id: 'dx:knw', ts: T2 - 80 * 60000, tag: 'ナレッジ', face: O.memberById('CN-SAKI'),
          bodyHtml: '<b>サキさん</b>が ナレッジ「当日受付のコツ」を<span class="act">更新しました</span> ― きょうの運営の学びを追記。', go: { label: '読む', href: '#/knowledge' } },
        { id: 'dx:eval', ts: T2 - 340 * 60000, tag: '締切', face: O.memberById('CN-KANA'),
          bodyHtml: '<b>総務部</b>より ― 週次評価(8月第4週)の入力は<span class="nb"><b>あす18:00</b>まで</span>。広報部は残り2名です。', go: null },
      ].map(function (f) {
        f.read = O.isRead(f.id);
        f.time = O.relLabel(new Date(f.ts).toISOString());
        return f;
      });
      var all = arr(feed).concat(extra);
      all.sort(function (a, b) { return b.ts - a.ts; });
      return all.slice(0, 8);
    };
  }

  /* ============================ 永続キャッシュ(SWR) ============================
     PII方針: メンバー名簿・会議ロスターはスタッフ(console同等の扱い)。参加者PIIは扱わない。
     時間に敏感なもの(きょうの予定/イベント/タスク)は保存しない=次の読取で埋まる。 */
  var CACHE_KEY = 'admin2.org.v1';
  var CACHE_TTL = 24 * 60 * 60 * 1000;
  function pickKeys(list, keys) {
    return arr(list).map(function (o) {
      var r = {};
      keys.forEach(function (k) { if (o && o[k] !== undefined && o[k] !== '' && o[k] !== null) r[k] = o[k]; });
      return r;
    });
  }
  var DEPT_KEEP = ['id', 'key', 'name', 'abbr', 'desc', 'order', 'status', 'memberCount'];
  var MEM_KEEP = ['id', 'name', 'dept', 'title', 'role', 'initial', 'accent', 'joinedAt', 'isActive'];
  var MTG_KEEP = ['intakeId', 'dept', 'meetingName', 'meetingDate', 'meetingType', 'status', 'docUrl'];
  var MIN_KEEP = ['dedupe_key', 'department', 'meeting_name', 'meeting_date', 'meeting_type', 'drive_url', 'updated_at'];
  function cacheSave() {
    if (O.DEMO) return;
    try {
      var M = O.M;
      var mtgs = arr(M.meetings && M.meetings.meetings).map(function (m) {
        var r = {};
        MTG_KEEP.forEach(function (k) { if (m[k] !== undefined && m[k] !== '') r[k] = m[k]; });
        r.roster = pickKeys(m.roster, ['memberId', 'name', 'rsvpStatus']);
        return r;
      });
      var glBy = {}, grpBy = {};
      Object.keys(O.GL).forEach(function (k) { if (O.GL[k] && Array.isArray(O.GL[k].items)) glBy[k] = O.GL[k].items; });
      Object.keys(O.GRP).forEach(function (k) { if (O.GRP[k] && Array.isArray(O.GRP[k].groups)) grpBy[k] = O.GRP[k].groups; });
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        mid: API.mid(), t: Date.now(),
        vm: {
          me: M.me,
          departments: pickKeys(M.departments, DEPT_KEEP),
          members: pickKeys(M.members, MEM_KEEP),
          tags: M.tags,
          meetings: M.meetings ? { canSeeAll: !!M.meetings.canSeeAll, scope: M.meetings.scope || 'own', meetings: mtgs } : null,
          minutes: M.minutes ? { scope: M.minutes.scope || 'own', items: pickKeys(M.minutes.items, MIN_KEEP) } : null,
          kudos: { kudos: pickKeys(arr(M.kudos && M.kudos.kudos), ['id', 'fromMemberId', 'fromName', 'toMemberId', 'toName', 'message', 'createdAt']).slice(0, 10) },
          glBy: glBy, grpBy: grpBy,
        },
      }));
    } catch (e) {}
  }
  function cacheLoad() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.vm || o.mid !== API.mid() || !o.t || Date.now() - o.t > CACHE_TTL) {
        localStorage.removeItem(CACHE_KEY);
        return null;
      }
      return o.vm;
    } catch (e) { return null; }
  }
  function cacheClear() { try { localStorage.removeItem(CACHE_KEY); } catch (e) {} }
  O.cacheSave = cacheSave;
  O.cacheClear = cacheClear;

  /* ============================ ルーティング ============================ */
  function route() {
    var h = location.hash || '#/';
    var m = /^#\/dept\/([^\/]+)(?:\/([a-z]+))?/.exec(h);
    if (m) {
      var sub = m[2] || 'dept';
      var view = { dept: 'dept', minutes: 'minutes', goals: 'goals', groups: 'groups', oneonone: 'oneonone', attendance: 'attendance', eval: 'eval' }[sub] || 'dept';
      return { view: view, id: decodeURIComponent(m[1]) };
    }
    if (/^#\/members/.test(h)) return { view: 'members' };
    if (/^#\/me\b/.test(h)) return { view: 'me' };
    var s = /^#\/(schedule|knowledge|kudos|orgprofile)/.exec(h);
    if (s) return { view: 'stub', key: s[1] };
    return { view: 'home' };
  }
  O.route = route;

  var loadedOnce = false, loading = false, unauthShown = false;
  function render() {
    var r = route();
    O.setBodyClass(r);
    if (O.DEMO && !demoSeeded) { demoSeed(); demoSeeded = true; }
    if (O.M.departments === null) { O.renderLoading(); return; }
    if (r.view === 'home') {
      // 新メンバーのオンボーディング進捗(権限があるときだけ遅延読取)
      var nb = O.newestMember();
      if (nb) O.loadOnboarding(nb.id);
      O.renderHome(O.buildHomeModel());
      return;
    }
    if (r.view === 'members') { O.renderMembers(O.buildMembersModel()); return; }
    if (r.view === 'me') { O.renderProfileEdit(); return; }
    if (r.view === 'stub') {
      O.root.innerHTML = '<div class="pg-edit">' + O.mastheadHtml({ showHq: (O.M.me && O.M.me.rank >= 3) }) +
        '<a class="back" href="#/"><span class="mi">arrow_back</span>組織ホームへ</a>' +
        O.stubBody(r.key) + O.colophonHtml() + '</div>';
      return;
    }
    // 部署ビュー
    var dept = O.findDept(r.id);
    if (!dept) {
      if (!loadedOnce && !O.DEMO) { O.renderLoading(); return; }
      O.renderNotFound();
      return;
    }
    if (r.view === 'dept' || r.view === 'goals' || r.view === 'groups') O.loadDeptExtras(dept.id);
    var vm = O.buildDeptModel(dept);
    if (r.view === 'minutes') { O.renderMin(O.buildMinModel(dept)); return; }
    if (r.view === 'goals') { O.renderGoalsEdit(vm); return; }
    if (r.view === 'groups') { O.renderGroupsEdit(vm); return; }
    if (r.view === 'oneonone' || r.view === 'attendance' || r.view === 'eval') {
      O.root.innerHTML = '<div class="pg-edit">' + O.mastheadHtml({ showHq: vm.showHq }) +
        O.deptHeadHtml(vm, r.view) + O.stubBody(r.view) +
        O.colophonHtml('部署ハブ', O.esc(dept.name)) + '</div>';
      return;
    }
    O.renderDept(vm);
  }
  O.render = render;
  var demoSeeded = false;

  /* ============================ 読込 ============================ */
  function loadReal() {
    if (loading) return;
    loading = true;
    unauthShown = false;
    /* 軽量API直行だと user 非同梱で役職不明のまま権限ゲートが誤発動する(eventアプリの実障害を継承)。
       セッションがあり役職未判明なら本体GASの超軽量 getDataGen で役職を解決して再描画。 */
    if (API.hasSession() && !(window.currentUser && window.currentUser.member)) {
      API.fetchData('getDataGen', {}).then(function () {
        if (window.currentUser && window.currentUser.member) {
          O.M.me = O.meModel();
          try { render(); } catch (e) {}
        }
      }, function () {});
    }
    var cached = cacheLoad();
    if (cached) {
      O.M.me = cached.me || null;
      O.M.departments = arr(cached.departments);
      O.M.members = arr(cached.members);
      O.M.tags = arr(cached.tags);
      O.M.meetings = cached.meetings || null;
      O.M.minutes = cached.minutes || null;
      O.M.kudos = cached.kudos || null;
      Object.keys(cached.glBy || {}).forEach(function (k) { O.GL[k] = { items: cached.glBy[k], err: false, fetched: false, loading: false }; });
      Object.keys(cached.grpBy || {}).forEach(function (k) { O.GRP[k] = { groups: cached.grpBy[k], err: false, fetched: false, loading: false }; });
    }
    render(); // キャッシュがあれば 0ms で紙面 / なければローディング

    var M = O.M;
    var pDepts = API.fetchData('listDepartments', {});
    var pMeetings = API.fetchData('listMinutesMeetings', {}).then(function (r) { return r; }, function () { M.meetingsOk = false; return null; });
    var pMinutes = API.fetchData('listMinutes', {}).then(function (r) { return r; }, function () { M.minutesOk = false; return null; });
    var pMembers = API.fetchData('listMembers', {}).then(function (r) { return r; }, function () { M.membersOk = false; return []; });
    var pTags = API.fetchData('listMemberTags', {}).then(function (r) { return r; }, function () { M.tagsOk = false; return []; });
    var pKudos = API.fetchData('listKudos', { limit: 20 }).then(function (r) { return r; }, function () { M.kudosOk = false; return null; });
    var pSchedule = API.fetchData('getSchedule', { start: O.TODAY, end: O.TODAY }).then(function (r) { return r; }, function () { M.scheduleOk = false; return null; });
    var pEvents = API.fetchData('listEvents', {}).then(function (r) { return r; }, function () { M.eventsOk = false; return []; });
    var pTodos = API.fetchData('listTodos', {}).then(function (r) { return r; }, function () { M.todosOk = false; return []; });

    // 段階レンダリング: キャッシュなし初回は速い組(部署+会議+議事録)で先に紙面を出す
    var doneAll = false;
    if (!cached) {
      Promise.all([pDepts, pMeetings, pMinutes]).then(function (res) {
        if (doneAll || unauthShown) return;
        M.departments = arr(res[0]);
        M.meetings = res[1];
        M.minutes = res[2];
        M.me = O.meModel();
        render();
      }).catch(function () { /* エラーは全体待ちで一元処理 */ });
    }
    Promise.all([pDepts, pMeetings, pMinutes, pMembers, pTags, pKudos, pSchedule, pEvents, pTodos]).then(function (res) {
      doneAll = true;
      loading = false;
      if (unauthShown) return;
      M.departments = arr(res[0]);
      M.meetings = res[1];
      M.minutes = res[2];
      M.members = arr(res[3]);
      M.tags = arr(res[4]);
      M.kudos = res[5];
      M.schedule = res[6];
      M.events = arr(res[7]);
      M.todos = arr(res[8]);
      M.me = O.meModel();
      loadedOnce = true;
      render();
      cacheSave();
    }).catch(function (e) {
      doneAll = true;
      loading = false;
      if (unauthShown || (e && e._auth)) return;
      if (cached) return; // 24h以内の前回紙面 > 全面エラー
      O.renderError((e && e.message) || String(e));
    });
  }

  /* ============================ 起動 ============================ */
  API.setOnUnauthorized(function () {
    unauthShown = true;
    API.clearSession();
    cacheClear();
    O.renderLogin('セッションが切れました。再度ログインしてください。');
  });
  window.addEventListener('hashchange', function () {
    if (O.DEMO) { render(); return; }
    if (!API.hasSession()) return;
    render();
  });
  function boot() {
    if (O.DEMO) { render(); return; }
    if (!API.hasSession()) { cacheClear(); O.renderLogin(''); return; }
    if (loadedOnce) { render(); return; }
    loadReal();
  }
  O.boot = boot;
  window.__og = O; // QAブリッジ(オフライン検証用。実UIと同じ入口のみ)
  boot();
})();

</script>
