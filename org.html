<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>組織 — connec+a 運営ポータル</title>
<meta name="description" content="connec+a 運営ポータル — 組織面">
<script>window.__ADMIN2_BUILD='20260902061413';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0&display=block" rel="stylesheet">
<style>
/* ================= shared/01-tokens.css ================= */
/* ============================================================================
   admin2 共通トークン+共通部品 (正典: redesign/portal-proto/portal.html)
   ここに置くのは全アプリで再利用する規則のみ: 色・書体・.glass・.btn・.nb・
   フォーカス・reduced-motion。レイアウトは各アプリ側で設計する(機械的統一の禁止)。
   ============================================================================ */
:root{
  --accent:#6e86e0; --deep:#4f63c4; --ink:#22314a; --ink2:#2b3d57; --ink3:#3d5877; --ink4:#526d89; --ink5:#71859a;
  --cream:#faf6e8; --paper:#fdfcf8; --line:#d9dfe9; --rule:#22314a;
  --warn:#a8434f; --ok:#3f7d5c; --amber:#8a6a2f;
  --wash1:rgba(110,134,224,.08); --wash2:rgba(244,232,196,.35); --wash3:rgba(233,180,196,.10);
  --serif:'Zen Old Mincho',serif; --sans:'Zen Kaku Gothic New',sans-serif; --latin:'Cormorant Garamond',serif;
  /* アプリ識別色(全アプリ共通で固定の意味を持つ) */
  --app-event:#6e86e0; --app-comms:#c96f83; --app-org:#4c8f6a; --app-hq:#b08430; --app-analytics:#5d7bab;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.8;
  background-image:
    radial-gradient(ellipse 900px 520px at 88% -6%, rgba(110,134,224,.26), transparent 60%),
    radial-gradient(ellipse 700px 500px at -8% 30%, rgba(244,228,178,.75), transparent 60%),
    radial-gradient(ellipse 540px 430px at 96% 46%, rgba(110,134,224,.2), transparent 62%),
    radial-gradient(ellipse 700px 460px at 26% 74%, rgba(110,134,224,.14), transparent 62%),
    radial-gradient(ellipse 620px 480px at 70% 108%, rgba(233,180,196,.26), transparent 62%);
  background-attachment:fixed}
/* フロストガラス(浮いている操作面・状態帯に使用。見出し・本文の紙面には使わない) */
.glass{background:linear-gradient(168deg, rgba(255,255,255,.52), rgba(255,255,255,.24));
  -webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);
  border:1px solid rgba(255,255,255,.75);box-shadow:0 14px 38px -18px rgba(34,49,74,.3), inset 0 1px 0 rgba(255,255,255,.9)}
.mi{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;vertical-align:-3px;display:inline-block}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px}
/* 日本語の改行制御: 単語の途中・単位の直前で折らない。複合語・日付時刻・数値+単位は .nb で固定 */
body{line-break:strict}
.nb{white-space:nowrap}
.btn{white-space:nowrap}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2.5px solid var(--deep);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

/* ボタン(操作規則は全アプリ共通。文字は絶対に折らない=入らないときはボタンごと縦積み) */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:700;font-size:14px;
  background:var(--deep);color:#fff;padding:12px 22px;border-radius:8px;text-decoration:none;min-height:44px;
  border:0;cursor:pointer;transition:background .15s}
.btn:hover{background:#43549f}
.btn.sub{color:var(--deep);background:linear-gradient(168deg, rgba(255,255,255,.55), rgba(255,255,255,.28));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);
  box-shadow:0 8px 22px -14px rgba(34,49,74,.3)}
.btn.sub:hover{background:rgba(255,255,255,.65)}

/* ================= org/20-org.css ================= */
/* ============================================================================
   組織アプリ — 正典: redesign/portal-proto/org-home.html / org-dept.html /
   org-minutes.html / org-members.html からの移植(1ファイルに統合)。
   衝突の解決: ページ固有の寸法は .pg-home / .pg-dept / .pg-min / .pg-members で
   スコープ。org-dept のメンバーレールは home の右rail(.rail)と名前が衝突するため
   .crewrail に改名(見た目は正典どおり)。
   ============================================================================ */

/* 組織ホームだけ夕暮れ寄りの水彩(琥珀+桃)。正典 org-home の「組織面だけの空気」 */
body.org-home{background-image:
  radial-gradient(ellipse 900px 520px at 88% -6%, rgba(110,134,224,.2), transparent 60%),
  radial-gradient(ellipse 760px 520px at -8% 24%, rgba(244,210,150,.5), transparent 60%),
  radial-gradient(ellipse 560px 440px at 90% 52%, rgba(233,180,196,.22), transparent 62%),
  radial-gradient(ellipse 640px 480px at 30% 108%, rgba(110,134,224,.14), transparent 62%)}

button{font-family:var(--sans);cursor:pointer}
.btn{padding:11px 20px}

/* ============ クローム(題字+アプリ切替) ============ */
.masthead{padding:20px 0 0;border-bottom:3px double var(--rule)}
.mast-top{display:flex;align-items:baseline;gap:16px}
.daimoku{font-family:var(--latin);font-size:28px;font-weight:500;color:var(--ink)}
.daimoku b{color:var(--accent);font-weight:500}
.mast-sub{font-family:var(--serif);font-size:12px;letter-spacing:.24em;color:var(--ink3)}
.mast-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink4)}
.mast-right img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1.5px solid var(--accent)}
.edition{display:flex;gap:2px;font-size:12.5px;margin:12px 0;padding:5px;border-radius:8px;align-items:center;
  background:linear-gradient(168deg, rgba(255,255,255,.5), rgba(255,255,255,.22));
  -webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);
  border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px -18px rgba(34,49,74,.3), inset 0 1px 0 rgba(255,255,255,.9)}
.edition a{padding:8px 18px;letter-spacing:.14em;color:var(--ink3);text-decoration:none;min-height:40px;display:inline-flex;align-items:center;border-radius:6px;flex:none}
.edition a:hover{background:rgba(255,255,255,.55)}
.edition a[aria-current]{font-weight:700;color:#fff;background:var(--deep);box-shadow:0 6px 16px -6px rgba(79,99,196,.6)}
.edition .spacer{flex:1}

/* 見出しブロック(戻る+表紙) */
.back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink4);text-decoration:none;margin:18px 0 4px;min-height:40px}
.back:hover{color:var(--deep)}
.titlegrid{display:grid;grid-template-columns:1fr 310px;gap:28px;align-items:end;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.titlegrid.nocover{grid-template-columns:1fr}
.titleblock{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.standfirst{font-size:13.5px;color:var(--ink3);margin-top:6px;max-width:52ch}
.cover{position:relative}
.cover img{width:100%;height:158px;object-fit:cover;border-radius:6px;display:block;background:#e8ecf4}
.cover .cap{position:absolute;left:8px;bottom:8px;padding:4px 11px;font-size:11.5px;color:#fff;letter-spacing:.05em;
  background:rgba(24,32,52,.38);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.28);border-radius:6px}
.kicker{font-size:12px;letter-spacing:.3em;color:var(--deep);font-weight:700;display:flex;align-items:center;gap:10px}
.kicker::before{content:'';width:26px;height:1.5px;background:var(--accent)}
.titleblock h1{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:.03em;line-height:1.4}
.titleblock .meta{font-size:13.5px;color:var(--ink3);padding-bottom:6px}

/* タブ(部署ハブ内) */
.tabbar{display:flex;gap:2px;align-items:center;margin:16px 0 22px;padding:5px;border-radius:8px}
.tabbar a{padding:9px 20px;font-size:13.5px;letter-spacing:.08em;color:var(--ink3);text-decoration:none;border-radius:6px;min-height:42px;display:inline-flex;align-items:center;gap:7px;flex:none}
.tabbar a:hover{background:rgba(255,255,255,.55)}
.tabbar a[aria-current]{font-weight:700;color:#fff;background:var(--deep);box-shadow:0 6px 16px -6px rgba(79,99,196,.6)}
.tabbar a .gate{font-size:10.5px;font-weight:700;color:var(--ink5);border:1px solid var(--line);border-radius:999px;padding:0 8px;line-height:1.7;background:rgba(255,255,255,.6)}
.tabbar .spacer{flex:1}

/* 節見出し(共通)+本文2列 */
h2.sec{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.12em;display:flex;align-items:baseline;gap:12px;margin:26px 0 4px}
h2.sec:first-child{margin-top:0}
h2.sec::after{content:'';flex:1;height:1px;background:var(--rule);opacity:.4}
h2.sec .all,h2.sec .act{font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--deep);text-decoration:none;letter-spacing:.04em;flex:none}
h2.sec .qual{font-family:var(--sans);font-size:12px;color:var(--ink5);letter-spacing:.06em;font-weight:400;flex:none}
h2.sec .cnt{font-family:var(--sans);font-size:12px;color:var(--ink5);letter-spacing:.06em;font-weight:400;flex:none}
h2.sec .mg{font-family:var(--sans);font-size:12px;color:var(--ink4);letter-spacing:.04em;font-weight:400;flex:none}
.cols{display:grid;gap:30px;align-items:start}
.cols>*{min-width:0}
.pg-home .cols{grid-template-columns:1fr 348px;padding:26px 0 40px}
.pg-home h2.sec{font-size:18px;letter-spacing:.14em}
.pg-dept .cols{grid-template-columns:1fr 356px;padding-bottom:40px}
.pg-min .cols{grid-template-columns:1fr 340px;padding-bottom:40px}

/* ============ 組織ホーム: 見開き(状況リード+きょうの残り) ============ */
.spread{display:grid;grid-template-columns:44px 1fr 348px;gap:0;border-bottom:1px solid var(--rule)}
.datepost{writing-mode:vertical-rl;font-family:var(--serif);font-size:13px;letter-spacing:.34em;color:var(--ink4);
  padding:34px 0 0 2px;border-right:1px solid var(--line)}
.lead{padding:32px 34px 26px 30px;border-right:1px solid var(--line)}
.lead h1{font-family:var(--serif);font-size:36px;font-weight:600;line-height:1.55;letter-spacing:.03em;margin:12px 0 6px;text-wrap:balance}
.lead h1 em{font-style:normal;color:var(--deep);white-space:nowrap}
.lead .standfirst{font-size:14px;color:var(--ink3);max-width:52ch;margin-top:0}
.lead .standfirst b{color:var(--ink2);font-weight:700}
.echo{display:flex;align-items:center;gap:12px;margin-top:20px;padding:12px 16px;border-left:3px solid var(--app-org);
  background:rgba(76,143,106,.06);font-size:13.5px}
.echo .mi{color:var(--ok);font-size:19px;flex:none}
.echo b{font-weight:700}
.echo a{margin-left:auto;flex:none;color:var(--deep);font-weight:700;text-decoration:none;font-size:12.5px}
.tonight{padding:28px 0 24px 28px}
.tonight h2{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.14em;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:2px}
.tl{list-style:none;border-left:2px solid var(--line);margin:12px 0 0 5px}
.tl li{position:relative;padding:8px 0 8px 20px;font-size:13.5px;display:flex;gap:10px;align-items:baseline}
.tl li::before{content:'';position:absolute;left:-6px;top:15px;width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid var(--ink5)}
.tl li.now::before{border-color:var(--deep);background:var(--deep)}
.tl li.done::before{border-color:var(--ok);background:var(--ok)}
.tl .when{font-family:var(--serif);flex:none;width:52px;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.tl b{font-weight:700}
.tl .sub{display:block;font-size:11.5px;color:var(--ink5)}
.tl li.done .strike{text-decoration:line-through;text-decoration-color:rgba(34,49,74,.35);color:var(--ink4)}
.tl-empty{font-size:12.5px;color:var(--ink5);padding:14px 0 6px}

/* 今夜の定例バンド */
.teirei{display:grid;grid-template-columns:1fr 330px;gap:0;border-bottom:1px solid var(--rule)}
.t-main{padding:24px 34px 22px 0;border-right:1px solid var(--line)}
.t-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.t-head h2{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:.08em}
.t-head .meta{font-size:13px;color:var(--ink3)}
.t-head .live{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--deep)}
.t-body{display:flex;gap:30px;margin-top:14px;align-items:flex-start}
.t-body .agenda{flex:1;list-style:none;counter-reset:ag}
.t-body .agenda li{counter-increment:ag;display:flex;gap:12px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:13.5px;align-items:baseline}
.t-body .agenda li:last-child{border-bottom:0}
.t-body .agenda li::before{content:counter(ag);font-family:var(--serif);font-size:15px;color:var(--deep);font-weight:600;flex:none;width:16px}
.t-body .agenda .who2{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink5)}
.t-body .agenda .who2 img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.t-noagenda{flex:1;font-size:13px;color:var(--ink4);padding:8px 0}
.t-people{flex:none;width:250px}
.t-people .cap{font-size:11.5px;letter-spacing:.12em;color:var(--ink4);margin-bottom:8px}
.t-faces{display:flex;flex-wrap:wrap;gap:8px}
.t-faces figure{width:52px;text-align:center}
.t-faces img,.t-faces .init{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 6px 16px -8px rgba(34,49,74,.4)}
.t-faces .init{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.t-faces figcaption{font-size:10.5px;color:var(--ink4);margin-top:2px;letter-spacing:.02em}
.t-faces figure.na img,.t-faces figure.na .init{filter:grayscale(1);opacity:.55}
.t-faces figure.na figcaption{color:var(--ink5)}
.t-cta{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}
.t-note{font-size:12px;color:var(--ink5)}
.t-note a{color:var(--deep);font-weight:700;text-decoration:none}
.t-done{font-size:13px;color:var(--ok);font-weight:700}
.t-side{padding:24px 0 22px 26px}
.t-side h3{font-family:var(--serif);font-size:14.5px;font-weight:600;letter-spacing:.12em;margin-bottom:8px}
.rec-steps{list-style:none;font-size:13px}
.rec-steps li{display:flex;gap:10px;padding:7px 0;align-items:baseline}
.rec-steps .mi{font-size:17px;color:var(--ink4);flex:none;top:2px;position:relative}
.rec-steps li.on .mi{color:var(--deep)}
.rec-steps b{font-weight:700}
.rec-steps .sub{display:block;font-size:11.5px;color:var(--ink5)}

/* みんなの動き */
.feed{list-style:none}
.feed li{display:grid;grid-template-columns:14px 44px 1fr auto;gap:0 12px;padding:13px 2px;border-bottom:1px dashed var(--line);font-size:13.5px;align-items:start}
.feed .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:9px}
.feed li.read .dot{background:transparent}
.feed img,.feed .init{width:40px;height:40px;border-radius:50%;object-fit:cover}
.feed .init{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
.feed b{font-weight:700}
.feed .act{color:var(--deep);font-weight:700}
.feed .meta2{display:flex;gap:8px;align-items:baseline;margin-top:2px;font-size:11.5px;color:var(--ink5)}
.feed .tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--ink4)}
.feed .foryou{color:var(--amber);font-weight:700}
.feed .go{align-self:center;font-size:12.5px;font-weight:700;color:var(--deep);text-decoration:none;border:1.5px solid var(--line);border-radius:8px;padding:6px 13px;background:rgba(255,255,255,.55);white-space:nowrap;min-height:36px;display:inline-flex;align-items:center}
.feed .go:hover{background:rgba(255,255,255,.8)}
.feed-empty{font-size:13px;color:var(--ink4);padding:16px 2px}

/* ホーム右rail */
.rail{border-radius:8px;padding:20px 20px 16px}
.rail .grp{margin-bottom:22px}
.rail .grp:last-child{margin-bottom:4px}
.rail h3{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.1em;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:8px;display:flex;align-items:baseline}
.rail h3 .all{margin-left:auto;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--deep);text-decoration:none}
.newbie{display:flex;gap:13px;align-items:flex-start}
.newbie img,.newbie .init{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2.5px solid #fff;box-shadow:0 8px 20px -8px rgba(34,49,74,.4);flex:none}
.newbie .init{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}
.newbie .nm{font-weight:700;font-size:14.5px}
.newbie .nm small{font-weight:400;font-size:11.5px;color:var(--ink5);margin-left:6px}
.newbie .today{font-size:12.5px;margin-top:2px}
.newbie .today b{color:var(--ok)}
.ob{list-style:none;margin-top:10px;font-size:12.5px}
.ob li{display:flex;gap:8px;padding:5px 0;align-items:baseline}
.ob .mi{font-size:15px;flex:none;position:relative;top:2px}
.ob li.done{color:var(--ink4)}
.ob li.done .mi{color:var(--ok)}
.ob li.today2 .mi{color:var(--ok)}
.ob li.today2 b{color:var(--ok)}
.ob li.next .mi{color:var(--deep)}
.ob li.next b{font-weight:700}
.ob li.later{color:var(--ink5)}
.ob li.later .mi{color:var(--ink5)}
.ob-note{font-size:12px;color:var(--ink4);margin-top:8px;line-height:1.7}
.ob-note button{background:none;border:0;color:var(--deep);font-weight:700;font-size:12px;padding:0;cursor:pointer}
.kudos{font-size:13px}
.kudos .row{display:flex;gap:11px;align-items:flex-start;padding:8px 0}
.kudos img,.kudos .init{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none}
.kudos .init{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px}
.kudos q{quotes:'「' '」';color:var(--ink2)}
.kudos .send{display:block;text-align:center;font-size:12.5px;color:var(--deep);font-weight:700;text-decoration:none;border-top:1px dashed var(--line);padding-top:10px;margin-top:6px;min-height:36px}
.wk{display:flex;gap:0}
.wk .n{flex:1;text-align:left;padding:4px 12px 0 0}
.wk .n+.n{border-left:1px solid var(--line);padding-left:12px}
.wk .v{font-family:var(--serif);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.wk .l{font-size:11px;letter-spacing:.1em;color:var(--ink4)}
.wk-note{font-size:11px;color:var(--ink5);margin-top:6px}

/* 部署の棚 */
.depts{border-radius:8px;overflow:hidden;margin-bottom:46px}
.depts a{display:grid;grid-template-columns:170px 1fr 210px 40px;gap:16px;align-items:baseline;padding:13px 22px;
  text-decoration:none;color:var(--ink);border-bottom:1px solid rgba(255,255,255,.6);transition:background .15s}
.depts a:last-child{border-bottom:0}
.depts a:hover{background:rgba(255,255,255,.5)}
.depts .dn{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.1em;display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.depts .dn::before{content:'';width:3px;height:15px;background:var(--app-org);align-self:center;flex:none}
.depts .dh{font-size:13px;color:var(--ink2);min-width:0}
.depts .dh .warn-t{color:var(--warn);font-weight:700}
.depts .dm{font-size:12px;color:var(--ink4);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.depts .go2{font-size:17px;color:var(--ink5);justify-self:end;align-self:center}
.depts a:hover .go2{color:var(--deep)}
.depts .mine .dn{color:var(--deep)}
.depts .mine .dn::before{background:var(--deep)}

/* ============ 部署ハブ: 会議の日バンド ============ */
.mday{display:grid;grid-template-columns:1fr 292px;gap:26px;margin:0 0 6px;border-radius:8px;padding:18px 22px 16px;border-left:4px solid var(--deep)}
.md-kicker{font-size:11.5px;letter-spacing:.3em;color:var(--deep);font-weight:700}
.md-title{font-family:var(--serif);font-size:21px;font-weight:600;margin-top:3px}
.md-title .pl{font-size:14px;color:var(--ink3);font-weight:400}
.md-agenda{list-style:none;margin-top:9px;display:flex;gap:8px 26px;flex-wrap:wrap}
.md-agenda li{font-size:13px;display:flex;gap:7px;align-items:baseline}
.md-agenda .no{font-family:var(--serif);color:var(--deep);font-weight:600;flex:none}
.md-agenda small{color:var(--ink5);font-size:11.5px;margin-left:5px}
.md-edit{font-size:12px;font-weight:700;color:var(--deep);text-decoration:none;margin-top:7px;display:inline-block}
.md-side{display:flex;flex-direction:column;align-items:flex-end;gap:9px;justify-content:center}
.md-rsvp{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink4)}
.md-rsvp .faces{display:flex}
.md-rsvp .faces img,.md-rsvp .faces .init{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid #fff;margin-left:-8px}
.md-rsvp .faces .init{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px}
.md-rsvp .faces img:first-child,.md-rsvp .faces .init:first-child{margin-left:0}
.mday .btn{font-size:15px;padding:13px 28px}
.md-note{font-size:11.5px;color:var(--ink5);text-align:right;max-width:32ch;line-height:1.7}

/* 出たばかりの議事録(3日以内) */
.fresh{margin:14px 0 24px}
.f-row{display:grid;grid-template-columns:96px 1fr auto;gap:16px;padding:13px 2px;border-bottom:1px dashed var(--line);align-items:baseline}
.f-row:last-child{border-bottom:0;padding-bottom:6px}
.f-date{font-family:var(--serif);font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.f-title{font-size:14.5px;font-weight:700}
.f-title .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:8px;vertical-align:1px}
.f-title .dot-label{font-size:11px;color:var(--warn);font-weight:700;letter-spacing:.06em;margin-left:6px}
.f-sub{font-size:12.5px;color:var(--ink4);margin-top:2px}
.f-sub b{color:var(--ink2)}
.f-you{display:inline-block;margin-top:7px;font-size:12.5px;padding:4px 12px;border-radius:0 4px 4px 0;background:rgba(138,106,47,.09);border-left:3px solid var(--amber);color:var(--ink2)}
.f-you b{color:var(--amber);letter-spacing:.04em}
.f-stay{font-size:11.5px;color:var(--ink5);margin-top:5px}
.f-open{font-size:12.5px;font-weight:700;color:var(--deep);text-decoration:none;flex:none}
.mt-note{font-size:12.5px;color:var(--ink4);margin-top:8px}

/* 数字バンド */
.numband{display:flex;margin:0 0 26px;border-radius:8px;overflow:hidden}
.numband .n{flex:1;padding:13px 18px 9px;border-right:1px solid rgba(255,255,255,.65)}
.numband .n:last-child{border-right:0}
.numband .v{font-family:var(--serif);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.numband .v small{font-size:13px;color:var(--ink4);font-weight:400;margin-left:2px}
.numband .l{font-size:12px;letter-spacing:.12em;color:var(--ink4)}
.numband .n .delta{font-size:11.5px;color:var(--ok);font-weight:700;margin-left:6px}

/* 部署目標(OKR-lite) */
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink4);margin-top:8px}
.legend span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend .lg-ok::before{background:var(--ok)}
.legend .lg-watch::before{background:var(--amber)}
.legend .lg-bad::before{background:var(--warn)}
.goal{padding:16px 2px 14px;border-bottom:1px dashed var(--line)}
.goal:last-of-type{border-bottom:0}
.goal .g-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.goal .g-name{font-size:14.5px;font-weight:700}
.goal .g-state{font-size:11.5px;font-weight:700;letter-spacing:.08em;border-radius:999px;padding:1px 10px;flex:none}
.goal .g-state.ok{color:var(--ok);border:1.5px solid rgba(63,125,92,.4);background:rgba(255,255,255,.6)}
.goal .g-state.watch{color:var(--amber);border:1.5px solid rgba(138,106,47,.4);background:rgba(255,255,255,.6)}
.goal .g-state.bad{color:var(--warn);border:1.5px solid rgba(168,67,79,.4);background:rgba(255,255,255,.6)}
.goal .g-num{margin-left:auto;font-family:var(--serif);font-size:15px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none}
.goal .g-num b{font-size:24px;font-weight:600;color:var(--ink)}
.goal .g-num .pct{font-size:13px;margin-left:8px}
.goal .g-num .pct.ok{color:var(--ok);font-weight:700}
.goal .g-num .pct.watch{color:var(--amber);font-weight:700}
.goal .g-num .pct.bad{color:var(--warn);font-weight:700}
.gbar{height:9px;border-radius:4px;background:rgba(110,134,224,.14);margin-top:9px;position:relative;overflow:hidden}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.gbar i.ok{background:var(--ok)}
.gbar i.watch{background:var(--amber)}
.gbar i.bad{background:var(--warn)}
.goal .g-note{font-size:12.5px;color:var(--ink4);margin-top:7px}
.goal .g-note b{color:var(--ink2)}
.goal .g-note .owner{display:inline-flex;align-items:center;gap:6px;margin-left:10px}
.goal .g-note .owner img{width:20px;height:20px;border-radius:50%;object-fit:cover;vertical-align:-5px}
.goal-empty{font-size:13px;color:var(--ink4);padding:14px 2px}
.goal-empty a{color:var(--deep);font-weight:700;text-decoration:none}

/* グループのレール */
.grow{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:13px 2px;border-bottom:1px dashed var(--line);align-items:baseline}
.grow:last-of-type{border-bottom:0}
.grow .gr-name{font-size:14.5px;font-weight:700}
.grow .gr-kind{font-size:11px;font-weight:700;letter-spacing:.08em;border-radius:999px;padding:1px 9px;margin-left:9px;vertical-align:2px;background:rgba(255,255,255,.6);color:var(--ink4);border:1.5px solid var(--line)}
.grow .gr-kind.project{color:var(--amber);border-color:rgba(138,106,47,.4)}
.grow .gr-sub{font-size:12.5px;color:var(--ink4);grid-column:1;margin-top:1px}
.grow .gr-sub b{color:var(--ink2)}
.grow .gr-open{font-size:12.5px;font-weight:700;color:var(--deep);text-decoration:none;flex:none;grid-column:2;grid-row:1}

/* メンバーレール(人物型)。org-dept の .rail はホーム右railと衝突するため改名 */
.crewrail{display:flex;gap:0;margin-top:12px;overflow-x:auto}
.crew{width:114px;flex:none;text-align:center;position:relative}
.crew img,.crew .init{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 8px 20px -8px rgba(34,49,74,.35)}
.crew .init{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:22px}
.crew.you img,.crew.you .init{border-color:var(--accent)}
.crew .role{display:inline-block;margin-top:-12px;position:relative;background:var(--deep);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:2px 10px;white-space:nowrap}
.crew.you .role{background:var(--accent)}
.crew.new .role{background:transparent;color:var(--amber);border:1.5px dashed rgba(138,106,47,.5)}
.crew .nm{font-size:13px;font-weight:700;margin-top:5px}
.crew .nt{font-size:11px;color:var(--ink5);line-height:1.5}

/* 出席のようす(スパーク) */
.att{display:flex;gap:26px;align-items:flex-end;margin-top:14px;flex-wrap:wrap}
.spark{display:flex;align-items:flex-end;gap:10px;height:84px}
.spark .b{width:44px;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.spark .b i{display:block;background:rgba(110,134,224,.32);border-radius:2px 2px 0 0;margin:0 6px}
.spark .b.hi i{background:var(--deep)}
.spark .b em{font-style:normal;font-family:var(--serif);font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.spark .b .dt{font-size:10.5px;color:var(--ink5);margin-top:3px;white-space:nowrap}
.att-note{font-size:13px;color:var(--ink3);max-width:34ch}
.att-note b{font-weight:700}
.att-note .up{color:var(--ok);font-weight:700}

/* 直近の議事録(紙面風) */
.minutes .m-row{display:grid;grid-template-columns:96px 1fr auto;gap:16px;padding:14px 2px;border-bottom:1px dashed var(--line);align-items:baseline}
.minutes .m-row:last-child{border-bottom:0}
.minutes .m-date{font-family:var(--serif);font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.minutes .m-title{font-size:14.5px;font-weight:700}
.minutes .m-sub{font-size:12.5px;color:var(--ink4);margin-top:2px}
.minutes .m-sub b{color:var(--ink2)}
.minutes .m-open{font-size:12.5px;font-weight:700;color:var(--deep);text-decoration:none;flex:none}

/* 右列(ガラス)・部署ハブ/議事録タブ共用 */
.side{border-radius:8px;padding:20px 20px 16px}
.side h2{font-family:var(--serif);font-size:15.5px;font-weight:600;letter-spacing:.1em;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:10px;display:flex;align-items:baseline}
.side h2 .act{margin-left:auto;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--deep);text-decoration:none}
.side h2 .cnt{margin-left:auto;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--amber)}
.side .grp{margin-bottom:22px}
.mt-title{font-family:var(--serif);font-size:18px;font-weight:600}
.mt-meta{font-size:13px;color:var(--ink3);margin-top:2px}
.side .agenda{list-style:none;margin-top:8px}
.side .agenda li{display:flex;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;align-items:baseline}
.side .agenda li:last-child{border-bottom:0}
.side .agenda .no{font-family:var(--serif);color:var(--deep);font-weight:600;flex:none}
.side .agenda small{display:block;font-size:11.5px;color:var(--ink5)}
.rsvp-line{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink4)}
.rsvp-line .faces{display:flex}
.rsvp-line .faces img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid #fff;margin-left:-8px}
.rsvp-line .faces img:first-child{margin-left:0}
.tasks{list-style:none}
.tasks li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;align-items:baseline}
.tasks li:last-child{border-bottom:0}
.tasks img,.tasks .init{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;align-self:center}
.tasks .init{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px}
.tasks b{font-weight:700}
.tasks small{display:block;font-size:11.5px;color:var(--ink5)}
.tasks time{margin-left:auto;flex:none;font-size:11.5px;color:var(--ink5);font-family:var(--serif)}
.tasks time.hot{color:var(--warn);font-weight:700}
.tasks-note{font-size:12px;color:var(--ink4);margin-top:6px}
.side-empty{font-size:12.5px;color:var(--ink5);padding:6px 0 4px;line-height:1.8}

/* ============ 会議・議事録タブ ============ */
.recband{display:flex;gap:26px;align-items:center;margin:0 0 24px;border-radius:8px;padding:16px 22px}
.recband .btn{font-size:15px;padding:13px 28px;flex:none}
.rb-note{font-size:12.5px;color:var(--ink4);max-width:44ch}
.rb-queue{margin-left:auto;display:flex;gap:11px;align-items:center;padding-left:22px;border-left:1px dashed var(--line);font-size:13px}
.rb-queue .mi{font-size:22px;color:var(--deep)}
.rb-queue b{font-weight:700}
.rb-queue .st{color:var(--deep);font-weight:700}
.rb-queue small{display:block;font-size:11.5px;color:var(--ink5)}
.filters{display:flex;gap:14px;align-items:center;margin:2px 0 8px;flex-wrap:wrap}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--rule);padding:7px 2px}
.search .mi{font-size:19px;color:var(--ink4)}
.search input{border:0;background:transparent;font-family:var(--sans);font-size:13.5px;color:var(--ink);width:100%;outline:none}
.search input::placeholder{color:var(--ink5)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--ink3);border:1px solid var(--line);
  background:rgba(255,255,255,.6);border-radius:999px;padding:6px 15px;min-height:34px;cursor:pointer}
.chips button[aria-pressed="true"]{color:#fff;background:var(--deep);border-color:var(--deep)}
.chips button small{font-weight:400;color:inherit;opacity:.75;margin-left:3px}
.month{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.16em;color:var(--ink3);display:flex;align-items:baseline;gap:12px;margin:22px 0 2px}
.month:first-of-type{margin-top:14px}
.month::after{content:'';flex:1;height:1px;background:var(--line)}
.month small{font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;color:var(--ink5);flex:none}
.mm{display:grid;grid-template-columns:86px 1fr auto;gap:16px;padding:15px 2px 14px;border-bottom:1px dashed var(--line);align-items:baseline}
.mm:last-child{border-bottom:0}
.mm-date{font-family:var(--serif);font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.mm-title{font-size:15px;font-weight:700}
.mm-title .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:8px;vertical-align:1px}
.mm-title .dot-label{font-size:11px;color:var(--warn);font-weight:700;letter-spacing:.06em;margin-left:7px}
.kind{font-size:11px;font-weight:700;letter-spacing:.08em;border-radius:999px;padding:1px 9px;margin-left:9px;vertical-align:2px;background:rgba(255,255,255,.6)}
.kind.teirei{color:var(--ink4);border:1.5px solid var(--line)}
.kind.rinji{color:var(--amber);border:1.5px solid rgba(138,106,47,.4)}
.kind.shodan{color:var(--deep);border:1.5px solid rgba(79,99,196,.4)}
.mm-sum{font-size:12.5px;color:var(--ink4);margin-top:3px}
.mm-sum b{color:var(--ink2)}
.mm-you{display:inline-block;margin-top:6px;font-size:12px;padding:2px 10px;border-radius:0 4px 4px 0;background:rgba(138,106,47,.09);border-left:3px solid var(--amber);color:var(--ink2)}
.mm-you b{color:var(--amber)}
.mm-top3{font-size:11.5px;color:var(--ink5);margin-top:4px}
.mm-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none}
.mm-att{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink4)}
.mm-att .faces{display:flex}
.mm-att .faces img{width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid #fff;margin-left:-7px}
.mm-att .faces img:first-child{margin-left:0}
.mm-open{font-size:12.5px;font-weight:700;color:var(--deep);text-decoration:none;background:none;border:0;padding:0;font-family:var(--sans);cursor:pointer}
.mm.opened{border-bottom:0;padding-bottom:6px}
.m-detail{margin:0 0 6px 86px;padding:16px 20px 14px;border-left:3px solid var(--deep);background:rgba(255,255,255,.45);border-radius:0 6px 6px 0}
.m-detail h3{font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--ink3);margin:14px 0 6px}
.m-detail h3:first-child{margin-top:0}
.d-you{font-size:13px;padding:8px 14px;border-radius:0 4px 4px 0;background:rgba(138,106,47,.1);border-left:3px solid var(--amber)}
.d-you b{color:var(--amber);letter-spacing:.04em}
.d-you .due{font-weight:700}
.dlist{list-style:none}
.dlist li{display:flex;gap:9px;padding:6px 0;font-size:13.5px;align-items:baseline;border-bottom:1px dashed var(--line)}
.dlist li:last-child{border-bottom:0}
.dlist .no{font-family:var(--serif);color:var(--deep);font-weight:600;flex:none}
.hw{display:flex;gap:10px;align-items:center;font-size:13.5px;padding:6px 0}
.hw img,.hw .init{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none}
.hw .init{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px}
.hw time{margin-left:auto;font-family:var(--serif);font-size:12px;color:var(--warn);font-weight:700;flex:none}
.fulltext{position:relative;margin-top:6px;font-size:13.5px;color:var(--ink3);max-height:118px;overflow:hidden;white-space:pre-line}
.fulltext::after{content:'';position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(rgba(253,252,248,0), #f6f5ef)}
.fulltext.open{max-height:none}
.fulltext.open::after{display:none}
.d-more{display:flex;gap:18px;margin-top:8px;font-size:12.5px;flex-wrap:wrap}
.d-more a,.d-more button{color:var(--deep);font-weight:700;text-decoration:none;background:none;border:0;padding:0;font-size:12.5px;font-family:var(--sans);cursor:pointer}
.d-none{font-size:13px;color:var(--ink4)}
.d-none a{color:var(--deep);font-weight:700;text-decoration:none}
.older{display:block;text-align:center;font-size:12.5px;font-weight:700;color:var(--deep);text-decoration:none;padding:14px 0 4px;background:none;border:0;width:100%;font-family:var(--sans);cursor:pointer}
.you-list{list-style:none}
.you-list li{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px;align-items:flex-start}
.you-list li:last-child{border-bottom:0}
.you-list input[type="checkbox"]{width:18px;height:18px;accent-color:var(--deep);margin-top:4px;flex:none}
.you-list b{font-weight:700}
.you-list small{display:block;font-size:11.5px;color:var(--ink5)}
.you-list .due{font-size:12px;color:var(--warn);font-weight:700}
.you-list li.done{color:var(--ink5)}
.you-list li.done b{font-weight:400;text-decoration:line-through}
.you-list li.done .mi{font-size:19px;color:var(--ok);margin-top:3px;flex:none}
.mention{font-size:13px;padding:10px 0 2px}
.mention .who{display:flex;gap:9px;align-items:center;margin-bottom:3px}
.mention .who img,.mention .who .init{width:26px;height:26px;border-radius:50%;object-fit:cover}
.mention .who .init{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px}
.mention q{quotes:'「' '」';color:var(--ink2)}
.mention a{color:var(--deep);font-weight:700;text-decoration:none}
.side-note{font-size:11.5px;color:var(--ink5);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}

/* ============ メンバー名鑑 ============ */
.finder{display:flex;gap:14px;align-items:center;margin:16px 0 8px;padding:12px 16px;border-radius:8px;flex-wrap:wrap}
.finder .q{display:flex;align-items:center;gap:8px;flex:1;min-width:230px;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:44px}
.finder .q .mi{color:var(--ink4);font-size:20px}
.finder .q input{border:0;background:none;font-family:var(--sans);font-size:13.5px;flex:1;color:var(--ink);outline:none;min-width:0}
.finder .q input::placeholder{color:var(--ink5)}
.finder .btn{flex:none}

<div id="app" class="wrap"></div>
<script>
// ================= shared/10-api.js =================
/* ============================================================================
   admin2 共通 GAS API 層 (vanilla JS・console.html の実プロトコル準拠)
   - 読取 = GET ?action&memberId&params(JSON: {...params, token})。タイムアウト12s。
     ネットワーク断/5xx/429/404 は指数バックオフで最大2回リトライ(読取は冪等)。
     対象4action は軽量読取API優先。2連続失敗で5分間 本体GAS直行にフォールバック。
   - 書込 = POST body=JSON {action,payload,memberId,token} / Content-Type: text/plain。
     二重送信防止のため自動リトライしない。
   - セッション = localStorage connecta.memberId / connecta.token
     (console.html と同一キー=同一オリジンでSSO。consoleログイン済ならそのまま開く)
   ============================================================================ */
window.AdminAPI = (function () {
  'use strict';
  var URL_MAIN = 'https://script.google.com/macros/s/AKfycbxLs1eXm39MHM0lSioBf9ghVFL8p8fIhIdYJpBBweBTCLOFDqWclPhoF66c0FgfrbHg/exec';
  var URL_READ = 'https://script.google.com/macros/s/AKfycbxm-_IBapGbmilVQSzPhsLhL6cMwm8_bIwxyq8Wh8j3IxXjGjBz234EwEohFe18EAY/exec';
  var READ_API_ACTIONS = {
    listEvents: 1, listParticipants: 1, listRegistrations: 1, listTodos: 1,
    // read-api @5 で追加(2026-09-01 B1): イベント新機能の読取+ポータルの遅い3本
    listEventStaffAssignments: 1, listVenues: 1, listEventExpenses: 1, listEventGroups: 1,
    listNews: 1, listMinutesMeetings: 1, listMembers: 1,
    // read-api @listWaitlist 追加済み(2026-09-01): キャンセル待ちの読取
    listWaitlist: 1,
    // read-api 対応済み(2026-09-02 B3): 配信タイムラインの読取
    listEventComms: 1,
    // イベント単体の申込読取(バックエンド実装中の新action。無ければ本体→呼び出し側でlistRegistrationsへフォールバック)
    listEventRegistrations: 1,
  };
  var ROLE_RANK = { '代表': 5, '副代表': 4, 'マネージャー': 3, 'アシマネ': 2, 'メンバー': 1 };
  var onUnauthorized = null; // アプリ側が setOnUnauthorized で登録(認証切れ→ログイン画面へ)

  function mid() { try { return localStorage.getItem('connecta.memberId') || ''; } catch (e) { return ''; } }
  function tok() { try { return localStorage.getItem('connecta.token') || ''; } catch (e) { return ''; } }
  function setSession(id, t) { try { if (id) localStorage.setItem('connecta.memberId', id); if (t) localStorage.setItem('connecta.token', t); } catch (e) {} }
  function clearSession() { try { localStorage.removeItem('connecta.memberId'); localStorage.removeItem('connecta.token'); } catch (e) {} }

  // 認証切れ判定(console.html authFail と同一)。権限不足(FORBIDDEN等)は認証切れ扱いにしない
  function authFail(j) {
    var e = (j && j.error && (j.error.message || j.error)) || '';
    if (/FORBIDDEN|権限がありません|required /i.test(String(e))) return false;
    return !!(j && (j.unauthorized === true || (!j.ok && /AUTH_REQUIRED|認証が必要|認証が切れ|再ログイン|未ログイン|セッション|ログインが必要|unauthorized|expired/i.test(String(e)))));
  }
  function handleResp(j) {
    if (j && j.user !== undefined) window.currentUser = j.user;
    if (authFail(j)) {
      if (typeof onUnauthorized === 'function') onUnauthorized();
      var er = new Error('認証が切れています。再ログインしてください。');
      er._auth = true;
      throw er;
    }
    if (!j || !j.ok) throw new Error((j && j.error && (j.error.message || j.error)) || '取得に失敗しました');
    return j.data;
  }

  // 1回のGET。silent=軽量API用(認証不一致でもログアウトさせず、失敗として本体へ委譲)
  async function fetchAt(base, action, params, timeoutMs, silent) {
    var u = base + '?action=' + encodeURIComponent(action)
      + '&memberId=' + encodeURIComponent(mid())
      + '&params=' + encodeURIComponent(JSON.stringify(Object.assign({}, params, { token: tok() })));
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var to = ctrl ? setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, timeoutMs || 12000) : null;
    var r;
    try { r = await fetch(u, { method: 'GET', signal: ctrl ? ctrl.signal : undefined }); }
    catch (e) {
      if (to) clearTimeout(to);
      var m = String((e && e.message) || '');
      var net = (e && e.name === 'AbortError') || /Load failed|Failed to fetch|NetworkError|network/i.test(m) || m === '';
      var err = new Error((e && e.name === 'AbortError')
        ? '応答に時間がかかっています。通信環境をご確認のうえ再読み込みしてください。'
        : net ? '通信が一時的に不安定です。少し待ってから再読み込みしてください。' : (m || '通信エラー'));
      err._net = net;
      throw err;
    }
    if (to) clearTimeout(to);
    if (!r.ok) {
      var e5 = new Error((r.status >= 500 || r.status === 429)
        ? 'サーバが混み合っています（HTTP ' + r.status + '）。少し待って再読み込みしてください。'
        : ('HTTP ' + r.status));
      // 404を含む理由: GASは並列GET時に一過性404を返すことがある(再送で成功する)
      if (r.status >= 500 || r.status === 429 || r.status === 404) e5._net = true;
      throw e5;
    }
    var t = await r.text();
    var j;
    try { j = JSON.parse(t); }
    catch (e2) { throw new Error('GASからの応答を解析できません。GASの公開設定(全員/自分として実行)を確認してください。'); }
    if (silent) {
      if (j && j.user !== undefined) window.currentUser = j.user;
      if (!j || !j.ok) throw new Error((j && j.error && (j.error.message || j.error)) || 'lite失敗');
      return j.data;
    }
    return handleResp(j);
  }

  var liteFails = 0, liteOff = false;
  async function fetchData(action, params, opts) {
    params = params || {}; opts = opts || {};
    // 対象readは軽量API優先。2回連続で不調なら5分間 本体直行(GAS混雑スパイクは数分で収まる)
    if (URL_READ && !liteOff && READ_API_ACTIONS[action]) {
      try {
        var d = await fetchAt(URL_READ, action, params, Math.min(opts.timeout || 12000, 5000), true);
        liteFails = 0;
        return d;
      } catch (e) {
        if (++liteFails >= 2 && !liteOff) {
          liteOff = true;
          setTimeout(function () { liteOff = false; liteFails = 0; }, 300000);
        }
      }
    }
    var attempt = 0;
    while (true) {
      try { return await fetchAt(URL_MAIN, action, params, opts.timeout); }
      catch (e) {
        if (e && e._net && attempt < 2) {
          attempt++;
          await new Promise(function (r) { setTimeout(r, 400 * attempt); });
          continue;
        }
        throw e;
      }
    }
  }

  // 書込。自動リトライしない(二重送信防止)
  async function postData(action, payload) {
    var r;
    try {
      r = await fetch(URL_MAIN, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, payload: payload || {}, memberId: mid(), token: tok() }),
      });
    } catch (e) {
      var m = String((e && e.message) || '');
      throw new Error(/Load failed|Failed to fetch|NetworkError|network/i.test(m) || m === ''
        ? '通信が一時的に不安定です。もう一度お試しください（二重送信を避けるため自動での再試行はしていません）。'
        : (m || '通信エラー'));
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var t = await r.text();
    var j;
    try { j = JSON.parse(t); }
    catch (e2) { throw new Error('GASからの応答を解析できません。GASの公開設定を確認してください。'); }
    return handleResp(j);
  }

  /* ログイン確定。重要: バックエンドの _validateToken_ は token先頭セグメント(=本来のメンバーID)と
     送信memberIdの一致を要求する。入力IDがメール/別コードだと不一致で直後にログアウトするため、
     user.member.id → token先頭 → r.memberId → 入力ID の順で本来のIDを採用する(console 2943-2945行と同じ)。 */
  function finishLogin(r, typedId) {
    var tk = (r && r.token) || '';
    if (!tk) return false;
    var realId = (r && r.user && r.user.member && r.user.member.id)
      || (String(tk).indexOf('.') > 0 ? String(tk).split('.')[0] : '')
      || (r && r.memberId) || String(typedId || '').trim();
    setSession(realId, tk);
    if (r && r.user !== undefined) window.currentUser = r.user;
    return true;
  }
  // 認証。needsPasswordSet===true が返ったら初回PW設定モードへ(呼び出し側で分岐)
  function login(identifier, password) { return postData('authenticate', { identifier: identifier, password: password }); }
  // 初回パスワード設定(10文字以上)。成功時 token が返る
  function setPassword(identifier, newPassword) { return postData('setPassword', { identifier: identifier, newPassword: newPassword }); }

  // ユーザー形: user.member.{id,name}, user.highestRole, user.highestRank
  function myRank() {
    var u = window.currentUser;
    if (!u || !u.member) return 0;
    if (typeof u.highestRank === 'number') return u.highestRank;
    return ROLE_RANK[u.highestRole] || 0;
  }
  function myName() {
    var m = (window.currentUser && window.currentUser.member) || {};
    return m.nickname || m.name || m['氏名'] || '';
  }
  function myRole() { return (window.currentUser && window.currentUser.highestRole) || ''; }

  return {
    fetchData: fetchData,
    postData: postData,
    login: login,
    setPassword: setPassword,
    finishLogin: finishLogin,
    hasSession: function () { return !!(mid() && tok()); },
    setSession: setSession,
    clearSession: clearSession,
    mid: mid,
    tok: tok,
    myRank: myRank,
    myName: myName,
    myRole: myRole,
    ROLE_RANK: ROLE_RANK,
    setOnUnauthorized: function (fn) { onUnauthorized = fn; },
  };
})();

/* ============================================================================

     (きょうこれからの会議=予定のみ・出欠未記録の過去会議を 0% として捏造しない)。 */
  function attendanceSeries(dept, limit) {
    var past = deptMeetings(dept).filter(function (m) {
      var d = mtDate(m);
      if (!d || d > TODAY) return false;
      var ro = arr(m.roster);
      if (!ro.length) return false;
      var recorded = ro.some(function (r) {
        var s = String((r && (r.rsvpStatus || r.rsvp_status)) || '');
        return s === 'attended' || s === 'late' || s === 'absent';
      });
      if (!recorded) return false; // 予定(planned)や未回答だけ=まだ開かれていない/記録されていない
      return true;
    }).sort(function (a, b) { return mtDate(b).localeCompare(mtDate(a)); }).slice(0, limit || 5);
    return past.reverse().map(function (m) {
      var ro = arr(m.roster);
      var att = ro.filter(rsvpAttended).length;
      // 未来でない実施済み会議でも attended 記録がなく planned のみの場合は planned を出席側に数えない
      return { date: mtDate(m), rate: Math.round(att / ro.length * 100), att: att, total: ro.length, name: mtName(m) };
    });
  }
  O.attendanceSeries = attendanceSeries;

    return '<header class="masthead"><div class="mast-top">' +

  }
  O.renderLoading = renderLoading;
  function renderError(msg) {

  O.renderError = renderError;
  function renderNotFound() {

  O.renderNotFound = renderNotFound;
  function renderLogin(note) {
    var state = { mode: 'login', err: note || '', busy: false, id: '', pw: '', npw: '', npw2: '' };
    function paint() {
      var f;
      if (state.mode === 'setpw') {

      }
      O.root.innerHTML = mastheadHtml({ nav: false, meFace: false }) +
        '<main class="login-main"><div class="kicker">運営メンバー専用</div>' +
        '<h1 class="login-h">' + (state.mode === 'setpw' ? 'パスワードの設定' : 'ログイン') + '</h1>' +
        '<p class="login-sub">' + (state.mode === 'setpw'
          ? '初回ログインです。ご自身のパスワードを設定してください。'
          : 'console と同じ<span class="nb">メンバーコード(またはメール)</span>と<span class="nb">パスワードで入れます</span>。') + '</p>' +
        '<form class="login-card glass" id="f">' + f +
        (state.err ? '<div class="login-err">' + esc(state.err) + '</div>' : '') +
        '</form></main>' + colophonHtml();
      bind();
    }
    function keep() {
      var g = function (id) { var n = document.getElementById(id); return n ? n.value : ''; };
      if (state.mode === 'setpw') { state.npw = g('f-npw'); state.npw2 = g('f-npw2'); }
      else { state.id = g('f-id'); state.pw = g('f-pw'); }
    }
    function submit() {
      keep();
      if (state.busy) return;
      if (state.mode === 'setpw') {
        if (state.npw !== state.npw2) { state.err = '確認用パスワードが一致しません。'; paint(); return; }
        if (state.npw.length < 10) { state.err = 'パスワードは10文字以上にしてください。'; paint(); return; }
        state.busy = true; state.err = ''; paint();
        API.setPassword(state.id.trim(), state.npw).then(function (r) {
          if (r && r.ok === false) { state.busy = false; state.err = r.error || 'パスワードの設定に失敗しました。'; paint(); return; }
          if (API.finishLogin(r, state.id)) { O.boot(); return; }
          state.busy = false; state.mode = 'login'; state.pw = '';
          state.err = '設定は完了しました。設定したパスワードでログインしてください。'; paint();
        }).catch(function (e) { state.busy = false; state.err = (e && e.message) || 'パスワードの設定に失敗しました。'; paint(); });
        return;
      }
      if (!state.id.trim()) { state.err = 'メンバーコードまたはメールを入力してください。'; paint(); return; }
      state.busy = true; state.err = ''; paint();
      API.login(state.id.trim(), state.pw).then(function (r) {
        if (r && r.needsPasswordSet) { state.busy = false; state.mode = 'setpw'; state.npw = ''; state.npw2 = ''; state.err = ''; paint(); return; }
        if (API.finishLogin(r, state.id)) { O.boot(); return; }
        state.busy = false; state.err = (r && r.error) || 'ID またはパスワードが違います。ご確認ください。'; paint();
      }).catch(function (e) { state.busy = false; state.err = (e && e.message) || 'ログインに失敗しました。'; paint(); });
    }
    function bind() {
      var form = document.getElementById('f');
      if (!form) return;
      form.addEventListener('submit', function (ev) { ev.preventDefault(); submit(); });
      document.getElementById('f-go').addEventListener('click', function (ev) { ev.preventDefault(); submit(); });
      var back = document.getElementById('f-back');
      if (back) back.addEventListener('click', function () { keep(); state.mode = 'login'; state.err = ''; paint(); });
    }
    paint();
  }
  O.renderLogin = renderLogin;

/* ============================================================================
   組織ホーム(#/) — 正典: org-home.html
   時間帯挨拶 / きょうの残り(getSchedule) / 今夜の会議バンド(listMinutesMeetings×
   getSchedule・出席で返す=setMyMeetingRsvp) / みんなの動き(議事録・称賛・新メンバー
   =localStorage既読) / 新しい仲間(listOnboarding・未起票検知→startOnboarding) /
   ひとこと称賛 / 今週の組織 / 部署の棚(listDepartments+実見出し合成)
   ============================================================================ */
(function () {
  'use strict';
  var O = window.__ORG;
  var API = window.AdminAPI;
  var esc = O.esc, arr = O.arr, faceHtml = O.faceHtml;

  /* ---------- 時間帯挨拶(朝/昼/夕/夜) ---------- */
  function greetWord(h) {
    if (h >= 5 && h < 11) return 'おはようございます';
    if (h >= 11 && h < 17) return 'こんにちは';
    if (h >= 17 && h < 23) return 'おつかれさまでした';
    return 'おつかれさまです';
  }
  function dayPartLabel(h) {
    if (h >= 5 && h < 11) return '朝';
    if (h >= 11 && h < 17) return '昼';
    if (h >= 17 && h < 23) return '夕';
    return '夜';
  }
  O.greetWord = greetWord;
  O.dayPartLabel = dayPartLabel;
  var KANJI_D = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十',
    '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
    '二十一', '二十二', '二十三', '二十四', '二十五', '二十六', '二十七', '二十八', '二十九', '三十', '三十一'];
  function datepostText() {
    var d = O.NOW;
    return KANJI_D[d.getMonth() + 1] + '月' + KANJI_D[d.getDate()] + '日 ' + O.WD[d.getDay()] + '曜 ' + dayPartLabel(d.getHours());
  }

  /* ---------- きょうの予定(getSchedule)の分類 ---------- */
  function todayItems() {
    var sc = O.M.schedule;
    var items = arr(sc && sc.items ? sc.items : sc).filter(function (it) {
      if (!it || !it.start) return false;
      if (String(it.start).slice(0, 10) !== O.TODAY) return false;
      return it.kind === 'meeting' || it.kind === 'oneonone' || it.kind === 'event';
    });
    items.sort(function (a, b) { return String(a.start).localeCompare(String(b.start)); });
    return items;
  }
  function itemState(it) {
    var nowMs = O.NOW.getTime();
    var s = O.tsOf(it.start);
    var e = O.tsOf(it.end) || (s ? s + 60 * 60000 : 0);
    if (!s) return '';
    if (e < nowMs) return 'done';
    if (s <= nowMs) return 'now';
    return '';
  }
  O.todayItems = todayItems;
  O.itemState = itemState;

  /* ---------- 今夜(次)の会議の選定 ---------- */
  function upcomingMeetings() {
    var ms = O.M.meetings && O.M.meetings.meetings ? O.M.meetings.meetings : O.M.meetings;
    return arr(ms).filter(function (m) {
      if (!m || O.mtCancelled(m)) return false;
      var d = O.mtDate(m);
      return d && d >= O.TODAY && !m.docUrl; // 議事録済みの会議は「これから」ではない
    }).sort(function (a, b) { return O.mtDate(a).localeCompare(O.mtDate(b)); });
  }
  O.upcomingMeetings = upcomingMeetings;
  function pickBandMeeting() {
    var ups = upcomingMeetings();
    if (!ups.length) return null;
    var mine = O.myDeptIds();
    var deptOfName = function (nm) {
      var hit = null;
      arr(O.M.departments).forEach(function (d) { if (d && O.deptMatches(d, nm)) hit = d; });
      return hit;
    };
    // きょうの会議を優先し、その中でも自部署を先に。無ければ7日以内の直近。
    var today = ups.filter(function (m) { return O.mtDate(m) === O.TODAY; });
    var pool = today.length ? today : ups.filter(function (m) { return O.mtDate(m) <= O.ymd(O.addDays(O.NOW, 7)); });
    if (!pool.length) return null;
    var withMine = pool.filter(function (m) { var d = deptOfName(m.dept); return d && mine[String(d.id)]; });
    var m0 = (withMine[0] || pool[0]);
    // 時刻は getSchedule 側(mtg-<intakeId>)から補完
    var sc = arr(O.M.schedule && O.M.schedule.items);
    var scIt = null;
    sc.forEach(function (it) { if (it && it.id === 'mtg-' + m0.intakeId) scIt = it; });
    return { m: m0, sc: scIt, dept: deptOfName(m0.dept) };
  }
  O.pickBandMeeting = pickBandMeeting;

  /* ---------- みんなの動き(実データで組める範囲=議事録・称賛・新メンバー) ---------- */
  function buildFeed() {
    var out = [];
    var mine = O.myNames();
    var seenDoc = {}; // 合同会議は部署ごとに同じ議事録が複製される(extra_departments)→フィードでは1回だけ
    arr(O.M.minutes && O.M.minutes.items).forEach(function (it) {
      var dk = O.mnUrl(it) || (O.ckey(O.mnTitle(it)) + '|' + O.mnDate(it));
      if (seenDoc[dk]) return;
      seenDoc[dk] = 1;
      var ts = O.tsOf(it.updated_at || O.mnDate(it));
      var url = O.mnUrl(it);
      var sub = String(it.submitterName || '').trim(); // 実BEは返さない(防御的リーダー・デモ用)
      var ex = O.extractMinutes(O.mnBody(it), mine);
      out.push({
        id: 'mn:' + O.mnId(it), ts: ts, tag: '議事録',
        face: sub ? (O.memberByName(sub) || { name: sub }) : null,
        deptTag: O.mnDept(it),
        bodyHtml: sub
          ? '<b>' + esc(sub) + 'さん</b>が ' + esc(O.mnDept(it)) + 'の議事録「' + esc(O.mnTitle(it)) + '」を<span class="act">上げました</span>。'
          : '<b>' + esc(O.mnDept(it)) + '</b>の議事録「' + esc(O.mnTitle(it)) + '」が<span class="act">上がりました</span>。',
        foryou: ex && ex.forYou.length ? 'あなた宛ての宿題が' + ex.forYou.length + '件' : '',
        go: url ? { label: '開く', href: url, ext: true } : null,
      });
    });
    arr(O.M.kudos && O.M.kudos.kudos ? O.M.kudos.kudos : O.M.kudos).forEach(function (k) {
      if (!k) return;
      out.push({
        id: 'kd:' + (k.id || (k.fromMemberId + '>' + k.toMemberId + '@' + k.createdAt)),
        ts: O.tsOf(k.createdAt), tag: '称賛',
        face: O.memberById(k.fromMemberId) || { name: k.fromName },
        bodyHtml: '<b>' + esc(k.fromName || '') + 'さん</b>が ' + esc(k.toName || '') + 'さんに<span class="act">称賛を送りました</span>' +
          (k.message ? ' ―「' + esc(String(k.message).slice(0, 60)) + '」' : '') + (k.emoji ? ' ' + esc(k.emoji) : ''),
        go: null,
      });
    });
    arr(O.M.members).forEach(function (m) {
      if (!m || m.isActive === false) return;
      var j = String(m.joinedAt || '').slice(0, 10);
      if (!j || j < O.ymd(O.addDays(O.NOW, -14)) || j > O.TODAY) return;
      out.push({
        id: 'nm:' + m.id + '@' + j, ts: O.tsOf(j) + 12 * 3600000, tag: '仲間',
        face: m,
        bodyHtml: '<b>' + esc(m.name) + 'さん</b>が' + (m.dept ? ' ' + esc(m.dept) + 'に' : '') + '<span class="act">入会しました</span>。',
        go: { label: '名鑑', href: '#/members' },
      });
    });
    out.sort(function (a, b) { return b.ts - a.ts; });
    return out.slice(0, 8).map(function (f) {
      f.read = O.isRead(f.id) || f.ts < O.NOW.getTime() - 7 * 86400000; // 7日より前は点を出さない
      f.time = O.relLabel(new Date(f.ts).toISOString());
      return f;
    });
  }
  O.buildFeed = buildFeed;

  /* ---------- 新しい仲間(オンボーディング) ---------- */
  function newestMember() {
    var hit = null;

      if (!m || m.isActive === false) return;
      var j = String(m.joinedAt || '').slice(0, 10);
      if (!j || j < O.ymd(O.addDays(O.NOW, -30)) || j > O.TODAY) return;

  O.newestMember = newestMember;
  function loadOnboarding(memberId) {

    if (!allowed) return; // アシマネ未満は他人のオンボーディングをfetchしない(BEゲートと同じ)

    ob.loading = true;

  /* ---------- 部署の棚: 実データからの見出し合成 ---------- */
  function deptShelfRows() {

    return deps.map(function (d) {
      var head = '';

      if (today) head = 'きょう <b>' + esc(O.mtName(today)) + '</b>。';

      else head = esc(d.desc || '');
      var mcount = O.deptMembers(d).length || O.num(d.memberCount);
      var att = O.attendanceSeries(d, 5);
      var avg = att.length >= 2 ? Math.round(att.reduce(function (s, x) { return s + x.rate; }, 0) / att.length) : null;
      var meta = (mcount ? mcount + '名' : '') + (avg !== null ? (mcount ? ' ・ ' : '') + '出席率' + avg + '%' : '');
      return { id: d.id, name: d.name, mine: !!mine[String(d.id)], headHtml: head, meta: meta };
    });
  }
  O.deptShelfRows = deptShelfRows;

  /* ---------- ホームのビューモデル ---------- */
  function buildHomeModel() {
    var M = O.M;
    var me = M.me || {};
    var vm = { me: me, showHq: me.rank >= 3 };
    var h = O.NOW.getHours();
    var items = todayItems();
    var upcoming = items.filter(function (it) { return itemState(it) !== 'done'; });

    // 見出し: 挨拶(時間帯)+残っている予定を1文で受ける
    var title = '<span class="nb">' + esc(greetWord(h)) + '、</span><span class="nb">' + esc(me.name || '') + (me.name ? 'さん。' : '') + '</span>';
    var follow = '';
    var future = upcoming.filter(function (it) { return itemState(it) === ''; }); // いま進行中のものは「残っています」に数えない
    if (M.scheduleOk && future.length) {
      var nx = future[future.length - 1]; // 一日の締め=最後の予定を見出しに(夕方の「夜は定例が残っています」)
      if (h < 17) nx = future[0]; // 朝昼は次の予定
      var t = O.hm(nx.start);
      var when = (h >= 17 ? '夜は' : 'このあと');
      follow = when + (t ? '<span class="nb">' + esc(t) + '</span>から' : '') + '<em>' + esc(nx.title) + '</em>' +
        (future.length > 1 ? ' <span class="nb">ほか' + (future.length - 1) + '件</span>が' : 'が') + '<span class="nb">残っています。</span>';
    } else if (M.scheduleOk && upcoming.length) {
      follow = 'いまは<em>' + esc(upcoming[0].title) + '</em>の<span class="nb">時間です。</span>';
    } else if (M.scheduleOk && items.length) {
      follow = 'きょうの予定はすべて<span class="nb">終わりました。</span>';
    } else if (M.scheduleOk) {
      follow = 'きょうの予定は<span class="nb">ありません。</span>';
    }
    vm.kicker = '組織 ・ ' + (h >= 17 ? 'きょうのむすび' : h < 11 ? 'きょうのはじまり' : 'きょうのいま');
    vm.titleHtml = title + (follow ? '<br>' + follow : '');
    vm.datepost = datepostText();

    // 立ち上がり文(standfirst): 残り予定の要約+処理中の議事録
    var parts = [];
    upcoming.slice(0, 2).forEach(function (it) {
      var t = O.hm(it.start);
      parts.push((t ? '<span class="nb">' + esc(t) + '</span>に' : '') + '<b>' + esc(it.title) + '</b>');
    });
    var pend = arr(M.meetings && M.meetings.meetings).filter(function (m) {
      return m && String(m.status || '') === 'pending' && !O.mtCancelled(m);
    })[0];
    var sf = parts.length ? parts.join('、') + '。' : '';
    if (pend) sf += '<b>' + esc(O.mtName(pend)) + '</b>の議事録を作成中です。';
    vm.standfirstHtml = sf;

    // きょうの余韻: きょう終わったイベント(イベント面へ)
    vm.echo = null;
    if (M.eventsOk) {
      var endedEv = null;
      arr(M.events).forEach(function (e) {
        if (!e || /中止|アーカイブ/.test(String(e.status || ''))) return;
        if (String(e.date || '').slice(0, 10) !== O.TODAY) return;
        var end = O.tsOf(O.TODAY + 'T' + String(e.endTime || '').slice(0, 5));
        if (end && end < O.NOW.getTime()) endedEv = e;
      });
      if (endedEv) {
        vm.echo = {
          html: 'きょうの<b>' + esc(endedEv.title || endedEv.name || 'イベント') + '</b>は終了しました。おつかれさまでした。',
          href: './event.html' + O.QS + '#/ev/' + encodeURIComponent(endedEv.id),
        };
      }
    }

    // きょうの残り(右)
    if (!M.scheduleOk) {
      vm.today = { err: true };
    } else {
      var rows = items.map(function (it) {
        var st = itemState(it);
        var t = O.hm(it.start) || (it.allDay ? '終日' : '');
        var sub = [it.dept, (it.meta && it.meta.venue) || ''].filter(Boolean).join(' ・ ');
        return { when: t, cls: st, title: it.title, sub: sub };
      });
      if (pend) rows.push({ when: 'このあと', cls: '', title: O.mtName(pend) + 'の議事録', sub: '作成中 ― できあがると部署ハブに出ます', plain: true });
      vm.today = { rows: rows };
    }

    // 今夜(次)の会議バンド
    vm.band = null;
    if (M.meetingsOk) {
      var pick = pickBandMeeting();
      if (pick) {
        var m = pick.m;
        var isToday = O.mtDate(m) === O.TODAY;
        var start = pick.sc ? pick.sc.start : '';
        var t2 = O.hm(start);
        var end2 = pick.sc ? O.hm(pick.sc.end) : '';
        var live = '';
        if (isToday && start) {
          var diff = O.tsOf(start) - O.NOW.getTime();
          if (diff > 0) {
            var mm2 = Math.round(diff / 60000);
            live = '開始まで ' + (mm2 >= 60 ? Math.floor(mm2 / 60) + '時間' + (mm2 % 60 ? (mm2 % 60) + '分' : '') : mm2 + '分');
          } else if (pick.sc && O.tsOf(pick.sc.end) > O.NOW.getTime()) live = '開催中';
        }
        var ro = arr(m.roster);
        var coming = ro.filter(O.rsvpComing);
        var unknown = ro.filter(O.rsvpUnknown);
        var meIn = null;
        ro.forEach(function (r) { if (r && String(r.memberId) === String(me.id)) meIn = r; });
        var faces = ro.slice(0, 8).map(function (r) {
          var mem = O.memberById(r.memberId) || { name: r.name };
          return { name: r.name || mem.name || '', p: mem, na: !O.rsvpComing(r) };
        });
        var prevMin = pick.dept ? O.deptMinutes(pick.dept)[0] : null;
        vm.band = {
          title: O.mtName(m),
          metaHtml: '<span class="nb">' + (isToday ? 'きょう' : esc(O.mdW(O.mtDate(m)))) + (t2 ? ' ' + esc(t2) + (end2 ? '–' + esc(end2) : '') : '') + '</span>' + (m.dept ? ' ・ ' + esc(m.dept) : ''),
          live: live,
          agenda: arr(m.agenda).length ? arr(m.agenda) : null, // 実BEにアジェンダは無い(デモのみ)
          capHtml: '<span class="nb">出席予定 ' + coming.length + '名</span>' + (unknown.length ? ' ・ <span class="nb">未回答 ' + unknown.length + '名</span>' : ''),
          faces: faces,
          intakeId: m.intakeId,
          canRsvp: !!m.intakeId && !!me.id && !O.DEMO,
          myComing: meIn ? O.rsvpComing(meIn) : null,
          deptHref: pick.dept ? '#/dept/' + encodeURIComponent(pick.dept.id) : '',
          prevMinutes: prevMin ? { label: '前回(' + O.md(O.mnDate(prevMin)) + ')の議事録', href: O.mnUrl(prevMin) } : null,
          demoAgendaBtn: !!m.demoAgendaBtn,
        };
      }
    }

    // みんなの動き(3系統すべて失敗なら「読み込み中…」ではなく正直なエラー1行へ)
    vm.feed = (M.minutesOk || M.kudosOk || M.membersOk) ? buildFeed() : [];
    if (O.DEMO && O.demoExtraFeed) vm.feed = O.demoExtraFeed(vm.feed);
    vm.feedErr = !M.minutesOk && !M.kudosOk;

    // 新しい仲間(オンボーディング)
    vm.newbie = null;
    if (M.membersOk) {
      var nb = newestMember();
      if (nb) {
        var ob = O.OB[nb.id];
        var mentor = null;
        if (ob && ob.data && arr(ob.data.steps).length && ob.data.steps[0].mentorId) mentor = O.memberById(ob.data.steps[0].mentorId);
        vm.newbie = {
          m: nb,
          joined: O.md(String(nb.joinedAt || '').slice(0, 10)) + '入会',
          mentorName: mentor ? mentor.name : '',
          canView: me.rank >= 2 || String(nb.id) === String(me.id),
          canStart: me.rank >= 2,
          ob: ob || null,
        };
      }
    }

    // ひとこと称賛
    vm.kudosRail = null;
    if (M.kudosOk) {
      var ks = arr(M.kudos && M.kudos.kudos ? M.kudos.kudos : M.kudos).slice()
        .sort(function (a, b) { return O.tsOf(b.createdAt) - O.tsOf(a.createdAt); });
      vm.kudosRail = { latest: ks[0] || null };
    }

    // 今週の組織
    vm.wk = null;
    var cells = [];
    if (M.meetingsOk) cells.push({ v: arr(M.meetings && M.meetings.meetings).filter(function (m) { return m && !O.mtCancelled(m) && O.inThisWeek(O.mtDate(m)); }).length, l: '会議' });
    if (M.minutesOk) cells.push({ v: (function () { // 合同会議の部署別複製は1件に数える
      var seen = {}, n = 0;
      arr(M.minutes && M.minutes.items).forEach(function (it) {
        if (!O.inThisWeek(O.mnDate(it))) return;
        var dk = O.mnUrl(it) || (O.ckey(O.mnTitle(it)) + '|' + O.mnDate(it));
        if (seen[dk]) return;
        seen[dk] = 1;
        n++;
      });
      return n;
    })(), l: '議事録' });
    if (M.membersOk) cells.push({ v: arr(M.members).filter(function (m) { return m && m.isActive !== false && O.inThisWeek(m.joinedAt); }).length, l: '<span class="nb">新メンバー</span>' });
    if (M.kudosOk) cells.push({ v: arr(M.kudos && M.kudos.kudos ? M.kudos.kudos : M.kudos).filter(function (k) { return k && O.inThisWeek(k.createdAt); }).length, l: '称賛' });
    if (cells.length >= 2) {
      vm.wk = { cells: cells, note: (M.meetings && M.meetings.scope === 'own') ? 'あなたが閲覧できる範囲の数字です' : '' };
    }

    // 部署の棚
    vm.depts = M.deptsOk ? deptShelfRows() : null;
    vm.deptsAllLink = false;
    return vm;
  }
  O.buildHomeModel = buildHomeModel;

          }).join('') + '</div></div>';

        '<li><span class="mi">history_edu</span><span>文字起こしされ、議事録になります<span class="sub">決定・宿題を整理した形で上がります</span></span></li>' +
        '<li><span class="mi">visibility</span><span>部署ハブの最上部に<b>3日間</b>表示<span class="sub">出られなかった人もここで追いつけます</span></span></li>' +
