  function editHeadHtml(ev, h1, sub, backHref) {
    return '<a class="back" href="' + esc(backHref) + '"><span class="mi">arrow_back</span>「' + esc(evTitle(ev)) + '」の概要へ戻る</a>' +
      '<div class="pagehead"><h1>' + esc(h1) + '</h1><span class="count">' + sub + '</span></div>';
  }
  function memberLabel(m) { return memberName(m) + ' (' + String(m.id) + ')'; }
  function staffMembers() {
    var list = DEMO ? DEMO_MEMBERS : arr(M.members);
    return list.filter(function (m) { return m && m.id && !/アーカイブ|退会/.test(String(m.status || '')); });
  }
  function labelOfMemberId(id) {
    var list = staffMembers();
    for (var i = 0; i < list.length; i++) if (String(list[i].id).trim() === String(id).trim()) return memberLabel(list[i]);
    return String(id || '');
  }
  function resolveMemberText(text) {
    var t = String(text || '').trim();
    if (!t) return { id: '' }; // 空欄 = 空き枠(点線)
    var list = staffMembers();
    var m1 = /\(([^()]+)\)\s*$/.exec(t);
    if (m1) {
      var id = m1[1].trim();
      for (var i = 0; i < list.length; i++) if (String(list[i].id).trim() === id) return { id: id };
    }
    var hits = list.filter(function (m) { return memberName(m) === t || String(m.id).trim() === t; });
    if (hits.length === 1) return { id: String(hits[0].id).trim() };
    return { err: true };
  }
  function staffEdInit(evId, entries) {
    staffEd = {
      evId: String(evId), inited: true, busy: false, err: '', notice: '',
      rows: arr(entries).map(function (e) {
        e = e || {};
        return {
          sessionId: e.sessionId || '', note: String(e.note || ''),
          memberText: e.memberId ? labelOfMemberId(e.memberId) : '',
          role: String(e.role || ''), slot: String(e.slot || ''),
        };
      }),
    };
    if (!staffEd.rows.length) staffEd.rows.push({ sessionId: '', note: '', memberText: '', role: '', slot: '' });
  }
  function staffEdKeep() {
    staffEd.rows.forEach(function (row, i) {
      var g = function (id) { var n = document.getElementById(id); return n && n.value != null ? String(n.value) : null; };
      var m = g('st-m-' + i); if (m !== null) row.memberText = m;
      var r0 = g('st-r-' + i); if (r0 !== null) row.role = r0;
      var t = g('st-t-' + i); if (t !== null) row.slot = t;
      var d = g('st-d-' + i); if (d !== null) row.sessionId = d; // 複数日: 全日共通('')⇔Day別(sessionId)
    });
  }
  function renderStaffEdit(ev, staffData) {
    document.body.classList.remove('has-tabbtn');

    if (!DEMO && M.me && M.me.rank < 2) {
      root.innerHTML = head + editHeadHtml(ev, 'この日の担当', '割当の編集', base) +
        (rankUnknown_() ? '<p class="stub-line">権限を確認しています…</p>' : '<p class="stub-line">担当の割当の閲覧・編集にはアシスタントマネージャー以上の権限が必要です。</p>') + colophonHtml(esc(evTitle(ev)));
      return;
    }
    if (staffEd.evId !== String(ev.id) || !staffEd.inited) {
      if (staffData === null) { // 取得待ち(到着したら loadExtras 側が再render)
        root.innerHTML = head + editHeadHtml(ev, 'この日の担当', '割当の編集', base) +

        '<input id="st-r-' + i + '" list="dl-roles" value="' + esc(row.role) + '" placeholder="受付・司会など" autocomplete="off" aria-label="役割">' +
        (multi ? '<select id="st-d-' + i + '" class="sr-day nb" aria-label="担当するDay">' + dayOptions(row) + '</select>' : '') +
        '<input id="st-t-' + i + '" value="' + esc(row.slot) + '" placeholder="11:30–13:30 など" autocomplete="off" aria-label="時間帯">' +
        '<button type="button" class="sr-del" data-sdel="' + i + '" aria-label="' + (i + 1) + '行目を削除"><span class="mi">close</span></button>' +
        '</div>';
    }).join('');
    root.innerHTML = head +
      editHeadHtml(ev, multi ? '担当の割当(複数日)' : 'この日の担当', '割当の編集 ・ ' + esc(evTitle(ev)), base) +
      '<p class="edit-note">保存すると、この一覧の内容で<span class="nb">' + (multi ? 'このイベントの担当' : 'この日の担当') + '</span>を<span class="nb">まるごと置き換えます</span>。メンバーを空欄にした行は<span class="nb">「未定」の空き枠</span>として残ります。' +
      (multi ? '<span class="nb">Dayの列</span>で<span class="nb">全日共通</span>か<span class="nb">特定のDayだけ</span>かを選べます。' : '') + '</p>' +
      '<div class="staffed">' +
      '<div class="sr head' + (multi ? ' withday' : '') + '"><span>メンバー</span><span>役割</span>' + (multi ? '<span>Day</span>' : '') + '<span>時間帯</span><span></span></div>' +
      rowsHtml +
      '</div>' +
      '<button type="button" class="sr-add" id="st-add"><span class="mi">add</span>行を追加</button>' +
      '<datalist id="dl-members">' + staffMembers().map(function (m) { return '<option value="' + esc(memberLabel(m)) + '"></option>'; }).join('') + '</datalist>' +
      '<datalist id="dl-roles">' + ROLE_PRESETS.map(function (r) { return '<option value="' + esc(r) + '"></option>'; }).join('') + '</datalist>' +
      (st.err ? '<p class="edit-err">' + esc(st.err) + '</p>' : '') +
      (st.notice ? '<p class="opnote" role="status">' + esc(st.notice) + '</p>' : '') +
      '<div class="edit-cta"><button type="button" class="btn" id="st-save"' + (st.busy ? ' disabled' : '') + '>' + (st.busy ? '保存中…' : '保存する') + '</button>' +
      '<a class="btn sub" href="' + esc(base) + '">保存せずに戻る</a></div>' +
      colophonHtml(esc(evTitle(ev)) + ' ・ 割当の編集');
    // 操作の束ね
    Array.prototype.forEach.call(root.querySelectorAll('[data-sdel]'), function (b) {
      b.addEventListener('click', function () {
        staffEdKeep();
        st.rows.splice(Number(b.getAttribute('data-sdel')), 1);
        if (!st.rows.length) st.rows.push({ sessionId: '', note: '', memberText: '', role: '', slot: '' });
        st.err = ''; st.notice = '';
        renderStaffEdit(ev, staffData);
      });
    });
    var add = document.getElementById('st-add');
    if (add) add.addEventListener('click', function () {
      staffEdKeep();
      st.rows.push({ sessionId: '', note: '', memberText: '', role: '', slot: '' });
      st.err = ''; st.notice = '';
      renderStaffEdit(ev, staffData);
    });
    var save = document.getElementById('st-save');
    if (save) save.addEventListener('click', function () { staffEdSave(ev, staffData); });

  function staffEdSave(ev, staffData) {
    var st = staffEd;
    if (st.busy) return;
    staffEdKeep();
    var entries = [];
    var err = '';
    st.rows.forEach(function (row, i) {
      var hasAny = String(row.memberText || '').trim() || String(row.role || '').trim() || String(row.slot || '').trim();
      if (!hasAny) return; // 完全な空行は保存しない
      var m = resolveMemberText(row.memberText);
      if (m.err) { err = err || (i + 1) + '行目のメンバーが見つかりません。候補から選ぶか、空欄(空き枠)にしてください。'; return; }
      if (!String(row.role || '').trim()) { err = err || (i + 1) + '行目の役割を入力してください。'; return; }
      var e = { memberId: m.id, role: String(row.role).trim() };
      if (String(row.slot || '').trim()) e.slot = String(row.slot).trim();
      if (row.note) e.note = row.note;
      if (row.sessionId) e.sessionId = row.sessionId;
      entries.push(e);
    });
    if (err) { st.err = err; st.notice = ''; renderStaffEdit(ev, staffData); return; }
    if (DEMO) {
      st.notice = 'デモ表示のため保存は行われません。実データでは、この内容で担当をまるごと置き換えます。';
      renderStaffEdit(ev, staffData);
      return;
    }
    st.busy = true; st.err = ''; st.notice = '';
    renderStaffEdit(ev, staffData);
    API.postData('saveEventStaffAssignments', { eventId: ev.id, entries: entries }).then(function () {
      // 書込成功 → 該当キャッシュを無効化して再取得(再取得に失敗しても送信済みの内容で表示)
      var x = EX[ev.id] || (EX[ev.id] = { staff: null, expenses: null, staffErr: false, expErr: false, fetched: false, loading: false });
      return API.fetchData('listEventStaffAssignments', { eventId: ev.id }).then(
        function (d) { x.staff = unwrapList(d, 'entries'); x.staffErr = false; },
        function () { x.staff = entries; }
      );
    }).then(function () {
      var x = EX[ev.id];
      if (x) x.fetched = true;
      cacheSave();
      staffEd = { evId: '', inited: false, rows: [], busy: false, err: '', notice: '' };
      location.hash = '#/ev/' + encodeURIComponent(ev.id); // 成功で概要へ戻る
      render();
    }).catch(function (e) {
      st.busy = false;
      if (e && e._auth) return;
      st.err = ((e && e.message) || '保存に失敗しました。') +
        ' 入力した内容は消えていません。通信環境を確認して、もう一度「保存する」を押してください。';
      renderStaffEdit(ev, staffData);
    });
  }

  /* ============================================================================
     支出を記録(#/ev/<id>/expenses) — 収支の見込みの支出側の編集ビュー
     追加 = addEventExpense / 削除 = removeEventExpense(確認つき)。自動リトライなし。
     ============================================================================ */
  var expEd = { evId: '', ready: false, busy: false, err: '', notice: '', confirmId: '', label: '', amount: '', memo: '' };
  function expEdKeep() {
    var g = function (id) { var n = document.getElementById(id); return n && n.value != null ? String(n.value) : null; };
    var l = g('ex-label'); if (l !== null) expEd.label = l;
    var a = g('ex-amount'); if (a !== null) expEd.amount = a;
    var m = g('ex-memo'); if (m !== null) expEd.memo = m;
  }
  function renderExpEdit(ev, expData) {
    document.body.classList.remove('has-tabbtn');
    var base = '#/ev/' + encodeURIComponent(ev.id);
    var head = mastheadHtml(editChrome());
    if (!DEMO && M.me && M.me.rank < 2) {
      root.innerHTML = head + editHeadHtml(ev, '支出の記録', esc(evTitle(ev)), base) +
        (rankUnknown_() ? '<p class="stub-line">権限を確認しています…</p>' : '<p class="stub-line">支出の閲覧・記録にはアシスタントマネージャー以上の権限が必要です。</p>') + colophonHtml(esc(evTitle(ev)));
      return;
    }
    if (expEd.evId !== String(ev.id)) {
      expEd = { evId: String(ev.id), ready: false, busy: false, err: '', notice: '', confirmId: '', label: '', amount: '', memo: '' };
    }
    if (expData === null) { // 取得待ち(到着したら loadExtras 側が再render)
      root.innerHTML = head + editHeadHtml(ev, '支出の記録', esc(evTitle(ev)), base) +
        '<div class="state-line">読み込み中…</div>' + colophonHtml(esc(evTitle(ev)));
      return;
    }
    expEd.ready = true;
    var st = expEd;
    var exps = arr(expData);
    var total = 0;
    exps.forEach(function (r) { total += num(r && r.amount); });
    var listHtml;
    if (!exps.length) {
      listHtml = '<div class="tbl-empty">まだ支出の記録はありません。下の欄に名目と金額を入れて追加すると、概要の「収支の見込み」に反映されます。</div>';
    } else {
      listHtml = '<div class="expl">' + exps.map(function (r) {
        var id = String(r.id || '');
        var op = (st.confirmId === id)
          ? '<span class="xconfirm"><span class="nb">この記録を削除しますか?</span><button type="button" class="yes nb" data-xdelyes="' + esc(id) + '">' + (st.busy ? '削除中…' : '削除する') + '</button><button type="button" class="no" data-xdelno="' + esc(id) + '">やめる</button></span>'
          : '<button type="button" class="xdel nb" data-xdel="' + esc(id) + '">削除</button>';
        return '<div class="xr"><div class="xl"><b>' + esc(r.label || '(名目なし)') + '</b>' +
          (r.note ? '<span class="xn">' + esc(r.note) + '</span>' : '') + '</div>' +
          '<span class="xa">−' + money(r.amount) + '円</span>' + op + '</div>';
      }).join('') +
        '<div class="xr total"><span>支出合計(' + exps.length + '件)</span><span class="xa">−' + money(total) + '円</span></div></div>';
    }
    root.innerHTML = head +
      editHeadHtml(ev, '支出の記録', esc(evTitle(ev)), base) +
      listHtml +
      '<div class="xadd">' +
      '<input id="ex-label" value="' + esc(st.label) + '" placeholder="名目(例: 食材・備品)" aria-label="名目">' +
      '<input id="ex-amount" value="' + esc(st.amount) + '" inputmode="numeric" placeholder="金額(円)" aria-label="金額">' +
      '<input id="ex-memo" value="' + esc(st.memo) + '" placeholder="メモ(任意)" aria-label="メモ">' +
      '<button type="button" class="btn nb" id="ex-add"' + (st.busy ? ' disabled' : '') + '>' + (st.busy ? '記録中…' : '追加する') + '</button>' +
      '</div>' +
      (st.err ? '<p class="edit-err">' + esc(st.err) + '</p>' : '') +
      (st.notice ? '<p class="opnote" role="status">' + esc(st.notice) + '</p>' : '') +
      '<p class="moneynote">参加費の収入とあわせた見込みは、概要の「収支の見込み」に載ります。</p>' +
      colophonHtml(esc(evTitle(ev)) + ' ・ 支出の記録');
    bindExpEdit(ev, expData);
  }
  function expRefetch(ev) {
    // 書込成功後: 該当キャッシュを無効化して再取得
    var x = EX[ev.id] || (EX[ev.id] = { staff: null, expenses: null, staffErr: false, expErr: false, fetched: false, loading: false });
    return API.fetchData('listEventExpenses', { eventId: ev.id }).then(
      function (d) { x.expenses = unwrapList(d, 'items'); x.expErr = false; },
      function () { x.expenses = null; x.fetched = false; } // 取れなければ次の表示で再取得
    ).then(function () { cacheSave(); return x.expenses; });
  }
  function bindExpEdit(ev, expData) {
    var st = expEd;
    Array.prototype.forEach.call(root.querySelectorAll('[data-xdel]'), function (b) {
      b.addEventListener('click', function () {
        expEdKeep();
        st.confirmId = b.getAttribute('data-xdel');

    Array.prototype.forEach.call(root.querySelectorAll('[data-xdelno]'), function (b) {

      b.addEventListener('click', function () {

          if (e && e._auth) return;

        return expRefetch(ev);

        st.busy = false; st.label = ''; st.amount = ''; st.memo = '';
        st.notice = '記録しました。';
        renderExpEdit(ev, list === null ? [] : list);
      }).catch(function (e) {
        st.busy = false;
        if (e && e._auth) return;
        st.err = ((e && e.message) || '記録に失敗しました。') + ' 入力した内容は残っています。もう一度「追加する」を押してください。';
        renderExpEdit(ev, expData);

  /* ============================================================================
     準備タブ(#/ev/<id>/prep)+運営ブリーフ(#/ev/<id>/brief)+編集ビュー

       読取 listActivities{eventId} / 追加 admin.activity.create / 変更 admin.activity.update

     - 班分け = event_groups。listEventGroups / saveEventGroups(イベント単位の全置換・アシマネ+)。
       自動編成はフロント実装(BE設計どおり)。participantIds はIDのみ・永続キャッシュしない。
     - ブリーフ = 既存データ(基本+進行+持ち物+担当+会場ライブラリの雨天時)から合成。
       確認 = ackEventBrief{eventId}(本人の割当行 ackAt を更新。なりすまし不可=session固定)。
     ============================================================================ */
  // 進行表の行編集(1行ずつ確定=部分保存の事故を作らない)。key: ''=閉 / 'new'=追加 / activityId=編集
  var ttEd = { evId: '', key: '', start: '', end: '', title: '', owner: '', sessionId: '', busy: false, err: '', notice: '', confirmDel: false };
  var belEd = { evId: '', inited: false, scope: '', items: [], busy: false, err: '', notice: '' };
  var gEd = { evId: '', inited: false, scope: '', groups: [], mixN: '', busy: false, err: '', notice: '', confirm: false };
  var briefSt = { busy: false, err: '', notice: '' };
  function resetPrepState(evId) {
    if (ttEd.evId !== String(evId)) {
      ttEd = { evId: String(evId), key: '', start: '', end: '', title: '', owner: '', sessionId: '', busy: false, err: '', notice: '', confirmDel: false };
      briefSt = { busy: false, err: '', notice: '' };
    }
  }
  function actsOf(evId) { var a = AC[evId]; return a && Array.isArray(a.acts) ? a.acts : null; }
  function groupsOf(evId) { var g = GR[evId]; return g && Array.isArray(g.groups) ? g.groups : null; }
  function staffOf(evId) { var x = EX[evId]; return x && Array.isArray(x.staff) ? x.staff : null; }
  function fullSessions(ev) { // EventSessions 全量(belongings含む)。単日=[] / 読み込み中=null
    if (!evIsMulti(ev)) return [];

  function parseItems(s) { return String(s || '').split('\n').map(function (t) { return t.trim(); }).filter(Boolean); }
  function hhmm(s) { var m = /^(\d{1,2}):(\d{2})$/.exec(String(s || '').trim()); return m ? pad2(+m[1]) + ':' + m[2] : ''; }
  /* ---- 持ち物: 表示スコープの解決(Day選択時: 専用→無ければ共通=参加者ガイドと同じフォールバック) ---- */
  function belongingsFor(ev, sel) {

    if (!evIsMulti(ev)) return { items: common, note: '' };
    var lmap = dayLabelMap(ev);
    if (!sel) {

  /* ---- 初参加/リピーター判定マップ(userId -> true/false)。判定不能なら null ---- */
  var DEMO_CAMP_FIRST = { CU1: false, CU2: true, CU3: false, CU4: true, CU5: true };
  function firstMap(ev) {

    if (!M.partsOk || !S.parts) return null;

  /* ---- 班分け対象(アクティブ申込のユニーク参加者)。sel指定時=そのDayの申込者だけ ---- */
  function groupPool(ev, sel, regs) {
    if (regs === undefined) regs = regsOf(ev);
    if (regs === null) return null;
    var seen = {};
    var out = [];
    arr(regs).forEach(function (r) {
      if (!r || r.isTest || r.eventId !== ev.id || !regActive(r)) return;
      if (sel && String(r.sessionId || '') !== String(sel)) return;
      var uid = String(r.userId || '').trim();
      if (!uid || seen[uid]) return;

  function poolNameMap(ev, regs) {
    var m = {};

    });

  /* ---- 自動で混ぜる: 初参加→リピーター→不明の順に並べ、蛇行(serpentine)で n 班へ。
          班サイズ差は最大1・初参加も各班に均等に散る。 ---- */
  function autoMixGroups(pool, fm, n) {
    var firsts = [], reps = [];
    pool.forEach(function (p) {
      if (fm && fm[p.id] === true) firsts.push(p); else reps.push(p);
    });
    var byName = function (a, b) { return String(a.name).localeCompare(String(b.name), 'ja') || String(a.id).localeCompare(String(b.id)); };
    firsts.sort(byName); reps.sort(byName);
    var ordered = firsts.concat(reps);
    var out = [];
    for (var i = 0; i < n; i++) out.push([]);
    ordered.forEach(function (p, i) {
      var pos = i % n;
      var gi = (Math.floor(i / n) % 2 === 0) ? pos : n - 1 - pos; // 蛇行
      out[gi].push(p.id);

    return out;
  }
  // 「初参加が固まっている班」検知: 初参加3名以上 かつ 班の6割以上
  function clusterWarn(firstCnt, size) { return firstCnt >= 3 && size > 0 && firstCnt / size >= 0.6; }
  /* ---- ブリーフ確認の集計(event_staff の ackAt。名単位=同じ人の複数行は1名に束ねる) ---- */
  function briefAckInfo(evId) {
    var entries = staffOf(evId);
    if (entries === null) return null;
    var by = {}; // memberId -> {name, acked}
    var order = [];
    arr(entries).forEach(function (e) {
      var mid0 = String((e && e.memberId) || '').trim();
      if (!mid0) return; // 空き枠は数えない
      if (!by[mid0]) { by[mid0] = { name: '', acked: false }; order.push(mid0); }
      if (e.ackAt) by[mid0].acked = true;
      if (!by[mid0].name) {
        var m = memberMap()[mid0];
        by[mid0].name = (m && memberName(m)) || String(e.memberName || '') || mid0;
      }
    });
    var total = order.length;
    var acked = 0;
    var pending = [];
    order.forEach(function (id) { if (by[id].acked) acked++; else pending.push(by[id].name); });
    var mine;
    if (DEMO) mine = { assigned: true, acked: false }; // デモ=「確認しました」の動きを見せる(記録はしない)
    else {
      var mid = String(API.mid() || '').trim();
      mine = mid && by[mid] ? { assigned: true, acked: by[mid].acked } : { assigned: false, acked: false };
    }
    return { total: total, acked: acked, pending: pending, mine: mine };
  }

  /* ---------- タイムテーブル(進行表) ---------- */
  function ttSorted(ev, sel) { // 表示行(Day絞り+ソート)。読み込み中=null

    });
    list.sort(function (a, b) {
      var la = lmap[String(a.sessionId || '')], lb = lmap[String(b.sessionId || '')];
      var da = la ? la.n : 999, db = lb ? lb.n : 999; // Day1→最終日→全日共通(毎日の定例)は末尾
      if (da !== db) return da - db;
      var t = String(a.startTime || '').localeCompare(String(b.startTime || ''));
      if (t !== 0) return t;
      return num(a.order) - num(b.order);
    });

  /* ---------- 運営ブリーフ(合成) ---------- */

      items.push({ dt: '日程', ddHtml: '<b><span class="nb">' + esc(dateJa(d)) + '</span>' + (ed && evEndDate(ev) !== evDate(ev) ? '〜<span class="nb">' + esc(dateSlash(ed)) + '(' + WD[ed.getDay()] + ')</span>' : '') + '</b> ― 全' + evSess(ev).length + '日' });
    } else if (d) {
      items.push({ dt: '日時', ddHtml: '<b><span class="nb">' + esc(dateJa(d)) + '</span>' + (tr ? ' <span class="nb">' + esc(tr) + '</span>' : '') + '</b>' });
    }
    if (ev.venue) {
      items.push({ dt: '会場', ddHtml: '<b>' + esc(ev.venue) + '</b>' + (ev.address ? ' ― ' + esc(ev.address) : '') });
    }
    var acts = opts.acts;
    if (acts && acts.length) {
      if (evIsMulti(ev)) {
        var lmap = dayLabelMap(ev);
        var byDay = {};
        var dayOrder = [];
        acts.forEach(function (a) {
          var k = String(a.sessionId || '');
          if (!byDay[k]) { byDay[k] = []; dayOrder.push(k); }
          byDay[k].push(a);
        });
        var lines = dayOrder.map(function (k) {
          var lm = lmap[k];
          var seq = byDay[k].slice(0, 5).map(function (a) { return '<span class="nb">' + esc((hhmm(a.startTime) || '') + ' ' + a.title) + '</span>'; }).join(' → ');
          return '<span class="nb">' + esc(lm ? lm.label : '全日') + '</span> ― ' + seq + (byDay[k].length > 5 ? ' → …' : '');
        });
        items.push({ dt: '進行', ddHtml: lines.join('<br>') });
      } else {
        var seq1 = acts.slice(0, 7).map(function (a) { return '<span class="nb">' + esc((hhmm(a.startTime) || '') + ' ' + a.title) + '</span>'; }).join(' → ');
        items.push({ dt: '進行', ddHtml: seq1 + (acts.length > 7 ? ' → …' : '') });
      }
    }
    var bel = opts.bel;
    if (bel && bel.length) {
      items.push({ dt: '持ち物', ddHtml: bel.length + '品目 ― ' + bel.slice(0, 4).map(function (b) { return '<span class="nb">' + esc(b) + '</span>'; }).join('・') + (bel.length > 4 ? ' ほか' : '') });
    }
    var staff = opts.staff;
    if (staff && staff.length) {
      var mm = memberMap();
      var byRole = {};
      var roleOrder = [];
      staff.forEach(function (e) {
        var id = String((e && e.memberId) || '').trim();
        var role = String((e && e.role) || '担当');
        if (!byRole[role]) { byRole[role] = []; roleOrder.push(role); }
        if (id) {
          var m = mm[id];
          var nm = (m && memberName(m)) || String(e.memberName || '') || id;
          if (byRole[role].indexOf(nm) < 0) byRole[role].push(nm);
        }
      });
      var parts = roleOrder.map(function (role) {
        return '<span class="nb">' + esc(role) + '=' + esc(byRole[role].length ? byRole[role].join('・') : '未定') + '</span>';
      });
      items.push({ dt: '担当', ddHtml: parts.join(' ／ ') });
    }
    var rain = opts.rain;
    if (rain) items.push({ dt: '雨天時', ddHtml: '<b>' + esc(rain) + '</b><span style="display:block;font-size:11px;color:var(--ink5)">会場ライブラリの登録内容</span>' });
    return items;
  }
  function rainPlanOf(ev) { // 会場ライブラリからイベント会場の雨天時プランを引く(名前一致)
    if (VN.venues === null) return '';
    var hit = '';
    arr(VN.venues).forEach(function (v) {
      if (!hit && v && v.rainPlan && v.name && ev.venue && String(ev.venue).indexOf(String(v.name)) >= 0) hit = String(v.rainPlan);
    });

  }
  function briefBoxHtml(B) { // ミニ紙面(準備タブのプレビュー/ブリーフ全文の共通描画)
    var h = '<div class="brief"><div class="b-head"><span>運営ブリーフ ― <span class="nb">' + esc(B.title) + '</span></span><small>' + B.smallHtml + '</small></div>';
    h += '<dl class="b-cols">' + B.items.map(function (it) {
      return '<div class="b-item"><dt>' + esc(it.dt) + '</dt><dd>' + it.ddHtml + '</dd></div>';
    }).join('') + '</dl>';
    if (B.footHtml) h += '<div class="b-foot">' + B.footHtml + '</div>';
    h += '</div>';
    return h;
  }
  function ackLineHtml(ack, briefHref) { // 「5名中4名が確認」行
    if (!ack || !ack.total) return '';
    var who = ack.acked >= ack.total
      ? '<span class="st"><span class="nb">全員確認済み</span></span><span class="who">' + ack.total + '名</span>'
      : '<span class="who">' + ack.total + '名中' + ack.acked + '名が確認 ― <b>' + esc(ack.pending.slice(0, 3).join('・')) + (ack.pending.length > 3 ? ' ほか' : '') + 'が未確認</b></span>';
    var ops = briefHref ? '<span class="ops"><a href="' + esc(briefHref) + '">全文を開く</a></span>' : '';
    return who + ops;

  /* ---------- 準備の残り(実データから検知できるタスクだけ) ---------- */
  function prepTasks(ev, P) {
    var tasks = [];   // {state:'warn'|'todo'|'done', html, href}
    var staff = P.staff;
    var base = '#/ev/' + encodeURIComponent(ev.id);
    if (staff !== null) {
      var empties = arr(staff).filter(function (e) { return !String((e && e.memberId) || '').trim(); });
      if (!arr(staff).length) {
        tasks.push({ state: 'todo', html: '担当がまだ割り当てられていません<span class="sub2"><a href="' + base + '/staff">割当を編集</a></span>' });
      } else if (empties.length) {
        var roles = empties.map(function (e) { return String((e && e.role) || '担当'); });
        tasks.push({ state: 'warn', html: '<span class="nb">' + esc(roles.slice(0, 2).join('・')) + 'の担当が未定</span><span class="sub2">' + empties.length + '枠 ― <a href="' + base + '/staff">割当を編集</a></span>' });
      } else {
        tasks.push({ state: 'done', html: '担当 ' + arr(staff).length + '枠 割当済み' });
      }
    }
    if (P.acts !== null) {
      if (!arr(P.acts).length) tasks.push({ state: 'todo', html: '進行表が未入力<span class="sub2">タイムテーブルの「＋ 行をたす」から</span>' });
      else tasks.push({ state: 'done', html: '進行表 ' + arr(P.acts).length + '行' });
    }
    if (P.groupsAll !== null) {
      var gn = arr(P.groupsAll).length;
      if (!gn) {
        if (P.hasRegs) tasks.push({ state: 'todo', html: '班分けが未作成<span class="sub2"><a href="' + base + '/groups">班を編集</a>の「自動で混ぜる」から</span>' });
      } else if (P.anyWarn) {
        tasks.push({ state: 'warn', html: '初参加がかたまっている班があります<span class="sub2"><a href="' + base + '/groups">班を編集</a>で入れ替え</span>' });
      } else {
        tasks.push({ state: 'done', html: '班分け ' + gn + '班' });
      }
    }
    if (P.belItems !== null) {
      if (!P.belItems.length) tasks.push({ state: 'todo', html: '持ち物が未入力<span class="sub2"><a href="' + base + '/belongings">品目を編集</a>から</span>' });
      else tasks.push({ state: 'done', html: '持ち物 ' + P.belItems.length + '品目' });
    }
    if (P.ack && P.ack.total > 0) {
      if (P.ack.acked < P.ack.total) tasks.push({ state: 'todo', html: 'ブリーフ未確認 <span class="nb">' + (P.ack.total - P.ack.acked) + '名</span><span class="sub2"><a href="' + base + '/brief">ブリーフを開く</a></span>' });
      else tasks.push({ state: 'done', html: 'ブリーフ 全員確認済み' });
    }
    var order = { warn: 0, todo: 1, done: 2 };
    tasks.sort(function (a, b) { return order[a.state] - order[b.state]; });
    return tasks;
  }
  function prepAsideHtml(A) {
    var h = '<aside class="side glass">';
    h += '<div class="grp"><h2>準備の残り</h2>';
    if (A.tasks === null) h += '<div class="side-empty">読み込み中…</div>';
    else if (!A.tasks.length) h += '<div class="side-empty">検知できる準備タスクはまだありません。</div>';
    else {
      h += '<ul class="chk">' + A.tasks.map(function (t) {
        var mi = t.state === 'done' ? 'check_circle' : (t.state === 'warn' ? 'error' : 'schedule');
        return '<li' + (t.state !== 'done' ? ' class="' + t.state + '"' : '') + '><span class="mi">' + mi + '</span><span>' + t.html + '</span>' + (t.time ? '<time>' + esc(t.time) + '</time>' : '') + '</li>';
      }).join('') + '</ul>';
    }
    h += '</div>';
    h += '<div class="grp"><h2>持ち物リスト' + (A.belEditHref ? '<a class="act" href="' + esc(A.belEditHref) + '">品目を編集</a>' : '') + '</h2>';
    if (A.belItems === null) h += '<div class="side-empty">読み込み中…</div>';
    else if (!A.belItems.length) {
      h += '<div class="side-empty">持ち物はまだ登録されていません。' + (A.belEditHref ? '「品目を編集」から追加できます。' : '') + '</div>';
    } else {
      var show = A.belItems.slice(0, 8);
      h += '<ul class="items">' + show.map(function (it, i) {
        var w = (i === show.length - 1 && A.belItems.length > show.length) ? '<span class="w">ほか' + (A.belItems.length - show.length) + '品目</span>' : '';
        return '<li><span class="mi">check_circle</span><span class="nb">' + esc(it) + '</span>' + w + '</li>';
      }).join('') + '</ul>';
    }
    var dn = [];
    if (A.belNote) dn.push(A.belNote);
    dn.push('参加者ガイド(イベント詳細)にそのまま表示されます。');
    h += '<p class="dist-state"><span class="sub2">' + dn.join(' ') + '</span></p>';
    h += '</div>';
    if (A.stickies && A.stickies.length) {
      h += '<div class="grp" style="margin-bottom:4px"><h2>担当メモ</h2>' + A.stickies.join('') + '</div>';
    }
    h += '</aside>';
    return h;
  }

  /* ---------- 準備タブ: モデル+描画 ---------- */
  function buildPrepModel(M, ev, regs) {
    if (regs === undefined) regs = regsOf(ev);
    var vm = buildHubModel(M, ev, 'prep');
    vm.ev = ev;
    var base = vm.tabs.base;
    var sel = evIsMulti(ev) ? daySel(ev) : '';
    var fm = firstMap(ev);
    var acts = actsOf(ev.id);
    var groupsAll = groupsOf(ev.id);
    var staff = canStaff() ? staffOf(ev.id) : null;
    var bel = belongingsFor(ev, sel);
    var belCommon = belongingsFor(ev, ''); // タスク判定はイベント全体(共通)で
    var ack = briefAckInfo(ev.id);
    var g = groupsView(ev, sel, fm, regs);
    var a = vm.agg;
    vm.prep = {
      canEdit: canStaff(),
      canDel: DEMO ? true : !!(M.me && M.me.rank >= 3), // 進行表の行削除はマネージャー+(admin.activity.delete)
      multi: evIsMulti(ev), sel: sel, sess: evSess(ev),
      ttRows: ttViewRows(ev, sel),
      ttSecnote: 'console の「当日進行」と同じ内容です。参加者ガイドの時程は console のタイムテーブル画面から。',
      g: g,
      gSecnote: '',
      gHint: '「班を編集」から自動で混ぜる・手で入れ替えるができます。',
      editHref: canStaff() ? base + '/groups' : '',
      belEditHref: canStaff() ? base + '/belongings' : '',
      belItems: bel.items, belNote: bel.note,
      ack: ack,
      brief: {
        title: evTitle(ev),
        smallHtml: '<span class="nb">いまのデータから作成</span>',
        items: briefItems(ev, { acts: acts === null ? [] : ttSorted(ev, ''), bel: belCommon.items || [], staff: arr(staff), rain: rainPlanOf(ev) }),
        footHtml: ackLineHtml(ack, base + '/brief'),
      },
      briefHref: base + '/brief',
      tasks: null,
      stickies: null,
    };
    var tasks = prepTasks(ev, {
      staff: staff, acts: acts, groupsAll: groupsAll,
      anyWarn: (function () { // 固まり検知はイベント全体(全スコープの班)で
        if (!fm || groupsAll === null) return false;
        var w = false;
        arr(groupsAll).forEach(function (gg) {
          var ids = arr(gg && gg.participantIds);
          var fc = 0;
          ids.forEach(function (id) { if (fm[String(id).trim()] === true) fc++; });
          if (clusterWarn(fc, ids.length)) w = true;
        });
        return w;
      })(),
      hasRegs: !!(a && a.applied > 0),
      belItems: belCommon.items, ack: ack,
    });
    vm.prep.tasks = tasks;
    // 数字バンド = 準備の現在地(読めた要素だけ・偽データ禁止)
    var nums = [];
    var doneCnt = tasks.filter(function (t) { return t.state === 'done'; }).length;
    if (tasks.length) nums.push({ v: String(doneCnt), unit: '/ ' + tasks.length + '件', labelHtml: '<span class="nb">準備タスク 完了</span>' });
    if (g !== null) nums.push({ v: String(g.count), unit: '班', labelHtml: '班分け' });
    if (bel.items !== null) nums.push({ v: String(bel.items.length), unit: '品目', labelHtml: '持ち物' });
    if (ack && ack.total > 0) nums.push({ v: String(ack.acked), unit: '/ ' + ack.total + '名', labelHtml: '<span class="nb">ブリーフ確認</span>' });
    var empties = arr(staff).filter(function (e) { return !String((e && e.memberId) || '').trim(); }).length;
    if (staff !== null && empties > 0) nums.push({ v: String(empties), unit: '枠', labelHtml: '<span class="nb">担当 未定</span>', hot: true, href: base + '/staff' });
    vm.nums = nums.length ? nums : null;
    vm.numsNote = nums.length ? null : (canStaff() ? '準備の状況を読み込み中…' : null);
    // 見出し下の一文: 残りタスクの要約(言えるときだけ)
    var remain = tasks.filter(function (t) { return t.state !== 'done'; });
    if (tasks.length) {
      vm.head.standfirst = remain.length
        ? '準備の残りは<span class="nb">あと' + remain.length + '件</span>。「準備の残り」の一覧から順に片づけられます。'
        : '検知できる準備タスクはすべて完了しています。';
    }
    return vm;
  }
  function renderPrep(vm) {
    document.body.classList.toggle('has-tabbtn', !!vm.reception);
    var P = vm.prep;
    var main;
    if (!P.canEdit) {
      main = rankUnknown_()
        ? '<p class="stub-line">権限を確認しています…</p>'

      '<p class="secnote">基本情報・進行・持ち物・担当からまとめた1枚。印刷は全文ページから。</p>' +

  }

  /* ---------- 運営ブリーフ全文(#/ev/<id>/brief)。@media print で紙面だけ印刷 ---------- */
  function briefAckDo(ev) {
    if (briefSt.busy) return;
    if (DEMO) {
      briefSt.notice = 'デモ表示のため記録は行われません。実データでは、あなたの割当に確認時刻が記録されます。';
      render();
      return;
    }
    briefSt.busy = true; briefSt.err = ''; briefSt.notice = '';
    render();
    API.postData('ackEventBrief', { eventId: ev.id }).then(function (res) {
      briefSt.busy = false;
      briefSt.notice = '確認を記録しました。';
      var x = EX[ev.id];
      var mid0 = String(API.mid() || '').trim();
      if (x && Array.isArray(x.staff)) {
        x.staff.forEach(function (e) {
          if (e && String(e.memberId || '').trim() === mid0) e.ackAt = (res && res.ackAt) || new Date().toISOString();
        });
      }
      cacheSave();
      render();
    }).catch(function (e) {
      briefSt.busy = false;
      if (e && e._auth) return;
      briefSt.err = ((e && e.message) || '記録に失敗しました。') + ' もう一度お試しください。';
      render();
    });
  }
  function renderBrief(ev) {
    document.body.classList.remove('has-tabbtn');
    var base = '#/ev/' + encodeURIComponent(ev.id);
    var head = mastheadHtml(editChrome());

      root.innerHTML = head + editHeadHtml(ev, '運営ブリーフ', esc(evTitle(ev)), base + '/prep') +
        (rankUnknown_() ? '<p class="stub-line">権限を確認しています…</p>' : '<p class="stub-line">運営ブリーフの閲覧にはアシスタントマネージャー以上の権限が必要です。</p>') + colophonHtml(esc(evTitle(ev)));
      return;
    }
    var staff = staffOf(ev.id);
    var acts = actsOf(ev.id);
    var ack = briefAckInfo(ev.id);
    var bel = belongingsFor(ev, '');
    var items = briefItems(ev, {
      acts: acts === null ? [] : ttSorted(ev, ''),
      bel: bel.items || [],
      staff: arr(staff),
      rain: rainPlanOf(ev),
    });
    var loading = (acts === null || staff === null);
    var ackArea = '';
    if (staff === null) {
      ackArea = '<div class="state-line">担当の確認状況を読み込み中…</div>';
    } else {
      var line = ack && ack.total ? '<span class="who">' + ack.total + '名中' + ack.acked + '名が確認' +
        (ack.pending.length ? ' ― <b>' + esc(ack.pending.slice(0, 3).join('・')) + (ack.pending.length > 3 ? ' ほか' : '') + 'が未確認</b>' : '') + '</span>' : '';
      var mineHtml = '';
      if (ack && ack.mine.assigned) {
        mineHtml = ack.mine.acked
          ? '<span class="done"><span class="nb">あなたは確認済みです</span></span>'
          : '<button type="button" class="btn nb" id="bf-ack"' + (briefSt.busy ? ' disabled' : '') + '>' + (briefSt.busy ? '記録中…' : '確認しました') + '</button>';
      } else if (arr(staff).length) {
        mineHtml = '<span class="who nb">あなたはこのイベントの担当ではないため、確認の記録は不要です。</span>';
      } else {
        mineHtml = '<span class="who nb">担当が割り当てられると、ここで確認を記録できます。</span>';
      }
      ackArea = '<div class="brief-ack">' + mineHtml + line +
        '<button type="button" class="btn sub nb" id="bf-print">印刷する</button></div>';
    }
    root.innerHTML = head +
      '<a class="back" href="' + esc(base + '/prep') + '"><span class="mi">arrow_back</span>「' + esc(evTitle(ev)) + '」の準備へ戻る</a>' +
      '<div class="pagehead"><h1>運営ブリーフ</h1><span class="count">' + esc(evTitle(ev)) + '</span></div>' +
      (loading ? '<p class="edit-note">進行・担当を読み込み中です。そろい次第この紙面に反映されます。</p>' : '') +
      '<div class="briefpage">' +
      briefBoxHtml({ title: evTitle(ev), smallHtml: '<span class="nb">いまのデータから作成</span> ・ <span class="nb">' + esc(dateJa(NOW)) + '</span>', items: items, footHtml: '' }) +
      ackArea +
      (briefSt.err ? '<p class="edit-err">' + esc(briefSt.err) + '</p>' : '') +
      (briefSt.notice ? '<p class="opnote" role="status">' + esc(briefSt.notice) + '</p>' : '') +
      '</div>' +
      colophonHtml(esc(evTitle(ev)) + ' ・ 運営ブリーフ');
    var ab = document.getElementById('bf-ack');
    if (ab) ab.addEventListener('click', function () { briefAckDo(ev); });

  /* ---------- 持ち物の編集(#/ev/<id>/belongings)。保存先=Events/EventSessions.belongings ---------- */
  function belScopes(ev) {
    var out = [{ id: '', label: evIsMulti(ev) ? '全日共通' : '持ち物' }];
    if (evIsMulti(ev)) {
      evSess(ev).forEach(function (s, i) {
        var d = parseYmd(s.date);
        out.push({ id: String(s.id), label: 'Day' + (i + 1) + (d ? ' ' + dateSlash(d) : '') });
      });
    }
    return out;
  }
  function belRaw(ev, scope) { // 保存済みの生テキスト。null=EventSessions読み込み中
    if (!scope) return String(ev.belongings || '');
    var ss = fullSessions(ev);
    if (ss === null) return null;
    var hit = null;
    ss.forEach(function (s) { if (s && String(s.id) === String(scope)) hit = s; });
    return String((hit && hit.belongings) || '');
  }
  function belEdKeep() {
    belEd.items = belEd.items.map(function (it, i) {
      var n = document.getElementById('bel-i-' + i);
      return n && n.value != null ? String(n.value) : it;
    });

  function belEdInit(ev, scope) {

  function belSave(ev) {

      belEd.items = clean.length ? clean : [''];

      renderBelongingsEdit(ev);
      return;
    }
    belEd.busy = true; belEd.err = ''; belEd.notice = '';
    renderBelongingsEdit(ev);
    var p = belEd.scope
      ? API.postData('updateEventSession', { sessionId: belEd.scope, fields: { eventId: ev.id, belongings: payload } })
      : API.postData('updateEvent', { eventId: ev.id, fields: { belongings: payload } });
    p.then(function () {
      belEd.busy = false;
      belEd.items = clean.length ? clean : [''];
      belEd.notice = '保存しました。参加者ガイド(イベント詳細)に反映されます。';
      if (belEd.scope) {
        var ss = fullSessions(ev);
        arr(ss).forEach(function (s) { if (s && String(s.id) === String(belEd.scope)) s.belongings = payload; });
      } else {
        ev.belongings = payload;

      renderBelongingsEdit(ev);

  /* ---------- 班分けの編集(#/ev/<id>/groups)。保存=saveEventGroups(全置換・確認つき) ---------- */

      });

        '<span class="secnote" style="margin:0">Day別と全日共通は別の班として保存されます。</span></div>';

    var cta;

      cta = '<div class="edit-cta"><span class="xconfirm"><span class="nb">この内容で班分けをまるごと置き換えます。よろしいですか?</span>' +
        '<button type="button" class="yes nb" data-gsaveyes="1"' + (st.busy ? ' disabled' : '') + '>' + (st.busy ? '保存中…' : '置き換えて保存') + '</button>' +

      '<div class="ged">' + (scopeIdx.length ? groupsHtml : '<div class="tbl-empty">' + (st.scope ? 'このDayの班はまだありません。' : '班はまだありません。') + '「自動で混ぜる」か「班をたす」から作成できます。</div>') + '</div>' +

  function gMoveMember(ev, pid, from, domId) {
    var st = gEd;
    if (st.busy) return;
    var el = document.getElementById(domId);
    var v = String((el && el.value) || '');
    if (!v) return;
    gEdKeep();
    if (from >= 0 && gEd.groups[from]) {
      gEd.groups[from].participantIds = gEd.groups[from].participantIds.filter(function (x) { return x !== pid; });
    }
    if (v.indexOf('g:') === 0) {
      var gi = Number(v.slice(2));
      if (gEd.groups[gi] && gEd.groups[gi].participantIds.indexOf(pid) < 0) gEd.groups[gi].participantIds.push(pid);
    }
    st.err = ''; st.notice = ''; st.confirm = false;
    renderGroupsEdit(ev);
  }
  function bindGroupsEdit(ev, moveSelects) {
    var st = gEd;
    var sc = document.getElementById('g-scope');
    if (sc) sc.addEventListener('change', function () {
      gEdKeep();
      st.scope = String(sc.value || '');
      st.err = ''; st.notice = ''; st.confirm = false;
      renderGroupsEdit(ev);
    });
    arr(moveSelects).forEach(function (d) {
      var el = document.getElementById(d.domId);
      if (el) el.addEventListener('change', function () { gMoveMember(ev, d.pid, d.from, d.domId); });
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-gdel]'), function (b) {
      b.addEventListener('click', function () {
        if (st.busy) return;
        gEdKeep();
        gEd.groups.splice(Number(b.getAttribute('data-gdel')), 1);
        st.err = ''; st.notice = ''; st.confirm = false;
        renderGroupsEdit(ev);
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-gadd]'), function (b) {
      b.addEventListener('click', function () {
        if (st.busy) return;
        gEdKeep();
        gEd.groups.push({ id: '', sessionId: String(st.scope || ''), name: (gScopeIdx().length + 1) + '班', participantIds: [], note: '' });
        st.err = ''; st.notice = ''; st.confirm = false;
        renderGroupsEdit(ev);
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-gmix]'), function (b) {
      b.addEventListener('click', function () {
        if (st.busy) return;
        gEdKeep();
        var regs = DEMO ? (ev.id === DEMO_ID2 ? DEMO_CAMP_REGS : DEMO_PIC_REGS) : regsOf(ev);
        var pool = groupPool(ev, st.scope, regs) || [];
        if (!pool.length) { st.err = st.scope ? 'このDayの申込者がまだいないため、自動では分けられません。' : '申込者がまだいないため、自動では分けられません。'; st.notice = ''; renderGroupsEdit(ev); return; }
        var n = Math.round(Number(String(st.mixN).trim()));
        if (!isFinite(n) || n <= 0) n = gScopeIdx().length || Math.max(1, Math.ceil(pool.length / 6));
        n = Math.max(1, Math.min(pool.length, n));
        var sets = autoMixGroups(pool, firstMap(ev), n);
        gEd.groups = gEd.groups.filter(function (g) { return String(g.sessionId || '') !== String(st.scope || ''); })
          .concat(sets.map(function (ids, i) { return { id: '', sessionId: String(st.scope || ''), name: (i + 1) + '班', participantIds: ids, note: '' }; }));
        st.err = ''; st.confirm = false;
        st.notice = pool.length + '名を' + n + '班に分けました。「保存する」までは反映されません。';
        renderGroupsEdit(ev);
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-gsave]'), function (b) {
      b.addEventListener('click', function () {
        if (st.busy) return;
        gEdKeep();
        var bad = -1;
        gEd.groups.forEach(function (g, gi) { if (bad < 0 && !String(g.name || '').trim()) bad = gi; });
        if (bad >= 0) { st.err = '班名が空の班があります。名前を入れてください。'; st.notice = ''; renderGroupsEdit(ev); return; }
        st.confirm = true; st.err = ''; st.notice = '';

      b.addEventListener('click', function () { gSave(ev); });

  function gSave(ev) {
    var st = gEd;
    if (st.busy) return;
    gEdKeep();
    if (DEMO) {
      st.confirm = false;
      st.notice = 'デモ表示のため保存は行われません。実データでは、この内容で班分けをまるごと置き換えます。';
      renderGroupsEdit(ev);
      return;
    }
    st.busy = true; st.err = ''; st.notice = '';
    renderGroupsEdit(ev);
    var payload = {
      eventId: ev.id,
      groups: gEd.groups.map(function (g) {
        var o = { sessionId: String(g.sessionId || ''), name: String(g.name || '').trim(), participantIds: g.participantIds.slice(), note: String(g.note || '') };
        if (g.id) o.id = g.id;
        return o;
      }),
    };
    API.postData('saveEventGroups', payload).then(function () {
      var gr = GR[ev.id] || (GR[ev.id] = { groups: null, err: false, fetched: false, loading: false });
      return API.fetchData('listEventGroups', { eventId: ev.id }).then(
        function (d) { gr.groups = unwrapList(d, 'groups'); gr.err = false; },
        function () { gr.groups = payload.groups; } // 再取得失敗でも送信済みの内容で表示
      ).then(function () { gr.fetched = true; });
    }).then(function () {
      gEd = { evId: '', inited: false, scope: '', groups: [], mixN: '', busy: false, err: '', notice: '', confirm: false };
      location.hash = '#/ev/' + encodeURIComponent(ev.id) + '/prep'; // 成功で準備タブへ戻る
      render();
    }).catch(function (e) {
      st.busy = false;
      st.confirm = false;
      if (e && e._auth) return;
      st.err = ((e && e.message) || '保存に失敗しました。') + ' 置き換えは行われていません。もう一度お試しください。';
      renderGroupsEdit(ev);
    });
  }

  /* ============================================================================
     永続キャッシュ(SWR)。listRegistrations 由来の個人名は保存しない:
     保存対象=イベント行(ホワイトリスト)+イベント別集計(件数・日次カウント)+自分の情報。
     ============================================================================ */
  var CACHE_KEY = 'admin2.event.v2'; // v2: staffBy/expBy/members を追加(担当・支出のSWR)
  var CACHE_TTL = 24 * 60 * 60 * 1000;
  var EV_KEEP = ['id', 'title', 'date', 'time', 'endTime', 'endDate', 'venue', 'address', 'capacity', 'status', 'category',
    'fee', 'feeType', 'childFee', 'allowCompanions', 'paymentMethod', 'paymentMethods', 'summary', 'heroImageUrl', 'posterUrl',
    'format', 'sessions', 'publishAt', 'regOpenDate', 'regCloseDate', 'mementoPhotoUrl', 'mementoPublishAt', 'belongings'];
  // mementoGallery は永続キャッシュに入れない(枚数が多いとlocalStorageを圧迫。fresh listEventsで数秒後に揃う=SWR)
  // 担当/支出/メンバー名簿もホワイトリスト保存(スタッフ=console同等のPII方針。参加者PIIは引き続き保存しない)
  var STAFF_KEEP = ['id', 'sessionId', 'memberId', 'role', 'slot', 'note', 'ackAt'];
  var EXP_KEEP = ['id', 'label', 'amount', 'note', 'createdAt'];
  var MEM_KEEP = ['id', 'name', 'nickname', 'photoUrl', 'avatarUrl', 'status'];
  function pickKeys(list, keys) {
    return arr(list).map(function (o) {
      var r = {};
      keys.forEach(function (k) { if (o && o[k] !== undefined && o[k] !== '' && o[k] !== null) r[k] = o[k]; });
      return r;
    });
  }
  function sanitizeEvents(events) { return pickKeys(events, EV_KEEP); }
  function cacheSave() {
    try {
      var staffBy = {}, expBy = {};
      Object.keys(EX).forEach(function (id) {
        if (EX[id] && Array.isArray(EX[id].staff)) staffBy[id] = pickKeys(EX[id].staff, STAFF_KEEP);
        if (EX[id] && Array.isArray(EX[id].expenses)) expBy[id] = pickKeys(EX[id].expenses, EXP_KEEP);
      });
      // キャンセル待ちは件数のみ保存(参加者名などのPIIは永続キャッシュに入れない)
      var wlBy = {};
      Object.keys(WL).forEach(function (id) {
        var n = wlWaiting(id);
        if (n > 0) wlBy[id] = n;
      });
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        mid: API.mid(), t: Date.now(),
        vm: {
          events: sanitizeEvents(M.events), aggs: M.aggs, me: M.me, regsOk: M.regsOk, partsOk: M.partsOk,
          members: M.members === null ? null : pickKeys(M.members, MEM_KEEP),
          staffBy: staffBy, expBy: expBy, wlBy: wlBy,
        },
      }));
    } catch (e) {}
  }
  function cacheLoad() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.vm || o.mid !== API.mid() || !o.t || Date.now() - o.t > CACHE_TTL) {
        localStorage.removeItem(CACHE_KEY);
        return null;
      }
      return o.vm;
    } catch (e) { return null; }
  }
  function cacheClear() { try { localStorage.removeItem(CACHE_KEY); localStorage.removeItem('admin2.event.v1'); } catch (e) {} }

  /* ============================================================================
     読込+ルーティング
     M = 描画用モデル(イベント+集計。キャッシュ可) / S = 生データ(PII含む。メモリのみ)
     一覧⇔ハブはメモリ共有=同一ページ内遷移で再fetchしない。
     ============================================================================ */
  var M = { events: null, aggs: null, me: null, regsOk: true, partsOk: false, members: null, membersFetched: false };
  var S = { regs: null, parts: null };
  var EX = {}; // eventId -> { staff, expenses, staffErr, expErr, fetched, loading }(担当/支出はイベント単位で遅延読取)
  var WL = {}; // eventId -> { items(PII=メモリのみ), err, fetched, loading, cachedWaiting(件数のみキャッシュ可) }
  var ER = {}; // eventId -> { rows(PII=メモリのみ・永続キャッシュ禁止), err, fetched, loading }(listEventRegistrations の先行読取)
  /* ---- 準備タブの遅延読取(メモリのみ・永続キャッシュしない) ---- */
  var AC = {}; // eventId -> { acts, err, fetched, loading }(進行表=EventActivities: listActivities)
  var GR = {}; // eventId -> { groups, err, fetched, loading }(班分け=event_groups: listEventGroups)
  var SF = {}; // eventId -> { sessions, err, fetched, loading }(EventSessions全量=Day別持ち物: listEventSessions)
  var VN = { venues: null, err: false, fetched: false, loading: false }; // 会場ライブラリ(ブリーフの雨天時)
  var CM = {}; // eventId -> { items, err, fetched, loading }(配信タイムライン=event_comms: listEventComms)
  var SV = {}; // eventId -> { surveys, resps, err, fetched, loading }(満足度=listSurveys+listSurveyResponses。PII=メモリのみ)
  var erUnsupported = false; // バックエンド未実装(unknown action)を検知したらセッション中は再試行しない
  var loadedOnce = false, loading = false, unauthShown = false;
  var membersLoading = null;

  function ensureMembers() {
    if (DEMO) return Promise.resolve();
    if (M.membersFetched) return Promise.resolve();
    if (membersLoading) return membersLoading;
    membersLoading = API.fetchData('listMembers', {}).then(function (d) {
      M.members = arr(d);
      M.membersFetched = true;
      membersLoading = null;
    }, function () {
      membersLoading = null;
      if (M.members === null) M.members = []; // 顔・名前が引けないだけ(IDで表示)。画面は壊さない
    });
    return membersLoading;
  }
  // 担当/支出の遅延読取(ハブ・編集ビューを開いたイベントだけ)。SWR: キャッシュ表示→裏で更新。
  function loadExtras(evId) {
    if (DEMO) return;
    if (!M.me || M.me.rank < 2) return; // アシマネ+のみ(それ未満はセクションごと非表示)
    var x = EX[evId] || (EX[evId] = { staff: null, expenses: null, staffErr: false, expErr: false, fetched: false, loading: false });
    if (x.loading || x.fetched) return;

      function (d) { x.staff = unwrapList(d, 'entries'); x.staffErr = false; },

    );
    var pE = API.fetchData('listEventExpenses', { eventId: evId }).then(
      function (d) { x.expenses = unwrapList(d, 'items'); x.expErr = false; },
      function () { x.expErr = true; if (x.expenses === null) x.expenses = []; }
    );
    Promise.all([pS, pE, ensureMembers()]).then(function () {
      x.loading = false;
      x.fetched = true;
      cacheSave();
      if (unauthShown) return;
      var r = route();
      if (String(r.id) !== String(evId)) return;
      if (r.view === 'hub' || r.view === 'prep' || r.view === 'brief') { render(); return; }
      // 編集ビューは入力中の再描画を避ける(未初期化=読み込み中表示のときだけ差し替え)
      if (r.view === 'staff' && (!staffEd.inited || staffEd.evId !== String(evId))) { render(); return; }
      if (r.view === 'expenses' && !(expEd.ready && expEd.evId === String(evId))) { render(); return; }
    });
  }

  /* イベント単体の申込先行読取(申込一覧の高速化・二段構え):
     新アクション listEventRegistrations {eventId} があれば使い、
     無ければ(unknown action/失敗)既存 listRegistrations(起動時に全件を裏で先読み中)へ自動フォールバック。
     全件が先に到着したらそちらを正とし、この結果は使わない。行はPII=メモリのみ。 */
  function loadEventRegs(evId) {
    if (DEMO) return;
    if (S.regs) return; // 全件到着済みなら不要
    if (erUnsupported) return; // BE未実装 → 既存listRegistrations の先読みに委ねる
    var er = ER[evId] || (ER[evId] = { rows: null, err: false, fetched: false, loading: false });
    if (er.loading || er.fetched) return;
    er.loading = true;
    API.fetchData('listEventRegistrations', { eventId: evId }).then(function (d) {
      er.rows = arr(d && d.rows ? d.rows : d);
      er.err = false;
    }, function (e) {
      if (/unknown action|invalid action|not supported|未対応|不明なアクション/i.test(String((e && e.message) || ''))) erUnsupported = true;
      er.err = true; // フォールバック: listRegistrations(全件)の到着を待つ
    }).then(function () {
      er.loading = false;
      er.fetched = true;
      if (unauthShown || S.regs || !Array.isArray(er.rows)) return;
      var r = route();
      if (String(r.id) !== String(evId)) return;
      if (r.view === 'regs' || r.view === 'hub' || r.view === 'prep') { render(); return; }
      if (r.view === 'groups' && !(gEd.inited && gEd.evId === String(evId))) render(); // 班編集: 初期化前のみ
    });
  }

  // キャンセル待ちの遅延読取(ハブ/申込・決済タブを開いたイベントだけ・アシマネ+)
  function loadWaitlist(evId) {
    if (DEMO) return;
    if (!M.me || M.me.rank < 2) return; // アシマネ未満はfetchしない(セクションごと非表示)
    var w = WL[evId] || (WL[evId] = { items: null, err: false, fetched: false, loading: false });
    if (w.loading || w.fetched) return;
    w.loading = true;
    API.fetchData('listWaitlist', { eventId: evId }).then(
      function (d) { w.items = arr(d && d.items); w.err = false; },
      function () { w.err = true; if (w.items === null) w.items = []; } // 取得失敗=非表示のまま(壊さない)
    ).then(function () {
      w.loading = false;
      w.fetched = true;
      cacheSave();
      if (unauthShown) return;
      var r = route();
      if (String(r.id) !== String(evId)) return;
      if (r.view === 'hub' || r.view === 'regs') render();
    });
  }

  // 配信タイムラインの遅延読取(ハブ/当日/事後/編集ビューを開いたイベントだけ・アシマネ+)
  function loadComms(evId) {
    if (DEMO) return;
    if (!M.me || M.me.rank < 2) return; // アシマネ未満はfetchしない(セクションごと非表示)
    var c = CM[evId] || (CM[evId] = { items: null, err: false, unsupported: false, fetched: false, loading: false });
    if (c.loading || c.fetched) return;
    c.loading = true;
    API.fetchData('listEventComms', { eventId: evId }).then(
      function (d) { c.items = unwrapList(d, 'items'); c.err = false; c.unsupported = false; },
      function (e) {
        // BE未対応(unknown action)は「エラー」ではなく機能なし=セクションごと非表示(偽装・空騒ぎ禁止)
        if (/unknown action|invalid action|not supported|未対応|不明なアクション/i.test(String((e && e.message) || ''))) c.unsupported = true;
        c.err = true;
        if (c.items === null) c.items = [];
      }
    ).then(function () {
      c.loading = false;
      c.fetched = true;
      if (unauthShown) return;
      var r = route();
      if (String(r.id) !== String(evId)) return;
      if (r.view === 'hub' || r.view === 'day' || r.view === 'after' || r.view === 'comms') render();
    });
  }
  // 書込成功後の再取得(失敗しても書込は成功済み=次回表示で再取得)
  function cmRefetch(evId) {
    var c = CM[evId] || (CM[evId] = { items: null, err: false, fetched: false, loading: false });
    return API.fetchData('listEventComms', { eventId: evId }).then(
      function (d) { c.items = unwrapList(d, 'items'); c.err = false; },
      function () { c.fetched = false; }
    ).then(function () { if (Array.isArray(c.items)) c.fetched = true; });
  }

  // 満足度の遅延読取(事後タブ・アシマネ+)。listSurveys(全件→イベントで絞る)+回答は該当サーベイぶん並行取得
  function loadSurveys(evId) {
    if (DEMO) return;
    if (!M.me || M.me.rank < 2) return; // listSurveyResponses はアシマネ+(BEゲート)
    var s = SV[evId] || (SV[evId] = { surveys: null, resps: null, err: false, fetched: false, loading: false });
    if (s.loading || s.fetched) return;
    s.loading = true;
    API.fetchData('listSurveys', {}).then(function (all) {
      var mine = arr(all).filter(function (x) { return x && x.eventId === evId; });
      s.surveys = mine;
      return Promise.all(mine.map(function (x) {
        return API.fetchData('listSurveyResponses', { surveyId: x.id }).then(function (d) { return arr(d); }, function () { return []; });
      })).then(function (arrs) {
        var flat = [];
        arrs.forEach(function (a) { a.forEach(function (r) { if (r && !r.isTest) flat.push(r); }); });
        s.resps = flat;
        s.err = false;
      });
    }, function () {
      s.err = true;
      if (s.surveys === null) { s.surveys = []; s.resps = []; }
    }).then(function () {
      s.loading = false;
      s.fetched = true;
      if (unauthShown) return;
      var r = route();
      if (String(r.id) === String(evId) && r.view === 'after') render();
    });
  }

  // 当日タブの遅延読取: 班分け(集合状況)+会場ライブラリ(雨天テンプレのrainPlan)。GR/VNはloadPrepと共有
  function loadGroups(evId) {
    if (DEMO) return;
    if (!M.me || M.me.rank < 2) return;
    var jobs = [];
    var gr = GR[evId] || (GR[evId] = { groups: null, err: false, fetched: false, loading: false });
    if (!gr.loading && !gr.fetched) {
      gr.loading = true;
      jobs.push(API.fetchData('listEventGroups', { eventId: evId }).then(
        function (d) { gr.groups = unwrapList(d, 'groups'); gr.err = false; },
        function () { gr.err = true; if (gr.groups === null) gr.groups = []; }
      ).then(function () { gr.loading = false; gr.fetched = true; }));
    }
    if (!VN.loading && !VN.fetched) {
      VN.loading = true;
      jobs.push(API.fetchData('listVenues', {}).then(
        function (d) { VN.venues = arr(d); VN.err = false; },
        function () { VN.err = true; if (VN.venues === null) VN.venues = []; }
      ).then(function () { VN.loading = false; VN.fetched = true; }));
    }
    if (!jobs.length) return;
    Promise.all(jobs).then(function () {
      if (unauthShown) return;
      var r = route();
      if (String(r.id) === String(evId) && r.view === 'day') render();
    });
  }
  // EventSessions全量だけの遅延読取(事後タブ=Day別の記念写真。loadPrepとSF共有)
  function loadSessionsFull(evId) {
    if (DEMO) return;
    if (!M.me || M.me.rank < 2) return;
    var sf = SF[evId] || (SF[evId] = { sessions: null, err: false, fetched: false, loading: false });
    if (sf.loading || sf.fetched) return;
    sf.loading = true;
    API.fetchData('listEventSessions', { eventId: evId }).then(
      function (d) { sf.sessions = arr(d); sf.err = false; },
      function () { sf.err = true; if (sf.sessions === null) sf.sessions = []; }
    ).then(function () {
      sf.loading = false;
      sf.fetched = true;
      if (unauthShown) return;
      var r = route();
      if (String(r.id) === String(evId) && r.view === 'after') render();
    });
  }

  /* 準備タブの遅延読取(アシマネ+のみ・メモリのみ):
     進行表=listActivities / 班分け=listEventGroups / EventSessions全量(Day別持ち物) / 会場ライブラリ。
     編集ビューは入力中の再描画を避ける(未初期化のときだけ差し替え)。 */
  function loadPrep(evId) {
    if (DEMO) return;
    if (!M.me || M.me.rank < 2) return;
    var jobs = [];
    var ac = AC[evId] || (AC[evId] = { acts: null, err: false, fetched: false, loading: false });
    if (!ac.loading && !ac.fetched) {
      ac.loading = true;
      jobs.push(API.fetchData('listActivities', { eventId: evId }).then(
        function (d) { ac.acts = arr(d); ac.err = false; },
        function () { ac.err = true; if (ac.acts === null) ac.acts = []; }
      ).then(function () { ac.loading = false; ac.fetched = true; }));
    }
    var gr = GR[evId] || (GR[evId] = { groups: null, err: false, fetched: false, loading: false });
    if (!gr.loading && !gr.fetched) {
      gr.loading = true;
      jobs.push(API.fetchData('listEventGroups', { eventId: evId }).then(
        function (d) { gr.groups = unwrapList(d, 'groups'); gr.err = false; },
        function () { gr.err = true; if (gr.groups === null) gr.groups = []; }
      ).then(function () { gr.loading = false; gr.fetched = true; }));
    }
    var ev = findEvent(evId);
    if (ev && evIsMulti(ev)) { // Day別の持ち物は EventSessions 全量にしか無い(listEventsのsessionsは軽量形)
      var sf = SF[evId] || (SF[evId] = { sessions: null, err: false, fetched: false, loading: false });
      if (!sf.loading && !sf.fetched) {
        sf.loading = true;
        jobs.push(API.fetchData('listEventSessions', { eventId: evId }).then(
          function (d) { sf.sessions = arr(d); sf.err = false; },
          function () { sf.err = true; if (sf.sessions === null) sf.sessions = []; }
        ).then(function () { sf.loading = false; sf.fetched = true; }));
      }
    }
    if (!VN.loading && !VN.fetched) {
      VN.loading = true;
      jobs.push(API.fetchData('listVenues', {}).then(
        function (d) { VN.venues = arr(d); VN.err = false; },
        function () { VN.err = true; if (VN.venues === null) VN.venues = []; }
      ).then(function () { VN.loading = false; VN.fetched = true; }));
    }
    if (!jobs.length) return;
    Promise.all(jobs).then(function () {
      if (unauthShown) return;
      var r = route();
      if (String(r.id) !== String(evId)) return;
      if (r.view === 'prep' || r.view === 'brief') { render(); return; }
      // 編集ビュー: 初期化前(読み込み中表示)のときだけ差し替え
      if (r.view === 'groups' && !(gEd.inited && gEd.evId === String(evId))) { render(); return; }
      if (r.view === 'belongings' && !(belEd.inited && belEd.evId === String(evId))) { render(); return; }
    });
  }

  function findEvent(id) {
    var hit = null;
    arr(M.events).forEach(function (e) { if (e && String(e.id) === String(id)) hit = e; });
    return hit;
  }
  function route() {
    var h = location.hash || '#/';
    var m = /^#\/ev\/([^\/]+)(?:\/([a-z]+))?/.exec(h);
    if (m) return { view: m[2] || 'hub', id: decodeURIComponent(m[1]) };
    return { view: 'list' };
  }
  function render() {
    var r = route();
    if (DEMO) {
      if (r.view === 'list') { renderList(demoListModel()); return; }
      resetRegsState(r.id);
      resetPrepState(r.id);
      if (r.id === DEMO_ID2) { renderDemoCamp(r); return; } // 複数日デモは実ビルダー経由
      if (r.view === 'regs') { renderRegs(demoRegsModel()); return; }
      if (r.view === 'staff') { renderStaffEdit({ id: DEMO_ID, title: '国際交流ピクニック' }, DEMO_STAFF); return; }
      if (r.view === 'expenses') { renderExpEdit({ id: DEMO_ID, title: '国際交流ピクニック' }, DEMO_EXPENSES); return; }
      if (r.view === 'comms') { seedDemoPic(); renderComms(DEMO_PIC_EV); return; }
      if (r.view === 'prep') { seedDemoPic(); renderPrep(demoPrepModel()); return; }
      if (r.view === 'brief') { seedDemoPic(); renderBrief(DEMO_PIC_EV); return; }
      if (r.view === 'groups') { seedDemoPic(); renderGroupsEdit(DEMO_PIC_EV); return; }
      if (r.view === 'belongings') { seedDemoPic(); renderBelongingsEdit(DEMO_PIC_EV); return; }
      if (r.view === 'day') { seedDemoPic(); renderDay(demoDayModel()); return; }
      if (r.view === 'after') { seedDemoPic(); renderAfter(demoAfterModel()); return; }
      renderHub(demoHubModel('hub'));
      return;
    }
    if (M.events === null) { renderLoading(); return; }
    if (r.view === 'list') { renderList(buildListModel(M)); return; }
    var ev = findEvent(r.id);
    if (!ev) {
      if (!loadedOnce) { renderLoading(); return; } // 深いリンク直開き: 実データ到着待ち
      renderNotFound();
      return;
    }
    resetRegsState(r.id);
    resetPrepState(r.id);
    if (r.view === 'hub' || r.view === 'staff' || r.view === 'expenses' || r.view === 'prep' || r.view === 'brief' || r.view === 'day' || r.view === 'after') loadExtras(ev.id); // 担当/支出の遅延読取
    if (r.view === 'hub' || r.view === 'regs') loadWaitlist(ev.id); // キャンセル待ち(数字バンド+一覧)
    if (r.view === 'hub' || r.view === 'regs' || r.view === 'prep' || r.view === 'groups' || r.view === 'day' || r.view === 'after') loadEventRegs(ev.id); // 全件未着ならイベント単体で先行読取
    if (r.view === 'prep' || r.view === 'brief' || r.view === 'groups' || r.view === 'belongings') loadPrep(ev.id); // 進行表/班分け/Day持ち物/会場
    if (r.view === 'hub' || r.view === 'day' || r.view === 'after' || r.view === 'comms') loadComms(ev.id); // 配信タイムライン
    if (r.view === 'day') loadGroups(ev.id); // 班の集合状況
    if (r.view === 'after') { loadSurveys(ev.id); if (evIsMulti(ev)) loadSessionsFull(ev.id); } // 満足度+Day別写真
    if (r.view === 'comms') { renderComms(ev); return; }
    if (r.view === 'regs') { renderRegs(buildRegsModel(M, ev, regsOf(ev))); return; }
    if (r.view === 'staff') {
      var xs = EX[ev.id];
      renderStaffEdit(ev, xs && xs.staff !== undefined ? xs.staff : null);
      return;
    }
    if (r.view === 'expenses') {
      var xe = EX[ev.id];
      renderExpEdit(ev, xe && xe.expenses !== undefined ? xe.expenses : null);
      return;
    }
    if (r.view === 'prep') { renderPrep(buildPrepModel(M, ev)); return; }
    if (r.view === 'brief') { renderBrief(ev); return; }
    if (r.view === 'groups') { renderGroupsEdit(ev); return; }
    if (r.view === 'belongings') { renderBelongingsEdit(ev); return; }
    if (r.view === 'day') { renderDay(buildDayModel(M, ev)); return; }
    if (r.view === 'after') { renderAfter(buildAfterModel(M, ev)); return; }
    renderHub(buildHubModel(M, ev, 'hub'));
  }

  function meModel() {
    var u = window.currentUser;
    var m = (u && u.member) || {};
    return {
      name: m.nickname || m.name || '',
      role: (u && u.highestRole) || '',
      rank: API.myRank(),
      photo: m.photoUrl || m.avatarUrl || '',
    };
  }
  function loadReal() {
    if (loading) return;
    loading = true;
    unauthShown = false;
    /* 読取の多くは軽量API(応答にuser非同梱)のため、直接アクセスだと役職不明のままアシマネ+ゲートが
       誤発動する(2026-09-02実障害: 代表でも準備タブ拒否)。セッションがあり役職未判明なら、本体GASの
       超軽量 getDataGen(認証済み応答にuserが同梱される)で役職を解決して再描画する。 */
    if (API.hasSession() && !(window.currentUser && window.currentUser.member)) {
      API.fetchData('getDataGen', {}).then(function () {
        if (window.currentUser && window.currentUser.member) { M.me = meModel(); try { render(); } catch (e) {} }
      }, function () {});
    }
    var cached = cacheLoad();
    if (cached) {
      M.events = arr(cached.events);
      M.aggs = cached.aggs || null;
      M.me = cached.me || null;
      M.regsOk = cached.regsOk !== false;
      M.partsOk = cached.partsOk === true;
      if (Array.isArray(cached.members)) M.members = cached.members; // membersFetched=false のまま=次のextras読取で裏更新
      var ids = {};
      Object.keys(cached.staffBy || {}).forEach(function (k) { ids[k] = 1; });
      Object.keys(cached.expBy || {}).forEach(function (k) { ids[k] = 1; });
      Object.keys(ids).forEach(function (k) {
        EX[k] = {
          staff: (cached.staffBy && cached.staffBy[k]) || null,
          expenses: (cached.expBy && cached.expBy[k]) || null,
          staffErr: false, expErr: false, fetched: false, loading: false,
        };
      });
      Object.keys(cached.wlBy || {}).forEach(function (k) {
        WL[k] = WL[k] || { items: null, err: false, fetched: false, loading: false };
        WL[k].cachedWaiting = num(cached.wlBy[k]); // 件数のみ(一覧は次の読取で)
      });
    }
    render(); // キャッシュがあれば 0ms で紙面 / なければローディング

    // 深いリンク(#/ev/<id>)直開き: 全件(listRegistrations)の到着を待たず、
    // イベント単体の先行読取(listEventRegistrations)を最初から並行発火(無ければ全件へフォールバック)
    var r0 = route();
    if (r0.id && (r0.view === 'regs' || r0.view === 'hub')) loadEventRegs(r0.id);

    var regsOk = true, partsOk = true;
    var pEvents = API.fetchData('listEvents', {});
    var pRegs = API.fetchData('listRegistrations', {}).then(function (r) { return r; }, function () { regsOk = false; return []; });
    var pParts = API.fetchData('listParticipants', {}).then(function (r) { return r; }, function () { partsOk = false; return []; });

    // 段階レンダリング: キャッシュなし初回は 速い2本(events+regs)で先に描画
    var doneAll = false;
    if (!cached) {
      if (r0.id) {
        // 深いリンクはさらに前段=eventsのみで骨格+数字バンドを即描画(行は先行読取/全件の到着で後着)
        pEvents.then(function (events) {
          if (doneAll || unauthShown || M.events !== null) return;
          M.events = arr(events);
          M.me = meModel();
          render();
        }).catch(function () { /* エラーは全体待ちで一元処理 */ });
      }
      Promise.all([pEvents, pRegs]).then(function (res) {
        if (doneAll || unauthShown) return;
        M.events = arr(res[0]);
        S.regs = arr(res[1]);
        M.regsOk = regsOk;
        M.partsOk = false;
        M.aggs = regsOk ? buildAggs(S.regs, null) : null;
        M.me = meModel();
        render();
      }).catch(function () { /* エラーは全体待ちで一元処理 */ });
    }
    Promise.all([pEvents, pRegs, pParts]).then(function (res) {
      doneAll = true;
      loading = false;
      if (unauthShown) return;
      M.events = arr(res[0]);
      S.regs = arr(res[1]);
      S.parts = arr(res[2]);
      M.regsOk = regsOk;
      M.partsOk = partsOk;
      M.aggs = regsOk ? buildAggs(S.regs, partsOk ? S.parts : null) : null;
      M.me = meModel();
      loadedOnce = true;
      render();
      cacheSave();
    }).catch(function (e) {
      doneAll = true;
      loading = false;
      if (unauthShown || (e && e._auth)) return;
      if (cached) return; // 24h以内の前回紙面 > 全面エラー
      renderError((e && e.message) || String(e));
    });
  }

  /* ---------- 起動 ---------- */
  API.setOnUnauthorized(function () {
    unauthShown = true;
    API.clearSession();
    cacheClear();
    renderLogin('セッションが切れました。再度ログインしてください。');
  });
  window.addEventListener('hashchange', function () {
    if (DEMO) { render(); return; }
    if (!API.hasSession()) return; // ログイン画面のまま
    render();
  });
  function boot() {
    if (DEMO) { render(); return; }
    if (!API.hasSession()) { cacheClear(); renderLogin(''); return; }
    if (loadedOnce) { render(); return; }
    loadReal();
  }
  boot();
})();


</script>
</body>
</html>
