<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>イベント — connec+a 運営ポータル</title>
<meta name="description" content="connec+a 運営ポータル — イベント面">
<script>window.__ADMIN2_BUILD='20260902031853';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0&display=block" rel="stylesheet">
<style>
/* ================= shared/01-tokens.css ================= */
/* ============================================================================
   admin2 共通トークン+共通部品 (正典: redesign/portal-proto/portal.html)
   ここに置くのは全アプリで再利用する規則のみ: 色・書体・.glass・.btn・.nb・
   フォーカス・reduced-motion。レイアウトは各アプリ側で設計する(機械的統一の禁止)。
   ============================================================================ */
:root{
  --accent:#6e86e0; --deep:#4f63c4; --ink:#22314a; --ink2:#2b3d57; --ink3:#3d5877; --ink4:#526d89; --ink5:#71859a;
  --cream:#faf6e8; --paper:#fdfcf8; --line:#d9dfe9; --rule:#22314a;
  --warn:#a8434f; --ok:#3f7d5c; --amber:#8a6a2f;
  --wash1:rgba(110,134,224,.08); --wash2:rgba(244,232,196,.35); --wash3:rgba(233,180,196,.10);
  --serif:'Zen Old Mincho',serif; --sans:'Zen Kaku Gothic New',sans-serif; --latin:'Cormorant Garamond',serif;
  /* アプリ識別色(全アプリ共通で固定の意味を持つ) */
  --app-event:#6e86e0; --app-comms:#c96f83; --app-org:#4c8f6a; --app-hq:#b08430; --app-analytics:#5d7bab;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.8;
  background-image:
    radial-gradient(ellipse 900px 520px at 88% -6%, rgba(110,134,224,.26), transparent 60%),
    radial-gradient(ellipse 700px 500px at -8% 30%, rgba(244,228,178,.75), transparent 60%),
    radial-gradient(ellipse 540px 430px at 96% 46%, rgba(110,134,224,.2), transparent 62%),
    radial-gradient(ellipse 700px 460px at 26% 74%, rgba(110,134,224,.14), transparent 62%),
    radial-gradient(ellipse 620px 480px at 70% 108%, rgba(233,180,196,.26), transparent 62%);
  background-attachment:fixed}
/* フロストガラス(浮いている操作面・状態帯に使用。見出し・本文の紙面には使わない) */
.glass{background:linear-gradient(168deg, rgba(255,255,255,.52), rgba(255,255,255,.24));
  -webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);
  border:1px solid rgba(255,255,255,.75);box-shadow:0 14px 38px -18px rgba(34,49,74,.3), inset 0 1px 0 rgba(255,255,255,.9)}
.mi{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;vertical-align:-3px;display:inline-block}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px}
/* 日本語の改行制御: 単語の途中・単位の直前で折らない。複合語・日付時刻・数値+単位は .nb で固定 */
body{line-break:strict}
.nb{white-space:nowrap}
.btn{white-space:nowrap}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2.5px solid var(--deep);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

/* ボタン(操作規則は全アプリ共通。文字は絶対に折らない=入らないときはボタンごと縦積み) */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:700;font-size:14px;
  background:var(--deep);color:#fff;padding:12px 22px;border-radius:8px;text-decoration:none;min-height:44px;
  border:0;cursor:pointer;transition:background .15s}
.btn:hover{background:#43549f}
.btn.sub{color:var(--deep);background:linear-gradient(168deg, rgba(255,255,255,.55), rgba(255,255,255,.28));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);
  box-shadow:0 8px 22px -14px rgba(34,49,74,.3)}
.btn.sub:hover{background:rgba(255,255,255,.65)}

/* ================= event/20-event.css ================= */
/* ============================================================================
   イベントアプリ固有スタイル
   正典: redesign/portal-proto/event-list.html / event-hub.html / event-regs.html
   トークン・.glass・.btn・.nb・focus・reduced-motion は shared/01-tokens.css。
   読む紙面(罫線・表・数字)は紙のまま、浮く操作面(タブ・数字バンド・右欄)だけガラス。
   ============================================================================ */
/* 見出し・短文は文節単位で折る(auto-phraseは撮影Chromeで効かないため .nb 手動指定が正) */
h1,h2,.standfirst,.kicker,.meta,.mixline,.waitnote,.f-body .meta,.up .sub{word-break:auto-phrase;text-wrap:pretty}
/* ボタン寸法は正典(event-*)に合わせる(sharedの操作規則はそのまま・余白のみ調整) */
.btn{padding:11px 20px}

/* ============ ミニマストヘッド(アプリ内共通) ============ */
.masthead{padding:20px 0 0;border-bottom:3px double var(--rule)}
.mast-top{display:flex;align-items:baseline;gap:16px}
.daimoku{font-family:var(--latin);font-size:28px;font-weight:500;color:var(--ink)}
.daimoku b{color:var(--accent);font-weight:500}
.mast-sub{font-family:var(--serif);font-size:12px;letter-spacing:.24em;color:var(--ink3)}
.mast-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink4)}
.mast-right img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1.5px solid var(--accent)}
.edition{display:flex;gap:2px;font-size:12.5px;margin:12px 0;padding:5px;border-radius:8px;align-items:center;
  background:linear-gradient(168deg, rgba(255,255,255,.5), rgba(255,255,255,.22));
  -webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);
  border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px -18px rgba(34,49,74,.3), inset 0 1px 0 rgba(255,255,255,.9)}
.edition a{padding:8px 18px;letter-spacing:.14em;color:var(--ink3);text-decoration:none;min-height:40px;display:inline-flex;align-items:center;border-radius:6px;flex:none}
.edition a:hover{background:rgba(255,255,255,.55)}
.edition a[aria-current]{font-weight:700;color:#fff;background:var(--deep);box-shadow:0 6px 16px -6px rgba(79,99,196,.6)}
.edition .spacer{flex:1}

/* ============ 一覧: ページ見出し+主要操作 ============ */
.pagehead{display:flex;align-items:baseline;gap:16px;margin:24px 0 4px}
.pagehead h1{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.14em}
.pagehead .count{font-size:12.5px;color:var(--ink4)}
.pagehead .spacer{flex:1}

/* ============ 一覧: 特集(きょう/次号) ============ */
.feature{display:grid;grid-template-columns:1.2fr 1fr;gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:14px}
.feature.nophoto{grid-template-columns:1fr}
.feature.nophoto .f-body{padding-left:0}
.f-photo{position:relative;overflow:hidden}
.f-photo img{width:100%;height:100%;min-height:300px;object-fit:cover;display:block}
.f-photo .cap{position:absolute;left:10px;bottom:10px;padding:6px 13px;font-size:12px;color:#fff;letter-spacing:.06em;
  background:rgba(24,32,52,.38);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.28);border-radius:7px}
.f-body{padding:26px 0 26px 30px;display:flex;flex-direction:column}
.kicker{font-size:12px;letter-spacing:.3em;color:var(--deep);font-weight:700;display:flex;align-items:center;gap:10px}
.kicker::before{content:'';width:26px;height:1.5px;background:var(--accent)}
.f-body h2{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.03em;line-height:1.45;margin:8px 0 2px}
.f-body .meta{font-size:13.5px;color:var(--ink3)}
.f-nums{display:flex;gap:0;margin:16px 0 14px;border-radius:8px;overflow:hidden}
.f-nums .n{flex:1;padding:11px 16px 7px;border-right:1px solid rgba(255,255,255,.65)}
.f-nums .n:last-child{border-right:0}
.f-nums .v{font-family:var(--serif);font-size:25px;font-weight:600;font-variant-numeric:tabular-nums}
.f-nums .v small{font-size:12px;color:var(--ink4);font-weight:400}
.f-nums .l{font-size:11.5px;letter-spacing:.1em;color:var(--ink4)}
.f-nums .n.hot .v,.f-nums .n.hot .l{color:var(--warn)}
.f-crew{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink4);margin-bottom:16px}
.f-crew .faces{display:flex}
.f-crew .faces img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid var(--paper);margin-left:-8px}
.f-crew .faces img:first-child{margin-left:0}
.f-cta{margin-top:auto;display:flex;gap:12px}
.f-note{font-size:12.5px;color:var(--warn);margin-bottom:14px}
.f-note button{background:none;border:0;color:var(--deep);font:inherit;font-weight:700;cursor:pointer;padding:2px 4px}

/* ============ 一覧: これから(次号の小組) ============ */
h2.sec{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.14em;display:flex;align-items:baseline;gap:12px;margin:30px 0 12px}
h2.sec::after{content:'';flex:1;height:1px;background:var(--rule);opacity:.4}
h2.sec .act{font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--deep);text-decoration:none;letter-spacing:.04em;flex:none;order:2}
.up{border-radius:8px;overflow:hidden}
.up a{display:grid;grid-template-columns:84px 96px 1fr 300px 40px;gap:16px;align-items:center;padding:14px 22px;
  text-decoration:none;color:var(--ink);border-bottom:1px solid rgba(255,255,255,.6);transition:background .15s}
.up a:last-child{border-bottom:0}
.up a:hover{background:rgba(255,255,255,.5)}
.up .th{width:84px;height:60px;object-fit:cover;border-radius:5px;display:block;background:#e8ecf4}
.up .th.empty{display:flex;align-items:center;justify-content:center;color:var(--ink5);border:1.5px dashed var(--line);background:rgba(255,255,255,.5)}
.up .faces{display:flex;justify-content:flex-end;margin-top:3px}
.up .faces img{width:20px;height:20px;border-radius:50%;object-fit:cover;border:1.5px solid #fff;margin-left:-6px}
.up .date{font-family:var(--serif);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.up .date small{display:block;font-family:var(--sans);font-size:11px;font-weight:400;color:var(--ink5);letter-spacing:.08em}
.up .ttl{font-size:15px;font-weight:700;min-width:0}
.up .ttl .st{font-size:11.5px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:1px 10px;margin-left:10px;vertical-align:2px}
.up .ttl .st.pub{color:var(--ok);border:1.5px solid rgba(63,125,92,.4)}
.up .ttl .st.draft{color:var(--amber);border:1.5px solid rgba(138,106,47,.4)}
.up .sub{font-size:12.5px;color:var(--ink4);text-align:right;white-space:nowrap}
.up .sub .warn-t{color:var(--warn);font-weight:700}
.up .go{font-size:18px;color:var(--ink5);justify-self:end;align-self:center}
.up a:hover .go{color:var(--deep)}
.up-empty{padding:16px 22px;font-size:13px;color:var(--ink4);border-radius:8px}

/* ============ 一覧: アーカイブ棚(罫線の表組・カードにしない) ============ */
.arch{border-top:1px solid var(--rule)}
.arch a{display:grid;grid-template-columns:64px 96px 1fr 130px 130px 110px 40px;gap:14px;align-items:center;
  padding:10px 6px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:13.5px}
.arch .th{width:64px;height:44px;object-fit:cover;border-radius:4px;display:block;background:#e8ecf4;filter:saturate(.9)}
.arch .th.empty{display:flex;align-items:center;justify-content:center;color:var(--ink5);border:1.5px dashed var(--line);background:rgba(255,255,255,.5)}
.arch a:hover{background:rgba(255,255,255,.45)}
.arch .date{font-family:var(--serif);font-variant-numeric:tabular-nums;color:var(--ink3);white-space:nowrap}
.arch .ttl{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arch .m{font-variant-numeric:tabular-nums;color:var(--ink3);white-space:nowrap}
.arch .m b{font-family:var(--serif);font-size:15px;color:var(--ink)}
.arch .go{font-size:17px;color:var(--ink5);justify-self:end}
.arch-more{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--deep);text-decoration:none;min-height:40px}

/* ============ ハブ共通: 戻る+見出しブロック(表紙写真つき) ============ */
.back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink4);text-decoration:none;margin:18px 0 4px;min-height:40px}
.back:hover{color:var(--deep)}
.titlegrid{display:grid;grid-template-columns:1fr 310px;gap:28px;align-items:end;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.titlegrid.nophoto{grid-template-columns:1fr}
.titleblock{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.standfirst{font-size:13.5px;color:var(--ink3);margin-top:6px;max-width:52ch}
.cover{position:relative}
.cover img{width:100%;height:158px;object-fit:cover;border-radius:6px;display:block;background:#e8ecf4}
.cover .cap{position:absolute;left:8px;bottom:8px;padding:4px 11px;font-size:11.5px;color:#fff;letter-spacing:.05em;
  background:rgba(24,32,52,.38);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.28);border-radius:6px}
.titleblock h1{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:.03em;line-height:1.4}
.titleblock .meta{font-size:13.5px;color:var(--ink3);padding-bottom:6px}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ok);border:1.5px solid rgba(63,125,92,.4);border-radius:999px;padding:3px 12px;background:rgba(255,255,255,.6)}
.state .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.state.draft{color:var(--amber);border-color:rgba(138,106,47,.4)}
.state.draft .dot{background:var(--amber)}
.state.off{color:var(--warn);border-color:rgba(168,67,79,.4)}
.state.off .dot{background:var(--warn)}
.state.done{color:var(--ink4);border-color:rgba(82,109,137,.4)}
.state.done .dot{background:var(--ink4)}

/* ============ ハブ共通: タブ+受付起動 ============ */
.tabbar{display:flex;gap:2px;align-items:center;margin:16px 0 22px;padding:5px;border-radius:8px}
.tabbar a{padding:9px 20px;font-size:13.5px;letter-spacing:.08em;color:var(--ink3);text-decoration:none;border-radius:6px;min-height:42px;display:inline-flex;align-items:center;gap:7px;flex:none}
.tabbar a:hover{background:rgba(255,255,255,.55)}
.tabbar a[aria-current]{font-weight:700;color:#fff;background:var(--deep);box-shadow:0 6px 16px -6px rgba(79,99,196,.6)}
.tabbar a .cnt{font-size:11px;font-weight:700;background:var(--warn);color:#fff;border-radius:999px;padding:0 7px;line-height:1.6}
.tabbar .spacer{flex:1}

/* ============ ハブ共通: Dayセグメント(複数日のみ・数字バンド直上・全タブ同位置) ============ */
.dayseg{display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:4px;border-radius:8px;margin:-8px 0 10px;width:max-content;max-width:100%}
.dayseg button{border:0;background:transparent;font:inherit;font-size:12.5px;letter-spacing:.06em;padding:7px 14px;border-radius:6px;color:var(--ink3);min-height:40px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.dayseg button:hover{background:rgba(255,255,255,.6)}
.dayseg button[aria-pressed="true"]{background:var(--deep);color:#fff;font-weight:700}
.dayseg button.today{position:relative;padding-top:12px;padding-bottom:2px}
.dayseg button.today::after{content:'きょう';display:block;font-size:9px;letter-spacing:.1em;font-weight:700;color:var(--warn);line-height:1.4}
.dayseg button.today[aria-pressed="true"]::after{color:rgba(255,255,255,.85)}

/* ============ ハブ共通: 数字バンド ============ */
.numband{display:flex;margin:0 0 26px;border-radius:8px;overflow:hidden}
.numband.tight{margin-bottom:12px}
.numband .n{flex:1;padding:13px 18px 9px;border-right:1px solid rgba(255,255,255,.65)}
.numband .n:last-child{border-right:0}
.numband .v{font-family:var(--serif);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.numband .v small{font-size:13px;color:var(--ink4);font-weight:400;margin-left:2px}
.numband .l{font-size:12px;letter-spacing:.12em;color:var(--ink4)}
.numband .n.hot .v,.numband .n.hot .l{color:var(--warn)}
.numband .n.hot .l{font-weight:700}
.numband .n a{color:inherit;text-decoration:none}
.numband-note{font-size:12.5px;color:var(--warn);margin:0 0 26px}
.numband-note button{background:none;border:0;color:var(--deep);font:inherit;font-weight:700;cursor:pointer;padding:2px 4px}

/* ============ regs: 決済方法の内訳(数字バンド直下・紙のまま) ============ */
.payband{display:flex;align-items:center;gap:14px;margin:0 0 26px;font-size:12.5px;color:var(--ink4);flex-wrap:wrap}
.payband .lbl{letter-spacing:.12em;flex:none}
.payband .bar{flex:1;min-width:180px;display:flex;height:10px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.55)}
.payband .bar i{height:100%}
.payband .bar .p0{background:var(--deep)}
.payband .bar .p1{background:rgba(110,134,224,.45)}
.payband .bar .p2{background:rgba(138,106,47,.55)}
.payband .bar .p3{background:rgba(82,109,137,.45)}
.payband .leg b{font-weight:700;color:var(--ink3)}

/* ============ 本文2列 ============ */
.cols{display:grid;grid-template-columns:1fr 356px;gap:30px;align-items:start;padding-bottom:40px}
.cols.solo{grid-template-columns:1fr}
.cols>*{min-width:0}
.cols h2.sec{letter-spacing:.12em;margin:26px 0 4px}
.cols h2.sec:first-child{margin-top:0}

/* 基本情報(罫線の定義リスト・カードにしない) */
.facts{margin-top:6px}
.facts .f{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:11px 2px;border-bottom:1px dashed var(--line);font-size:13.5px}
.facts .f dt{color:var(--ink4);letter-spacing:.06em;font-size:12.5px;padding-top:2px}
.facts .f dd b{font-weight:700}
.facts .f dd .note{display:block;font-size:12px;color:var(--ink5)}
.facts .venue-src{font-size:11.5px;color:var(--ink5);margin-left:8px}
.facts a{color:var(--deep);font-weight:700;text-decoration:none}

/* 担当レール(人物型) */
.rail{display:flex;gap:0;margin-top:12px;overflow-x:auto}
.crew{width:118px;flex:none;text-align:center;position:relative}
.crew img{width:66px;height:66px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 8px 20px -8px rgba(34,49,74,.35)}
.crew .role{display:inline-block;margin-top:-12px;position:relative;background:var(--deep);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:2px 10px}
.crew .nm{font-size:13px;font-weight:700;margin-top:5px}
.crew .nt{font-size:11px;color:var(--ink5);line-height:1.5}
.crew .ph-empty{width:66px;height:66px;border-radius:50%;border:2px dashed var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--ink5);background:rgba(255,255,255,.5)}
.crew.empty .role{background:transparent;color:var(--warn);border:1.5px dashed rgba(168,67,79,.5)}
/* 担当レールの空状態/取得失敗(非表示にせず、操作に繋がる1行) */
.rail-line{font-size:13.5px;color:var(--ink4);padding:12px 2px}
.rail-line a,.rail-line button{color:var(--deep);font-weight:700;text-decoration:none;background:none;border:0;font:inherit;cursor:pointer;padding:0}

/* 配信タイムライン */
.tl{margin-top:10px;border-left:2px solid var(--line);padding-left:0;list-style:none}
.tl li{position:relative;padding:9px 2px 9px 22px;font-size:13.5px;display:flex;gap:10px;align-items:baseline}
.tl li::before{content:'';position:absolute;left:-6px;top:16px;width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid var(--ink5)}
.tl li.sent::before{border-color:var(--ok);background:var(--ok)}
.tl li.next::before{border-color:var(--deep);background:var(--deep)}
.tl .when{font-family:var(--serif);flex:none;width:106px;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.tl b{font-weight:700}
.tl .st{margin-left:auto;flex:none;font-size:11.5px;letter-spacing:.06em}
.tl .st.ok{color:var(--ok);font-weight:700}
.tl .st.next{color:var(--deep);font-weight:700}
.tl .st.plan{color:var(--ink5)}

/* 申込のうごき(日次バー+注釈) */
.trend-wrap{margin-top:14px}
.trend{display:flex;align-items:flex-end;gap:4px;height:96px}
.trend i{flex:1;background:rgba(110,134,224,.28);border-radius:2px 2px 0 0;min-height:3px;position:relative}
.trend i.mark{background:rgba(110,134,224,.5)}
.trend i.hi{background:var(--deep)}
.trend i em{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--serif);font-size:12px;color:var(--deep);font-weight:600;white-space:nowrap}
.trend-x{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink5);margin-top:5px}
.trend-notes{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink4);margin-top:8px}
.trend-notes span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;background:rgba(110,134,224,.5);margin-right:6px;vertical-align:-1px}
.trend-notes span.hi::before{background:var(--deep)}
.trend-empty{font-size:13px;color:var(--ink4);padding:10px 2px}
.mixline{font-size:13.5px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.mixline b{font-weight:700}
.crowd{display:flex;align-items:center;gap:12px;margin-top:10px}
.crowd .faces{display:flex}
.crowd .faces img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--paper);margin-left:-9px}
.crowd .faces img:first-child{margin-left:0}
.crowd span{font-size:12.5px;color:var(--ink4)}

/* ============ 右列(ガラスの状況欄・申込詳細) ============ */
.side{border-radius:8px;padding:20px 20px 16px}
.side h2{font-family:var(--serif);font-size:15.5px;font-weight:600;letter-spacing:.1em;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:8px;display:flex;align-items:baseline}
.side h2 .act{margin-left:auto;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--deep);text-decoration:none}
.side .grp{margin-bottom:20px}
.side-empty{padding:10px 2px;font-size:12.5px;color:var(--ink4)}
/* 申込ペース(概要タブ右欄の小さな棒) */
.pace{display:flex;align-items:flex-end;gap:5px;height:64px;margin:10px 0 4px}
.pace i{flex:1;background:rgba(110,134,224,.35);border-radius:2px 2px 0 0;min-height:4px}
.pace i.hi{background:var(--deep)}
.pace-cap{font-size:11.5px;color:var(--ink4);display:flex;justify-content:space-between}
.pace-note{font-size:12.5px;margin-top:6px}
.pace-note b{color:var(--deep)}
/* チェック行 */
.chk{list-style:none}
.chk li{display:flex;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;align-items:baseline}
.chk li:last-child{border-bottom:0}
.chk .mi{font-size:17px;color:var(--ok);flex:none}
.chk li.todo .mi{color:var(--amber)}
.chk li .sub2{display:block;font-size:11.5px;color:var(--ink5)}
.chk li time{margin-left:auto;flex:none;font-size:11.5px;color:var(--ink5);font-family:var(--serif)}
/* 収支ミニ */
.ledger{font-size:13.5px}
.ledger .lr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.ledger .lr span:last-child{font-variant-numeric:tabular-nums;font-family:var(--serif);font-size:15px}
.ledger .lr.total{border-bottom:0;border-top:1.5px solid var(--rule);margin-top:2px;padding-top:9px;font-weight:700}
.ledger .lr.total span:last-child{color:var(--ok);font-size:18px}
.ledger .note{font-size:11.5px;color:var(--ink5);margin-top:4px}

/* ============ regs: 申込のうごき(縮小版) ============ */
.pace-strip{display:flex;align-items:flex-end;gap:18px;margin-top:8px}
.pace-strip .pace{height:52px;flex:1;max-width:420px;gap:4px;margin:0}
.pace-strip .pace-note{font-size:12.5px;color:var(--ink4);padding-bottom:2px;margin-top:0}
.pace-strip .pace-note b{color:var(--deep);font-weight:700}

/* ============ regs: 表示切替+絞り込み+検索 ============ */
.listhead{display:flex;align-items:center;gap:18px;margin-top:12px;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:8px;gap:2px}
.seg button{border:0;background:transparent;font:inherit;font-size:12.5px;letter-spacing:.06em;padding:7px 16px;border-radius:6px;color:var(--ink3);min-height:40px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--deep);color:#fff;font-weight:700}
.q{font:inherit;font-size:12.5px;padding:8px 12px;min-height:40px;width:170px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.7);color:var(--ink)}
.q::placeholder{color:var(--ink5)}
.filters{display:flex;gap:16px;font-size:12.5px;margin-left:auto}
.filters a{color:var(--ink4);text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
.filters a b{font-family:var(--serif);margin-left:4px}
.filters a[aria-current]{color:var(--ink);font-weight:700;border-bottom:2px solid var(--deep)}
.filters a.warncnt b{color:var(--warn)}

/* ============ regs: 申込の表 ============ */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px}
table.regs{width:100%;border-collapse:collapse;min-width:680px;font-size:13.5px}
.regs th{text-align:left;font-size:11.5px;letter-spacing:.12em;color:var(--ink4);font-weight:700;border-bottom:1.5px solid var(--rule);padding:8px 10px;white-space:nowrap}
.regs th.num,.regs td.amt{text-align:right}
.regs td{padding:10px;border-bottom:1px dashed var(--line);vertical-align:middle}
.regs tbody tr.sel>td{background:rgba(110,134,224,.09)}
.regs .who{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.regs .who img{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none}
.regs .who .tag{font-size:10.5px;font-weight:700;color:var(--deep);border:1px solid rgba(110,134,224,.45);border-radius:999px;padding:0 8px;line-height:1.7}
.regs .when{font-family:var(--serif);font-variant-numeric:tabular-nums;color:var(--ink3);white-space:nowrap}
.regs .day{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink3);white-space:nowrap}
.regs tr.child .day{font-size:11.5px;color:var(--ink4)}
.regs .amt{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:14.5px;white-space:nowrap}
.regs .st{white-space:nowrap}
.regs .st .how{display:block;font-size:11.5px;color:var(--ink5);font-weight:400}
.regs .st-paid{color:var(--ok);font-weight:700}
.regs .st-unpaid{color:var(--warn);font-weight:700}
.regs .st-refund{color:var(--amber);font-weight:700}
.regs .st-cancel{color:var(--ink5);font-weight:700}
.regs .comp{white-space:nowrap;color:var(--ink3)}
.regs .none{color:var(--ink5)}
.regs tr.child td{border-bottom:1px dashed var(--line);background:rgba(255,255,255,.35);font-size:12.5px;color:var(--ink4);padding-top:6px;padding-bottom:6px}
.regs tr.child .cname{padding-left:42px;position:relative;white-space:nowrap}
.regs tr.child .cname::before{content:'└';position:absolute;left:22px;color:var(--ink5)}
.rowbtn{display:inline-flex;align-items:center;font-weight:700;font-size:12.5px;color:var(--deep);text-decoration:none;border:1.5px solid rgba(79,99,196,.45);border-radius:6px;padding:7px 13px;min-height:38px;white-space:nowrap;background:rgba(255,255,255,.5);font-family:var(--sans);cursor:pointer}
.rowbtn:hover{background:rgba(255,255,255,.8)}
.rowlink{font-size:12.5px;font-weight:700;color:var(--deep);text-decoration:none;white-space:nowrap;min-height:38px;display:inline-flex;align-items:center;padding:0 4px;background:none;border:0;font-family:var(--sans);cursor:pointer}
.tbl-more{font-size:12.5px;color:var(--ink4);padding:10px 2px 0}
.tbl-more a,.tbl-more button{color:var(--deep);font-weight:700;text-decoration:none;background:none;border:0;font:inherit;cursor:pointer;padding:0}
.moneynote{font-size:12px;color:var(--ink5);margin-top:8px}
/* 試験配信で無効な操作の控えめな案内 */
.opnote{font-size:12.5px;color:var(--amber);margin-top:8px}
.tbl-empty{font-size:13px;color:var(--ink4);padding:14px 2px}

/* ============ regs: キャンセル待ち(隔離) ============ */
.waitnote{font-size:13px;color:var(--ink3);margin-top:8px;max-width:60ch}
.wl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 2px;border-bottom:1px dashed var(--line)}
.wl:last-of-type{border-bottom:0}
.wl img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.wl .wi{min-width:0}
.wl .nm{font-weight:700;white-space:nowrap}
.wl .nm .tag{font-size:10.5px;font-weight:700;color:var(--deep);border:1px solid rgba(110,134,224,.45);border-radius:999px;padding:0 8px;margin-left:6px}
.wl .at{display:block;font-family:var(--serif);font-size:12.5px;color:var(--ink4);font-variant-numeric:tabular-nums;white-space:nowrap}
.wl .ord{font-family:var(--serif);font-size:12.5px;color:var(--ink5);flex:none;width:24px}
.wl .sp{flex:1}
.wl .btn.sub{font-size:12.5px;padding:8px 14px;min-height:40px;flex:none}
.wl .wl-done{font-family:var(--serif);font-size:12.5px;color:var(--ink4);flex:none;font-variant-numeric:tabular-nums}
.wl .xconfirm{min-height:40px}

/* ============ regs: 右列 申込の詳細 ============ */
.side.regside{padding-bottom:18px}
.side.regside h2{margin-bottom:12px;display:block}
.person{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.person img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2.5px solid #fff;box-shadow:0 8px 20px -8px rgba(34,49,74,.35)}
.person .nm{font-weight:700;font-size:16px}
.person .tag{font-size:10.5px;font-weight:700;color:var(--deep);border:1px solid rgba(110,134,224,.45);border-radius:999px;padding:0 8px;margin-left:6px}
.person .sub{font-size:12px;color:var(--ink5)}
.dfacts{margin-top:4px}
.dfacts .f{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.dfacts .f dt{color:var(--ink4);letter-spacing:.06em;font-size:12px;padding-top:1px}
.dfacts .f dd b{font-weight:700}
.dfacts .f dd .note{display:block;font-size:11.5px;color:var(--ink5)}
.dact{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.dact .btn.sub{font-size:13px}
/* 危険操作(下段に隔離) */
.danger{margin-top:22px;border:1.5px dashed rgba(168,67,79,.5);border-radius:6px;padding:13px 15px}
.danger h3{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--warn);margin-bottom:4px}
.danger p{font-size:12px;color:var(--ink4);line-height:1.7;margin-bottom:10px}
.btn-warn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 15px;border:1.5px solid var(--warn);color:var(--warn);border-radius:6px;font-weight:700;font-size:13px;text-decoration:none;background:rgba(255,255,255,.5);white-space:nowrap;font-family:var(--sans);cursor:pointer}
.btn-warn:hover{background:rgba(168,67,79,.08)}

/* ============ 準備中タブ(1行・装飾なし) ============ */
.stub-line{font-size:13.5px;color:var(--ink4);padding:26px 2px 80px}

/* ============ 状態: ローディング / エラー ============ */
.state-line{font-size:13px;color:var(--ink4);padding:24px 0 60px}
.state-error{padding:36px 0 60px}
.state-error h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:10px 0 8px}
.state-error p{font-size:13.5px;color:var(--ink2);max-width:52ch}
.state-error .cta{display:flex;gap:12px;align-items:center;margin-top:16px}

/* ============ ログイン(未ログイン時) ============ */
.login-main{max-width:430px;margin:0 auto;padding:52px 0 90px}
.login-h{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.06em;margin:10px 0 6px}
.login-sub{font-size:13px;color:var(--ink3);margin-bottom:20px}
.login-card{padding:24px 22px 20px;border-radius:8px}
.login-card label{display:block;font-size:12.5px;font-weight:700;color:var(--ink3);letter-spacing:.06em;margin-bottom:15px}
.login-card input{display:block;width:100%;margin-top:6px;padding:11px 12px;font-family:var(--sans);font-size:14px;
  border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.85);color:var(--ink);min-height:44px;font-weight:400}
.login-card .hint{display:block;font-size:11.5px;font-weight:400;color:var(--ink5);margin-top:3px}
.login-card .btn{width:100%;justify-content:center;margin-top:4px}
.login-err{margin-top:12px;font-size:13px;color:var(--warn)}
.login-alt{margin-top:10px;background:none;border:0;color:var(--ink4);font-family:var(--sans);font-size:12.5px;cursor:pointer;padding:8px 0;display:block}

/* ============ 奥付 ============ */
.colophon{border-top:3px double var(--rule);margin-top:38px;padding:14px 0 34px;display:flex;font-size:12px;color:var(--ink5);letter-spacing:.1em}
.colophon span:last-child{margin-left:auto}

/* ============ レスポンシブ(縮小ではなく再配置) ============ */
@media(max-width:960px){
  .wrap{padding:0 20px}
  .edition,.tabbar{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .feature{grid-template-columns:1fr}
  .f-photo img{min-height:0;height:210px}
  .f-body{padding:20px 0 22px}
  .up a{grid-template-columns:84px 1fr 40px;gap:4px 14px}
  .up .th{grid-row:1 / span 3}
  .up .date{grid-column:2}
  .up .ttl{grid-column:2}
  .up .sub{grid-column:2;text-align:left;white-space:normal}
  .up .faces{display:none}
  .up .go{grid-column:3;grid-row:1 / span 3}
  .arch a{grid-template-columns:64px 1fr 40px;gap:2px 14px}
  .arch .th{grid-row:1 / span 4}
  .arch .date,.arch .ttl,.arch .m{grid-column:2}
  .arch .go{grid-column:3;grid-row:1 / span 4}
  .cols{grid-template-columns:1fr}
  .titlegrid{grid-template-columns:1fr}
  .cover img{height:180px}
  .trend i em{display:none}
}
@media(max-width:640px){
  .masthead{padding-top:14px}
  .mast-sub{display:none}
  .pagehead{flex-wrap:wrap;gap:10px}
  .pagehead .btn{flex:1 1 100%;justify-content:center}
  .f-body h2{font-size:25px}
  .f-nums{flex-wrap:wrap}
  .f-nums .n{flex:1 1 50%;border-bottom:1px solid rgba(255,255,255,.65)}
  .f-nums .n:nth-child(n+3){border-bottom:0}
  .f-cta{flex-wrap:wrap}
  .f-cta .btn{flex:1 1 100%;justify-content:center}
  .titleblock h1{font-size:26px}
  .titleblock{gap:8px}
  .tabbar .btn{position:fixed;left:16px;right:16px;bottom:14px;z-index:30;justify-content:center;box-shadow:0 14px 34px -10px rgba(79,99,196,.6)}
  .numband{flex-wrap:wrap}
  .numband .n{flex:1 1 33%;border-bottom:1px solid rgba(255,255,255,.65)}
  .numband .n:nth-child(-n+3){border-bottom:1px solid rgba(255,255,255,.65)}
  .numband .n:nth-child(n+4){border-bottom:0}
  .numband .v{font-size:24px}
  .facts .f{grid-template-columns:92px 1fr}
  .tl .when{width:88px}
  .pace-strip{flex-direction:column;align-items:stretch;gap:6px}
  .pace-strip .pace{max-width:none}
  .listhead{gap:10px}
  .q{width:100%}
  .filters{margin-left:0;width:100%}
  .wl .sp{display:none}
  .wl .btn.sub{flex:0 0 calc(100% - 88px);margin-left:88px;justify-content:center}
  .colophon{flex-direction:column;gap:2px}
  .colophon span:last-child{margin-left:0}
  .login-main{padding-top:34px}
  body.has-tabbtn{padding-bottom:70px}
}

/* ============ ハブ内の編集ビュー: 割当を編集 / 支出の記録 ============ */
.edit-note{font-size:13px;color:var(--ink4);margin:2px 0 14px;max-width:64ch}
.edit-err{font-size:13px;color:var(--warn);margin-top:14px;max-width:64ch}
.edit-cta{display:flex;gap:12px;align-items:center;margin:22px 0 8px;flex-wrap:wrap}
/* 担当の行(罫線のシート。カードにしない) */
.staffed{margin-top:4px;max-width:860px}
.staffed .sr{display:grid;grid-template-columns:minmax(200px,1.2fr) minmax(130px,.8fr) minmax(150px,1fr) 44px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.staffed .sr.head{padding:0 0 6px;border-bottom:1.5px solid var(--rule);font-size:11.5px;color:var(--ink4);letter-spacing:.08em}
.staffed input{font:inherit;font-size:14px;padding:9px 11px;min-height:42px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.72);color:var(--ink);width:100%}
.staffed input::placeholder{color:var(--ink5);font-size:12.5px}
/* 複数日: Day列(全日共通⇔Day別)つきの4+1列 */
.staffed .sr.withday{grid-template-columns:minmax(180px,1.2fr) minmax(120px,.7fr) minmax(120px,.7fr) minmax(130px,.9fr) 44px}
.staffed select.sr-day{font:inherit;font-size:13px;padding:9px 8px;min-height:42px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.72);color:var(--ink);width:100%}
.sr-del{border:0;background:none;color:var(--ink5);cursor:pointer;min-height:42px;min-width:42px;border-radius:6px}
.sr-del:hover{color:var(--warn);background:rgba(168,67,79,.08)}
.sr-add{margin-top:12px;display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--line);background:none;color:var(--deep);font-family:var(--sans);font-weight:700;font-size:13px;padding:9px 16px;border-radius:8px;cursor:pointer;min-height:42px;white-space:nowrap}
.sr-add:hover{border-color:var(--deep)}
/* 支出の一覧(罫線+tabular-nums) */
.expl{margin-top:6px;max-width:640px}
.expl .xr{display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.expl .xl{min-width:0}
.expl .xl b{font-weight:700}
.expl .xn{display:block;font-size:12px;color:var(--ink5)}
.expl .xa{margin-left:auto;font-variant-numeric:tabular-nums;font-family:var(--serif);font-size:15.5px;white-space:nowrap}
.expl .xr.total{border-bottom:0;border-top:1.5px solid var(--rule);font-weight:700}
.expl .xr.total .xa{font-size:18px}
.xdel{border:0;background:none;color:var(--ink5);font-family:var(--sans);font-size:12.5px;cursor:pointer;min-height:40px;padding:0 6px;flex:none}
.xdel:hover{color:var(--warn)}
.xconfirm{display:inline-flex;gap:10px;align-items:center;font-size:12.5px;color:var(--warn);flex:none}
.xconfirm button{border:0;font-family:var(--sans);font-size:12.5px;font-weight:700;cursor:pointer;min-height:40px;padding:0 8px;background:none}
.xconfirm .yes{color:#fff;background:var(--warn);border-radius:6px;padding:0 14px}
.xconfirm .no{color:var(--ink4)}
.xadd{display:grid;grid-template-columns:minmax(160px,1.1fr) 130px minmax(140px,1fr) auto;gap:10px;align-items:center;margin-top:16px;max-width:640px}
.xadd input{font:inherit;font-size:14px;padding:9px 11px;min-height:42px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.72);color:var(--ink);width:100%}
.xadd input::placeholder{color:var(--ink5);font-size:12.5px}
.xadd .btn{min-height:42px;padding:9px 18px}
/* 収支の見込み: 赤字のとき */

/* ============ 準備タブ(正典: event-prep.html) ============ */

.tt-edit input,.tt-edit select{font:inherit;font-size:14px;padding:9px 10px;min-height:42px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.72);color:var(--ink);width:100%}

.tt-edit .tte-ops{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}

.tt-edit .tte-del{margin-left:auto;border:0;background:none;color:var(--ink5);font-family:var(--sans);font-size:12.5px;cursor:pointer;min-height:40px}

/* 班分け */

.d.rep{background:var(--accent)}
.policy{font-size:12.5px;color:var(--ink3);padding:8px 12px;border-left:3px solid var(--accent);background:rgba(110,134,224,.07);margin:8px 0 4px}
.policy b{font-weight:700}
.gband .grow{display:grid;grid-template-columns:96px 1fr 118px 190px;gap:14px;align-items:center;padding:10px 8px;border-bottom:1px dashed var(--line)}

.gband .gfaces{display:flex}
.gband .gfaces img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--paper);margin-left:-8px;box-shadow:0 3px 8px -4px rgba(34,49,74,.35)}
.gband .gfaces img:first-child{margin-left:0}
.gband .gnames{font-size:12.5px;color:var(--ink2);line-height:1.7}

.gband .grow.warnrow .gnote{color:var(--amber)}
.gband .grow.warnrow .gnote b{font-weight:700}
.swaphint{font-size:11.5px;color:var(--ink5);margin-top:8px;display:flex;align-items:center;gap:6px}
.swaphint .mi{font-size:16px}
/* 班分けの編集ビュー */
.ged-scope{display:flex;gap:8px;align-items:center;margin:2px 0 14px;flex-wrap:wrap}
.ged-scope select{font:inherit;font-size:13.5px;padding:9px 10px;min-height:42px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.72);color:var(--ink)}
.ged-mix{display:flex;gap:10px;align-items:center;margin:10px 0 4px;flex-wrap:wrap}
.ged-mix input{font:inherit;font-size:14px;padding:9px 10px;min-height:42px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.72);color:var(--ink);width:74px;text-align:center}
.ged-mix .btn{min-height:42px;padding:9px 16px;font-size:13px}
.ged{margin-top:10px}
.ged .gg{padding:12px 0 10px;border-bottom:1px solid var(--line)}
.ged .gg-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ged .gg-head input{font:inherit;font-size:14px;padding:8px 10px;min-height:40px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.72);color:var(--ink)}

.ged .gg-head .g-note{flex:1;min-width:180px}

.ged .gg-mixline{font-size:12px;color:var(--ink4);margin:4px 0 2px}
.ged .gg-mixline.warn{color:var(--amber);font-weight:700}
.ged .mem{display:flex;gap:8px;align-items:center;padding:5px 0 5px 8px;font-size:13px;border-bottom:1px dashed var(--line)}

.ged .mem .d{flex:none}
.ged .mem .nm2{min-width:0}
.ged .mem .tag{font-size:10.5px;font-weight:700;color:#9a6320;background:rgba(201,135,58,.14);border-radius:999px;padding:1px 8px;flex:none}
.ged .mem select{margin-left:auto;font:inherit;font-size:12.5px;padding:6px 8px;min-height:38px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.72);color:var(--ink3);flex:none;max-width:140px}

.ged-pool{margin-top:16px}

.g-add{margin-top:12px;display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--line);background:none;color:var(--deep);font-family:var(--sans);font-weight:700;font-size:13px;padding:9px 16px;border-radius:8px;cursor:pointer;min-height:42px;white-space:nowrap}
.g-add:hover{border-color:var(--deep)}
/* 運営ブリーフ(ミニ紙面) */
.brief{margin-top:10px;background:#fffdf9;border:1px solid var(--line);border-radius:4px;padding:18px 22px 14px;
  box-shadow:0 10px 26px -16px rgba(34,49,74,.28);position:relative}

.brief .b-head{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.1em;border-bottom:2px solid var(--rule);padding-bottom:6px;display:flex;align-items:baseline;gap:10px}
.brief .b-head small{font-family:var(--sans);font-size:11px;color:var(--ink5);letter-spacing:.06em;margin-left:auto;font-weight:400}

/* 持ち物 */
.items{list-style:none}

.beled{margin-top:4px;max-width:640px}

.beled input{font:inherit;font-size:14px;padding:9px 11px;min-height:42px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.72);color:var(--ink);width:100%}

.bel-tabs button:hover{background:rgba(255,255,255,.55)}

/* 付箋(手書き=人間的なメモの限定アクセント。デモのみ) */
.sticky{font-family:'Klee One','Zen Kaku Gothic New',cursive;font-size:13px;line-height:1.7;padding:14px 15px 12px;border-radius:2px 12px 3px 10px;
  box-shadow:0 10px 24px -12px rgba(34,49,74,.3);position:relative;margin-top:14px}
.sticky::before{content:'';position:absolute;top:-8px;left:16px;width:48px;height:15px;background:rgba(255,255,255,.55);transform:rotate(-3deg);border-left:1px dashed rgba(0,0,0,.05);border-right:1px dashed rgba(0,0,0,.05)}
.sticky.y{background:#fdf3c0;transform:rotate(-.5deg)}

<script>
// ================= shared/10-api.js =================
/* ============================================================================
   admin2 共通 GAS API 層 (vanilla JS・console.html の実プロトコル準拠)
   - 読取 = GET ?action&memberId&params(JSON: {...params, token})。タイムアウト12s。
     ネットワーク断/5xx/429/404 は指数バックオフで最大2回リトライ(読取は冪等)。
     対象4action は軽量読取API優先。2連続失敗で5分間 本体GAS直行にフォールバック。
   - 書込 = POST body=JSON {action,payload,memberId,token} / Content-Type: text/plain。
     二重送信防止のため自動リトライしない。
   - セッション = localStorage connecta.memberId / connecta.token
     (console.html と同一キー=同一オリジンでSSO。consoleログイン済ならそのまま開く)
   ============================================================================ */
window.AdminAPI = (function () {
  'use strict';
  var URL_MAIN = 'https://script.google.com/macros/s/AKfycbxLs1eXm39MHM0lSioBf9ghVFL8p8fIhIdYJpBBweBTCLOFDqWclPhoF66c0FgfrbHg/exec';
  var URL_READ = 'https://script.google.com/macros/s/AKfycbxm-_IBapGbmilVQSzPhsLhL6cMwm8_bIwxyq8Wh8j3IxXjGjBz234EwEohFe18EAY/exec';
  var READ_API_ACTIONS = {
    listEvents: 1, listParticipants: 1, listRegistrations: 1, listTodos: 1,
    // read-api @5 で追加(2026-09-01 B1): イベント新機能の読取+ポータルの遅い3本
    listEventStaffAssignments: 1, listVenues: 1, listEventExpenses: 1, listEventGroups: 1,
    listNews: 1, listMinutesMeetings: 1, listMembers: 1,
    // read-api @listWaitlist 追加済み(2026-09-01): キャンセル待ちの読取
    listWaitlist: 1,
    // read-api 対応済み(2026-09-02 B3): 配信タイムラインの読取
    listEventComms: 1,
    // イベント単体の申込読取(バックエンド実装中の新action。無ければ本体→呼び出し側でlistRegistrationsへフォールバック)
    listEventRegistrations: 1,
  };
  var ROLE_RANK = { '代表': 5, '副代表': 4, 'マネージャー': 3, 'アシマネ': 2, 'メンバー': 1 };
  var onUnauthorized = null; // アプリ側が setOnUnauthorized で登録(認証切れ→ログイン画面へ)

  function mid() { try { return localStorage.getItem('connecta.memberId') || ''; } catch (e) { return ''; } }
  function tok() { try { return localStorage.getItem('connecta.token') || ''; } catch (e) { return ''; } }
  function setSession(id, t) { try { if (id) localStorage.setItem('connecta.memberId', id); if (t) localStorage.setItem('connecta.token', t); } catch (e) {} }
  function clearSession() { try { localStorage.removeItem('connecta.memberId'); localStorage.removeItem('connecta.token'); } catch (e) {} }

  // 認証切れ判定(console.html authFail と同一)。権限不足(FORBIDDEN等)は認証切れ扱いにしない
  function authFail(j) {
    var e = (j && j.error && (j.error.message || j.error)) || '';
    if (/FORBIDDEN|権限がありません|required /i.test(String(e))) return false;
    return !!(j && (j.unauthorized === true || (!j.ok && /AUTH_REQUIRED|認証が必要|認証が切れ|再ログイン|未ログイン|セッション|ログインが必要|unauthorized|expired/i.test(String(e)))));
  }
  function handleResp(j) {
    if (j && j.user !== undefined) window.currentUser = j.user;
    if (authFail(j)) {
      if (typeof onUnauthorized === 'function') onUnauthorized();
      var er = new Error('認証が切れています。再ログインしてください。');
      er._auth = true;
      throw er;
    }
    if (!j || !j.ok) throw new Error((j && j.error && (j.error.message || j.error)) || '取得に失敗しました');
    return j.data;
  }

  // 1回のGET。silent=軽量API用(認証不一致でもログアウトさせず、失敗として本体へ委譲)
  async function fetchAt(base, action, params, timeoutMs, silent) {
    var u = base + '?action=' + encodeURIComponent(action)
      + '&memberId=' + encodeURIComponent(mid())
      + '&params=' + encodeURIComponent(JSON.stringify(Object.assign({}, params, { token: tok() })));
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var to = ctrl ? setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, timeoutMs || 12000) : null;
    var r;
    try { r = await fetch(u, { method: 'GET', signal: ctrl ? ctrl.signal : undefined }); }
    catch (e) {
      if (to) clearTimeout(to);
      var m = String((e && e.message) || '');
      var net = (e && e.name === 'AbortError') || /Load failed|Failed to fetch|NetworkError|network/i.test(m) || m === '';
      var err = new Error((e && e.name === 'AbortError')
        ? '応答に時間がかかっています。通信環境をご確認のうえ再読み込みしてください。'
        : net ? '通信が一時的に不安定です。少し待ってから再読み込みしてください。' : (m || '通信エラー'));
      err._net = net;
      throw err;
    }
    if (to) clearTimeout(to);
    if (!r.ok) {
      var e5 = new Error((r.status >= 500 || r.status === 429)
        ? 'サーバが混み合っています（HTTP ' + r.status + '）。少し待って再読み込みしてください。'
        : ('HTTP ' + r.status));
      // 404を含む理由: GASは並列GET時に一過性404を返すことがある(再送で成功する)
      if (r.status >= 500 || r.status === 429 || r.status === 404) e5._net = true;
      throw e5;
    }
    var t = await r.text();
    var j;
    try { j = JSON.parse(t); }
    catch (e2) { throw new Error('GASからの応答を解析できません。GASの公開設定(全員/自分として実行)を確認してください。'); }
    if (silent) {
      if (j && j.user !== undefined) window.currentUser = j.user;
      if (!j || !j.ok) throw new Error((j && j.error && (j.error.message || j.error)) || 'lite失敗');
      return j.data;
    }
    return handleResp(j);
  }

  var liteFails = 0, liteOff = false;
  async function fetchData(action, params, opts) {
    params = params || {}; opts = opts || {};
    // 対象readは軽量API優先。2回連続で不調なら5分間 本体直行(GAS混雑スパイクは数分で収まる)
    if (URL_READ && !liteOff && READ_API_ACTIONS[action]) {
      try {
        var d = await fetchAt(URL_READ, action, params, Math.min(opts.timeout || 12000, 5000), true);
        liteFails = 0;
        return d;
      } catch (e) {
        if (++liteFails >= 2 && !liteOff) {
          liteOff = true;
          setTimeout(function () { liteOff = false; liteFails = 0; }, 300000);
        }
      }
    }
    var attempt = 0;
    while (true) {
      try { return await fetchAt(URL_MAIN, action, params, opts.timeout); }
      catch (e) {
        if (e && e._net && attempt < 2) {
          attempt++;
          await new Promise(function (r) { setTimeout(r, 400 * attempt); });
          continue;
        }
        throw e;
      }
    }
  }

  // 書込。自動リトライしない(二重送信防止)
  async function postData(action, payload) {
    var r;
    try {
      r = await fetch(URL_MAIN, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, payload: payload || {}, memberId: mid(), token: tok() }),
      });
    } catch (e) {
      var m = String((e && e.message) || '');
      throw new Error(/Load failed|Failed to fetch|NetworkError|network/i.test(m) || m === ''
        ? '通信が一時的に不安定です。もう一度お試しください（二重送信を避けるため自動での再試行はしていません）。'
        : (m || '通信エラー'));
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var t = await r.text();
    var j;
    try { j = JSON.parse(t); }
    catch (e2) { throw new Error('GASからの応答を解析できません。GASの公開設定を確認してください。'); }
    return handleResp(j);
  }

  /* ログイン確定。重要: バックエンドの _validateToken_ は token先頭セグメント(=本来のメンバーID)と
     送信memberIdの一致を要求する。入力IDがメール/別コードだと不一致で直後にログアウトするため、
     user.member.id → token先頭 → r.memberId → 入力ID の順で本来のIDを採用する(console 2943-2945行と同じ)。 */
  function finishLogin(r, typedId) {
    var tk = (r && r.token) || '';
    if (!tk) return false;
    var realId = (r && r.user && r.user.member && r.user.member.id)
      || (String(tk).indexOf('.') > 0 ? String(tk).split('.')[0] : '')
      || (r && r.memberId) || String(typedId || '').trim();
    setSession(realId, tk);
    if (r && r.user !== undefined) window.currentUser = r.user;
    return true;
  }
  // 認証。needsPasswordSet===true が返ったら初回PW設定モードへ(呼び出し側で分岐)
  function login(identifier, password) { return postData('authenticate', { identifier: identifier, password: password }); }
  // 初回パスワード設定(10文字以上)。成功時 token が返る
  function setPassword(identifier, newPassword) { return postData('setPassword', { identifier: identifier, newPassword: newPassword }); }

  // ユーザー形: user.member.{id,name}, user.highestRole, user.highestRank
  function myRank() {
    var u = window.currentUser;
    if (!u || !u.member) return 0;
    if (typeof u.highestRank === 'number') return u.highestRank;
    return ROLE_RANK[u.highestRole] || 0;
  }
  function myName() {
    var m = (window.currentUser && window.currentUser.member) || {};
    return m.nickname || m.name || m['氏名'] || '';
  }
  function myRole() { return (window.currentUser && window.currentUser.highestRole) || ''; }

  return {
    fetchData: fetchData,
    postData: postData,
    login: login,
    setPassword: setPassword,
    finishLogin: finishLogin,
    hasSession: function () { return !!(mid() && tok()); },
    setSession: setSession,
    clearSession: clearSession,
    mid: mid,
    tok: tok,
    myRank: myRank,
    myName: myName,
    myRole: myRole,
    ROLE_RANK: ROLE_RANK,
    setOnUnauthorized: function (fn) { onUnauthorized = fn; },
  };
})();

// ================= event/30-app.js =================
/* ============================================================================
   イベントアプリ — vanilla JS(ポータルと同方式)
   正典: redesign/portal-proto/event-list.html / event-hub.html / event-regs.html / event-prep.html
   ルート(ハッシュ): #/ = 一覧 / #/ev/<id> = ハブ概要 / #/ev/<id>/regs = 申込・決済
                     #/ev/<id>/prep = 準備(本実装) / brief = 運営ブリーフ / groups|belongings = 編集
                     #/ev/<id>/day|after = 準備中(正直な1行)
   方針:
   - デモと実データは同じ描画関数を通す(ビューモデルの出所だけが違う)。
   - バックエンド未実装の新機能(配信タイムライン/準備チェック)は、実データモードでは
     vm 側が null → セクションごと非表示。描画関数は分離済みなので、GAS実装後は
     vm 組立に結線するだけでよい。
     担当レール/収支(B1)+キャンセル待ち(listWaitlist/promoteWaitlist)は結線済み。
   - 実フィールドに無い項目の行は出さない(偽データ・空飾り禁止)。
   - 金銭の書込(決済済みにする/返金)は第1弾では実装しない。ボタンは正典どおり
     出すが、押すと控えめな案内のみ(偽完了禁止)。
   ============================================================================ */
(function () {
  'use strict';
  var API = window.AdminAPI;
  var root = document.getElementById('app');
  var DEMO = /[?&]demo=1/.test(location.search);
  var QS = DEMO ? '?demo=1' : '';

  /* ---------- 小道具 ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function num(x) { return Number(x) || 0; }
  // BE実形は {eventId, entries|items|groups:[...]} のobject包み(evb1系)。旧形(素の配列)も受ける防御的展開。
  function unwrapList(d, key) { return Array.isArray(d) ? d : arr(d && d[key]); }
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  function pad2(n) { return String(n).length < 2 ? '0' + n : String(n); }
  function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function parseYmd(s) {
    var m = /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/.exec(String(s || ''));
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  var NOW = new Date();
  var TODAY = ymd(NOW);
  var YESTER = ymd(new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate() - 1));
  function dateJaFull(d) { return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日(' + WD[d.getDay()] + ')'; }
  function dateJa(d) { return (d.getMonth() + 1) + '月' + d.getDate() + '日(' + WD[d.getDay()] + ')'; }
  function dateSlash(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }
  function money(n) { return String(num(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function dtLabel(iso) { // ISO日時 → 'M/D HH:MM'
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) { d = parseYmd(iso); return d ? dateSlash(d) : ''; }
    return dateSlash(d) + ' ' + d.getHours() + ':' + pad2(d.getMinutes());
  }
  function timeRange(ev) {
    var t = String(ev.time || '').slice(0, 5);
    var e = String(ev.endTime || '').slice(0, 5);
    if (!t) return '';
    return e ? t + '–' + e : t + ' 開始';
  }

  /* ---------- データを防御的に読む ---------- */
  function evTitle(e) { return e.title || e.name || '(無題のイベント)'; }
  function evImage(e) { return e.heroImageUrl || e.posterUrl || e.imageUrl || e.image || ''; }
  function evStatus(e) { return String(e.status || ''); }
  function evCancelled(e) { return /中止|アーカイブ/.test(evStatus(e)); }
  function evPublished(e) { return /公開中/.test(evStatus(e)); }
  function evDraft(e) { return /下書き/.test(evStatus(e)); }
  function evDate(e) { return String(e.date || '').slice(0, 10); }
  function evEndDate(e) { return String(e.endDate || '').slice(0, 10) || evDate(e); }
  function evPast(e) { var d = evEndDate(e); return !!d && d < TODAY; }
  function evToday(e) {
    if (evDate(e) === TODAY) return true;
    var ss = arr(e.sessions);
    for (var i = 0; i < ss.length; i++) if (String(ss[i].date || '').slice(0, 10) === TODAY) return true;
    return false;
  }
  /* ---------- 複数日(セッション)ヘルパ ----------
     consoleと同じデータ実形: listEvents は multi のとき e.format==='multi' と
     e.sessions=[{id,name,date:'YYYY-MM-DD',startTime,endTime,venue}](日付昇順) を返す。
     申込行(listRegistrations)は sessionId(空=イベント全体)/sessionOrder/sessionLabel を持ち、
     参加費は日付ソートの先頭行(=Day1)に全額計上・Day2以降は金額0の兄弟行(同 applicationId)。 */
  function evSess(e) {
    if (!e || e.format !== 'multi') return [];
    return arr(e.sessions).filter(function (s) { return s && s.date; }).slice()
      .sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
  }
  function evIsMulti(e) { return evSess(e).length > 1; }
  function dayLabelMap(e) { // sessionId -> {n, label:'Day1', md:'9/14'}
    var m = {};
    evSess(e).forEach(function (s, i) {
      var d = parseYmd(s.date);
      m[String(s.id)] = { n: i + 1, label: 'Day' + (i + 1), md: d ? dateSlash(d) : '' };
    });
    return m;
  }
  function todayDayOf(e) { // きょうのDay判定=セッションdate===今日
    var ss = evSess(e);
    for (var i = 0; i < ss.length; i++) if (String(ss[i].date).slice(0, 10) === TODAY) return { n: i + 1, total: ss.length };
    return null;
  }
  function regStatus(r) { return String(r.status || ''); }
  function regCancelled(r) { return /キャンセル/.test(regStatus(r)); }
  function regPaid(r) { return r.paid === true || r.paid === 'TRUE' || /決済済み|チェックイン/.test(regStatus(r)); }
  function regChecked(r) { return /チェックイン/.test(regStatus(r)); }
  function regRefundWait(r) { return regCancelled(r) && regPaid(r) && !r.refundedAt && !(num(r.refundAmount) > 0); }
  function regActive(r) { return !r.isTest && !regCancelled(r); }

  /* ---------- イベント別 集計(非PII: 件数と日次カウントのみ。キャッシュ可) ----------
     multiday監査の教訓を継承:
     - KPIユニーク化: 複数日は1申込=Day数ぶんの行になるため、applicationId で1申込に束ねて数える。
     - 0円行(Day2以降)は未決済に数えない。ただし同一申込の課金行(Day1)が未決済なら申込ごと未決済(兄弟未決済検知)。
     - 収入/決済方法は課金行(金額>0)だけで数える(0円行は入金ではない)。
     - dayAggs: sessionId別の申込/決済/未決済/チェックイン(''=日程未指定の救済対象)。 */
  function appKeyOf(r) { return r.eventId + '||' + String(r.applicationId || r.userId || r.id || ''); }
  function newAgg() { return { applied: 0, paid: 0, unpaid: 0, checked: 0, cancels: 0, refundWait: 0, companions: 0, days: {}, yesterday: 0, first: 0, repeat: 0, firstKnown: 0, pay: {}, revenue: 0, unpaidAmt: 0, dayAggs: {} }; }
  function buildAggs(regs, parts) {
    var pmap = null;
    if (parts) {
      pmap = {};
      arr(parts).forEach(function (p) { if (p && p.id) pmap[String(p.id).trim()] = p; });
    }
    var by = {};
    function aggOf(eid) { return by[eid] || (by[eid] = newAgg()); }
    // 1) 申込(application)単位に束ねる
    var apps = {};
    var order = [];
    arr(regs).forEach(function (r) {
      if (!r || r.isTest || !r.eventId) return;
      var k = appKeyOf(r);
      var g = apps[k];
      if (!g) { g = apps[k] = { eventId: r.eventId, rows: [], cans: [] }; order.push(k); }
      if (regCancelled(r)) g.cans.push(r); else g.rows.push(r);
    });
    // 2) 行単位の金銭(課金行のみ)+返金待ち
    arr(regs).forEach(function (r) {
      if (!r || r.isTest || !r.eventId) return;
      var a = aggOf(r.eventId);
      if (regCancelled(r)) {
        // 返金待ちは課金行(金額>0)だけ数える(0円の兄弟行は決済フラグ継承のため二重計上しない)
        if (regRefundWait(r) && num(r.amount) > 0) a.refundWait++;
        return;
      }
      if (num(r.amount) > 0) {
        if (regPaid(r)) {
          a.revenue += num(r.amount);
          var m = String(r.actualPaymentMethod || '').trim();
          if (m) a.pay[m] = (a.pay[m] || 0) + 1;
        } else {
          a.unpaidAmt += num(r.amount);
        }
      }
    });
    // 3) 申込単位のユニーク集計+Day別集計
    order.forEach(function (k) {
      var g = apps[k];
      var a = aggOf(g.eventId);
      if (!g.rows.length) { if (g.cans.length) a.cancels++; return; } // 全行キャンセル=1申込のキャンセル
      // 申込の決済状態: 単日行(sessionIdなし)=従来どおり !regPaid /
      // セッション行(複数日)=課金行(金額>0)が未決済のときだけ未決済(0円行=Day2以降は支払対象なし)
      var appUnpaid = g.rows.some(function (r) { return !regPaid(r) && (num(r.amount) > 0 || !r.sessionId); });
      a.applied++;
      if (appUnpaid) a.unpaid++; else a.paid++;
      if (g.rows.some(regChecked)) a.checked++;
      if (g.rows.some(function (r) { return num(r.companionsCount) > 0; })) a.companions++;
      var first = '';
      g.rows.forEach(function (r) {
        var d = String(r.appliedAt || r.createdAt || '').slice(0, 10);
        if (d && (!first || d < first)) first = d;
        // Day別: そのDayの申込行(0円行の決済状態は兄弟=申込単位で判定)
        var sid = String(r.sessionId || '');
        var da = a.dayAggs[sid] || (a.dayAggs[sid] = { applied: 0, paid: 0, unpaid: 0, checked: 0 });
        da.applied++;
        if (appUnpaid) da.unpaid++; else da.paid++;
        if (regChecked(r)) da.checked++;
      });
      if (first) {
        a.days[first] = (a.days[first] || 0) + 1;
        if (first === YESTER) a.yesterday++;
      }
      if (pmap) {
        var p = pmap[String(g.rows[0].userId || '').trim()];
        if (p) {
          a.firstKnown++;
          if (num(p.events) <= 0) a.first++; else a.repeat++;
        }
      }
    });
    return by;
  }
  // 「このペースだと満員」予測: 直近7日の申込ペースから線形概算(定員があるときのみ・過信させない文言)
  function fullForecast(ev, a) {
    if (!ev || !a || !(num(ev.capacity) > 0) || !evPublished(ev) || evPast(ev)) return '';
    var remain = num(ev.capacity) - a.applied;
    if (remain <= 0) return '満員';
    var last7 = 0;
    for (var i = 0; i < 7; i++) {
      var d = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate() - i);
      last7 += a.days[ymd(d)] || 0;
    }
    if (last7 <= 0) return '';
    var daysTo = Math.ceil(remain / (last7 / 7));
    if (daysTo > 60) return '';
    var fd = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate() + daysTo);
    var ed = parseYmd(evDate(ev));
    if (ed && fd.getTime() > ed.getTime()) return ''; // 開催日までに満員にならない概算なら言わない
    return 'このペースだと<span class="nb">' + esc(dateSlash(fd)) + 'ごろ満員</span>の見込み';
  }
  // 下書きの公開前チェック(実フィールドから判定できるものだけ)
  function draftChecks(ev) {
    var c = [];
    if (!evDate(ev) && !arr(ev.sessions).length) c.push('日付未設定');
    if (!ev.venue) c.push('会場未定');
    if (!evImage(ev)) c.push('写真なし');
    if (!(num(ev.fee) > 0) && !ev.feeType) c.push('料金未設定');
    return c;
  }

  /* ---------- 画面の骨格(題字+アプリ切替は全状態で共通) ---------- */
  function mastheadHtml(o) {

      nav = '<nav class="edition" aria-label="アプリ切替">' + tabs + '<span class="spacer"></span></nav>';

      (sub ? sub + ' ・ ' : '') + esc(dateJaFull(NOW)) + '</span></footer>';
  }

  function featureHtml(F) {

      '<h2>' + esc(F.title) + '</h2>' +
      (F.metaHtml ? '<div class="meta">' + F.metaHtml + '</div>' : '');
    if (F.nums && F.nums.length) {
      h += '<div class="f-nums glass">' + F.nums.map(function (n) {
        return '<div class="n' + (n.hot ? ' hot' : '') + '"><div class="v">' + esc(n.v) +
          (n.unit ? '<small>' + esc(n.unit) + '</small>' : '') + '</div><div class="l">' + n.labelHtml + '</div></div>';
      }).join('') + '</div>';

    arr(F.crew).forEach(function (c, i) {

        (c.facesHtml ? '<span class="faces">' + c.facesHtml + '</span>' : '') +
        '<span>' + c.textHtml + '</span></div>';
    });
    h += '<div class="f-cta"><a class="btn sub" href="' + esc(F.ctaHref || '#') + '">イベントを開く</a></div>';
    h += '</div></article>';
    return h;
  }

    if (vm.upcoming === null) return h + '<div class="up-empty glass">読み込み中…</div>';
    if (!vm.upcoming.length) return h + '<div class="up-empty glass">' + esc(vm.upcomingEmpty || '開催予定のイベントはありません。「新しいイベント」から作成できます。') + '</div>';
    h += '<nav class="up glass">' + vm.upcoming.map(function (u) {
      return '<a href="' + esc(u.href) + '">' +

        '<span class="date">' + esc(u.dateV) + '<small>' + esc(u.dateSmall || '') + '</small></span>' +
        '<span class="ttl">' + esc(u.ttl) + (u.st ? '<span class="st ' + esc(u.st.cls) + '">' + esc(u.st.label) + '</span>' : '') + '</span>' +
        '<span class="sub">' + (u.subHtml || '') + (u.facesHtml ? '<span class="faces">' + u.facesHtml + '</span>' : '') + '</span>' +
        '<span class="mi go">arrow_forward</span></a>';
    }).join('') + '</nav>';

  function pastHtml(vm) {
    var h = '<h2 class="sec">終わったイベント</h2>';
    if (vm.past === null) return h + '<div class="up-empty">読み込み中…</div>';
    if (!vm.past.rows.length) return h + '<div class="up-empty">終わったイベントはまだありません。</div>';
    h += '<nav class="arch">' + vm.past.rows.map(function (p) {
      return '<a href="' + esc(p.href) + '">' +
        (p.img ? '<img class="th" src="' + esc(p.img) + '" alt="">' : '<span class="th empty"><span class="mi">image</span></span>') +
        '<span class="date">' + esc(p.date) + '</span>' +
        '<span class="ttl">' + esc(p.ttl) + '</span>' +
        '<span class="m">' + (p.m1 || '') + '</span>' +
        '<span class="m">' + (p.m2 || '') + '</span>' +
        '<span class="m">' + (p.m3 || '') + '</span>' +
        '<span class="mi go">arrow_forward</span></a>';
    }).join('') + '</nav>';
    if (vm.past.total > vm.past.rows.length) {
      h += '<a class="arch-more" href="#">過去' + vm.past.total + '件をすべて見る<span class="mi" style="font-size:16px">arrow_forward</span></a>';
    }

  }
  function renderList(vm) {
    document.body.classList.remove('has-tabbtn');
    root.innerHTML = mastheadHtml({ mePhoto: vm.mePhoto, showHq: vm.showHq }) +
      '<div class="pagehead"><h1>イベント</h1><span class="count">' + esc(vm.countLine || '') + '</span>' +
      '<span class="spacer"></span><a class="btn" href="#" id="ev-new"><span class="mi">add</span>新しいイベント</a></div>' +
      '<div id="ev-new-note"></div>' +
      (vm.feature ? featureHtml(vm.feature)
        : '<div class="feature nophoto"><div class="f-body"><div class="kicker">イベント</div>' +
          '<h2>' + esc(vm.featureEmpty || '開催予定のイベントはありません。') + '</h2>' +
          '<div class="meta">「新しいイベント」から作成すると、ここに特集として載ります。</div></div></div>') +
      upcomingHtml(vm) + pastHtml(vm) + colophonHtml('');
    bindRetry();
    var nb = document.getElementById('ev-new');
    if (nb) nb.addEventListener('click', function (e) {
      e.preventDefault();
      document.getElementById('ev-new-note').innerHTML =
        '<p class="opnote">イベントの作成はこの画面ではまだできません。当面は console から作成してください。</p>';
    });

  /* ---------- 一覧: 実データ → ビューモデル ---------- */
  function upRowSub(ev, a) {
    if (evDraft(ev)) {
      var cs = draftChecks(ev);
      if (!cs.length) return '';
      return '<span class="warn-t">公開前チェック' + cs.length + '件</span> ― ' +
        cs.map(function (c) { return '<span class="nb">' + esc(c) + '</span>'; }).join('・') + '。';
    }
    var parts = [];
    var td = todayDayOf(ev);
    if (td && td.total > 1) parts.push('きょうは<span class="nb">Day' + td.n + '/' + td.total + '日目</span>');
    if (a) {
      parts.push('申込 ' + a.applied + (num(ev.capacity) > 0 ? '/' + num(ev.capacity) : '件'));
      if (a.yesterday > 0) parts.push('きのう<span class="nb">+' + a.yesterday + '名</span>');
      var fc = fullForecast(ev, a);
      if (fc === '満員') parts.push('<span class="nb">満員</span>です');
      else if (fc) parts.push(fc);
    }
    return parts.length ? parts.join(' ― ') + '。' : '';
  }
  function buildListModel(M) {
    var vm = { mePhoto: M.me && M.me.photo, showHq: (M.me && M.me.rank >= 3) };
    var events = arr(M.events).filter(function (e) { return e && !evCancelled(e); });
    var aggs = M.aggs || null;
    function aggOf(e) { return aggs ? (aggs[e.id] || newAgg()) : null; }

    var upcoming = events.filter(function (e) { return !evPast(e); });
    var past = arr(M.events).filter(function (e) { return e && evPast(e) && !/中止/.test(evStatus(e)); });
    vm.countLine = '開催予定 ' + upcoming.length + '件 ・ 過去 ' + past.length + '件';

    // 特集: きょう開催 > 直近の公開中
    var featured = null;
    upcoming.forEach(function (e) { if (evToday(e) && !featured) featured = e; });
    if (!featured) {
      upcoming.forEach(function (e) {
        if (!evPublished(e) || !evDate(e)) return;
        if (!featured || evDate(e) < evDate(featured)) featured = e;
      });
    }
    if (featured) {
      var fa = aggOf(featured);
      var meta = [];
      var tr = timeRange(featured);
      if (tr) meta.push('<span class="nb">' + esc(tr) + '</span>');
      if (featured.venue) meta.push(esc(featured.venue));
      if (num(featured.capacity) > 0) meta.push('<span class="nb">定員' + num(featured.capacity) + '名</span>');
      var crew = [];
      if (fa && M.partsOk && fa.firstKnown > 0) {
        var t = '参加者は';
        var seg = [];
        if (fa.repeat > 0) seg.push('リピーター' + fa.repeat + '名');
        if (fa.first > 0) seg.push('初参加<span class="nb">' + fa.first + '名</span>');
        t += seg.join('+') || '—';
        if (fa.yesterday > 0) t += ' ・ きのう<span class="nb">+' + fa.yesterday + '名</span>';
        crew.push({ facesHtml: '', textHtml: t });
      } else if (fa && fa.yesterday > 0) {
        crew.push({ facesHtml: '', textHtml: 'きのう<span class="nb">+' + fa.yesterday + '名</span>の申込' });
      }
      var ftd = todayDayOf(featured); // 開催中の複数日: 何日目かを特集kickerに
      vm.feature = {
        kicker: evToday(featured)
          ? (ftd && ftd.total > 1 ? 'きょう開催 ・ <span class="nb">Day' + ftd.n + '/' + ftd.total + '日目</span>' : 'きょう開催 ・ 進行中')
          : (evDraft(featured) ? '次号 ・ 下書き' : '次回イベント'),
        title: evTitle(featured),
        metaHtml: (evToday(featured) ? '' : '<span class="nb">' + esc(evDate(featured) ? dateJa(parseYmd(evDate(featured))) : '日付未定') + '</span> ・ ') + meta.join(' ・ '),
        photo: evImage(featured) ? { src: evImage(featured), cap: '' } : null,
        nums: fa ? [
          { v: String(fa.applied), unit: '名', labelHtml: '申込' },
          { v: String(fa.paid), unit: '名', labelHtml: '決済済み' },
          { v: String(fa.unpaid), unit: '名', labelHtml: '未決済', hot: fa.unpaid > 0 },
        ].concat(num(featured.capacity) > 0
          ? [{ v: String(Math.max(0, num(featured.capacity) - fa.applied)), unit: '枠', labelHtml: '残り' }] : []) : null,
        noteHtml: (!M.regsOk) ? '申込数を取得できませんでした。<button type="button" id="ev-retry">再読み込み</button>' : '',
        crew: crew,
        ctaHref: '#/ev/' + encodeURIComponent(featured.id),
      };
    } else {
      vm.feature = null;
    }

    // これから(特集を除く・日付順・日付なしは最後)
    vm.upcoming = upcoming
      .filter(function (e) { return !featured || e.id !== featured.id; })
      .sort(function (a, b) { return (evDate(a) || '9999').localeCompare(evDate(b) || '9999'); })
      .map(function (e) {
        var d = parseYmd(evDate(e));
        return {
          href: '#/ev/' + encodeURIComponent(e.id),
          img: evImage(e) || null,
          dateV: d ? dateSlash(d) : '—',
          dateSmall: d ? WD[d.getDay()] + '曜' : '日付未定',
          ttl: evTitle(e),
          st: evDraft(e) ? { cls: 'draft', label: '下書き' } : (evPublished(e) ? { cls: 'pub', label: '公開中' } : null),
          subHtml: upRowSub(e, aggOf(e)),
          facesHtml: '',
        };
      });

    // 終わったイベント(新しい順5件+件数)
    var pastSorted = past.slice().sort(function (a, b) { return (evEndDate(b) || '').localeCompare(evEndDate(a) || ''); });
    vm.past = {
      total: past.length,
      rows: pastSorted.slice(0, 5).map(function (e) {
        var d = parseYmd(evEndDate(e));
        var a = aggOf(e);
        var m1 = '', m2 = '';
        if (a) {
          m1 = '参加 <b>' + a.applied + '</b>名';
          if (a.checked > 0 && a.applied > 0) m2 = '出席率 <b>' + Math.round(a.checked / a.applied * 100) + '</b>%';
        }
        return {
          href: '#/ev/' + encodeURIComponent(e.id),
          img: evImage(e) || null,
          date: d ? dateSlash(d) : '',
          ttl: evTitle(e),
          m1: m1, m2: m2,
          m3: e.mementoPhotoUrl ? '写真公開済み' : '',
        };
      }),
    };
    return vm;
  }

  /* ============================================================================
     ハブ共通ヘッダ(見出しブロック+タブ+数字バンド)

  function tabbarHtml(tabs, reception) {
    var base = tabs.base;
    function tab(id, label, extra) {
      var href = id === 'hub' ? base : base + '/' + id;
      return '<a href="' + href + '"' + (tabs.active === id ? ' aria-current="page"' : '') + '>' + label + (extra || '') + '</a>';

    return '<nav class="tabbar glass" aria-label="イベント内">' +

  function hubTrendModel(ev, a, M) {
    if (!a) return null;
    var dayKeys = Object.keys(a.days).sort();
    if (!dayKeys.length) return { empty: evDraft(ev) ? 'まだ公開前です。公開すると日次の申込がここに載ります。' : 'まだ申込がありません。' };
    var endD = parseYmd(TODAY);
    var startD = parseYmd(dayKeys[0]);
    var span = Math.round((endD - startD) / 86400000) + 1;
    if (span > 30) { startD = new Date(endD.getFullYear(), endD.getMonth(), endD.getDate() - 29); span = 30; }
    if (span < 7) { startD = new Date(endD.getFullYear(), endD.getMonth(), endD.getDate() - 6); span = 7; }
    var days = [];
    var max = 1;
    for (var i = 0; i < span; i++) {
      var dd = new Date(startD.getFullYear(), startD.getMonth(), startD.getDate() + i);
      var k = ymd(dd);
      var c = a.days[k] || 0;
      if (c > max) max = c;
      days.push({ k: k, d: dd, c: c });
    }
    var pubDay = String(ev.publishAt || '').slice(0, 10);
    var bars = days.map(function (x) {
      var b = { h: x.c > 0 ? Math.max(8, Math.round(x.c / max * 100)) : 2 };
      if (x.k === pubDay) { b.cls = 'mark'; b.em = '公開'; }
      if (x.k >= YESTER && x.c > 0) b.cls = 'hi';
      if (x.k === YESTER && a.yesterday > 0) { b.cls = 'hi'; b.em = 'きのう +' + a.yesterday; }
      return b;
    });
    var midD = days[Math.floor(days.length / 2)].d;
    var T = {
      bars: bars,
      x: [dateSlash(days[0].d) + (days[0].k === pubDay ? ' 公開' : ''), dateSlash(midD), 'きょう'],
      notes: a.yesterday > 0 ? [{ cls: 'hi', text: 'きのう +' + a.yesterday + '名' }] : [],
    };
    // 内訳(判定できる要素だけ。判定不能なら省略)
    var mix = [];
    if (M.partsOk && a.firstKnown > 0) mix.push('初参加<b>' + a.first + '名</b> ・ リピーター<b>' + a.repeat + '名</b>');
    if (a.companions > 0) mix.push('同伴あり<b>' + a.companions + '組</b>');
    if (a.cancels > 0) mix.push('キャンセル累計<b>' + a.cancels + '件</b>');
    if (mix.length) T.mixHtml = a.applied + '名の内訳 ― ' + mix.join(' ・ ') + '。';
    return T;
  }

  function buildRegRowsMulti(M, ev, mine) {

  /* ---- 未決済の回収キュー(申込単位。課金行=決済確定の対象) ---- */
  function buildDayQueue(ev, regs, sel) {

    var mine = arr(regs).filter(function (r) { return r && !r.isTest && r.eventId === ev.id && regActive(r); });
    var apps = {};
    var order = [];
    mine.forEach(function (r) {
      var k = appKeyOf(r);
      if (!apps[k]) { apps[k] = []; order.push(k); }
      apps[k].push(r);
    });
    var lmap = dayLabelMap(ev);
    var rows = [];
    var totalAmt = 0;
    order.forEach(function (k) {
      var g = apps[k];
      if (sel && !g.some(function (r) { return String(r.sessionId || '') === String(sel); })) return; // Dayセグメント絞り
      var unpaidRows = g.filter(function (r) { return num(r.amount) > 0 && !paidFlag(r); });
      if (!unpaidRows.length) return;
      var moneyRow = unpaidRows[0];
      var amt = 0;
      unpaidRows.forEach(function (r) { amt += num(r.amount); });
      totalAmt += amt;
      var atVenue = g.some(rowAtVenue);
      var lm = lmap[String(moneyRow.sessionId || '')];
      var notes = [];
      if (moneyRow.note) notes.push(String(moneyRow.note).slice(0, 26));
      if (num(moneyRow.companionsCount) > 0) notes.push('同伴' + num(moneyRow.companionsCount) + '名');
      if (evIsMulti(ev) && lm) notes.push('参加費は' + lm.label + 'の行');

        note: notes.join(' ・ '),

  function buildDayGroups(ev, regs, sel) {
    var groups = groupsOf(ev.id);
    if (groups === null || regs === null) return null;
    var list = arr(groups);
    var note = '';
    if (evIsMulti(ev) && sel) {
      var own = list.filter(function (g) { return String((g && g.sessionId) || '') === String(sel); });
      if (own.length) list = own;
      else {
        list = list.filter(function (g) { return !(g && g.sessionId); });
        if (list.length) note = 'このDay専用の班分けはありません ― 全日共通を表示中。';
      }
    }
    if (!list.length) return { rows: [], note: '' };
    var checked = {};
    arr(regs).forEach(function (r) {
      if (!r || r.isTest || r.eventId !== ev.id || !regActive(r) || !rowAtVenue(r)) return;
      if (sel && String(r.sessionId || '') !== String(sel)) return;
      var uid = String(r.userId || '').trim();
      if (uid) checked[uid] = 1;

    var inGroup = {};
    var rows = list.map(function (g) {
      var ids = arr(g.participantIds).map(function (x) { return String(x).trim(); });
      ids.forEach(function (id) { inGroup[id] = 1; });
      var x = ids.filter(function (id) { return checked[id]; }).length;
      return { name: String(g.name || ''), note: String(g.note || ''), x: x, y: ids.length, full: ids.length > 0 && x >= ids.length };
    });
    var loose = 0;
    Object.keys(checked).forEach(function (id) { if (!inGroup[id]) loose++; });

  function galleryVisible(g) {
    var out = [];
    arr(g).forEach(function (x) {
      if (typeof x === 'string') { if (x) out.push(x); }
      else if (x && typeof x === 'object' && x.u && !x.h) out.push(String(x.u));
    });
    return out;
  }
  function galleryHiddenCount(g) {

  function pubInfo(at) { // 公開日時 → {past, label:'9/6(日) 12:00'}
    if (!at) return null;
    var d = new Date(String(at).replace(' ', 'T'));
    if (isNaN(d.getTime())) { d = parseYmd(String(at)); if (!d) return null; }
    return { past: d.getTime() <= Date.now(), label: dateSlash(d) + '(' + WD[d.getDay()] + ') ' + d.getHours() + ':' + pad2(d.getMinutes()) };
  }
  function buildAfterPhotos(ev) {
    var cover = String(ev.mementoPhotoUrl || '');
    var vis = galleryVisible(ev.mementoGallery);
    var hidden = galleryHiddenCount(ev.mementoGallery);
    var total = (cover ? 1 : 0) + vis.length;
    var days = null;
    if (evIsMulti(ev)) {
      var ss = fullSessions(ev);
      if (ss !== null) {
        var lmap = dayLabelMap(ev);
        days = [];
        arr(ss).forEach(function (s) {
          if (!s) return;
          var c2 = String(s.mementoPhotoUrl || '');
          var v2 = galleryVisible(s.mementoGallery);
          var lm = lmap[String(s.id)];
          var cnt = (c2 ? 1 : 0) + v2.length;
          total += cnt;
          days.push({
            label: lm ? lm.label + (lm.md ? ' ' + lm.md : '') : String(s.name || ''),
            count: cnt, pub: pubInfo(s.mementoPublishAt),
          });
        });

  function buildAfterSat(ev, checkedApps) {

    var surveys = arr(s.surveys);
    if (!surveys.length) return { none: true };
    var resps = arr(s.resps);
    var npsV = resps.filter(function (r) { return r && r.nps !== null && r.nps !== undefined; });
    var pro = npsV.filter(function (r) { return num(r.nps) >= 9; }).length;
    var det = npsV.filter(function (r) { return num(r.nps) <= 6; }).length;

  var ROLE_PRESETS = ['受付', '司会', '写真', '救護', '誘導'];
  var staffEd = { evId: '', inited: false, rows: [], busy: false, err: '', notice: '' };
  function editChrome() {
    if (DEMO) return { mePhoto: 'https://i.pravatar.cc/56?img=47', showHq: true };
    return { mePhoto: M.me && M.me.photo, showHq: !!(M.me && M.me.rank >= 3) };
