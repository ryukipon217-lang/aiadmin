  if(fOwner)rows=rows.filter(a=>a.owner===fOwner);
  if(query){const q=query.toLowerCase();rows=rows.filter(app=>{const ap=findAp(app.applicantId);return (ap.name+ap.kana+app.position+ap.email+(app.tags||[]).join('')).toLowerCase().includes(q);});}
  const selIds=Object.keys(sel).filter(k=>sel[k]&&rows.some(r=>r.id===k));
  const allSel=rows.length>0&&rows.every(r=>sel[r.id]);
  const clearSel=()=>setSel({});
  return (
    <div>
      <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:12,flexWrap:'wrap'}}>
        <div className="seg">{views.map(([k,l])=>(<b key={k} className={filter===k?'on':''} onClick={()=>setFilter(k)}>{l}</b>))}</div>
        <div style={{flex:1}}/><button className={`btn sm ${showF?'prim':''}`} onClick={()=>setShowF(v=>!v)}><Sym i="filter_list" s={{fontSize:16}}/>絞り込み</button>
      </div>
      <div style={{display:'flex',gap:7,alignItems:'center',marginBottom:12,flexWrap:'wrap'}}>
        <span className="muted" style={{fontSize:12}}>保存ビュー (§78):</span>
        {SAVED_VIEWS.map(([k,l])=>(<span key={k} className={`selchip ${saved===k?'on':''}`} style={{padding:'5px 11px',fontSize:12}} onClick={()=>setSaved(saved===k?'':k)}>{l}</span>))}
      </div>
      {showF&&<div className="card pad" style={{marginBottom:12,display:'flex',gap:14,alignItems:'center',flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}><span className="flbl" style={{margin:0}}>応募経路</span><select className="field" style={{width:'auto',padding:'6px 9px'}} value={fSource} onChange={e=>setFSource(e.target.value)}><option value="">すべて</option>{SOURCES.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select></div>
        <div style={{display:'flex',alignItems:'center',gap:8}}><span className="flbl" style={{margin:0}}>担当</span><select className="field" style={{width:'auto',padding:'6px 9px'}} value={fOwner} onChange={e=>setFOwner(e.target.value)}><option value="">すべて</option>{['hr','r1','r2','rep'].map(u=><option key={u} value={u}>{uname(u)}</option>)}</select></div>
        <span className="muted" style={{fontSize:12}}>該当 {rows.length}件</span>
        {(fSource||fOwner)&&<button className="btn sm ghost" onClick={()=>{setFSource('');setFOwner('');}}>クリア</button>}
      </div>}
      {selIds.length>0&&<div className="card pad" style={{marginBottom:12,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',background:'var(--blue-soft)',border:'1px solid var(--blue-bd)'}}>
        <b style={{fontSize:13,color:'var(--blueh)'}}>{selIds.length}件を選択中</b>
        <select className="field" style={{width:'auto',padding:'6px 9px'}} value="" onChange={e=>{if(e.target.value){dispatch({type:'bulkAssign',ids:selIds,owner:e.target.value});clearSel();}}}><option value="">担当を変更…</option>{['hr','r1','r2','rep'].map(u=><option key={u} value={u}>{uname(u)}</option>)}</select>
        <button className="btn sm" onClick={()=>{dispatch({type:'bulkTag',ids:selIds,tag:'要対応'});clearSel();}}><Sym i="label" s={{fontSize:15}}/>タグ「要対応」</button>
        <button className="btn sm" onClick={()=>{dispatch({type:'bulkRemind',ids:selIds});clearSel();}}><Sym i="send" s={{fontSize:15}}/>リマインド送信</button>
        <span className="fhint">採用・不採用の一括操作は追加確認が必要です (§79)</span>
        <div style={{flex:1}}/><button className="btn sm ghost" onClick={clearSel}>選択解除</button>
      </div>}
      <div className="card" style={{overflow:'hidden'}}>
        <table className="tbl">
          <thead><tr><th style={{width:34}}><span className="chkbox" style={{border:`1.5px solid ${allSel?'var(--blue)':'var(--line2)'}`,background:allSel?'var(--blue)':'#fff',cursor:'pointer'}} onClick={()=>{if(allSel)clearSel();else{const n={};rows.forEach(r=>n[r.id]=true);setSel(n);}}}>{allSel&&<Sym i="check" s={{fontSize:13,color:'#fff'}}/>}</span></th><th>応募者 / 人物</th><th>応募ポジション</th><th>状況ラベル</th><th>次のアクション</th><th>担当</th><th>採用判断</th></tr></thead>
          <tbody>
            {rows.map(app=>{
              const ap=findAp(app.applicantId),st=operationalStatus(app),na=nextActionOf(app),dec=latestDecision(app.id);
              const other=applications.filter(x=>x.applicantId===app.applicantId&&x.id!==app.id).length, on=!!sel[app.id];
              return <tr key={app.id} className="trow" onClick={()=>go('detail',app.id)}>
                <td onClick={e=>{e.stopPropagation();setSel(s=>({...s,[app.id]:!s[app.id]}));}}><span className="chkbox" style={{border:`1.5px solid ${on?'var(--blue)':'var(--line2)'}`,background:on?'var(--blue)':'#fff',cursor:'pointer'}}>{on&&<Sym i="check" s={{fontSize:13,color:'#fff'}}/>}</span></td>
                <td><div className="nm"><Avatar ap={ap} size={36} photo/><div><b>{ap.name}</b>{other>0&&<span className="tag" style={{marginLeft:6,fontSize:10}}>他{other}件</span>}{(app.tags||[]).filter(t=>t==='要対応').map(t=><span key={t} className="tag" style={{marginLeft:5,fontSize:10,background:'var(--amber-soft)',borderColor:'var(--amber-bd)',color:'#9a6c14'}}>🏷 {t}</span>)}<div className="mt">{srcLabel(app.source)}{app.dupOf&&' · ⚠ 重複候補'}</div></div></div></td>
                <td style={{color:'var(--ink)',fontWeight:500}}>{app.position}<div className="mt mono" style={{color:'var(--ink4)'}}>#{app.code}</div></td>
                <td><div className="labelwrap">{st.labels.slice(0,3).map((l,i)=><Chip key={i} tone={l.tone} dot={false}>{l.text}</Chip>)}</div></td>
                <td>{na?<div><div style={{fontWeight:500,color:'var(--ink)'}}>{na.title}</div><div className="mt" style={{color:new Date(na.dueAt)<NOW?'var(--red)':'var(--ink3)'}}>{rel(na.dueAt)}</div></div>:<span className="muted">—</span>}</td>
                <td><span className="tag">{uname(app.owner)}</span></td>
                <td>{dec?<Chip tone={dec.type==='hire'?'green':dec.type==='reject'||dec.type==='withdrawn'?'red':dec.type==='reopen'?'amber':'slate'}>{decLabel(dec.type)}</Chip>:<span className="muted">未</span>}</td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------- Detail ---------- */
function Detail({appId, go, dispatch, viewerRole}){
  const [tab,setTab]=useState('overview');
  const [modal,setModal]=useState(null);
  const [editAct,setEditAct]=useState(null);
  const [actTarget,setActTarget]=useState(null);
  const [dupDismiss,setDupDismiss]=useState(false);
  const [aiOn,setAiOn]=useState(true);
  const app=findApp(appId),ap=findAp(app.applicantId);
  const st=operationalStatus(app),dec=latestDecision(app.id);
  const acts=listBy(activities,app.id).slice().sort((a,b)=>b.seq-a.seq);
  const roles=listBy(appRoles,app.id);
  const myEvals=listBy(evals,app.id);
  const myAi=ai.filter(a=>a.applicationId===app.id).sort((a,b)=>b.version-a.version)[0];
  const tl=buildTimeline(app.id);
  const otherApps=applications.filter(x=>x.applicantId===app.applicantId&&x.id!==app.id);
  const openTasks=listBy(tasks,app.id).filter(t=>t.status==='open');
  const upcoming=acts.filter(a=>a.plannedAt&&OPEN_ST.includes(a.status)).sort((a,b)=>new Date(a.plannedAt)-new Date(b.plannedAt));
  const inProg=acts.filter(a=>OPEN_ST.includes(a.status));
  const tmpl=templates[app.templateVer];
  const recCounts={hire:0,hold:0,reject:0}; myEvals.forEach(e=>recCounts[e.rec]!=null&&recCounts[e.rec]++);
  const split=new Set(myEvals.map(e=>e.rec)).size>1;
  const age=ageOf(ap.birth);
  const elapsed=Math.round((NOW-new Date(app.createdAt))/MS.d);
  const isHired=dec?.type==='hire'||app.lifecycle==='post_decision';
  const maskPII=['interviewer','viewer'].includes(viewerRole);
  const canRecruit=['super','radmin','recruiter'].includes(viewerRole);
  const canDecide=['super','radmin'].includes(viewerRole);

  const tone=t=>({blue:'--blue',teal:'--teal',amber:'--amber',red:'--red',violet:'--violet',green:'--green',slate:'--slate'}[t]);

  const TL = ({rows})=>(
    <div className="tl">
      {rows.map((e,i)=>(
        <div key={i} className="tlr">
          <div className="td tt">{fmtMD(e.at).replace('/','月')+'日'}<small>{pad(new Date(e.at).getHours())}:{pad(new Date(e.at).getMinutes())}</small></div>
          <div className="tk tt"><span className="nd" style={{background:`var(${tone(e.tone)})`}}/><span className="ln"/></div>
          <div className="tc"><div className="tt2">{e.title}</div>{e.tx&&(!aiOn&&e.tag==='AI分析'?null:<div className="tx">{e.tx}</div>)}</div>
          <div className="tm"><Chip tone={e.tone==='green'?'green':e.tag==='面接'?'blue':e.tag==='判断'?'amber':e.tag==='AI分析'?'blue':e.tag==='評価'?'violet':'slate'} dot={false}>{e.tag}</Chip><span className="who">{e.who}</span></div>
        </div>
      ))}
    </div>
  );

  return (
    <div>
      {/* Header */}
      <div className="card pad" style={{marginBottom:16}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 300px 260px',gap:20,alignItems:'start'}} className="ov-top">
          <div style={{display:'flex',gap:16}}>
            <Avatar ap={ap} size={78} photo/>
            <div style={{minWidth:0}}>
              <div style={{display:'flex',alignItems:'center',gap:9,flexWrap:'wrap'}}>
                <h1 style={{fontSize:24,fontWeight:800,margin:0,color:'var(--ink)'}}>{ap.name}</h1>
                {age&&<span className="tag" style={{fontSize:12}}>{age}歳</span>}
                {app.tags[0]&&<Chip tone="blue" dot={false}>{app.tags[0]}</Chip>}
              </div>
              <div className="muted" style={{fontSize:13,marginTop:2}}>{ap.kana}</div>
              <div style={{display:'flex',gap:16,flexWrap:'wrap',marginTop:10,fontSize:12.5,color:'var(--ink2)'}}>
                <span><Sym i="mail" s={{fontSize:15,color:'var(--ink4)'}}/> {maskPII?'●●●●●●@●●●●':(ap.email||'—')}</span>
                <span><Sym i="call" s={{fontSize:15,color:'var(--ink4)'}}/> {maskPII?'●●●-●●●●-●●●●':(ap.phone||'—')}</span>
                {maskPII&&<Chip tone="slate" dot={false}><Sym i="lock" s={{fontSize:13}}/> PIIマスク中</Chip>}
              </div>
              <div style={{display:'flex',gap:16,flexWrap:'wrap',marginTop:6,fontSize:12.5,color:'var(--ink2)'}}>
                <span><Sym i="location_on" s={{fontSize:15,color:'var(--ink4)'}}/> {ap.pref}</span>
                {otherApps.length>0&&canRecruit&&<span className="link" onClick={()=>go('detail',otherApps[0].id)} style={{fontSize:12.5}}><Sym i="group" s={{fontSize:15}}/> この人物の応募 全{otherApps.length+1}件</span>}
              </div>
            </div>
          </div>
          <div>
            <div className="muted" style={{fontSize:12,fontWeight:600,marginBottom:7}}>この応募の総合状況</div>
            <div className="statusbox" style={{background:`var(--${st.ptone==='green'?'green':st.ptone}-soft)`,color:`var(${tone(st.ptone)})`}}>{st.primary}</div>
            <div style={{display:'flex',justifyContent:'space-between',marginTop:12,fontSize:12}}>
              <div><div className="muted">応募日</div><div style={{fontWeight:600,marginTop:2}}>{fmtDate(app.createdAt)}</div></div>
              <div style={{textAlign:'right'}}><div className="muted">経過日数</div><div style={{fontWeight:600,marginTop:2}}>{elapsed}日</div></div>
            </div>
          </div>
          <div>
            <div style={{display:'flex',alignItems:'center',marginBottom:7}}><span className="muted" style={{fontSize:12,fontWeight:600}}>候補者メモ</span><span className="link" style={{marginLeft:'auto',fontSize:11.5}}><Sym i="edit" s={{fontSize:13}}/> 編集</span></div>
            <div style={{fontSize:12.5,color:'var(--ink2)',lineHeight:1.6,background:'var(--bg)',borderRadius:9,padding:'11px 13px',minHeight:74}}>{app.memo||'コミュニケーション能力が高く、意欲的。'}</div>
            <div style={{display:'flex',gap:7,marginTop:10}}>
              {canDecide?<button className="btn prim" style={{flex:1,justifyContent:'center'}} onClick={()=>setModal('decision')}><Sym i="gavel" s={{fontSize:16}}/>採用判断</button>:<button className="btn" style={{flex:1,justifyContent:'center',opacity:.6,cursor:'not-allowed'}} title="採用権限が必要です (§68)"><Sym i="lock" s={{fontSize:15}}/>採用判断</button>}
              {canRecruit&&<button className="btn" title="アクティビティを追加" onClick={()=>{setEditAct(null);setModal('activity');}}><Sym i="add"/></button>}
              {canRecruit&&<button className="btn" title="その他の操作" onClick={()=>setModal('more')}><Sym i="more_vert"/></button>}
            </div>
          </div>
        </div>
      </div>

      {/* 重複候補バナー (§38/39) */}
      {app.dupOf&&!dupDismiss&&(()=>{const other=findAp(app.dupOf);return (
        <div className="card pad" style={{marginBottom:16,border:'1px solid var(--amber-bd)',background:'var(--amber-soft)'}}>
          <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
            <Sym i="join_inner" s={{fontSize:22,color:'var(--amber)'}}/>
            <div style={{flex:1,minWidth:200}}><div style={{fontWeight:700,color:'var(--ink)'}}>同一人物の可能性があります</div><div style={{fontSize:12.5,color:'var(--ink2)',marginTop:2}}>{other?`「${other.name}（${other.email||'—'}）」と一致。自動統合はしません — 対応を選んでください (§38/39)。`:''}</div></div>
            <button className="btn prim" onClick={()=>setModal('merge')}><Sym i="merge" s={{fontSize:16}}/>統合する</button>
            <button className="btn" onClick={()=>dispatch({type:'keepSeparate',appId:app.id})}>別人として維持</button>
            <button className="btn ghost" onClick={()=>setDupDismiss(true)}>後で確認</button>
          </div>
        </div>);})()}

      {/* Tabs */}
      <div className="tabs">
        {[['overview','概要'],['timeline','選考タイムライン'],['activities','選考アクティビティ'],['evals','評価・分析'],['flow','標準ルートとの差分'],['roles','ロール'],['decisions','判断履歴'],['comm','連絡'],...(isHired?[['membership','加入手続']]:[])].map(([k,l])=>(
          <div key={k} className={`tab ${tab===k?'on':''}`} onClick={()=>setTab(k)}>{l}</div>
        ))}
      </div>

      {tab==='overview' && (
        <div>
          {/* row 1 */}
          <div className="grid ov-top" style={{gridTemplateColumns:'1fr 1fr 1fr',marginBottom:16}}>
            <div className="card pad">
              <div className="ch"><Sym i="badge"/>応募情報</div>
              <div className="kv">
                <div className="k">Application</div><div className="v mono">#{app.code}</div>
                <div className="k">応募ポジション</div><div className="v">{app.position}</div>
                <div className="k">応募経路</div><div className="v">{srcLabel(app.source)}</div>
                <div className="k">現在の担当</div><div className="v">{uname(app.owner)}</div>
                <div className="k">応募メモ</div><div className="v" style={{color:'var(--ink2)'}}>{app.memo||'—'}</div>
              </div>
            </div>
            <div className="card pad">
              <div className="ch"><Sym i="label"/>現在の状態ラベル</div>
              <div className="labelwrap" style={{marginBottom:16}}>{st.labels.map((l,i)=><Chip key={i} tone={l.tone} dot={false}>{l.text}</Chip>)}</div>
              <div className="ch" style={{marginBottom:8}}><Sym i="event"/>選考期限</div>
              {[['次回アクション期限',nextActionOf(app)?.dueAt],['選考判断期限',app.decisionDueAt],['本人回答期限',app.responseDueAt]].filter(x=>x[1]).map(([l,d],i)=>{
                const od=new Date(d)<NOW, soon=new Date(d)-NOW<3*MS.d;
                return <div key={i} className="duebar"><span className="dl">{l}</span><span className="dd"><span className="dv" style={{color:od?'var(--red)':'var(--ink)'}}>{fmtDate(d)}</span><Chip tone={od?'red':soon?'amber':'slate'} dot={false}>{rel(d)}</Chip></span></div>;
              })}
            </div>
            <div className="card pad">
              <div className="ch"><Sym i="bolt"/>次の推奨アクション</div>
              {openTasks.slice(0,4).map(t=>{
                const isCand=t.kind==='wait'; const who=isCand?ap:{id:t.assignee,name:uname(t.assignee),color:'#64708f'};
                const od=new Date(t.dueAt)<NOW;
                return <div key={t.id} className="recrow">
                  <Avatar ap={who} size={32} photo={isCand}/>
                  <div style={{flex:1,minWidth:0}}><div className="rt">{t.actorName||uname(t.assignee)} さん</div><div className="rs">{t.title}</div></div>
                  <div style={{textAlign:'right'}}><Chip tone={t.prio==='高'?'red':'amber'} dot={false}>{t.prio}</Chip><div className="rs" style={{color:od?'var(--red)':'var(--ink3)',marginTop:4}}>{fmtDate(t.dueAt)}</div></div>
                  {!isCand&&<button className="btn sm" title="完了にする" onClick={()=>dispatch({type:'completeTask',taskId:t.id})}><Sym i="check" s={{fontSize:15}}/></button>}
                </div>;
              })}
              {!openTasks.length&&<div className="muted" style={{fontSize:12.5,padding:'6px 0'}}>未完了のタスクはありません</div>}
              <button className="btn sm" style={{width:'100%',justifyContent:'center',marginTop:12}} onClick={()=>setModal('task')}><Sym i="add" s={{fontSize:15}}/>タスクを追加</button>
            </div>
          </div>
          {/* row 2 */}
          <div className="grid ov-body" style={{gridTemplateColumns:'1fr 340px',marginBottom:16}}>
            <div className="card pad">
              <div className="ch"><Sym i="timeline"/>選考タイムライン
                <span style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
                  <span className="muted" style={{fontSize:12}}>AI要約を表示</span>
                  <span onClick={()=>setAiOn(v=>!v)} style={{width:36,height:20,borderRadius:12,background:aiOn?'var(--blue)':'var(--line2)',position:'relative',cursor:'pointer',transition:'.15s'}}><span style={{position:'absolute',top:2,left:aiOn?18:2,width:16,height:16,borderRadius:'50%',background:'#fff',transition:'.15s'}}/></span>
                </span>
              </div>
              <TL rows={tl.slice(0,9)}/>
              <button className="btn sm" style={{width:'100%',justifyContent:'center',marginTop:6}} onClick={()=>setTab('timeline')}>すべてのイベントを表示 <Sym i="arrow_forward" s={{fontSize:15}}/></button>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:16}}>
              <div className="card pad">
                <div className="ch"><Sym i="pending_actions"/>進行中のアクティビティ<span className="more" onClick={()=>setTab('activities')}>すべて表示</span></div>
                {inProg.slice(0,4).map(a=>(<div key={a.id} className="arow"><div className="ai" style={{background:atype(a.type).color+'18'}}><Sym i={atype(a.type).icon} s={{color:atype(a.type).color}}/></div><div style={{flex:1,minWidth:0}}><div className="an">{a.name} <Chip tone={AST[a.status].t} dot={false}>{AST[a.status].l}</Chip></div><div className="as">{a.plannedAt?fmt(a.plannedAt):'未設定'}</div></div>{(a.type==='INTERVIEW'||a.type==='REP_CHECK')&&<button className="btn sm" onClick={()=>go('room',a.id)}><Sym i="meeting_room" s={{fontSize:14}}/>開く</button>}</div>))}
                {!inProg.length&&<div className="muted" style={{fontSize:12.5}}>進行中のアクティビティはありません</div>}
              </div>
              <div className="card pad">
                <div className="ch"><Sym i="reviews"/>面接官の評価サマリー<span className="more" onClick={()=>setTab('evals')}>詳細を見る</span></div>
                {[['採用推奨','hire','green'],['保留','hold','amber'],['不採用推奨','reject','red']].map(([l,k,c])=>(
                  <div key={k} className="evbar"><span className="el" style={{color:`var(--${c})`}}>{l}</span><span className="ec">{recCounts[k]}名</span><div className="track"><div className="fill" style={{width:`${Math.max(6,(recCounts[k]/Math.max(1,myEvals.length))*100)}%`,background:`var(--${c})`}}/></div></div>
                ))}
                {split&&<div className="notebox warn"><Sym i="balance"/><div><b>意見が分かれています</b><br/>最終判断は採用担当者が行ってください。</div></div>}
              </div>
              {myAi&&canRecruit&&(
                <div className="card pad">
                  <div className="ch"><Sym i="auto_awesome"/>AI分析<span className="muted" style={{fontSize:11,fontWeight:500,marginLeft:8}}>最新: Version {myAi.version}</span><span className="more" onClick={()=>setTab('evals')}>詳細を見る</span></div>
                  <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:8}}><Sym i="verified" s={{fontSize:17,color:'var(--green)'}}/><b style={{color:'var(--ink)',fontSize:13.5}}>総合評価: {myAi.verdict}</b></div>
                  <div style={{fontSize:12.5,color:'var(--ink2)',lineHeight:1.6}}>{myAi.summary}</div>
                  <button className="btn sm" style={{width:'100%',justifyContent:'center',marginTop:12}}>AI分析を表示</button>
                </div>
              )}
            </div>
          </div>
          {/* row 3 */}
          <FlowDiff app={app} acts={acts} tmpl={tmpl}/>
        </div>
      )}

      {tab==='timeline' && <div className="card pad"><div className="ch"><Sym i="timeline"/>選考タイムライン<span className="muted" style={{fontSize:11.5,fontWeight:500,marginLeft:'auto'}}>人が状況を理解するための履歴 (§42)</span></div><TL rows={tl}/></div>}

      {tab==='activities' && (
        <div className="card pad">
          <div className="ch"><Sym i="event_list"/>選考アクティビティ<button className="btn sm prim" style={{marginLeft:'auto'}} onClick={()=>{setEditAct(null);setModal('activity');}}><Sym i="add" s={{fontSize:15}}/>アクティビティを追加</button></div>
          <div className="muted" style={{fontSize:12,marginBottom:14}}>順序制約なし・種類は自由に追加可能 (§10/11)。同じ種類の面接を何度でも実施できます。</div>
          {acts.map(a=>{const ty=atype(a.type),meta=AST[a.status],asess=sessions.filter(s=>s.activityId===a.id);
            return <div key={a.id} className="evalcard">
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <div className="ai" style={{width:32,height:32,background:ty.color+'18'}}><Sym i={ty.icon} s={{color:ty.color,fontSize:17}}/></div>
                <div style={{flex:1}}><div style={{fontWeight:600,color:'var(--ink)',fontSize:13.5}}>{a.name} {a.seq&&<span className="tag" style={{marginLeft:4,fontSize:10}}>実施#{a.seq}</span>}</div><div style={{fontSize:11.5,color:'var(--ink3)',marginTop:2}}>{a.plannedAt?`予定 ${fmt(a.plannedAt)}`:''}{a.completedAt?` · ${fmtMD(a.completedAt)} 実施`:''} · 担当 {uname(a.owner)}{a.type==='INTERVIEW'&&(a.rec?' · 🎙 録音あり':' · 録音なし')}</div></div>
                {(a.type==='INTERVIEW'||a.type==='REP_CHECK')&&<button className="btn sm" onClick={()=>go('room',a.id)}><Sym i="meeting_room" s={{fontSize:15}}/>面接ルーム</button>}
                <button className="btn sm" title="編集" onClick={()=>{setEditAct(a);setModal('activity');}}><Sym i="edit" s={{fontSize:15}}/></button>
                <button className="btn sm" title="状態を変更" onClick={()=>{setActTarget(a);setModal('actaction');}}><Sym i="more_vert" s={{fontSize:15}}/></button>
                <Chip tone={meta.t}>{meta.l}</Chip>
              </div>
              {a.notes&&<div style={{fontSize:12.5,color:'var(--ink2)',marginTop:8,paddingLeft:42}}>{a.notes}</div>}
              {a.skipReason&&<div style={{fontSize:12,color:'var(--ink3)',marginTop:4,paddingLeft:42}}>スキップ理由: {a.skipReason}</div>}
              {asess.length>0&&<div style={{paddingLeft:42,marginTop:8}}><div style={{fontSize:10.5,fontWeight:700,color:'var(--ink4)',marginBottom:5}}>セッション分割 (§21)</div>{asess.map(s=>(<div key={s.id} style={{display:'flex',alignItems:'center',gap:7,fontSize:12,marginBottom:3}}><Chip tone={AST[s.status]?.t||'slate'} dot={false}>{AST[s.status]?.l}</Chip><span style={{color:'var(--ink2)'}}>{s.topic}</span></div>))}</div>}
            </div>;
          })}
        </div>
      )}

      {tab==='evals' && !canRecruit && <div className="card pad"><div className="emptyx"><Sym i="lock"/>評価・AI分析の閲覧には採用権限が必要です。面接官は自分が担当した面接の情報のみ閲覧できます (§69/70)。</div></div>}
      {tab==='evals' && canRecruit && (
        <div className="grid" style={{gridTemplateColumns:'1fr 1fr'}}>
          <div className="card pad">
            <div className="ch"><Sym i="reviews"/>面接官ごとの評価 (§24/25)</div>
            {split&&<div className="notebox warn" style={{marginBottom:12}}><Sym i="balance"/><div>評価が分かれています。多数決では決めません — 採用判断は独立プロセスです。</div></div>}
            {myEvals.map(e=>(<div key={e.id} className="evalcard"><div style={{display:'flex',alignItems:'center',gap:8}}><b style={{color:'var(--ink)',fontSize:13}}>{uname(e.by)}</b><Chip tone={e.rec==='hire'?'green':e.rec==='reject'?'red':'amber'} dot={false}>{recLabel(e.rec)}</Chip><span className="stars" style={{marginLeft:'auto'}}>{'★'.repeat(e.score)}{'☆'.repeat(5-e.score)}</span></div><div style={{fontSize:12.5,color:'var(--ink2)',marginTop:6,lineHeight:1.5}}>{e.comment}</div></div>))}
            {!myEvals.length&&<div className="emptyx"><Sym i="reviews"/>評価未入力</div>}
          </div>
          <div className="card pad">
            <div className="ch"><Sym i="auto_awesome"/>AI分析 (Version管理 §64/65)</div>
            {myAi?<div>
              <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:8}}><Sym i="verified" s={{fontSize:18,color:'var(--green)'}}/><b style={{fontSize:14}}>総合評価: {myAi.verdict}</b><span className="tag" style={{marginLeft:'auto'}}>v{myAi.version}</span></div>
              <div style={{fontSize:12.5,color:'var(--ink2)',lineHeight:1.6}}>{myAi.summary}</div>
              <div style={{marginTop:10,display:'flex',flexWrap:'wrap',gap:6}}>{myAi.flags.map((f,i)=><span key={i} className="tag" style={{fontSize:11}}>⚠ {f}</span>)}</div>
              <div className="notebox info" style={{marginTop:12}}><Sym i="info"/><div>入力: {myAi.inputs.join(' / ')} · {myAi.model}。AIは事実を説明するだけで、採否は人間が確定します (§46/66)。</div></div>
            </div>:<div className="emptyx"><Sym i="auto_awesome"/>AI分析なし</div>}
          </div>
        </div>
      )}

      {tab==='flow' && <FlowDiff app={app} acts={acts} tmpl={tmpl} full/>}

      {tab==='roles' && (
        <div className="card pad">
          <div className="ch"><Sym i="badge"/>応募ロール (§6/7)<button className="btn sm" style={{marginLeft:'auto'}} onClick={()=>setModal('changerole')}><Sym i="swap_horiz" s={{fontSize:15}}/>ポジション変更</button><button className="btn sm" onClick={()=>setModal('addrole')}><Sym i="add" s={{fontSize:15}}/>ロール追加</button></div>
          {roles.length?roles.map(r=>(<div key={r.id} className="evalcard" style={{display:'flex',alignItems:'center',gap:10}}><div style={{flex:1,fontWeight:600,color:'var(--ink)',fontSize:13.5}}>{r.role}</div><select className="field" style={{width:'auto',padding:'5px 9px',fontSize:12}} value={r.reln} onChange={e=>dispatch({type:'setRoleReln',roleId:r.id,reln:e.target.value})}>{Object.entries(RELN).map(([k,v])=><option key={k} value={k}>{v.l}</option>)}</select></div>)):<div className="emptyx"><Sym i="badge"/>ロール未設定</div>}
          {listBy(roleHistory,app.id).length>0&&<div style={{marginTop:14}}><div style={{fontSize:12,fontWeight:700,color:'var(--ink3)',marginBottom:8}}>ポジション変更履歴 (§7)</div>{listBy(roleHistory,app.id).map(r=>(<div key={r.id} className="arow"><div className="ai" style={{background:'var(--teal-soft)'}}><Sym i="swap_horiz" s={{color:'var(--teal)'}}/></div><div style={{flex:1}}><div className="an">{r.from} → {r.to}</div><div className="as">{fmtMD(r.at)} · {uname(r.by)} · {r.reason} · 本人同意{r.consent?'あり':'なし'}</div></div></div>))}</div>}
        </div>
      )}

      {tab==='decisions' && !canRecruit && <div className="card pad"><div className="emptyx"><Sym i="lock"/>採用判断の履歴は採用権限を持つユーザーのみ閲覧できます (§69)。</div></div>}
      {tab==='decisions' && canRecruit && (
        <div className="card pad">
          <div className="ch"><Sym i="gavel"/>採用判断の履歴 (§26/27)<span className="muted" style={{fontSize:11.5,fontWeight:500,marginLeft:'auto'}}>上書きせず履歴として保持</span></div>
          {listBy(decisions,app.id).slice().sort((a,b)=>new Date(b.at)-new Date(a.at)).map(d=>(<div key={d.id} className="evalcard"><div style={{display:'flex',alignItems:'center',gap:9}}><Chip tone={d.type==='hire'?'green':d.type==='reject'||d.type==='withdrawn'?'red':'amber'}>{decLabel(d.type)}</Chip><span className="muted" style={{fontSize:12}}>{fmt(d.at)} · {uname(d.by)}</span>{d.supersedes&&<span className="tag" style={{fontSize:10}}>前判断を更新</span>}</div><div style={{fontSize:12.5,color:'var(--ink2)',marginTop:6}}>{d.reason}{d.comment&&` — ${d.comment}`}</div></div>))}
          {!listBy(decisions,app.id).length&&<div className="emptyx"><Sym i="gavel"/>まだ判断はありません。判断は面接ステータスとは独立したプロセスです。</div>}
        </div>
      )}

      {tab==='comm' && (
        <div className="card pad">
          <div className="ch"><Sym i="forum"/>連絡履歴 (§51)<button className="btn sm prim" style={{marginLeft:'auto'}} onClick={()=>setModal('compose')}><Sym i="edit" s={{fontSize:15}}/>メール作成</button></div>
          {listBy(comms,app.id).length?listBy(comms,app.id).sort((a,b)=>new Date(b.at)-new Date(a.at)).map(c=>(<div key={c.id} className="arow"><div className="ai" style={{background:c.dir==='in'?'var(--green-soft)':'var(--blue-soft)'}}><Sym i={c.dir==='in'?'call_received':'send'} s={{color:c.dir==='in'?'var(--green)':'var(--blue)'}}/></div><div style={{flex:1}}><div className="an">{c.subject}</div><div className="as">{c.dir==='in'?'受信':'送信'} · {c.autoId?'自動':'手動'} · {fmt(c.at)}</div></div><Chip tone={c.status==='sent'||c.status==='received'?'green':c.status==='scheduled'?'blue':c.status==='failed'?'red':'slate'} dot={false}>{c.status==='sent'?'送信済':c.status==='received'?'受信':c.status==='scheduled'?'送信予定':c.status==='failed'?'送信失敗':c.status}</Chip></div>)):<div className="emptyx"><Sym i="forum"/>連絡履歴なし</div>}
          {listBy(comms,app.id).some(c=>c.status==='failed')&&<div className="notebox warn" style={{marginTop:8}}><Sym i="error"/><div>送信に失敗した連絡があります。再送できます(内部エラーはユーザーに表示しません §91)。</div></div>}
        </div>
      )}

      {tab==='membership' && <MembershipPanel app={app} dispatch={dispatch}/>}

      {modal==='activity'&&<ActivityForm app={app} editAct={editAct} onClose={()=>{setModal(null);setEditAct(null);}} dispatch={dispatch}/>}
      {modal==='decision'&&<DecisionModal app={app} split={split} onClose={()=>setModal(null)} dispatch={dispatch}/>}
      {modal==='compose'&&<ComposeForm app={app} onClose={()=>setModal(null)} dispatch={dispatch}/>}
      {modal==='more'&&<MoreMenu app={app} onClose={()=>setModal(null)} onPick={k=>setModal(k)} dispatch={dispatch}/>}
      {modal==='pause'&&<PauseModal app={app} onClose={()=>setModal(null)} dispatch={dispatch}/>}
      {modal==='changerole'&&<ChangeRoleModal app={app} onClose={()=>setModal(null)} dispatch={dispatch}/>}
      {modal==='addrole'&&<AddRoleModal app={app} onClose={()=>setModal(null)} dispatch={dispatch}/>}
      {modal==='task'&&<TaskForm app={app} onClose={()=>setModal(null)} dispatch={dispatch}/>}
      {modal==='actaction'&&actTarget&&<ActivityActionModal act={actTarget} onClose={()=>{setModal(null);setActTarget(null);}} onReschedule={()=>{setEditAct(actTarget);setModal('activity');}} dispatch={dispatch}/>}
      {modal==='merge'&&app.dupOf&&<MergeModal app={app} onClose={()=>setModal(null)} dispatch={dispatch}/>}
    </div>
  );
}

function FlowDiff({app, acts, tmpl, full}){
  return (
    <div className="card pad">
      <div className="ch"><Sym i="alt_route"/>標準ルートとの差分{full&&<span className="muted" style={{fontSize:11.5,fontWeight:500,marginLeft:8}}>標準から外れることはエラーではありません (§47)</span>}<span className="more">詳細を見る</span></div>
      <div className="flow">
        <div className="flowlbl">標準ルート（{tmpl.position}）</div>
        <div className="chain">{tmpl.steps.map((s,i)=>(<Fragment key={i}>{i>0&&<span className="farr">›</span>}<span className="fstep">{s}</span></Fragment>))}<span className="tag" style={{marginLeft:4}}>{tmpl.ver}</span></div>
        <div className="flowlbl">実際のルート（この応募者）</div>
        <div className="chain">{acts.slice().reverse().map((a,i)=>{const done=DONE_ST.includes(a.status),now=['in_progress','partially_completed','scheduled','planned'].includes(a.status);const inTmpl=tmpl.steps.some(s=>a.name.includes(s.slice(0,2)));return <Fragment key={a.id}>{i>0&&<span className="farr">›</span>}<span className={`fstep ${done?'done':''} ${now?'now':''} ${!inTmpl?'off':''}`}>{a.name}</span></Fragment>;})}</div>
      </div>
    </div>
  );
}

/* ---------- Activity / Interview scheduling form (§80/81 — 入力画面) ---------- */
function ActivityForm({app, editAct, onClose, dispatch}){
  const editing=!!editAct;
  const [type,setType]=useState(editAct?editAct.type:'INTERVIEW');
  const [name,setName]=useState(editAct?editAct.name:'代表面談');
  const itype='REP';
  const [ivs,setIvs]=useState(editAct?.interviewers||['iv1']);
  const [mode,setMode]=useState(editAct?.mode||'online');
  const [url,setUrl]=useState(editAct?.url||RECRUIT_SETTINGS.zoomUrl);
  const [comp,setComp]=useState(editAct?.completionMode||'all_sessions');
  const [sessList,setSessList]=useState(editing?[]:['人物・志望理由','活動条件']);
  const [willRec,setWillRec]=useState(editAct?editAct.rec:true);
  const dd=editAct?.plannedAt?new Date(editAct.plannedAt):null;
  const [date,setDate]=useState(dd?dd.toISOString().slice(0,10):'2026-08-31');
  const [time,setTime]=useState(dd?`${pad(dd.getHours())}:${pad(dd.getMinutes())}`:'18:00');
  const [owner,setOwner]=useState(editAct?editAct.owner:'hr');
  const [dep,setDep]=useState(editAct?.depId||'');
  const [notes,setNotes]=useState(editAct?editAct.notes||'':'');
  const isIv=type==='INTERVIEW';
  const existing=listBy(activities,app.id).filter(a=>!editAct||a.id!==editAct.id);
  const chooseType=k=>{setType(k);if(!editing)setName(k==='INTERVIEW'?'代表面談':atype(k).label);};
  const submit=()=>{
    dispatch({type:'createActivity',appId:app.id,editId:editAct?.id,payload:{
      type,name,itype:isIv?itype:null,owner,plannedAt:new Date(`${date}T${time}:00+09:00`).toISOString(),
      interviewers:isIv?ivs:[],mode:isIv?mode:null,url,completionMode:isIv?comp:null,
      sessions:isIv?sessList.filter(s=>s.trim()):[],willRec:isIv?willRec:false,dep,notes}});
    onClose();
  };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal lg" onClick={e=>e.stopPropagation()}>
        <div className="mhd"><div className="mt">{editing?'アクティビティを編集':'アクティビティを追加'}</div><div className="mx">標準フローに無い活動も自由に追加できます。ここで入力した内容がタイムライン・監査・自動化に反映されます (§80/81)。</div></div>
        <div className="mbd scroll">
          <div className="frow"><div className="flbl">種類</div>
            <div className="selrow">{ATYPES.filter(a=>a.key!=='OTHER').map(a=>(<span key={a.key} className={`selchip ${type===a.key?'on':''}`} onClick={()=>chooseType(a.key)}><Sym i={a.icon} s={{fontSize:15,color:a.color}}/>{a.label}{a.custom&&<span className="tag" style={{fontSize:9.5,marginLeft:2}}>カスタム</span>}</span>))}</div>
          </div>
          <div className="frow"><div className="flbl">名称 <span className="req">必須</span></div><input className="field" value={name} onChange={e=>setName(e.target.value)} placeholder="例: 代表面談"/></div>
          {isIv&&<Fragment>
            <div className="grid2">
              <div className="frow"><div className="flbl">完了条件 (§22)</div>
                <select className="field" value={comp} onChange={e=>setComp(e.target.value)}><option value="all_sessions">全セッション完了で自動完了</option><option value="minimum">必要セッション完了で完了</option><option value="manual">手動で完了</option></select></div>
            </div>
            <div className="frow"><div className="flbl">面接官（複数可・評価は各自独立 §24）</div>
              <div className="selrow">{['iv1','iv2','rep','hr'].map(u=>(<span key={u} className={`selchip ${ivs.includes(u)?'on':''}`} onClick={()=>setIvs(v=>v.includes(u)?v.filter(x=>x!==u):[...v,u])}>{ivs.includes(u)&&<Sym i="check" s={{fontSize:14}}/>}{uname(u)}</span>))}</div></div>
            <div className="grid2">
              <div className="frow"><div className="flbl">実施方法</div><div className="selrow"><span className={`selchip ${mode==='online'?'on':''}`} onClick={()=>setMode('online')}><Sym i="videocam" s={{fontSize:15}}/>オンライン</span><span className={`selchip ${mode==='onsite'?'on':''}`} onClick={()=>setMode('onsite')}><Sym i="location_on" s={{fontSize:15}}/>対面</span></div></div>
              <div className="frow"><div className="flbl">{mode==='online'?'会議URL':'場所'}{mode==='online'&&<span className="fhint">共通Zoom（設定で管理）</span>}</div><input className="field" value={url} onChange={e=>setUrl(e.target.value)} placeholder={mode==='online'?'https://zoom.us/j/…':'渋谷オフィス 3F'}/>{mode==='online'&&<div className="fhint" style={{marginTop:4}}><Sym i="link" s={{fontSize:13}}/> この共通Zoomリンク・ID・パスコードは面接案内の自動送信メールにも差し込まれます (§55)。</div>}</div>
            </div>
            <div className="frow"><div className="flbl">セッション分割（任意 §21）</div>
              {sessList.map((s,i)=>(<div key={i} className="sess-item"><span className="mono" style={{fontSize:11,color:'var(--ink4)',width:66,flex:'none'}}>Session {i+1}</span><input className="field" value={s} onChange={e=>setSessList(l=>l.map((x,j)=>j===i?e.target.value:x))} placeholder="トピック（例: 活動条件）"/><button className="btn sm" onClick={()=>setSessList(l=>l.filter((_,j)=>j!==i))}><Sym i="close" s={{fontSize:15}}/></button></div>))}
              <button className="btn sm" onClick={()=>setSessList(l=>[...l,''])}><Sym i="add" s={{fontSize:15}}/>セッションを追加</button>
            </div>
            <div className="frow"><label className="check"><input type="checkbox" checked={willRec} onChange={e=>setWillRec(e.target.checked)}/>録音を予定する（任意 §61）</label></div>
          </Fragment>}
          <div className="grid2">
            <div className="frow"><div className="flbl">予定日</div><input className="field" type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
            <div className="frow"><div className="flbl">時刻</div><input className="field" type="time" value={time} onChange={e=>setTime(e.target.value)}/></div>
          </div>
          <div className="grid2">
            <div className="frow"><div className="flbl">担当</div><select className="field" value={owner} onChange={e=>setOwner(e.target.value)}>{['hr','r1','r2','rep','iv1','iv2'].map(u=><option key={u} value={u}>{uname(u)}</option>)}</select></div>
            <div className="frow"><div className="flbl">依存（任意 §16）</div><select className="field" value={dep} onChange={e=>setDep(e.target.value)}><option value="">なし</option>{existing.map(a=><option key={a.id} value={a.id}>{a.name} の完了後</option>)}</select></div>
          </div>
          <div className="frow"><div className="flbl">メモ</div><textarea className="field" value={notes} onChange={e=>setNotes(e.target.value)} style={{minHeight:64,resize:'vertical',fontFamily:'var(--s)'}} placeholder="補足・目的など"/></div>
        </div>
        <div className="mfoot"><button className="btn" onClick={onClose}>キャンセル</button><button className="btn prim" onClick={submit} disabled={!name.trim()}><Sym i={editing?'save':'add'} s={{fontSize:16}}/>{editing?'保存':'この内容で作成'}</button></div>
      </div>
    </div>
  );
}

/* ---------- Email compose (§51/56/59 — 入力画面) ---------- */
function ComposeForm({app, onClose, dispatch}){
  const ap=findAp(app.applicantId);
  const zoomBlock=`実施方法: オンライン（Zoom）\nURL: ${RECRUIT_SETTINGS.zoomUrl}\nミーティングID: ${RECRUIT_SETTINGS.zoomMeetingId} ／ パスコード: ${RECRUIT_SETTINGS.zoomPasscode}`;
  const TPL={interview:['代表面談のご案内',`${ap.name} 様\n\nこの度はご応募ありがとうございます。代表面談の日程をご案内いたします。\n\n日時: 〇月〇日 〇〇:〇〇\n${zoomBlock}\n\nご不明点がございましたらお気軽にご連絡ください。`],thanks:['面接のお礼',`${ap.name} 様\n\n本日は面接のお時間をいただき、誠にありがとうございました。\n選考結果は追ってご連絡いたします。`],accept:['採用のご連絡',`${ap.name} 様\n\nこの度は選考の結果、採用が決定いたしましたのでご連絡いたします。\n今後の加入手続きについて、改めてご案内いたします。`],reject:['選考結果のご連絡',`${ap.name} 様\n\nこの度は選考にご参加いただきありがとうございました。\n慎重に検討いたしました結果、今回はご期待に沿えない結果となりました。`]};
  const [tpl,setTpl]=useState('');
  const [subject,setSubject]=useState('');
  const [body,setBody]=useState('');
  const [when,setWhen]=useState('now');
  const [delay,setDelay]=useState('5');
  const apply=k=>{setTpl(k);if(TPL[k]){setSubject(TPL[k][0]);setBody(TPL[k][1]);}};
  const needAppr=['accept','reject'].includes(tpl);
  const submit=()=>{dispatch({type:'sendComm',appId:app.id,subject:subject||'(件名なし)',when,delay});onClose();};
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal lg" onClick={e=>e.stopPropagation()}>
        <div className="mhd"><div className="mt">メールを作成</div><div className="mx">応募者への連絡はApplicationに紐付き、履歴として残ります (§51)。</div></div>
        <div className="mbd scroll">
          <div className="frow"><div className="flbl">宛先</div><input className="field" value={`${ap.name} <${ap.email}>`} readOnly style={{color:'var(--ink3)'}}/></div>
          <div className="frow"><div className="flbl">テンプレート</div>
            <div className="selrow">{[['interview','面接案内'],['thanks','お礼'],['accept','採用連絡'],['reject','不採用連絡']].map(([k,l])=>(<span key={k} className={`selchip ${tpl===k?'on':''}`} onClick={()=>apply(k)}>{l}</span>))}</div></div>
          <div className="frow"><div className="flbl">件名 <span className="req">必須</span></div><input className="field" value={subject} onChange={e=>setSubject(e.target.value)} placeholder="件名"/></div>
          <div className="frow"><div className="flbl">本文</div><textarea className="field" value={body} onChange={e=>setBody(e.target.value)} style={{minHeight:180,resize:'vertical',fontFamily:'var(--s)'}} placeholder="本文を入力…"/></div>
          <div className="frow"><div className="flbl">送信タイミング</div>
            <div className="selrow"><span className={`selchip ${when==='now'?'on':''}`} onClick={()=>setWhen('now')}>すぐ送信</span><span className={`selchip ${when==='schedule'?'on':''}`} onClick={()=>setWhen('schedule')}>予約送信</span>
              {when==='now'&&<span style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--ink3)'}}><Sym i="undo" s={{fontSize:15}}/>送信取消の猶予 <select className="field" style={{width:'auto',padding:'6px 8px'}} value={delay} onChange={e=>setDelay(e.target.value)}><option value="0">なし</option><option value="5">5分</option><option value="30">30分</option></select> (§59)</span>}</div></div>
          {needAppr&&<div className="notebox warn"><Sym i="verified_user"/><div><b>この種別は承認が必要です (§56)</b><br/>採用・不採用連絡は自動送信されず、承認者の確認後に送信されます。</div></div>}
        </div>
        <div className="mfoot"><button className="btn" onClick={onClose}>キャンセル</button><button className="btn prim" onClick={submit} disabled={!subject.trim()}><Sym i={when==='schedule'?'schedule_send':'send'} s={{fontSize:16}}/>{needAppr?'承認へ送る':when==='schedule'?'予約する':'送信'}</button></div>
      </div>
    </div>
  );
}

/* ---------- Interview Room (面接当日の実務画面) ---------- */
const IV_GUIDES = {
  REP:{label:'代表面談', mode:'必要セッション完了で完了', sessions:[
    {key:'s1',name:'Session 1 · 人物・志望理由',status:'planned',guide:['自己紹介と、これまでの活動','志望動機 — connec+aで実現したいこと','大切にしている価値観','チームでの協働経験'],check:['志望動機が明確か','カルチャーフィット','コミュニケーション力','主体性・熱意']},
    {key:'s2',name:'Session 2 · 活動条件',status:'planned',guide:['稼働可能な時間・曜日','活動を開始できる時期','学業/仕事との両立','対応可能な役割範囲'],check:['稼働可能時間を確認','活動開始時期を確認','継続性の見込み']},
    {key:'s3',name:'Session 3 · 意思・配属確認',status:'planned',guide:['希望ポジション・配属イメージ','これまでのスキルの棚卸し','活動への本気度・覚悟','懸念・不安の有無','条件面の最終確認'],check:['希望ポジション確認','入会意思の確認','条件合意','懸念点の解消']},
  ]},
};
const ROOM_ME='iv1';
function fmtClock(s){const m=Math.floor(s/60),ss=s%60;return `${pad(m)}:${pad(ss)}`;}

function InterviewRoom({actId, go, dispatch}){
  const act=activities.find(a=>a.id===actId);
  const app=act?findApp(act.applicationId):null;
  const ap=app?findAp(app.applicantId):null;
  const G=IV_GUIDES.REP;
  const [started,setStarted]=useState(false);
  const [sec,setSec]=useState(0);
  const [rec,setRec]=useState(false);
  const [recSec,setRecSec]=useState(0);
  const [recordings,setRecordings]=useState(act&&act.rec?[{name:'録音 1',dur:1830,tr:'完了'}]:[]);
  const [curS,setCurS]=useState(G.sessions[0].key);
  const [checked,setChecked]=useState({});
  const [notes,setNotes]=useState([]);
  const [nt,setNt]=useState('');
  const [ntTag,setNtTag]=useState('note');
  const [memo,setMemo]=useState(act?act.notes||'':'');
  const [evRec,setEvRec]=useState(null);
  const [evScore,setEvScore]=useState(0);
  const [evComment,setEvComment]=useState('');
  const [evSaved,setEvSaved]=useState(false);
  useEffect(()=>{if(!started)return;const iv=setInterval(()=>setSec(s=>s+1),1000);return ()=>clearInterval(iv);},[started]);
  useEffect(()=>{if(!rec)return;const iv=setInterval(()=>setRecSec(s=>s+1),1000);return ()=>clearInterval(iv);},[rec]);
  if(!act) return <div className="page">面接が見つかりません。<span className="link" onClick={()=>go('dashboard')}>戻る</span></div>;
  const sess=G.sessions.find(s=>s.key===curS)||G.sessions[0];
  const sc=checked[curS]||{};
  const scDone=sess.check.filter((_,i)=>sc[i]).length;
  const toggleCheck=i=>setChecked(c=>({...c,[curS]:{...(c[curS]||{}),[i]:!(c[curS]||{})[i]}}));
  const startStopRec=()=>{if(rec){setRec(false);setRecordings(r=>[...r,{name:`録音 ${r.length+1}`,dur:recSec,tr:'処理待ち'}]);setRecSec(0);}else{setRec(true);if(!started)setStarted(true);}};
  const addNote=()=>{if(!nt.trim())return;setNotes(n=>[...n,{t:rec?fmtClock(recSec):fmtClock(sec),tag:ntTag,text:nt.trim()}]);setNt('');};
  const endInterview=()=>{dispatch({type:'completeInterview',activityId:act.id});go('detail',app.id);};
  const saveEval=()=>{if(!evRec)return;dispatch({type:'saveEval',appId:app.id,activityId:act.id,rec:evRec,score:evScore||3,comment:evComment});setEvSaved(true);};
  const TAGS={note:{l:'メモ',ic:'notes'},good:{l:'良い',ic:'thumb_up'},concern:{l:'懸念',ic:'warning'},check:{l:'要確認',ic:'help'}};
  return (
    <div style={{minHeight:'100vh',background:'var(--bg)'}}>
      <div className="topbar" style={{padding:'0 22px',gap:12}}>
        <div onClick={()=>go('detail',app.id)} style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',fontWeight:600,color:'var(--ink2)',fontSize:13}}><Sym i="arrow_back" s={{fontSize:18}}/>候補者へ戻る</div>
        <div style={{width:1,height:24,background:'var(--line)'}}/>
        <Avatar ap={ap} size={30} photo/>
        <div><div style={{fontWeight:700,color:'var(--ink)',fontSize:14,lineHeight:1.2}}>{ap.name}</div><div style={{fontSize:11,color:'var(--ink3)'}}>{app.position}</div></div>
        <Chip tone="blue" dot={false}>{act.name}</Chip>
        {act.plannedAt&&<span className="muted" style={{fontSize:12}}><Sym i="schedule" s={{fontSize:14}}/> {fmt(act.plannedAt)}</span>}
        <div style={{flex:1}}/>
        <div style={{display:'flex',alignItems:'center',gap:8,padding:'6px 10px',borderRadius:9,background:started?'var(--blue-soft)':'var(--bg)',border:'1px solid var(--line)'}}>
          <Sym i="timer" s={{fontSize:17,color:'var(--blue)'}}/><span className="mono" style={{fontWeight:700,fontSize:15,color:'var(--ink)'}}>{fmtClock(sec)}</span>
          <button className="btn sm" onClick={()=>setStarted(s=>!s)}>{started?'一時停止':'面接開始'}</button>
        </div>
        <button className="btn" onClick={()=>window.open(RECRUIT_SETTINGS.zoomUrl,'_blank')} title={`ID ${RECRUIT_SETTINGS.zoomMeetingId} / パス ${RECRUIT_SETTINGS.zoomPasscode}`}><Sym i="videocam" s={{fontSize:16}}/>Zoomを開く</button>
        <button className="btn prim" onClick={endInterview}><Sym i="check" s={{fontSize:16}}/>面接を終了</button>
      </div>
      <div style={{padding:'20px 22px',display:'grid',gridTemplateColumns:'1fr 360px',gap:18,alignItems:'start'}} className="ov-body">
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div className="card pad">
            <div className="ch"><Sym i="mic"/>録音<span className="muted" style={{fontSize:11.5,fontWeight:500,marginLeft:8}}>任意・複数可 (§61/62)</span></div>
            <div style={{display:'flex',alignItems:'center',gap:14}}>
              <button className="recbtn" onClick={startStopRec} style={{background:rec?'var(--red-soft)':'var(--blue)'}}>{rec?<span style={{width:16,height:16,borderRadius:3,background:'var(--red)'}}/>:<Sym i="mic" s={{color:'#fff',fontSize:24}}/>}</button>
              <div style={{flex:1}}>{rec?<div style={{display:'flex',alignItems:'center',gap:10}}><span className="recdot"/><span className="mono" style={{fontWeight:700,fontSize:18}}>{fmtClock(recSec)}</span><div className="wv">{[0,1,2,3,4,5,6,7,8].map(i=><i key={i} style={{animationDelay:`${i*0.09}s`}}/>)}</div></div>:<div className="muted" style={{fontSize:13}}>録音を開始（またはファイルをアップロード）</div>}</div>
              <label className="btn" style={{cursor:'pointer'}}><Sym i="upload_file" s={{fontSize:16}}/>アップロード<input type="file" accept="audio/*,video/*" style={{display:'none'}} onChange={e=>{const f=e.target.files[0];if(f)setRecordings(r=>[...r,{name:f.name,dur:null,tr:'処理待ち'}]);}}/></label>
            </div>
            {recordings.length>0&&<div style={{marginTop:12}}>{recordings.map((r,i)=>(<div key={i} className="arow"><div className="ai" style={{background:'var(--blue-soft)'}}><Sym i="graphic_eq" s={{color:'var(--blue)'}}/></div><div style={{flex:1}}><div className="an">{r.name}</div><div className="as">{r.dur!=null?fmtClock(r.dur):'アップロード済'} · 文字起こし: {r.tr}</div></div><Chip tone={r.tr==='完了'?'green':'slate'} dot={false}>{r.tr}</Chip></div>))}</div>}
          </div>
          <div className="card pad">
            <div className="ch"><Sym i="edit_note"/>面接メモ<span className="muted" style={{fontSize:11.5,fontWeight:500,marginLeft:'auto'}}>自動保存</span></div>
            <div className="selrow" style={{marginBottom:9}}>{Object.entries(TAGS).map(([k,v])=>(<span key={k} className={`selchip ${ntTag===k?'on':''}`} onClick={()=>setNtTag(k)}><Sym i={v.ic} s={{fontSize:14}}/>{v.l}</span>))}</div>
            <div style={{display:'flex',gap:8}}><input className="field" placeholder="発言・気づきを記録（Enterで追加）" value={nt} onChange={e=>setNt(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')addNote();}}/><button className="btn" onClick={addNote}>{rec?<><Sym i="fiber_manual_record" s={{fontSize:14,color:'var(--red)'}}/>{fmtClock(recSec)}</>:'追加'}</button></div>
            <div style={{marginTop:10}}>{notes.length===0?<div className="muted" style={{fontSize:12.5}}>タイムスタンプ付きでメモを残せます。録音中は録音位置が記録され、後から頭出しできます。</div>:notes.slice().reverse().map((n,i)=>(<div key={i} style={{display:'flex',gap:9,alignItems:'flex-start',padding:'7px 0',borderTop:i>0?'1px solid var(--line)':'0'}}><span className="mono" style={{fontSize:11.5,color:'var(--blue)',fontWeight:600,flex:'none',width:42}}>{n.t}</span><Sym i={TAGS[n.tag].ic} s={{fontSize:14,color:'var(--ink4)',flex:'none',marginTop:1}}/><span style={{fontSize:12.5,color:'var(--ink2)'}}>{n.text}</span></div>))}</div>
            <textarea className="field" placeholder="自由記述メモ…" value={memo} onChange={e=>setMemo(e.target.value)} style={{marginTop:12,minHeight:88,resize:'vertical',fontFamily:'var(--s)'}}/>
          </div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div className="card pad">
            <div className="ch"><Sym i="splitscreen"/>セッション<span className="muted" style={{fontSize:11,fontWeight:500,marginLeft:'auto'}}>{G.mode}</span></div>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>{G.sessions.map(s=>{const done=(checked[s.key]&&Object.values(checked[s.key]).filter(Boolean).length)||0;const on=s.key===curS;return (
              <div key={s.key} onClick={()=>setCurS(s.key)} style={{padding:'9px 11px',borderRadius:9,border:`1px solid ${on?'var(--blue)':'var(--line)'}`,background:on?'var(--blue-soft)':'#fff',cursor:'pointer'}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}><span style={{fontWeight:600,fontSize:12.5,color:'var(--ink)'}}>{s.name}</span><Chip tone={s.status==='completed'?'green':s.status==='not_required'?'slate':'blue'} dot={false}>{AST[s.status]?.l||'予定'}</Chip></div>
                <div style={{fontSize:11,color:'var(--ink3)',marginTop:3}}>確認 {done}/{s.check.length}</div></div>);})}</div>
          </div>
          <div className="card pad">
            <div className="ch"><Sym i="checklist"/>質問ガイド・確認事項<span className="muted" style={{fontSize:11,fontWeight:500,marginLeft:'auto'}}>{scDone}/{sess.check.length}</span></div>
            <div style={{fontSize:11,fontWeight:700,color:'var(--ink4)',marginBottom:5}}>聞くこと</div>
            {sess.guide.map((g,i)=>(<div key={i} style={{display:'flex',gap:8,padding:'5px 0',fontSize:12.5,color:'var(--ink2)'}}><Sym i="chat_bubble" s={{fontSize:14,color:'var(--blue)',marginTop:2,flex:'none'}}/>{g}</div>))}
            <div style={{fontSize:11,fontWeight:700,color:'var(--ink4)',margin:'11px 0 5px'}}>確認チェックリスト</div>
            {sess.check.map((c,i)=>(<div key={i} onClick={()=>toggleCheck(i)} style={{display:'flex',alignItems:'center',gap:9,padding:'6px 0',cursor:'pointer'}}><span className="chkbox" style={{border:`1.5px solid ${sc[i]?'var(--green)':'var(--line2)'}`,background:sc[i]?'var(--green)':'#fff'}}>{sc[i]&&<Sym i="check" s={{fontSize:13,color:'#fff'}}/>}</span><span style={{fontSize:12.5,color:sc[i]?'var(--ink4)':'var(--ink)',textDecoration:sc[i]?'line-through':'none'}}>{c}</span></div>))}
          </div>
          <div className="card pad">
            <div className="ch"><Sym i="grade"/>あなたの評価<span className="muted" style={{fontSize:11,fontWeight:500,marginLeft:8}}>{uname(ROOM_ME)}</span></div>
            <div className="notebox info" style={{marginBottom:12}}><Sym i="lock"/><div>評価は面接官ごとに独立保存され、他の面接官の評価は判断確定まで見えません (§24/25/70)。</div></div>
            <div style={{display:'flex',gap:6,marginBottom:12}}>{[['hire','採用','green'],['hold','保留','amber'],['reject','不採用','red']].map(([k,l,c])=>(<div key={k} onClick={()=>setEvRec(k)} style={{flex:1,textAlign:'center',padding:'8px 0',borderRadius:9,cursor:'pointer',fontSize:12.5,fontWeight:700,border:`1px solid ${evRec===k?`var(--${c})`:'var(--line)'}`,background:evRec===k?`var(--${c}-soft)`:'#fff',color:evRec===k?`var(--${c})`:'var(--ink3)'}}>{l}</div>))}</div>
            <div style={{display:'flex',alignItems:'center',gap:3,marginBottom:12}}><span className="muted" style={{fontSize:12,marginRight:6}}>スコア</span>{[1,2,3,4,5].map(n=>(<span key={n} onClick={()=>setEvScore(n)} style={{cursor:'pointer',fontSize:22,color:n<=evScore?'var(--amber)':'var(--line2)'}}>{n<=evScore?'★':'☆'}</span>))}</div>
            <textarea className="field" placeholder="所見・コメント" value={evComment} onChange={e=>setEvComment(e.target.value)} style={{minHeight:66,resize:'vertical',fontFamily:'var(--s)'}}/>
            <button className="btn prim" style={{width:'100%',justifyContent:'center',marginTop:10,opacity:evRec?1:.5}} onClick={saveEval} disabled={!evRec}>{evSaved?<><Sym i="check_circle" s={{fontSize:16}}/>保存しました（変更可）</>:'評価を保存'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function DecisionModal({app, split, onClose, dispatch}){
  const [dtype,setDtype]=useState(null);
  const [reason,setReason]=useState('');
  const [comment,setComment]=useState('');
  const [notify,setNotify]=useState(true);
  const dec=latestDecision(app.id);
  const opts=[['hire','採用','how_to_reg','green'],['reject','不採用','do_not_disturb_on','red'],['hold','保留','pause_circle','amber'],['reopen','判断を取消して再選考','undo','violet']];
  const submit=()=>{if(!dtype||!reason.trim())return;dispatch({type:'makeDecision',appId:app.id,dtype,reason});onClose();};
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="mhd"><div className="mt">採用判断</div><div className="mx">判断は面接のステータスとは独立し、履歴として保存されます。過去の判断は上書きされません (§26/27)。</div></div>
        <div className="mbd">
          {split&&<div className="notebox warn" style={{marginBottom:12}}><Sym i="balance"/><div>面接官評価が分かれています。多数決ではなく、人が最終判断してください (§25)。</div></div>}
          {dec&&<div style={{fontSize:12.5,color:'var(--ink3)',marginBottom:12}}>現在の判断: <Chip tone={dec.type==='hire'?'green':'amber'}>{decLabel(dec.type)}</Chip>（{uname(dec.by)}, {fmtMD(dec.at)}）</div>}
          <div className="frow"><div className="flbl">判断 <span className="req">必須</span></div><div className="selrow">{opts.map(([k,l,ic,c])=>(<span key={k} className={`selchip ${dtype===k?'on':''}`} onClick={()=>setDtype(k)}><Sym i={ic} s={{fontSize:15,color:`var(--${c})`}}/>{l}</span>))}</div></div>
          <div className="frow"><div className="flbl">理由 <span className="req">必須</span></div><input className="field" placeholder="監査ログに記録されます" value={reason} onChange={e=>setReason(e.target.value)}/></div>
          <div className="frow"><div className="flbl">詳細コメント</div><textarea className="field" value={comment} onChange={e=>setComment(e.target.value)} style={{minHeight:58,resize:'vertical',fontFamily:'var(--s)'}} placeholder="任意"/></div>
          <label className="check"><input type="checkbox" checked={notify} onChange={e=>setNotify(e.target.checked)}/>応募者へ連絡メールを準備する{['hire','reject'].includes(dtype)&&<span className="fhint">（採用・不採用連絡は承認後に送信 §56）</span>}</label>
          <div className="fhint" style={{marginTop:10}}>採用しても直ちにメンバーは作成されません。加入情報確認→加入確定→メンバー作成の順です (§34/35)。</div>
        </div>
        <div className="mfoot"><button className="btn" onClick={onClose}>キャンセル</button><button className="btn prim" onClick={submit} disabled={!dtype||!reason.trim()}><Sym i="check" s={{fontSize:16}}/>判断を確定</button></div>
      </div>
    </div>
  );
}

function Automation({dispatch, go}){
  const stopped=autoState.stopped;
  const scheduled=comms.filter(c=>c.status==='scheduled');
  return (
    <div>
      <div className="card pad" style={{marginBottom:16,display:'flex',alignItems:'center',gap:14,flexWrap:'wrap',border:stopped?'1px solid var(--red-bd)':'1px solid var(--line)',background:stopped?'var(--red-soft)':'#fff'}}>
        <div style={{flex:1}}><div className="ch" style={{margin:0}}><Sym i="smart_toy"/>自動送信エンジン {stopped&&<Chip tone="red" dot={false}>全停止中</Chip>}</div><div className="muted" style={{fontSize:12.5,marginTop:5}}>SelectionActivityに送信ロジックを埋め込まず独立動作 (§52)。冪等キーで二重送信防止 (§57)、Transactional Outboxで整合性担保 (§58)。</div></div>
        <button className={stopped?'btn prim':'btn danger'} onClick={()=>dispatch({type:'killAll'})}><Sym i="power_settings_new" s={{fontSize:17}}/>{stopped?'自動送信を再開':'全自動送信を停止（Kill Switch §60）'}</button>
      </div>
      <div className="card pad" style={{marginBottom:16}}>
        <div className="ch"><Sym i="videocam"/>共通Zoom設定<span className="muted" style={{fontSize:11.5,fontWeight:500,marginLeft:8}}>面接案内メールに自動差し込み (§55)</span><span className="link" style={{marginLeft:'auto',fontSize:12}}><Sym i="edit" s={{fontSize:14}}/>編集</span></div>
        <div className="muted" style={{fontSize:12.5,marginBottom:12}}>Zoomリンクは組織で固定。面接アクティビティの既定URLとなり、面接案内・リマインドの自動送信メールに <span className="mono" style={{fontSize:11.5,color:'var(--blue-deep)'}}>{'{{zoomUrl}}'}</span> として差し込まれます。</div>
        <div className="grid" style={{gridTemplateColumns:'2fr 1fr 1fr',gap:12}}>
          <div><div className="flbl">会議URL</div><div className="field mono" style={{fontSize:12.5}}>{RECRUIT_SETTINGS.zoomUrl}</div></div>
          <div><div className="flbl">ミーティングID</div><div className="field mono" style={{fontSize:12.5}}>{RECRUIT_SETTINGS.zoomMeetingId}</div></div>
          <div><div className="flbl">パスコード</div><div className="field mono" style={{fontSize:12.5}}>{RECRUIT_SETTINGS.zoomPasscode}</div></div>
        </div>
      </div>
      <div className="card" style={{overflow:'hidden',marginBottom:16}}>
        <table className="tbl"><thead><tr><th>Automation</th><th>トリガー (§54)</th><th>承認 (§56)</th><th style={{textAlign:'center'}}>有効</th></tr></thead>
          <tbody>{AUTOMATIONS.map(a=>{const eff=a.enabled&&!stopped;return (<tr key={a.id}><td style={{fontWeight:600,color:'var(--ink)'}}>{a.name}</td><td className="muted">{a.trigger}</td>
            <td><span className={`selchip ${a.approval?'on':''}`} style={{padding:'4px 9px',fontSize:11.5}} onClick={()=>dispatch({type:'toggleApproval',id:a.id})}>{a.approval?'承認必須':'自動可'}</span></td>
            <td style={{textAlign:'center'}}><span className={`sw ${eff?'on':'off'}`} title={stopped?'全停止中':''} onClick={()=>dispatch({type:'toggleAutomation',id:a.id})} style={{display:'inline-block',opacity:stopped?.5:1}}><i/></span></td></tr>);})}</tbody>
        </table>
      </div>
      <div className="grid" style={{gridTemplateColumns:'1fr 1fr'}}>

/* アクティビティの状態遷移 (§14/15) */
function ActivityActionModal({act, onClose, onReschedule, dispatch}){
  const [sub,setSub]=useState(null); const [reason,setReason]=useState('');
  const ACTIONS=[
    {k:'completed',l:'完了にする',ic:'check_circle',c:'green'},
    {k:'reschedule',l:'日程を変更',ic:'event_repeat',c:'blue'},
    {k:'no_show',l:'無断欠席（No Show）',ic:'person_off',c:'red'},
    {k:'cancelled_by_applicant',l:'中止（本人都合）',ic:'cancel',c:'red',reason:true},
    {k:'cancelled_by_organization',l:'中止（運営都合）',ic:'cancel',c:'red',reason:true},
    {k:'skipped',l:'スキップ',ic:'skip_next',c:'slate',reason:true},
    {k:'not_required',l:'不要にする',ic:'block',c:'slate'},
  ];
  const pick=a=>{if(a.k==='reschedule'){onClose();onReschedule();return;}if(a.reason){setSub(a);return;}dispatch({type:'changeActivityStatus',activityId:act.id,status:a.k});onClose();};
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="mhd"><div className="mt">{act.name}</div><div className="mx">状態を変更します。理由はタイムライン・監査に記録されます (§14/15/81)。</div></div>
        <div className="mbd">
          {!sub?ACTIONS.map(a=>(<div key={a.k} className="opt" onClick={()=>pick(a)}><div className="oi" style={{background:`var(--${a.c}-soft)`}}><Sym i={a.ic} s={{color:`var(--${a.c})`,fontSize:18}}/></div><div style={{flex:1}}><div className="ot">{a.l}</div></div><Sym i="chevron_right" s={{color:'var(--ink4)'}}/></div>)):
          <div><div className="flbl">{sub.l}の理由 <span className="req">必須</span></div><input className="field" autoFocus value={reason} onChange={e=>setReason(e.target.value)} placeholder="理由を入力"/><div style={{display:'flex',gap:9,justifyContent:'flex-end',marginTop:14}}><button className="btn" onClick={()=>setSub(null)}>戻る</button><button className="btn prim" disabled={!reason.trim()} onClick={()=>{dispatch({type:'changeActivityStatus',activityId:act.id,status:sub.k,reason});onClose();}}>確定</button></div></div>}
        </div>
      </div>
    </div>
  );
}

/* ---------- App shell ---------- */
function App(){
  const [route,setRoute]=useState(((location.hash||'').replace('#','')==='apply')?{view:'apply',id:null}:{view:'dashboard',id:null});
  const [query,setQuery]=useState('');
  const [audit,setAudit]=useState(auditSeed);
  const [notifOpen,setNotifOpen]=useState(false);
  const [viewerRole,setViewerRole]=useState('radmin');
  const [,force]=useState(0);
  const go=useCallback((view,id=null)=>{setRoute({view,id});window.scrollTo(0,0);},[]);
  const dispatch=useCallback((cmd)=>{
    if(cmd.type==='createActivity'){const p=cmd.payload;
      if(cmd.editId){const a=activities.find(x=>x.id===cmd.editId);if(a)Object.assign(a,{type:p.type,name:p.name,itype:p.itype,owner:p.owner,plannedAt:p.plannedAt,notes:p.notes,rec:p.willRec,interviewers:p.interviewers,mode:p.mode,url:p.url,completionMode:p.completionMode,depId:p.dep});setAudit(a2=>[{id:nid('al'),actor:'hr',action:'EDIT_ACTIVITY',entity:cmd.appId,at:iso(0),reason:`${p.name} を編集`},...a2]);}
      else{const id=nid('ac');activities.push({id,applicationId:cmd.appId,type:p.type,name:p.name,itype:p.itype,status:'scheduled',plannedAt:p.plannedAt,completedAt:null,seq:listBy(activities,cmd.appId).length+1,createdBy:'hr',owner:p.owner,notes:p.notes,rec:p.willRec,interviewers:p.interviewers,mode:p.mode,url:p.url,completionMode:p.completionMode,depId:p.dep});(p.sessions||[]).forEach(topic=>sessions.push({id:nid('se'),activityId:id,topic,status:'planned',completedAt:null}));setAudit(a=>[{id:nid('al'),actor:'hr',action:'CREATE_ACTIVITY',entity:cmd.appId,at:iso(0),reason:`${p.name} を作成`},...a]);}}
    if(cmd.type==='saveEval'){evals.push({id:nid('ev'),applicationId:cmd.appId,activityId:cmd.activityId,by:ROOM_ME,rec:cmd.rec,score:cmd.score,comment:cmd.comment,at:iso(0)});setAudit(a=>[{id:nid('al'),actor:ROOM_ME,action:'EVAL_SUBMIT',entity:cmd.appId,at:iso(0),reason:`面接評価 ${recLabel(cmd.rec)}`},...a]);}
    if(cmd.type==='completeInterview'){const a2=activities.find(x=>x.id===cmd.activityId);if(a2){a2.status='completed';a2.completedAt=iso(0);}setAudit(a=>[{id:nid('al'),actor:ROOM_ME,action:'INTERVIEW_COMPLETE',entity:a2?a2.applicationId:'',at:iso(0),reason:`${a2?a2.name:'面接'} を完了`},...a]);}
    if(cmd.type==='sendComm'){comms.push({id:nid('cm'),applicationId:cmd.appId,channel:'email',dir:'out',subject:cmd.subject,status:cmd.when==='schedule'?'scheduled':'sent',at:iso(cmd.when==='schedule'?(parseInt(cmd.delay)||5)*60000:0),autoId:null});setAudit(a=>[{id:nid('al'),actor:'hr',action:'SEND_COMM',entity:cmd.appId,at:iso(0),reason:`メール「${cmd.subject}」`},...a]);}
    if(cmd.type==='makeDecision'){const prev=latestDecision(cmd.appId);decisions.push({id:nid('de'),applicationId:cmd.appId,type:cmd.dtype,by:'hr',at:iso(0),reason:cmd.reason,comment:'',supersedes:prev?prev.id:null});const app=findApp(cmd.appId);if(cmd.dtype==='hire')app.lifecycle='post_decision';else if(cmd.dtype==='reject')app.lifecycle='closed';else if(cmd.dtype==='reopen')app.lifecycle='active';setAudit(a=>[{id:nid('al'),actor:'hr',action:cmd.dtype==='reopen'?'DECISION_REVERSE':'MAKE_DECISION',entity:cmd.appId,at:iso(0),reason:`${decLabel(cmd.dtype)} — ${cmd.reason}`},...a]);}
    if(cmd.type==='createApplicant'){const p=cmd.payload;let apId=cmd.existingApplicantId;if(!apId){apId=nid('ap');applicants.push({id:apId,name:p.name,kana:p.kana,email:p.email,phone:p.phone,pref:p.pref,birth:p.birth,color:'#3a5bd9'});}const appId=nid('app');applications.push({id:appId,applicantId:apId,position:p.position,code:'A0'+(applications.length+20),source:p.source,owner:p.owner,lifecycle:p.source==='DIRECT'?'post_decision':'active',createdAt:iso(0),templateVer:'tmpl_std_v3',memo:p.memo,tags:p.tags||[]});activities.push({id:nid('ac'),applicationId:appId,type:'DOCUMENT_REVIEW',name:'応募受付',status:'completed',plannedAt:iso(0),completedAt:iso(0),seq:1,createdBy:'hr',owner:p.owner,notes:p.source==='DIRECT'?'直接採用として登録':'手動登録',rec:false});appRoles.push({id:nid('rl'),applicationId:appId,role:p.position,reln:p.source==='DIRECT'?'accepted':'primary'});if(p.source==='DIRECT')decisions.push({id:nid('de'),applicationId:appId,type:'hire',by:'hr',at:iso(0),reason:p.directReason||'直接採用',comment:'',supersedes:null});setAudit(a=>[{id:nid('al'),actor:'hr',action:p.source==='DIRECT'?'DIRECT_HIRE':'CREATE_APPLICATION',entity:appId,at:iso(0),reason:`${p.name} / ${p.position}（${srcLabel(p.source)}）`},...a]);cmd.onDone&&cmd.onDone(appId);}
    if(cmd.type==='changeActivityStatus'){const a=activities.find(x=>x.id===cmd.activityId);if(a){a.status=cmd.status;if(DONE_ST.includes(cmd.status)||cmd.status==='no_show'||cmd.status.indexOf('cancelled')===0)a.completedAt=a.completedAt||iso(0);if(cmd.reason){if(cmd.status==='skipped'||cmd.status==='not_required')a.skipReason=cmd.reason;else a.cancelReason=cmd.reason;}setAudit(al=>[{id:nid('al'),actor:'hr',action:'ACTIVITY_STATUS',entity:a.applicationId,at:iso(0),reason:`${a.name}: ${AST[cmd.status]?.l||cmd.status}${cmd.reason?` — ${cmd.reason}`:''}`},...al]);}}
    if(cmd.type==='rescheduleActivity'){const a=activities.find(x=>x.id===cmd.activityId);if(a){a.plannedAt=cmd.plannedAt;a.status='scheduled';setAudit(al=>[{id:nid('al'),actor:'hr',action:'RESCHEDULE',entity:a.applicationId,at:iso(0),reason:`${a.name} を ${fmt(cmd.plannedAt)} に再調整`},...al]);}}
    if(cmd.type==='createTask'){tasks.push({id:nid('tk'),applicationId:cmd.appId,title:cmd.title,assignee:cmd.assignee,dueAt:cmd.dueAt,status:'open',kind:cmd.kind||'todo',prio:cmd.prio||'中'});setAudit(a=>[{id:nid('al'),actor:'hr',action:'CREATE_TASK',entity:cmd.appId,at:iso(0),reason:`タスク「${cmd.title}」`},...a]);}
    if(cmd.type==='completeTask'){const t=tasks.find(x=>x.id===cmd.taskId);if(t)t.status='done';}
    if(cmd.type==='pauseApp'){const app=findApp(cmd.appId);if(app){app.lifecycle='paused';app.pause={at:iso(0),by:'hr',holdReason:cmd.reason,resumePlannedAt:cmd.resumeAt};setAudit(a=>[{id:nid('al'),actor:'hr',action:'PAUSE',entity:cmd.appId,at:iso(0),reason:`停止: ${cmd.reason}`},...a]);}}
    if(cmd.type==='resumeApp'){const app=findApp(cmd.appId);if(app){app.lifecycle='active';app.pause=null;setAudit(a=>[{id:nid('al'),actor:'hr',action:'RESUME',entity:cmd.appId,at:iso(0),reason:'選考を再開'},...a]);}}
    if(cmd.type==='addRole'){appRoles.push({id:nid('rl'),applicationId:cmd.appId,role:cmd.role,reln:cmd.reln||'candidate'});setAudit(a=>[{id:nid('al'),actor:'hr',action:'ADD_ROLE',entity:cmd.appId,at:iso(0),reason:`ロール追加: ${cmd.role}`},...a]);}
    if(cmd.type==='setRoleReln'){const r=appRoles.find(x=>x.id===cmd.roleId);if(r)r.reln=cmd.reln;}
    if(cmd.type==='changeRole'){const cur=listBy(appRoles,cmd.appId).find(r=>r.reln==='primary');if(cur)cur.reln='rejected';appRoles.push({id:nid('rl'),applicationId:cmd.appId,role:cmd.to,reln:'primary'});const app=findApp(cmd.appId);if(app)app.position=cmd.to;roleHistory.push({id:nid('rh'),applicationId:cmd.appId,from:cmd.from,to:cmd.to,at:iso(0),by:'hr',reason:cmd.reason,consent:cmd.consent});setAudit(a=>[{id:nid('al'),actor:'hr',action:'ROLE_CHANGE',entity:cmd.appId,at:iso(0),reason:`${cmd.from} → ${cmd.to}`},...a]);}
    if(cmd.type==='confirmJoinInfo'){const app=findApp(cmd.appId);if(app){app.postHire={...(app.postHire||{}),infoConfirmed:true,state:'joining_process'};setAudit(a=>[{id:nid('al'),actor:'hr',action:'JOIN_INFO',entity:cmd.appId,at:iso(0),reason:'加入情報を確認'},...a]);}}
    if(cmd.type==='confirmMembership'){const app=findApp(cmd.appId);if(app){app.postHire={...(app.postHire||{}),membershipConfirmed:true,state:'confirmed'};setAudit(a=>[{id:nid('al'),actor:'hr',action:'MEMBERSHIP',entity:cmd.appId,at:iso(0),reason:'加入を確定'},...a]);}}
    if(cmd.type==='createMember'){const app=findApp(cmd.appId);if(app){const ap=findAp(app.applicantId);const existing=members.find(m=>m.applicantId===app.applicantId);if(!existing){members.push({id:nid('mb'),applicantId:app.applicantId,name:ap.name,role:app.position,joinedAt:iso(0),applicationId:app.id});setAudit(a=>[{id:nid('al'),actor:'hr',action:'MEMBER_CREATE',entity:cmd.appId,at:iso(0),reason:`${ap.name} をメンバー作成`},...a]);}app.postHire={...(app.postHire||{}),memberId:'created',state:'joined'};}}
    if(cmd.type==='mergeApplicants'){const {primaryId,mergeId}=cmd;applications.forEach(a=>{if(a.applicantId===mergeId)a.applicantId=primaryId;if(a.applicantId===primaryId)delete a.dupOf;});const m=findAp(mergeId);if(m)m.mergedInto=primaryId;const p=findAp(primaryId);setAudit(a=>[{id:nid('al'),actor:'hr',action:'MERGE',entity:primaryId,at:iso(0),reason:`統合: 主=${p?p.name:primaryId}（被統合レコードは全保持）`},...a]);}
    if(cmd.type==='keepSeparate'){const app=findApp(cmd.appId);if(app)delete app.dupOf;setAudit(a=>[{id:nid('al'),actor:'hr',action:'MERGE',entity:cmd.appId,at:iso(0),reason:'別人として維持'},...a]);}
    if(cmd.type==='toggleAutomation'){const a=AUTOMATIONS.find(x=>x.id===cmd.id);if(a)a.enabled=!a.enabled;}
    if(cmd.type==='toggleApproval'){const a=AUTOMATIONS.find(x=>x.id===cmd.id);if(a)a.approval=!a.approval;}
    if(cmd.type==='killAll'){autoState.stopped=!autoState.stopped;setAudit(al=>[{id:nid('al'),actor:'hr',action:'KILL_SWITCH',entity:'',at:iso(0),reason:autoState.stopped?'全自動送信を停止':'自動送信を再開'},...al]);}
    if(cmd.type==='cancelScheduled'){const c=comms.find(x=>x.id===cmd.commId);if(c){c.status='cancelled';setAudit(al=>[{id:nid('al'),actor:'hr',action:'CANCEL_SEND',entity:c.applicationId,at:iso(0),reason:`予約送信を取消「${c.subject}」`},...al]);}}
    if(cmd.type==='readNotif'){const n=NOTIFICATIONS.find(x=>x.id===cmd.id);if(n)n.read=true;}
    if(cmd.type==='readAllNotif'){NOTIFICATIONS.forEach(n=>n.read=true);}
    if(cmd.type==='bulkAssign'){cmd.ids.forEach(id=>{const a=findApp(id);if(a)a.owner=cmd.owner;});setAudit(al=>[{id:nid('al'),actor:'hr',action:'BULK',entity:'',at:iso(0),reason:`${cmd.ids.length}件の担当を${uname(cmd.owner)}へ`},...al]);}
    if(cmd.type==='bulkTag'){cmd.ids.forEach(id=>{const a=findApp(id);if(a&&!(a.tags||[]).includes(cmd.tag))a.tags=[...(a.tags||[]),cmd.tag];});setAudit(al=>[{id:nid('al'),actor:'hr',action:'BULK',entity:'',at:iso(0),reason:`${cmd.ids.length}件にタグ「${cmd.tag}」`},...al]);}
    if(cmd.type==='bulkRemind'){cmd.ids.forEach(id=>comms.push({id:nid('cm'),applicationId:id,channel:'email',dir:'out',subject:'リマインド',status:'scheduled',at:iso(5*60000),autoId:'au_bulk'}));setAudit(al=>[{id:nid('al'),actor:'hr',action:'BULK',entity:'',at:iso(0),reason:`${cmd.ids.length}件へリマインド予約`},...al]);}
    if(cmd.type==='setTiming'){ORG_SETTINGS.memberCreationTiming=cmd.value;setAudit(al=>[{id:nid('al'),actor:'hr',action:'SETTINGS',entity:'',at:iso(0),reason:`Member作成タイミングを${cmd.value}に変更`},...al]);}
    if(cmd.type==='anonymize'){const ap=findAp(cmd.applicantId);if(ap){ap.name='（匿名化済み）';ap.email='';ap.phone='';ap.kana='';ap.anon=true;}setAudit(al=>[{id:nid('al'),actor:'hr',action:'ANON',entity:cmd.applicantId,at:iso(0),reason:'個人情報を匿名化 (§41)'},...al]);}
    force(x=>x+1);
  },[]);
  const nav=[{sec:'運用'},{k:'dashboard',l:'ダッシュボード',i:'space_dashboard'},{k:'list',l:'応募者一覧',i:'groups',ct:applications.filter(a=>!['closed','archived'].includes(a.lifecycle)).length},{k:'new',l:'応募者を追加',i:'person_add'},{k:'positions',l:'募集ポジション',i:'work'},{sec:'仕組み'},{k:'flowtmpl',l:'選考フローテンプレート',i:'account_tree'},{k:'automation',l:'自動化・通知',i:'smart_toy'},{k:'apply',l:'申込フォーム（公開）',i:'assignment_ind'},{k:'settings',l:'設定',i:'settings'}];
  const titles={dashboard:['ダッシュボード','いま採用チームが対応すべきことを一望'],list:['応募者一覧','人物と応募機会を分離して管理 (§5)'],detail:['',''],'new':['',''],automation:['自動化・通知','独立したAutomation Engine (§52-60)'],positions:['募集ポジション','標準選考ルートを管理 (§86)'],flowtmpl:['選考フローテンプレート','推奨ルート・Version管理 (§8/9)'],settings:['設定','権限・Member作成・データ保持 (§35/68-71/41)']};
  const [tt,ts]=titles[route.view]||['',''];
  const curApp=route.view==='detail'?findApp(route.id):null;
  const curAp=curApp?findAp(curApp.applicantId):null;
  const roleLabel={super:'Super Admin',radmin:'Recruitment Admin',recruiter:'Recruiter',interviewer:'Interviewer',viewer:'Viewer'}[viewerRole];
  if(route.view==='room') return <InterviewRoom actId={route.id} go={go} dispatch={dispatch}/>;
  if(route.view==='apply') return <ApplyForm dispatch={dispatch} go={go}/>;
  return (
    <div className="shell">
      <aside className="side">
        <div className="brand"><div className="lg"><Sym i="hub"/></div><div className="bt">Recruit</div></div>
        {nav.map((n,i)=>n.sec?<div key={i} className="navsec">{n.sec}</div>:<div key={n.k} className={`navi ${route.view===n.k||(n.k==='list'&&route.view==='detail')?'on':''}`} onClick={()=>go(n.k)}><Sym i={n.i}/>{n.l}{n.ct!=null&&<span className="ct">{n.ct}</span>}</div>)}
        <div className="sidefoot"><b>設計プロトタイプ</b><br/>固定ステージ型ATSではなく、実際の採用プロセスをそのまま記録する Recruitment Operations System。admin の新リンク案。</div>
      </aside>
      <main className="main">
        <div className="topbar">
          {route.view==='detail'&&curApp?
            <div className="crumb"><span className="link" onClick={()=>go('list')}>応募者一覧</span><Sym i="chevron_right"/><b>{curAp.name}</b><Sym i="chevron_right"/><span>{curApp.position}（Application #{curApp.code}）</span></div>
            :<div className="crumb"><Sym i="tune" s={{color:'var(--ink4)'}}/><span>採用オペレーション</span></div>}
          <div style={{flex:1}}/>
          <div className="search"><Sym i="search"/><input placeholder="応募者・メモを検索…" value={query} onChange={e=>{setQuery(e.target.value);if(route.view!=='list'&&route.view!=='detail')go('list');}}/></div>
          <div className="iconbtn" onClick={()=>setNotifOpen(v=>!v)}><Sym i="notifications"/>{NOTIFICATIONS.filter(n=>!n.read).length>0&&<span className="badge">{NOTIFICATIONS.filter(n=>!n.read).length}</span>}</div>
          <div className="me" onClick={()=>go('settings')} title="設定でロールを切替"><Avatar ap={U.hr} size={32} photo/><div className="mn"><small>{roleLabel}</small><b>{U.hr.name.split(' / ')[1]||U.hr.name}</b></div><Sym i="expand_more" s={{fontSize:18,color:'var(--ink4)'}}/></div>
          {notifOpen&&<div style={{position:'fixed',inset:0,zIndex:59}} onClick={()=>setNotifOpen(false)}/>}
          {notifOpen&&<NotifPanel go={go} dispatch={dispatch} onClose={()=>setNotifOpen(false)}/>}
        </div>
        <div className="page">
          {route.view!=='detail'&&(tt||ts)&&<div className="ph"><h1>{tt}</h1><span className="psub">{ts}</span></div>}
          {route.view==='dashboard'&&<Dashboard go={go} audit={audit}/>}
          {route.view==='list'&&<ListView go={go} query={query} dispatch={dispatch}/>}
          {route.view==='new'&&<NewApplicant go={go} dispatch={dispatch}/>}
          {route.view==='detail'&&<Detail appId={route.id} go={go} dispatch={dispatch} viewerRole={viewerRole}/>}
          {route.view==='automation'&&<Automation dispatch={dispatch} go={go}/>}
          {route.view==='positions'&&<PositionsView/>}
          {route.view==='flowtmpl'&&<FlowTemplatesView/>}
          {route.view==='settings'&&<SettingsView viewerRole={viewerRole} setViewerRole={setViewerRole} dispatch={dispatch}/>}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
(function(){
  var EL=document.getElementById('appsrc'); var SRC=EL?(EL.textContent||''):''; if(!SRC)return;
  var BABEL='https://unpkg.com/@babel/standalone@7.25.6/babel.min.js';
  function exec(code){var s=document.createElement('script');s.textContent=code;document.body.appendChild(s);}
  function compile(){
    function run(){try{var code=window.Babel.transform(SRC,{presets:['react'],sourceType:'script'}).code;exec(code);}catch(e){if(window.console)console.error('[boot] compile failed',e);}}
    if(window.Babel){run();return;}
    var s=document.createElement('script');s.src=BABEL;s.crossOrigin='anonymous';s.onload=run;s.onerror=function(){if(window.console)console.error('[boot] babel load failed');};document.head.appendChild(s);
  }
  function ready(){return window.React&&window.ReactDOM;}
  if(ready())compile(); else {var t=0,iv=setInterval(function(){if(ready()||++t>200){clearInterval(iv);compile();}},20);}
})();
</script>
</body>
</html>
