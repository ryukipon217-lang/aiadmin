<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recruit · 採用オペレーション</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..0&display=swap" rel="stylesheet">
<style>
:root{
  --nav:#1b2239; --nav2:#222b47; --nav-hi:#2c3757; --nav-tx:#9aa4c0; --nav-tx2:#eef1f8; --nav-line:rgba(255,255,255,.08);
  --bg:#f4f6fb;
  --card:#ffffff; --line:#e7eaf1; --line2:#dce1ec;
  --ink:#1d2542; --ink2:#495375; --ink3:#78829f; --ink4:#a1abc1;
  --blue:#3a5bd9; --blueh:#2f4bc0; --blue-soft:#eef1fd; --blue-bd:#d3dbf7;
  --green:#1f9d63; --green-soft:#e8f6ef; --green-bd:#bfe6d1;
  --amber:#c58a1c; --amber-soft:#fbf3e1; --amber-bd:#eeddb0;
  --red:#d94f5c; --red-soft:#fdedef; --red-bd:#f5ccd1;
  --violet:#7a5bd0; --violet-soft:#f0ecfb; --violet-bd:#ddd2f4;
  --teal:#2b8fb8; --teal-soft:#e6f3f9; --teal-bd:#c3e2ef;
  --slate:#64708f; --slate-soft:#eef1f6; --slate-bd:#dbe1ec;
  --sh:0 1px 2px rgba(24,34,64,.04),0 1px 3px rgba(24,34,64,.05);
  --sh2:0 6px 18px -6px rgba(24,34,64,.14);
  --r:12px; --r2:9px;
  --s:'Inter','Noto Sans JP',sans-serif;
  --m:'JetBrains Mono',monospace;
  --side:224px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--s);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.msym{font-family:'Material Symbols Rounded';font-weight:400;line-height:1;font-style:normal;vertical-align:-3px;font-size:20px}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#cdd4e2;border-radius:20px;border:3px solid var(--bg);background-clip:content-box}
a{color:inherit}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--nav);display:flex;flex-direction:column;padding:14px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:8px 8px 16px}
.brand .lg{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#4d6ff0,#3a5bd9);color:#fff}
.brand .lg .msym{font-size:20px}
.brand .bt{font-weight:800;color:#fff;font-size:16.5px;letter-spacing:.02em}
.navsec{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#5f6a89;font-weight:700;padding:14px 12px 6px}
.navi{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;color:var(--nav-tx);cursor:pointer;font-weight:500;font-size:13.5px;position:relative;transition:.13s;margin-bottom:1px}
.navi:hover{background:var(--nav2);color:var(--nav-tx2)}
.navi.on{background:var(--nav-hi);color:#fff;font-weight:600}
.navi.on::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:#5b7bf5}
.navi .msym{font-size:20px;opacity:.9}
.navi .ct{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;background:rgba(255,255,255,.1);color:var(--nav-tx2)}
.sidefoot{margin-top:auto;padding:12px;border-top:1px solid var(--nav-line);font-size:11px;color:#6b7699;line-height:1.55}
.sidefoot b{color:#9aa6c8}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;height:58px}
.crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink3);font-weight:500}
.crumb b{color:var(--ink);font-weight:600}
.crumb .msym{font-size:16px;color:var(--ink4)}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;background:var(--bg);border:1px solid var(--line);min-width:260px}
.search input{border:0;background:transparent;outline:none;font-family:var(--s);font-size:13px;color:var(--ink);width:100%}
.search .msym{color:var(--ink4);font-size:18px}
.iconbtn{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);cursor:pointer;position:relative}
.iconbtn:hover{background:var(--bg)}
.iconbtn .badge{position:absolute;top:5px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.me{display:flex;align-items:center;gap:9px;padding:5px 8px 5px 5px;border-radius:10px;cursor:pointer}
.me:hover{background:var(--bg)}
.me .mn{font-size:12.5px;line-height:1.25}
.me .mn small{display:block;color:var(--ink3);font-size:10.5px}
.me .mn b{color:var(--ink);font-weight:600}

.page{padding:22px 24px 56px}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px}
.ph h1{font-size:21px;font-weight:800;color:var(--ink);margin:0;letter-spacing:-.01em}
.ph .psub{font-size:13px;color:var(--ink3);margin-left:2px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.grid{display:grid;gap:16px}
.ch{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink);margin:0 0 14px}
.ch .msym{font-size:19px;color:var(--blue)}
.ch .more{margin-left:auto;font-size:12px;font-weight:600;color:var(--blue);cursor:pointer}
.ch .more:hover{text-decoration:underline}
.muted{color:var(--ink3)}
.hr{height:1px;background:var(--line);border:0;margin:14px 0}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:600;line-height:1.5;white-space:nowrap;border:1px solid transparent}
.chip .dot{width:6px;height:6px;border-radius:50%}
.c-blue{background:var(--blue-soft);color:var(--blueh);border-color:var(--blue-bd)} .c-blue .dot{background:var(--blue)}
.c-green{background:var(--green-soft);color:#177a4c;border-color:var(--green-bd)} .c-green .dot{background:var(--green)}
.c-amber{background:var(--amber-soft);color:#9a6c14;border-color:var(--amber-bd)} .c-amber .dot{background:var(--amber)}
.c-red{background:var(--red-soft);color:#c13c49;border-color:var(--red-bd)} .c-red .dot{background:var(--red)}
.c-rose{background:var(--red-soft);color:#c13c49;border-color:var(--red-bd)} .c-rose .dot{background:var(--red)}
.c-violet{background:var(--violet-soft);color:#6446bd;border-color:var(--violet-bd)} .c-violet .dot{background:var(--violet)}
.c-teal{background:var(--teal-soft);color:#227699;border-color:var(--teal-bd)} .c-teal .dot{background:var(--teal)}
.c-slate{background:var(--slate-soft);color:#515c78;border-color:var(--slate-bd)} .c-slate .dot{background:var(--slate)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;font-family:var(--s);font-weight:600;font-size:13px;cursor:pointer;border:1px solid var(--line2);background:#fff;color:var(--ink2);transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn .msym{font-size:17px}
.btn.prim{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.prim:hover{background:var(--blueh);border-color:var(--blueh);color:#fff}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.danger{color:var(--red);border-color:var(--red-bd)} .btn.danger:hover{background:var(--red-soft);border-color:var(--red)}

/* ---------- avatar ---------- */
.av{border-radius:50%;object-fit:cover;flex:none;background:#dfe4ee;display:grid;place-items:center;color:#fff;font-weight:700;overflow:hidden}
.av.sq{border-radius:10px}

/* ---------- KPI ---------- */
.kpi{padding:16px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer;transition:.13s}
.kpi:hover{box-shadow:var(--sh2);transform:translateY(-1px);border-color:var(--line2)}
.kpi .ki{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-bottom:11px}
.kpi .ki .msym{font-size:19px}
.kpi .kv{font-size:26px;font-weight:800;color:var(--ink);line-height:1}
.kpi .kl{font-size:12px;color:var(--ink3);font-weight:500;margin-top:5px}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;letter-spacing:.03em;color:var(--ink3);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:#fbfcfe}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2);vertical-align:middle}
.trow{cursor:pointer;transition:.1s}
.trow:hover td{background:#f7f9fd}
.tbl tr:last-child td{border-bottom:0}
.nm{display:flex;align-items:center;gap:11px}
.nm b{color:var(--ink);font-weight:600;font-size:13.5px}
.nm .mt{font-size:11.5px;color:var(--ink3);margin-top:1px}

/* ---------- overview blocks ---------- */
.kv{display:grid;grid-template-columns:96px 1fr;gap:9px 12px;font-size:13px}
.kv .k{color:var(--ink3);font-weight:500}
.kv .v{color:var(--ink);font-weight:500}
.duebar{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.duebar:first-of-type{border-top:0}
.duebar .dl{color:var(--ink2);font-weight:500}
.duebar .dd{display:flex;align-items:center;gap:9px}
.duebar .dv{color:var(--ink);font-weight:600}

.recrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.recrow:first-of-type{border-top:0}
.recrow .rt{font-weight:600;color:var(--ink);font-size:13px}
.recrow .rs{font-size:11.5px;color:var(--ink3);margin-top:2px}

/* ---------- status box ---------- */
.statusbox{border-radius:10px;padding:14px 16px;text-align:center;font-weight:800;font-size:18px;letter-spacing:.01em}
.labelwrap{display:flex;flex-wrap:wrap;gap:7px}

/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column}
.tlr{display:grid;grid-template-columns:64px 26px 1fr auto;gap:0 8px;align-items:start;padding:0}
.tlr .tt{padding:2px 0 18px}
.tlr:last-child .tt,.tlr:last-child .tc,.tlr:last-child .tm{padding-bottom:2px}
.tlr .td{font-size:11.5px;color:var(--ink3);font-weight:600;text-align:right;padding-top:1px;line-height:1.35}
.tlr .td small{display:block;color:var(--ink4);font-weight:500;font-size:10.5px}
.tlr .tk{position:relative;display:flex;justify-content:center}
.tlr .nd{width:12px;height:12px;border-radius:50%;margin-top:3px;z-index:1;border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--line2)}
.tlr .ln{position:absolute;top:12px;bottom:-6px;width:2px;background:var(--line);left:50%;margin-left:-1px}
.tlr:last-child .ln{display:none}
.tlr .tc{padding:0 0 18px}
.tlr .tt2{font-weight:600;color:var(--ink);font-size:13.5px}
.tlr .tx{font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.45}
.tlr .tm{display:flex;align-items:center;gap:9px;padding:1px 0 18px;white-space:nowrap}
.tlr .who{font-size:12px;color:var(--ink3);font-weight:500}

/* ---------- eval bars ---------- */
.evbar{display:grid;grid-template-columns:78px 34px 1fr;gap:10px;align-items:center;margin-bottom:9px}
.evbar .el{font-size:12.5px;font-weight:600}
.evbar .ec{font-size:12.5px;color:var(--ink2);font-weight:600}
.track{height:8px;border-radius:5px;background:var(--bg);overflow:hidden}
.track .fill{height:100%;border-radius:5px}
.notebox{display:flex;gap:9px;padding:11px 12px;border-radius:9px;font-size:12px;line-height:1.5;margin-top:12px}
.notebox.warn{background:var(--amber-soft);color:#8a6112} .notebox.warn .msym{color:var(--amber)}
.notebox.info{background:var(--blue-soft);color:#33469c} .notebox.info .msym{color:var(--blue)}
.notebox .msym{flex:none;font-size:18px}

/* ---------- activity / rail rows ---------- */
.arow{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.arow:first-of-type{border-top:0}
.arow .ai{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.arow .ai .msym{font-size:17px}
.arow .an{font-weight:600;color:var(--ink);font-size:12.5px}
.arow .as{font-size:11.5px;color:var(--ink3);margin-top:2px}

/* ---------- flow diff ---------- */
.flow{display:grid;grid-template-columns:150px 1fr;gap:12px 14px;align-items:center}
.flowlbl{font-size:12.5px;font-weight:600;color:var(--ink2)}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fstep{display:inline-flex;align-items:center;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
.fstep.done{background:var(--green-soft);border-color:var(--green-bd);color:#177a4c}
.fstep.now{background:var(--amber-soft);border-color:var(--amber-bd);color:#9a6c14}
.fstep.off{background:var(--violet-soft);border-color:var(--violet-bd);color:#6446bd}
.farr{color:var(--ink4);font-size:14px;font-weight:700}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{padding:11px 15px;font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.12s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}

.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg b{padding:6px 13px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--ink3);cursor:pointer}
.seg b.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}

.evalcard{border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:9px;background:#fff}
.emptyx{text-align:center;padding:34px 20px;color:var(--ink3);font-size:13px}
.emptyx .msym{font-size:32px;color:var(--ink4);display:block;margin-bottom:8px}
.link{color:var(--blue);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}
.stars{color:var(--amber);letter-spacing:1px;font-size:13px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,28,54,.42);display:grid;place-items:center;z-index:80;padding:20px;animation:fade .16s}
@keyframes fade{from{opacity:0}}
.modal{width:min(540px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 24px 60px -12px rgba(20,28,54,.4);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(10px);opacity:.6}}
.modal .mhd{padding:18px 20px;border-bottom:1px solid var(--line)}
.modal .mt{font-size:16px;font-weight:800;color:var(--ink)}
.modal .mx{font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.5}
.modal .mbd{padding:18px 20px}
.opt{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;border:1px solid var(--line);cursor:pointer;transition:.12s;margin-bottom:8px}
.opt:hover{border-color:var(--blue);background:var(--blue-soft)}
.opt .oi{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.opt .ot{font-weight:600;color:var(--ink);font-size:13.5px}
.opt .os{font-size:11.5px;color:var(--ink3);margin-top:1px}
.field{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line2);background:#fff;font-family:var(--s);font-size:13px;color:var(--ink);outline:none}
.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
textarea.field{line-height:1.55}
select.field{appearance:auto;-webkit-appearance:auto}

/* ---------- forms ---------- */
.modal.lg{width:min(700px,96vw)}
.mbd.scroll{max-height:62vh;overflow:auto}
.frow{margin-bottom:15px}
.flbl{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.flbl .req{color:var(--red);font-size:10.5px;font-weight:700}
.fhint{font-size:11px;color:var(--ink4);font-weight:500}
.selrow{display:flex;flex-wrap:wrap;gap:7px}
.selchip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink3);cursor:pointer;transition:.12s}
.selchip:hover{border-color:var(--blue-bd);color:var(--ink2)}
.selchip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blueh)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sess-item{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;border-radius:0 0 14px 14px}
.check{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.check input{width:16px;height:16px;accent-color:var(--blue)}

/* ---------- interview room ---------- */
@keyframes wv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.wv{display:flex;align-items:flex-end;gap:3px;height:26px}
.wv i{width:3px;height:100%;background:var(--blue);border-radius:2px;transform-origin:center;animation:wv 1s ease-in-out infinite}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.25}}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:pls 1.1s infinite;flex:none}
.recbtn{width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;box-shadow:var(--sh);transition:.12s}
.recbtn:hover{transform:scale(1.04)}
.chkbox{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;flex:none;transition:.12s}
.sw{width:38px;height:22px;border-radius:12px;position:relative;cursor:pointer;transition:.15s;flex:none}
.sw i{position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--blue)} .sw.on i{left:18px}
.sw.off{background:var(--line2)} .sw.off i{left:2px}
.notif{position:absolute;top:52px;right:64px;width:380px;max-height:72vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);z-index:60}
.notif .nrow{display:flex;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.notif .nrow:hover{background:var(--bg)}
.notif .nrow.unread{background:var(--blue-soft)}
.notif .nrow.unread:hover{background:#e5ebfc}

@media(max-width:1120px){.ov-top{grid-template-columns:1fr!important}.ov-body{grid-template-columns:1fr!important}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

<script type="text/plain" id="appsrc">
const {useState, useMemo, useCallback, useEffect, Fragment} = React;

/* ============================================================================
   Recruit — 採用オペレーションシステム (設計プロトタイプ)
   固定ステージ型ATSではなく「実際に起きた採用プロセスをそのまま記録する」思想。
   Applicant/Application分離・順序制約なしSelectionActivity・独立Decision履歴・

const listBy = (arr, appId) => arr.filter(x=>x.applicationId===appId);
function activitySummary(acts){
  const byType={}; acts.forEach(a=>{(byType[a.name]=byType[a.name]||[]).push(a);});
  return Object.entries(byType).map(([label,list])=>{const open=list.find(a=>OPEN_ST.includes(a.status));const st=open?open.status:list[list.length-1].status;return {label,status:st};});
}
function latestDecision(appId){const ds=listBy(decisions,appId).slice().sort((a,b)=>new Date(a.at)-new Date(b.at));return ds.length?ds[ds.length-1]:null;}
function overdueActions(appId){return listBy(tasks,appId).filter(t=>t.status==='open'&&t.kind!=='wait'&&new Date(t.dueAt)<NOW);}
function operationalStatus(app){
  const acts=listBy(activities,app.id), dec=latestDecision(app.id), labels=[];
  if(app.lifecycle==='paused'){labels.push({text:`停止中 · ${app.pause?.holdReason||'保留'}`,tone:'violet'});return {labels,primary:'停止中',ptone:'violet'};}
  if(app.lifecycle==='closed'||app.lifecycle==='archived'){
    if(dec?.type==='reject'){labels.push({text:'不採用',tone:'red'});return {labels,primary:'不採用',ptone:'red'};}
    if(dec?.type==='withdrawn'){labels.push({text:'本人辞退',tone:'red'});return {labels,primary:'本人辞退',ptone:'red'};}
    labels.push({text:'終了',tone:'slate'});return {labels,primary:'終了',ptone:'slate'};
  }
  if(app.lifecycle==='post_decision') labels.push({text: dec?.type==='hire'?'採用 · 加入手続中':'手続中',tone:'teal'});
  if(app.lifecycle==='active') labels.push({text:'選考中',tone:'blue'});
  const summary=activitySummary(acts.filter(a=>a.type==='INTERVIEW'));
  summary.forEach(s=>{
    if(s.status==='partially_completed') labels.push({text:`${s.label} 一部完了`,tone:'blue'});
    else if(s.status==='completed') labels.push({text:`${s.label} 完了`,tone:'blue'});
    else if(s.status==='no_show') labels.push({text:`${s.label} 無断欠席`,tone:'red'});
  });
  const repc=acts.find(a=>a.type==='REP_CHECK');
  if(repc&&repc.status==='not_required') labels.push({text:'代表確認 未実施',tone:'red'});
  if(app.lifecycle==='decision_pending') labels.push({text:'採用判断待ち',tone:'amber'});
  if(app.responseDueAt) labels.push({text:'本人回答待ち',tone:'blue'});
  if(overdueActions(app.id).length) labels.push({text:'期限超過',tone:'red'});
  if(!labels.length) labels.push({text:'選考中',tone:'blue'});
  const prim = app.lifecycle==='post_decision'?labels[0].text:'選考中';
  return {labels, primary:prim, ptone: app.lifecycle==='post_decision'?'teal':'green'};
}
function nextActionOf(app){
  const ts=listBy(tasks,app.id).filter(t=>t.status==='open').sort((a,b)=>new Date(a.dueAt)-new Date(b.dueAt));
  if(ts.length) return ts[0];
  const up=listBy(activities,app.id).filter(a=>a.plannedAt&&OPEN_ST.includes(a.status)&&new Date(a.plannedAt)>=NOW).sort((a,b)=>new Date(a.plannedAt)-new Date(b.plannedAt))[0];
  if(up) return {title:up.name,assignee:up.owner,dueAt:up.plannedAt,kind:'activity'};
  return null;
}
function buildTimeline(appId){
  const ev=[], app=findApp(appId);
  ev.push({at:app.createdAt,title:'応募受付',tx:'応募フォームからのエントリー',tone:'green',tag:'応募',who:'システム'});

    const ty=atype(a.type), tag=a.type==='INTERVIEW'?'面接':a.type==='REP_CHECK'?'判断':atype(a.type).label;
    if(a.plannedAt&&!a.completedAt&&OPEN_ST.includes(a.status)) ev.push({at:a.plannedAt,title:`${a.name} を設定`,tx:`${fmt(a.plannedAt)} に設定`,tone:'blue',tag,who:uname(a.owner)});
    else if(a.plannedAt&&a.completedAt&&new Date(a.plannedAt)<new Date(a.completedAt)) ev.push({at:a.plannedAt,title:`${a.name} を設定`,tx:`${fmt(a.completedAt)} に実施`,tone:'blue',tag,who:uname(a.createdBy)});
    if(a.completedAt){const done=AST[a.status]?.l||'完了';ev.push({at:a.completedAt,title:`${a.name} ${a.status==='completed'?'実施':done}`,tx:a.notes||'',tone:DONE_ST.includes(a.status)?'green':a.status==='no_show'?'red':'blue',tag,who:uname(a.owner)});}
  });
  listBy(evals,appId).forEach(e=>ev.push({at:e.at,title:`面接官評価 (${uname(e.by)})`,tx:`${recLabel(e.rec)} · ${'★'.repeat(e.score)}${'☆'.repeat(5-e.score)}`,tone:'violet',tag:'評価',who:uname(e.by)}));
  ai.filter(a=>a.applicationId===appId).forEach(a=>ev.push({at:a.at,title:`AI分析生成 (Version ${a.version})`,tx:'新しい録音を追加して再生成しました。',tone:'blue',tag:'AI分析',who:'システム'}));
  listBy(decisions,appId).forEach(d=>ev.push({at:d.at,title:d.type==='hire'?'採用決定':d.type==='reject'?'不採用決定':d.type==='reopen'?'採用判断 取消':d.type==='withdrawn'?'本人辞退':decLabel(d.type),tx:`${d.reason}`,tone:d.type==='hire'?'green':d.type==='reject'||d.type==='withdrawn'?'red':'amber',tag:'判断',who:uname(d.by)}));
  listBy(roleHistory,appId).forEach(r=>ev.push({at:r.at,title:`ポジション変更: ${r.from} → ${r.to}`,tx:`${r.reason} · 本人同意${r.consent?'あり':'なし'}`,tone:'teal',tag:'変更',who:uname(r.by)}));
  return ev.sort((a,b)=>new Date(b.at)-new Date(a.at));
}

function fmt(d){const x=new Date(d);return `${x.getMonth()+1}月${x.getDate()}日 ${pad(x.getHours())}:${pad(x.getMinutes())}`;}
function fmtDate(d){const x=new Date(d);return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日`;}
function fmtMD(d){const x=new Date(d);return `${x.getMonth()+1}/${x.getDate()}`;}
function rel(d){const diff=new Date(d)-NOW,ad=Math.abs(diff)/MS.d;if(ad<1){const h=Math.max(1,Math.round(Math.abs(diff)/MS.h));return diff<0?`${h}時間前`:`あと${h}時間`;}const n=Math.round(ad);return diff<0?`${n}日超過`:`あと${n}日`;}
function ageOf(b){if(!b)return null;const d=new Date(b);let a=NOW.getFullYear()-d.getFullYear();const m=NOW.getMonth()-d.getMonth();if(m<0||(m===0&&NOW.getDate()<d.getDate()))a--;return a;}
